name = "shorted-edge-cache"
main = "worker.js"
compatibility_date = "2024-11-01"
account_id = "2132ccf47ceb5fff234c34d85490470a"
workers_dev = false
preview_urls = false

[vars]
SHORTS_API_ORIGIN = "https://shorts-uiekqxovma-km.a.run.app"
CHAT_SERVICE_ORIGIN = "https://chat-service-uiekqxovma-km.a.run.app"
MARKET_DATA_ORIGIN = "https://market-data-uiekqxovma-km.a.run.app"
CACHE_TTL_DEFAULT = "60"
CACHE_TTL_TOP_SHORTS = "300"
CACHE_TTL_STOCK_DATA = "120"
CACHE_TTL_NEWS = "300"
CACHE_TTL_PUBLIC_DAILY = "3600"
CACHE_TTL_PUBLIC_STALE = "86400"
EDGE_ANALYTICS_SAMPLE_RATE = "0.01"
# ALLOWED-arm sample rate for the edge_rate_limit event stream. Blank inherits
# EDGE_ANALYTICS_SAMPLE_RATE. LIMITED decisions (429s) are ALWAYS emitted at
# 100% and no setting can sample them away — see worker.js.
EDGE_RATE_LIMIT_SAMPLE_RATE = ""

# ---------------------------------------------------------------------------
# Analytics Engine — OPTIONAL, and intentionally commented out.
#
# Production truth is Terraform (var.edge_rate_limit_analytics_dataset, empty by
# default), so the binding is absent unless someone opts in. worker.js checks
# for `writeDataPoint` before calling it, so an unbound RATE_LIMIT_ANALYTICS is
# a silent no-op. Uncomment for `wrangler dev` experimentation.
# ---------------------------------------------------------------------------
# [[analytics_engine_datasets]]
# binding = "RATE_LIMIT_ANALYTICS"
# dataset = "shorted_edge_rate_limit"

[placement]
mode = "smart"

[[kv_namespaces]]
binding = "EDGE_KV"
id = "e08015a2c6324c7b8b3faa810d5b0c73"

# ---------------------------------------------------------------------------
# Rate limiting bindings (Cloudflare Workers Rate Limiting API — GA 2025-09-19,
# requires Wrangler >= 4.36.0). Per-minute limiting lives here, NOT in Upstash.
#
# NOTE: PRODUCTION TRUTH LIVES IN TERRAFORM. This worker is deployed by
# `cloudflare_workers_script.edge_cache` in terraform/modules/cloudflare-edge,
# which declares its own bindings list. These entries exist so `wrangler dev`
# and `wrangler deploy --dry-run` behave like prod — keep the two in sync.
#
# `namespace_id` is an account-scoped identifier you choose; two bindings with
# the same namespace_id share counters, even across Workers. `period` is a HARD
# ENUM: exactly 10 or 60. That enum is why every traffic class needs TWO
# bindings — a 10s burst bucket and a 60s sustained bucket.
#
# The numbers below mirror the Terraform defaults; rationale for each lives in
# terraform/modules/cloudflare-edge/variables.tf and services/edge-worker/README.md.
# ---------------------------------------------------------------------------

# --- api.shorted.com.au, authenticated (keyed by SHA-256 of the token) ---
[[ratelimits]]
name = "API_KEY_BURST_RATE_LIMITER"
namespace_id = "2003"

  [ratelimits.simple]
  limit = 100
  period = 10

[[ratelimits]]
name = "API_KEY_RATE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 600
  period = 60

# --- api.shorted.com.au, anonymous (keyed by real client IP) ---
[[ratelimits]]
name = "ANON_BURST_RATE_LIMITER"
namespace_id = "2004"

  [ratelimits.simple]
  limit = 10
  period = 10

[[ratelimits]]
name = "ANON_RATE_LIMITER"
namespace_id = "2002"

  [ratelimits.simple]
  limit = 30
  period = 60

# --- api.shorted.com.au, first-party SSR/rewrite runaway detector ---
[[ratelimits]]
name = "FIRST_PARTY_RATE_LIMITER"
namespace_id = "2005"

  [ratelimits.simple]
  limit = 600
  period = 10

# --- shorted.com.au, anonymous browser (keyed by REAL client IP) ---
[[ratelimits]]
name = "BROWSER_ANON_BURST_RATE_LIMITER"
namespace_id = "2006"

  [ratelimits.simple]
  limit = 100
  period = 10

[[ratelimits]]
name = "BROWSER_ANON_RATE_LIMITER"
namespace_id = "2007"

  [ratelimits.simple]
  limit = 600
  period = 60

# --- shorted.com.au, signed-in browser (keyed by session-cookie hash) ---
[[ratelimits]]
name = "BROWSER_AUTH_BURST_RATE_LIMITER"
namespace_id = "2008"

  [ratelimits.simple]
  limit = 200
  period = 10

[[ratelimits]]
name = "BROWSER_AUTH_RATE_LIMITER"
namespace_id = "2009"

  [ratelimits.simple]
  limit = 1200
  period = 60
