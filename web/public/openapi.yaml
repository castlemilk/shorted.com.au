          type:
          - number
          - "null"
        landShareBelow2m:
          description: percent of valid sampled land area, 0..100 (proto double)
          format: double
          title: land_share_below_2m
          type:
          - number
          - "null"
        landShareBelow5m:
          description: percent of valid sampled land area, 0..100 (proto double)
          format: double
