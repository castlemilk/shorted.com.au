    shorts.v1alpha1.PartyFundingSummary:
      additionalProperties: false
      description: |-
        PartyFundingSummary is one party group in one financial year, straight from
         mv_aec_party_funding. Nothing here is derived: each figure is a sum or a
         distinct count over lodged returns.

         The two sides of the ledger are kept apart on purpose. total_receipts_cents
         is what the party's OWN annual return declares it received; the itemised and
         declared_donations figures are the transaction-level rows from the recipient
         side and the donor side respectively. They do not reconcile to each other and
         must never be presented as if they should.
      properties:
        declaredDonationsCents:
          description: (proto int64)
          format: int64
          title: declared_donations_cents
          type:
          - integer
          - string
        distinctDonorCount:
          description: (proto int32)
          format: int32
          title: distinct_donor_count
          type: integer
        distinctPayerCount:
          description: (proto int32)
          format: int32
          title: distinct_payer_count
          type: integer
        donationCount:
          description: From donations made — the DONOR-declared side. (proto int32)
          format: int32
          title: donation_count
          type: integer
        financialYear:
          description: verbatim label, e.g. '2024-25' (proto string)
          title: financial_year
          type: string
        financialYearEnd:
          description: (proto int32)
          format: int32
          title: financial_year_end
          type: integer
        itemisedReceiptCount:
          description: From itemised receipts — the RECIPIENT-declared side. (proto
            int32)
          format: int32
          title: itemised_receipt_count
          type: integer
        itemisedReceiptsCents:
          description: (proto int64)
          format: int64
          title: itemised_receipts_cents
          type:
          - integer
          - string
        listedDonorCents:
          description: (proto int64)
          format: int64
          title: listed_donor_cents
          type:
          - integer
          - string
        listedDonorCount:
          description: (proto int32)
          format: int32
          title: listed_donor_count
          type: integer
        listedPayerCents:
          description: (proto int64)
          format: int64
          title: listed_payer_cents
          type:
          - integer
          - string
        listedPayerCount:
          description: payers matched to an ASX code, exact/curated only (proto int32)
          format: int32
          title: listed_payer_count
          type: integer
        partyGroup:
          description: 'party_group_key: the source Party Group, or the party''s own
            name (proto string)'
          title: party_group
          type: string
        partyReturnCount:
          description: returns lodged under this group (branches lodge separately)
            (proto int32)
          format: int32
          title: party_return_count
          type: integer
        postReformScheme:
          description: |-
            TRUE from FY2027, the first year of the reformed scheme. A series crossing
             this boundary is two regimes and must carry a break annotation. (proto bool)
          title: post_reform_scheme
          type: boolean
        thresholdCensored:
          description: |-
            TRUE for every row under the old scheme: figures below the year's
             disclosure threshold are absent from the source entirely. (proto bool)
          title: threshold_censored
          type: boolean
        totalDebtsCents:
          description: (proto int64)
          format: int64
          title: total_debts_cents
          type:
          - integer
          - string
        totalPaymentsCents:
          description: (proto int64)
          format: int64
          title: total_payments_cents
          type:
          - integer
          - string
        totalReceiptsCents:
          description: From the party's own annual return. (proto int64)
          format: int64
          title: total_receipts_cents
          type:
          - integer
          - string
      title: PartyFundingSummary
      type: object
