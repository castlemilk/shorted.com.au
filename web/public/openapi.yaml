          title: company_name
          type: string
        daysToCover:
          description: (proto double)
          format: double
          title: days_to_cover
          type: number
        divergenceScore:
          description: 0-100, 0 unless price up AND shorts building (proto double)
          format: double
          title: divergence_score
          type: number
        industry:
          description: (proto string)
          title: industry
          type: string
        latestPrice:
          description: (proto double)
          format: double
          title: latest_price
          type: number
        logoUrl:
          description: (proto string)
          title: logo_url
          type: string
        marketCap:
          description: (proto double)
          format: double
          title: market_cap
          type: number
        priceChange1m:
          description: (proto double)
          format: double
          title: price_change_1m
          type: number
        shortPct:
          description: (proto double)
          format: double
          title: short_pct
          type: number
        shortPctChange4w:
          description: (proto double)
          format: double
          title: short_pct_change_4w
          type: number
        squeezeScore:
