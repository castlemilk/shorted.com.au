          title: industry
          type: string
        shortPercent:
          description: |-
            THE COMPANY's ASIC short interest, market-wide; 0 when the company is not
             in the short-interest set. It says nothing about any member's holding, its
             size, or any gain or loss — disclosure_note carries that in full. (proto double)
          format: double
          title: short_percent
