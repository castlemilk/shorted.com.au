info:
  contact:
    email: support@shorted.com.au
    name: Shorted Support
    url: https://shorted.com.au
  description: |
    Programmatic access to Australian market and public-interest data:
    ASIC short positions for ASX-listed securities, Australian house prices
    and suburb metrics, ABS/RBA economic series, and the federal register of
    members' and senators' interests.

    Every endpoint is a Connect-RPC method. Call it with an HTTP POST, a JSON
    body, and the `Connect-Protocol-Version: 1` header:

    ```bash
    curl -X POST https://api.shorted.com.au/shorts.v1alpha1.StockService/GetStock \
      -H 'Content-Type: application/json' \
      -H 'Connect-Protocol-Version: 1' \
      -d '{"productCode":"BHP"}'
    ```

    Authentication is optional for public endpoints; a bearer token raises
    your rate limits. See https://shorted.com.au/docs/api for tiers.
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  title: Shorted Public API
  version: 1.0.0
  x-logo:
    url: https://shorted.com.au/logo.png
openapi: 3.1.0
paths:
  /shorts.v1alpha1.EconomyService/GetEconomicSeries:
    post:
      description: Fetch observations for up to 50 series by series_key.
      operationId: EconomyService_GetEconomicSeries
      parameters:
      - in: header
        name: Connect-Protocol-Version
        required: true
        schema:
          $ref: '#/components/schemas/connect-protocol-version'
      - in: header
        name: Connect-Timeout-Ms
        schema:
          $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shorts.v1alpha1.GetEconomicSeriesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shorts.v1alpha1.GetEconomicSeriesResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      summary: GetEconomicSeries
      tags:
      - shorts.v1alpha1.EconomyService
  /shorts.v1alpha1.EconomyService/GetStateCompanyAggregates:
    post:
      description: Exposure-weighted market cap and short interest aggregates by state.
      operationId: EconomyService_GetStateCompanyAggregates
      parameters:
      - in: header
        name: Connect-Protocol-Version
        required: true
        schema:
          $ref: '#/components/schemas/connect-protocol-version'
      - in: header
        name: Connect-Timeout-Ms
        schema:
          $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shorts.v1alpha1.GetStateCompanyAggregatesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shorts.v1alpha1.GetStateCompanyAggregatesResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      summary: GetStateCompanyAggregates
      tags:
      - shorts.v1alpha1.EconomyService
  /shorts.v1alpha1.EconomyService/ListEconomicSeries:
    post:
      description: List economic series catalog entries (Australian economy snapshot
        layer).
      operationId: EconomyService_ListEconomicSeries
      parameters:
      - in: header
        name: Connect-Protocol-Version
        required: true
        schema:
          $ref: '#/components/schemas/connect-protocol-version'
      - in: header
        name: Connect-Timeout-Ms
        schema:
          $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shorts.v1alpha1.ListEconomicSeriesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shorts.v1alpha1.ListEconomicSeriesResponse'
          description: Success
        default:
