          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: (proto google.protobuf.Timestamp)
          title: created_at
        hasThreshold:
          description: (proto bool)
          title: has_threshold
          type: boolean
        id:
          description: (proto string)
          title: id
          type: string
        scope:
          $ref: '#/components/schemas/shorts.v1alpha1.AlertMonitorScope'
          description: (proto shorts.v1alpha1.AlertMonitorScope)
          title: scope
        status:
          $ref: '#/components/schemas/shorts.v1alpha1.AlertMonitorStatus'
          description: (proto shorts.v1alpha1.AlertMonitorStatus)
          title: status
        target:
          description: (proto string)
          title: target
          type: string
        threshold:
          description: (proto double)
          format: double
          title: threshold
          type: number
        updatedAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: (proto google.protobuf.Timestamp)
          title: updated_at
      title: AlertMonitor
      type: object
    shorts.v1alpha1.AlertMonitorCadence:
      description: Alert delivery cadence.
      enum:
      - ALERT_MONITOR_CADENCE_UNSPECIFIED
      - ALERT_MONITOR_CADENCE_DAILY
      - ALERT_MONITOR_CADENCE_WEEKLY
      title: AlertMonitorCadence
      type: string
    shorts.v1alpha1.AlertMonitorCondition:
      description: Alert monitor trigger condition.
      enum:
      - ALERT_MONITOR_CONDITION_UNSPECIFIED
      - ALERT_MONITOR_CONDITION_SHORT_INTEREST_ABOVE
      - ALERT_MONITOR_CONDITION_SHORT_INTEREST_RISES
      - ALERT_MONITOR_CONDITION_NEW_TOP_TEN_ENTRY
      title: AlertMonitorCondition
      type: string
    shorts.v1alpha1.AlertMonitorScope:
      description: Alert monitor target type.
      enum:
      - ALERT_MONITOR_SCOPE_UNSPECIFIED
      - ALERT_MONITOR_SCOPE_INDUSTRY
      - ALERT_MONITOR_SCOPE_STOCK
      title: AlertMonitorScope
      type: string
    shorts.v1alpha1.AlertMonitorStatus:
      description: Alert monitor lifecycle status.
      enum:
      - ALERT_MONITOR_STATUS_UNSPECIFIED
      - ALERT_MONITOR_STATUS_ACTIVE
      - ALERT_MONITOR_STATUS_PAUSED
      title: AlertMonitorStatus
      type: string
    shorts.v1alpha1.BattlegroundStock:
