    shorts.v1alpha1.DeclaredInterest:
      additionalProperties: false
      description: |-
        DeclaredInterest is one holding over one continuous period.

         declared_from_known distinguishes "declared since this date" from "declared as
         at a statement whose date the form did not state". A consumer must render the
         second as an unknown start and never substitute a guess.
      properties:
        companyName:
          description: (proto string)
          title: company_name
          type: string
        currentlyDeclared:
          description: (proto bool)
          title: currently_declared
          type: boolean
        declaredFrom:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: (proto google.protobuf.Timestamp)
          title: declared_from
        declaredFromKnown:
          description: (proto bool)
          title: declared_from_known
          type: boolean
        declaredText:
          description: verbatim, as the member wrote it (proto string)
          title: declared_text
          type: string
        declaredTo:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: absent while still declared (proto google.protobuf.Timestamp)
          title: declared_to
        entityKind:
          description: |-
            What the declared entity IS: listed | private_company | family_trust |
             smsf | managed_fund | foreign | not_an_entity.

             A consumer needs this to describe an unmatched row honestly. "Not matched to
             an ASX listing" is only true of entity_kind='listed'; saying it about a
             family trust reports a system failure that did not happen, because a trust
             can never have a ticker. (proto string)
          title: entity_kind
          type: string
        holder:
          $ref: '#/components/schemas/shorts.v1alpha1.RegisterHolder'
          description: (proto shorts.v1alpha1.RegisterHolder)
          title: holder
        industry:
          description: (proto string)
          title: industry
          type: string
        itemLabel:
          description: (proto string)
          title: item_label
          type: string
        itemNo:
          description: 1 shareholdings, 3 real estate, 4 directorships… (proto int32)
          format: int32
          title: item_no
          type: integer
        matchMethod:
          description: curated_alias | ticker_in_text | name_exact (proto string)
          title: match_method
          type: string
        propertyState:
          description: (proto string)
          title: property_state
          type: string
        salCode:
          description: empty unless resolved to an ABS suburb (proto string)
          title: sal_code
          type: string
        secondaryText:
          description: item 3 purpose, item 6 creditor… (proto string)
          title: secondary_text
          type: string
        sourceLicence:
          description: (proto string)
          title: source_licence
          type: string
        sourceUrl:
          description: the aph.gov.au PDF this came from (proto string)
          title: source_url
          type: string
        stockCode:
          description: empty unless publishably resolved (proto string)
          title: stock_code
          type: string
        suburbName:
          description: (proto string)
          title: suburb_name
          type: string
      title: DeclaredInterest
      type: object
    shorts.v1alpha1.DeclarerCountChange:
      additionalProperties: false
      description: |-
        DeclarerCountChange is a company whose number of declaring members differs
         between the window's start and now.

         BOTH sides are dated-only and use the identical predicate at two dates. About
         80% of currently-declared rows carry no start date, so an undated-inclusive
         "now" against a dated-only baseline would report every company as growing by
         its undated population, and an abs() ordering would then rank the list by
         that artefact.
      properties:
        companyName:
          description: (proto string)
          title: company_name
          type: string
        declarersAtWindowStart:
          description: (proto int32)
          format: int32
          title: declarers_at_window_start
          type: integer
        declarersNow:
          description: |-
            Members whose declaration is dated and open today — the SAME predicate
             NewlyDeclaredCompany.declarer_count uses, so one response speaks with one
             measure of "how many members declare this company". (proto int32)
          format: int32
          title: declarers_now
          type: integer
        industry:
          description: (proto string)
          title: industry
          type: string
        stockCode:
          description: (proto string)
          title: stock_code
          type: string
      title: DeclarerCountChange
      type: object
