      additionalProperties: false
      properties:
        addressKey:
          description: (proto string)
          title: address_key
          type: string
      title: GetPropertyHistoryRequest
      type: object
    shorts.v1alpha1.GetPropertyHistoryResponse:
      additionalProperties: false
      description: |-
        Full price timeline for a single physical address (stable address_key),
         across all its listings and relists. Derived from ToS-restricted listing
         rows — deep-links OUT to the live portal page rather than reproducing the
         listing; flag-gated the same way as ListSuburbDropListings.
      properties:
        addressKey:
          description: (proto string)
          title: address_key
          type: string
        current:
          $ref: '#/components/schemas/shorts.v1alpha1.PropertyListingSnapshot'
          description: most-recent active listing (or most-recent if none active)
            (proto shorts.v1alpha1.PropertyListingSnapshot)
          title: current
        currentPrice:
          description: (proto double)
          format: double
          title: current_price
          type: number
        displayAddress:
          description: (proto string)
          title: display_address
          type: string
        distinctDwellings:
          description: |-
            Distinct KNOWN bedroom counts seen under this address_key (NULL/0 excluded).
             >1 means the portal likely listed multiple differently-sized units of one
             building WITHOUT a unit number, so this timeline may blend more than one
             physical dwelling. Counting bedrooms (not raw bed/bath/type tuples) keeps
             cross-portal label noise from falsely flagging a single dwelling. A search-
             results crawl cannot recover the missing unit number, so the view warns
             instead of silently merging. See docs/feature/housing/architecture.md. (proto int32)
          format: int32
          title: distinct_dwellings
          type: integer
        events:
          description: full timeline across ALL its listings, ordered observed_at
            asc (proto shorts.v1alpha1.PropertyPriceEvent)
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.PropertyPriceEvent'
          title: events
          type: array
        firstPrice:
          description: (proto double)
          format: double
          title: first_price
          type: number
        numListings:
          description: distinct source+listing_id at this address (proto int32)
          format: int32
          title: num_listings
          type: integer
        postcode:
          description: (proto string)
          title: postcode
          type: string
        stateCode:
          description: (proto string)
          title: state_code
          type: string
        suburb:
          description: (proto string)
          title: suburb
          type: string
        valuation:
          $ref: '#/components/schemas/shorts.v1alpha1.PropertyValuation'
          description: |-
            AVM valuation for this address (property.com.au). Unset when none exists,
             fetch_status != 'ok', or HOUSING_VALUATIONS_ENABLED is off. (proto shorts.v1alpha1.PropertyValuation)
          title: valuation
      title: GetPropertyHistoryResponse
      type: object
    shorts.v1alpha1.GetRegisterActivityRequest:
      additionalProperties: false
      properties:
        chamber:
          description: '''house'' | ''senate'' (proto string)'
          title: chamber
          type: string
        itemNo:
          description: register form item 1-14; 0 = all (proto int32)
          format: int32
          title: item_no
          type: integer
        kind:
          $ref: '#/components/schemas/shorts.v1alpha1.RegisterChangeKind'
          description: UNSPECIFIED = both (proto shorts.v1alpha1.RegisterChangeKind)
          title: kind
        partyAb:
          description: AEC abbreviation (proto string)
          title: party_ab
          type: string
        politicianSlug:
          description: |-
            The SAME filter set ListRegisterChanges takes, and for one reason: the
             weekly strip is drawn above a FILTERED feed, so parliament-wide numbers
             rendered there read as the filtered member's own. All optional and all
             ADDITIVE — an unfiltered request is byte-identical to the old behaviour.

             They narrow the WEEKLY BUCKETS, filtered_event_count and
             filtered_member_count only. The three rails (active_members,
             newly_declared_companies, declarer_count_changes) are NOT narrowed by the
             filters: they answer corpus-wide questions inside the window, and a
             "most active members" rail filtered to one member would be a tautology. canonical slug; consumers never derive one (proto string)
          title: politician_slug
          type: string
        windowDays:
          description: |-
            30 | 90 | 180 | 365. Anything else is clamped to the next value up (0 and
             negatives default to 90), so a cache key can never describe a window other
             than the one that produced it. (proto int32)
          format: int32
          title: window_days
          type: integer
      title: GetRegisterActivityRequest
      type: object
    shorts.v1alpha1.GetRegisterActivityResponse:
      additionalProperties: false
      properties:
        activeMembers:
          description: |-
            The three rails below are CORPUS-WIDE and window-scoped: the request's
             filters do not narrow them. (proto shorts.v1alpha1.ActiveMember)
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.ActiveMember'
          title: active_members
          type: array
        asAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: (proto google.protobuf.Timestamp)
          title: as_at
        declarerCountChanges:
          description: (proto shorts.v1alpha1.DeclarerCountChange)
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.DeclarerCountChange'
          title: declarer_count_changes
          type: array
        filteredEventCount:
          description: |-
            Dated events matching the request's filters inside the window. Equal to the
             sum of every bucket's added_count + removed_count, so a count line beside
             the strip states the strip's own total and not the parliament's. (proto int32)
          format: int32
          title: filtered_event_count
          type: integer
        filteredMemberCount:
          description: |-
            DISTINCT members with at least one such event — PEOPLE, never rows. A
             surface can state it exactly instead of counting the members it happens to
             have rendered, which is always a floor. (proto int32)
          format: int32
          title: filtered_member_count
          type: integer
        newlyDeclaredCompanies:
          description: (proto shorts.v1alpha1.NewlyDeclaredCompany)
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.NewlyDeclaredCompany'
          title: newly_declared_companies
          type: array
        sourceLicence:
          description: (proto string)
          title: source_licence
          type: string
        undatedCurrentCount:
          description: |-
            Currently-declared rows with no known start date, and therefore absent from
             every measure above. Stated rather than dropped silently: a surface must be
             able to caption what its timeline does not contain. (proto int32)
          format: int32
          title: undated_current_count
          type: integer
        weeks:
          description: |-
            Contiguous Monday buckets, NARROWED BY THE REQUEST'S FILTERS. The first
             bucket is the Monday on or before (today - window_days), so no bucket is a
             partial week drawn as a full one. (proto shorts.v1alpha1.WeeklyEventCount)
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.WeeklyEventCount'
          title: weeks
          type: array
        windowDays:
          description: the clamped window actually used (proto int32)
          format: int32
          title: window_days
          type: integer
      title: GetRegisterActivityResponse
      type: object
