          description: (proto string)
          title: listing_id
          type: string
        listingStatus:
          description: (proto string)
          title: listing_status
          type: string
        observedAt:
          description: RFC3339, the run timestamp (proto string)
          title: observed_at
          type: string
        prevPrice:
          description: (proto double)
          format: double
          title: prev_price
          type: number
        prevStatus:
          description: (proto string)
          title: prev_status
          type: string
        price:
          description: (proto double)
          format: double
          title: price
