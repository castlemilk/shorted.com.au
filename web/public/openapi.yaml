      title: BattlegroundStock
      type: object
    shorts.v1alpha1.BattlegroundView:
      description: View mode for GetBattlegroundStocks
      enum:
      - BATTLEGROUND_VIEW_UNSPECIFIED
      - BATTLEGROUND_VIEW_SQUEEZE
      - BATTLEGROUND_VIEW_DIVERGENCE
      title: BattlegroundView
      type: string
    shorts.v1alpha1.CandidateDonation:
      additionalProperties: false
      description: CandidateDonation is one itemised gift named in a candidate's election
        return.
      properties:
        amountCents:
          description: (proto int64)
          format: int64
          title: amount_cents
          type:
          - integer
          - string
        donationDate:
          description: YYYY-MM-DD; empty when the return omits it (proto string)
          title: donation_date
          type: string
        donorName:
          description: verbatim (proto string)
          title: donor_name
          type: string
      title: CandidateDonation
      type: object
    shorts.v1alpha1.CandidateElectionReturn:
      additionalProperties: false
      description: |-
        CandidateElectionReturn is one election return lodged by the member as a
         candidate — the honest member layer, because it names the person.

         A NIL RETURN IS A FACT, not missing data: nil_return true means "lodged a
         return declaring no gifts", which is publishable exactly as that.
      properties:
        amendmentNo:
          description: |-
            Amendments land continuously; the number is published so a reader knows the
             figure was revised rather than wondering why it moved. (proto int32)
          format: int32
          title: amendment_no
          type: integer
        candidateName:
          description: verbatim 'SURNAME, Given Names' (proto string)
          title: candidate_name
          type: string
        discretionaryCents:
          description: (proto int64)
          format: int64
          title: discretionary_cents
          type:
          - integer
          - string
        donations:
          description: |-
            Itemised gifts, where the return names them. Empty is NOT "no gifts" — see
             the event coverage counts below. (proto shorts.v1alpha1.CandidateDonation)
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.CandidateDonation'
          title: donations
          type: array
        donorCount:
          description: (proto int32)
          format: int32
          title: donor_count
          type: integer
        electorateName:
          description: (proto string)
          title: electorate_name
          type: string
        electorateState:
          description: (proto string)
          title: electorate_state
          type: string
        event:
          description: verbatim, e.g. '2025 Federal Election' (proto string)
          title: event
          type: string
        eventItemisedReturnCount:
          description: (proto int32)
          format: int32
          title: event_itemised_return_count
          type: integer
        eventReturnCount:
          description: |-
            CORPUS-WIDE coverage for this event, carried on the row it caveats: of
             event_return_count returns lodged, event_itemised_return_count name their
             donors individually. Without this an empty donations list reads as a claim. (proto int32)
          format: int32
          title: event_return_count
          type: integer
        eventYear:
          description: (proto int32)
          format: int32
          title: event_year
          type: integer
        expenditureCents:
          description: (proto int64)
          format: int64
          title: expenditure_cents
          type:
          - integer
          - string
        nilReturn:
          description: (proto bool)
          title: nil_return
          type: boolean
        partyName:
          description: (proto string)
          title: party_name
          type: string
        returnType:
          description: '''Candidate'' | ''Senate Group'' (proto string)'
          title: return_type
          type: string
        sourceUrl:
          description: (proto string)
          title: source_url
          type: string
        totalGiftCents:
          description: (proto int64)
          format: int64
          title: total_gift_cents
          type:
          - integer
          - string
      title: CandidateElectionReturn
      type: object
    shorts.v1alpha1.CompanyTaxYear:
      additionalProperties: false
      description: |-
        One income year of ATO corporate-tax transparency data for an entity.
         has_taxable_income / has_tax_payable distinguish a genuine zero from
         "not reported" (the ATO leaves these blank; blank is meaningful, not zero).
      properties:
        hasTaxPayable:
          description: (proto bool)
          title: has_tax_payable
          type: boolean
        hasTaxableIncome:
          description: (proto bool)
          title: has_taxable_income
          type: boolean
        incomeYear:
          description: e.g. 2024 for the 2023-24 report (proto int32)
          format: int32
          title: income_year
          type: integer
        taxPayable:
          description: valid only when has_tax_payable (proto double)
          format: double
          title: tax_payable
          type: number
        taxableIncome:
          description: valid only when has_taxable_income (proto double)
          format: double
          title: taxable_income
          type: number
        totalIncome:
          description: always reported (A$) (proto double)
          format: double
          title: total_income
          type: number
      title: CompanyTaxYear
      type: object
