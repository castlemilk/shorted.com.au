    shorts.v1alpha1.ReceiptTypeSplit:
      additionalProperties: false
      description: |-
        ReceiptTypeSplit is the source's own distinction between kinds of money, and
         it MUST be rendered rather than summed away: a conference fee is not a
         donation. The five buckets are exhaustive over the source vocabulary
         ('Donation Received', 'Other Receipt', 'Subscription', 'Public Funding',
         'Unspecified' and blank, the last two folded into unspecified_cents), so
         their sum is exactly total_cents and a consumer can prove it.
      properties:
        donationCents:
          description: (proto int64)
          format: int64
          title: donation_cents
          type:
          - integer
          - string
        otherReceiptCents:
          description: (proto int64)
          format: int64
          title: other_receipt_cents
          type:
          - integer
          - string
        publicFundingCents:
          description: (proto int64)
          format: int64
          title: public_funding_cents
          type:
          - integer
          - string
        subscriptionCents:
          description: (proto int64)
          format: int64
          title: subscription_cents
          type:
          - integer
          - string
        unspecifiedCents:
          description: (proto int64)
          format: int64
          title: unspecified_cents
          type:
          - integer
          - string
      title: ReceiptTypeSplit
      type: object
