components:
  schemas:
    connect-protocol-version:
      const: 1
      description: Define the version of the Connect protocol
      enum:
      - 1
      title: Connect-Protocol-Version
      type: number
    connect-timeout-header:
      description: Define the timeout, in ms
      title: Connect-Timeout-Ms
      type: number
    connect.error:
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
      properties:
        code:
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
          enum:
          - canceled
          - unknown
          - invalid_argument
          - deadline_exceeded
          - not_found
          - already_exists
          - permission_denied
          - resource_exhausted
          - failed_precondition
          - aborted
          - out_of_range
          - unimplemented
          - internal
          - unavailable
          - data_loss
          - unauthenticated
          examples:
          - not_found
          type: string
        details:
          description: A list of messages that carry the error details. There is no
            limit on the number of messages.
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          type: array
        message:
          description: A developer-facing error message, which should be in English.
            Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details]
            field, or localized by the client.
          type: string
      title: Connect Error
      type: object
    connect.error_details.Any:
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that
        describes the type of the serialized message, with an additional debug field
        for ConnectRPC error details.
      properties:
        debug:
          description: Deserialized error detail payload. The 'type' field indicates
            the schema. This field is for easier debugging and should not be relied
            upon for application logic.
          discriminator:
            propertyName: type
          oneOf:
          - additionalProperties: true
            description: Detailed error information.
            title: Any
            type: object
          title: Debug
        type:
          description: 'A URL that acts as a globally unique identifier for the type
            of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.
            This is used to determine the schema of the data in the `value` field
            and is the discriminator for the `debug` field.'
          type: string
        value:
          description: The Protobuf message, serialized as bytes and base64-encoded.
            The specific message type is identified by the `type` field.
          format: binary
          type: string
      type: object
    google.protobuf.Timestamp:
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();


         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();


         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://www.joda.org/joda-time/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime%2D%2D
         ) to obtain a formatter capable of generating timestamps in this format.
      examples:
      - "2023-01-15T01:30:15.01Z"
      - "2024-12-25T12:00:00Z"
      format: date-time
      type: string
    shorts.v1alpha1.ActiveMember:
      additionalProperties: false
      description: |-
        ActiveMember is a member ordered by their COUNT of dated events in the
         window. A high count reflects lodgement and extraction activity, not conduct.
      properties:
        chamber:
          description: (proto string)
          title: chamber
          type: string
        displayName:
          description: (proto string)
          title: display_name
          type: string
        division:
          description: (proto string)
          title: division
          type: string
        eventCount:
          description: (proto int32)
          format: int32
          title: event_count
          type: integer
        partyAb:
          description: (proto string)
          title: party_ab
          type: string
        slug:
          description: (proto string)
          title: slug
          type: string
      title: ActiveMember
      type: object
    shorts.v1alpha1.AddressPriceDrop:
      additionalProperties: false
      description: |-
        One physical address (deduped by stable address_key) whose for-sale asking
         price fell over the window, deep-linking to its per-address history page.
      properties:
        addressKey:
          description: (proto string)
          title: address_key
          type: string
        agencyName:
          description: marketing agency of the current listing ('' when not captured)
            (proto string)
          title: agency_name
          type: string
        agentNames:
          description: listing agents ('' when not captured) (proto string)
          items:
            type: string
          title: agent_names
          type: array
        bathrooms:
          description: (proto int32)
          format: int32
          title: bathrooms
          type: integer
        bedrooms:
          description: (proto int32)
          format: int32
          title: bedrooms
          type: integer
        currentPrice:
          description: current active asking, AUD (proto double)
          format: double
          title: current_price
          type: number
        displayAddress:
          description: (proto string)
          title: display_address
          type: string
        dropAbs:
          description: first_price - current_price, AUD (proto double)
          format: double
          title: drop_abs
          type: number
        dropPct:
          description: fraction (0.062 == a 6.2% drop) (proto double)
          format: double
          title: drop_pct
          type: number
        firstPrice:
          description: earliest observed price in the window, AUD (proto double)
          format: double
          title: first_price
          type: number
        lastObservedAt:
          description: RFC3339, when the current listing was last seen (proto string)
          title: last_observed_at
          type: string
        latestListingUrl:
          description: deep link to the live portal listing (proto string)
          title: latest_listing_url
          type: string
        latestSource:
          description: '''rea'' | ''domain'' (proto string)'
          title: latest_source
          type: string
        numListings:
          description: distinct source+listing_id at this address (proto int32)
          format: int32
          title: num_listings
          type: integer
        postcode:
          description: (proto string)
          title: postcode
          type: string
        propertyType:
          description: (proto string)
          title: property_type
          type: string
        stateCode:
          description: (proto string)
          title: state_code
          type: string
        suburb:
          description: (proto string)
          title: suburb
          type: string
      title: AddressPriceDrop
      type: object
    shorts.v1alpha1.AgencyPriceStats:
      additionalProperties: false
      description: |-
        One agency's aggregate footprint across its tracked listings. agency
         identity is per-portal (REA company id / Domain advertiser id) — the same
         real-world agency may appear once per portal.
      properties:
        activeListings:
          description: (proto int32)
          format: int32
          title: active_listings
          type: integer
        agencyId:
          description: portal-scoped id (proto string)
          title: agency_id
          type: string
        agencyName:
          description: (proto string)
          title: agency_name
          type: string
        agentNames:
          description: small display sample of listing agents (<=6) (proto string)
          items:
            type: string
          title: agent_names
          type: array
        avgAsking:
          description: AUD (0 if none) (proto double)
          format: double
          title: avg_asking
          type: number
        avgDropPct:
          description: 0..1 fraction (0 if no drops) (proto double)
          format: double
          title: avg_drop_pct
          type: number
        droppedCount:
          description: deduped addresses cut in the 30-day window (proto int32)
          format: int32
          title: dropped_count
          type: integer
        medianAsking:
          description: AUD (proto double)
          format: double
          title: median_asking
          type: number
        pricedListings:
          description: active listings with a numeric asking price (proto int32)
          format: int32
          title: priced_listings
          type: integer
        source:
          description: '''rea'' | ''domain'' (proto string)'
          title: source
          type: string
        stateCode:
          description: (proto string)
          title: state_code
          type: string
        suburbsCovered:
          description: (proto int32)
          format: int32
          title: suburbs_covered
          type: integer
        totalDropValue:
          description: summed AUD reductions (proto double)
          format: double
          title: total_drop_value
          type: number
      title: AgencyPriceStats
      type: object
    shorts.v1alpha1.AlertMonitor:
