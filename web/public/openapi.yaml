    shorts.v1alpha1.SuburbSummary:
      additionalProperties: false
      properties:
        amenities:
          $ref: '#/components/schemas/shorts.v1alpha1.SuburbAmenities'
          description: Amenity/lifestyle metrics (Local Insights); null/absent until
            ingested. (proto shorts.v1alpha1.SuburbAmenities)
          title: amenities
        connectivityQualityScore:
          description: 0..100 (tech-tier proxy) (proto double)
          format: double
          title: connectivity_quality_score
          type: number
        crimeBreakInsRank:
          description: |-
            Crime percentile ranks (0..100, higher = more reported crime; latest
             2-yr-pooled FY, CVS-adjusted). 0 = no data — pct_rank is strictly > 0
             whenever a reliable observation exists. Small-population and
             statistically-unreliable suburbs are gated server-side
             (mv_suburb_crime_latest) and read as no-data. NSW (BOCSAR) only in
             Phase 1; uncovered states/TAS/NT stay 0. CC-BY sources.

             The rank is population-weighted WITHIN THE SUBURB'S OWN STATE, never across
             states: each police force counts offences under its own rules, so a
             cross-jurisdiction pool would compare incomparable counts. Read "82nd
             percentile" as "82nd of that state", and label it that way in any client. (proto double)
          format: double
          title: crime_break_ins_rank
          type: number
        crimeMotorVehicleRank:
          description: |-
            Field 31 is reserved by convention for crime_property_damage_rank once a
             CVS anchor exists; do not use 31 for anything else. (proto double)
          format: double
          title: crime_motor_vehicle_rank
          type: number
        crimeViolentRank:
          description: (proto double)
          format: double
          title: crime_violent_rank
          type: number
        dominantNbnTech:
          description: NBN connectivity (Local Insights); '' until ingested. Fixed
            Line | Fixed Wireless | Satellite (proto string)
          title: dominant_nbn_tech
          type: string
        federalDivision:
          description: Federal electoral representation (AEC 2025 election), spatially
            joined. Commonwealth Electoral Division (proto string)
          title: federal_division
          type: string
        federalMember:
          description: sitting House of Reps member (proto string)
          title: federal_member
          type: string
        federalParty:
          description: member's party (full name) (proto string)
          title: federal_party
          type: string
        federalPartyAb:
          description: party abbreviation (palette key) (proto string)
          title: federal_party_ab
          type: string
        federalTppAlp:
          description: 0..100 Labor two-party-preferred % (proto double)
          format: double
          title: federal_tpp_alp
          type: number
        latestMedianPrice:
          description: 0 if no price data (proto double)
          format: double
          title: latest_median_price
          type: number
        latestPeriod:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: (proto google.protobuf.Timestamp)
          title: latest_period
        medianAge:
          description: (proto double)
          format: double
          title: median_age
          type: number
        medianWeeklyHhdIncome:
          description: (proto double)
          format: double
          title: median_weekly_hhd_income
          type: number
        pctBornOverseas:
          description: Cultural demographics for the map's "highlight" toggle (ABS
            Census 2021). 0..100 (proto double)
          format: double
          title: pct_born_overseas
          type: number
        pctTopLanguage:
          description: 0..100 share speaking top_language (proto double)
          format: double
          title: pct_top_language
          type: number
        politicianPropertyCount:
          description: |-
            Properties declared in the federal Registers of Members'/Senators'
             Interests that resolve to this suburb. A COUNT of declarations — the
             registers record what is held, never quantity or value.

             A scalar rather than a nested message on purpose: the map needs a value for
             every suburb in a state (~5,000 rows per request), and a message would drag
             the politicians descriptor into the hot /housing/[state] route bundle. (proto int32)
          format: int32
          title: politician_property_count
          type: integer
        population:
          description: (proto int32)
          format: int32
          title: population
          type: integer
        postcode:
          description: (proto string)
          title: postcode
          type: string
        regionCode:
          description: priced-region code (for the price series), '' if unpriced (proto
            string)
          title: region_code
          type: string
        salCode:
          description: (proto string)
          title: sal_code
          type: string
        salName:
          description: (proto string)
          title: sal_name
          type: string
        seifa:
          $ref: '#/components/schemas/shorts.v1alpha1.SuburbSeifa'
          description: Profile-only in the current backend query; list responses leave
            it absent. (proto shorts.v1alpha1.SuburbSeifa)
          title: seifa
        stateCode:
          description: (proto string)
          title: state_code
          type: string
        stateDistrict:
          description: ABS State Electoral Division (proto string)
          title: state_district
          type: string
        stateMember:
          description: state lower-house member ('' for Hare-Clark TAS/ACT) (proto
            string)
          title: state_member
          type: string
        stateParty:
          description: state member's party (full name) (proto string)
          title: state_party
          type: string
        statePartyAb:
          description: state party abbreviation (palette key) (proto string)
          title: state_party_ab
          type: string
        topLanguage:
          description: top language other than English at home, '' if none (proto
            string)
          title: top_language
          type: string
        topReligion:
          description: dominant religious affiliation, '' if none (proto string)
          title: top_religion
          type: string
        yoyPct:
          description: (proto double)
          format: double
          title: yoy_pct
          type: number
      title: SuburbSummary
      type: object
