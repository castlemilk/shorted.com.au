    shorts.v1alpha1.GetTopShortsRequest:
      additionalProperties: false
      description: Request for Top10 RPC, specifying the period of time.
      properties:
        limit:
          description: (proto int32)
          format: int32
          title: limit
          type: integer
        offset:
          description: (proto int32)
          format: int32
          title: offset
          type: integer
        period:
          description: (proto string)
          title: period
          type: string
        productCodes:
          description: |-
            Optional explicit set of product codes to return time series for, INSTEAD
             of the top-`limit` ranking. Lets callers that already know which stocks
             they need (e.g. industry-crowding constituents) fetch just those series
             rather than every top-N stock's points. Ignored when empty. When set with
             summary_only=false, `limit`/`offset` are not applied to the code set. (proto string)
          items:
            type: string
          title: product_codes
          type: array
        summaryOnly:
          description: |-
            When true, returns only product code, name, and latest short position
             without time series points. Much faster and smaller response. (proto bool)
          title: summary_only
          type: boolean
      title: GetTopShortsRequest
      type: object
