      type: object
    shorts.v1alpha1.PropertyValuation:
      additionalProperties: false
      description: |-
        AVM valuation snapshot for a physical address (property.com.au / PropTrack
         AVM). DERIVED figures from a proprietary-tos-restricted source: the raw
         harvested profile is never exposed; this surface deep-links OUT to the
         source profile. Absent entirely when the address has no successful
         valuation, or when the valuations kill switch is off.
      properties:
        bathrooms:
          description: (proto int32)
          format: int32
          title: bathrooms
          type: integer
        bedrooms:
          description: 0 = unknown (proto int32)
          format: int32
          title: bedrooms
          type: integer
        buildingSizeSqm:
          description: floor area; 0 = unknown (proto double)
          format: double
          title: building_size_sqm
          type: number
        carSpaces:
          description: (proto int32)
          format: int32
          title: car_spaces
          type: integer
        estimateConfidence:
          description: source confidence string ('' when not exposed); free-form (proto
            string)
          title: estimate_confidence
          type: string
        estimateHigh:
          description: AVM range high, AUD (0 = not provided) (proto double)
          format: double
          title: estimate_high
          type: number
        estimateLow:
          description: AVM range low, AUD (0 = not provided) (proto double)
          format: double
          title: estimate_low
          type: number
        estimateMid:
          description: AVM point estimate, AUD (0 = not provided) (proto double)
          format: double
          title: estimate_mid
          type: number
        fetchedAt:
          description: RFC3339 — AVMs are point-in-time; UI must show this (proto
            string)
          title: fetched_at
          type: string
        landSizeSqm:
          description: 0 = unknown (proto double)
          format: double
          title: land_size_sqm
          type: number
        profileUrl:
          description: deep link OUT to the source profile page (proto string)
          title: profile_url
          type: string
        propertyType:
          description: ''''' = unknown (proto string)'
          title: property_type
          type: string
        rentEstimateMid:
          description: weekly rent estimate, AUD (0 when not exposed) (proto double)
          format: double
          title: rent_estimate_mid
          type: number
        salesHistory:
          description: newest first (proto shorts.v1alpha1.PropertyValuationSale)
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.PropertyValuationSale'
          title: sales_history
          type: array
        source:
          description: '''property.com.au'' (proto string)'
          title: source
          type: string
        valuationGranularity:
          description: |-
            'exact'    — the profile is the exact dwelling this address names
             'building' — a unit whose own profile isn't indexed; this is the whole
                          BUILDING's AVM used as a fallback. Consumers MUST label it
                          "building estimate" and MUST NOT present it as unit-precise. (proto string)
          title: valuation_granularity
          type: string
        yearBuilt:
          description: 0 = unknown (proto int32)
          format: int32
          title: year_built
          type: integer
      title: PropertyValuation
      type: object
    shorts.v1alpha1.PropertyValuationSale:
      additionalProperties: false
      description: |-
        One historical sales/timeline event from the valuation source's property
         profile (property.com.au timeline). Distinct from PropertyPriceEvent: these
         are the portal's own transaction history (sold/listed/rented, potentially
         decades back), not our crawl-observed asking-price events.
      properties:
        agency:
          description: ''''' when not captured (proto string)'
          title: agency
          type: string
        date:
          description: ISO date 'YYYY-MM-DD' ('' when unparsed) (proto string)
          title: date
          type: string
        eventType:
          description: source badge text, e.g. 'Sold' | 'Listed for sale' | 'Rented'
            (proto string)
          title: event_type
          type: string
        price:
          description: AUD; 0 = undisclosed (source omitted the figure) (proto double)
          format: double
          title: price
          type: number
      title: PropertyValuationSale
      type: object
