# Report extractor echo repair: run the financial-report-extractor job once
# with `--repair-echo-digests`, on demand.
#
# Before the trust funnel (docs/plans/fundamentals-coverage.md §6.1), the
# extractor's prompt example leaked into stored metrics (revenue $5,142m, NPAT
# $1,823m, EPS 94.2c as BHP, CBA, DRO, EDV and MSB results), and the digests
# written from those metrics repeat the figures. The API withholds any filing
# summary whose metrics still carry such an entry. This run drops ONLY the echo
# entries from those rows (everything else is kept verbatim) and writes a new
# digest through the trusted prompt, or digest NULL when none can be written,
# so the summaries come back. It is a one-off after the deploy, and safe to
# re-run: a clean row is not selected again.
#
# It executes the SAME job the daily schedule runs. `--args` replaces the
# deployed args and keeps the image's command (python
# extract_reports_concurrent.py), so the flags below are the whole run.
# Default is a dry run: it selects and logs the rows and writes nothing.
#
# After the execution ends (either way) the workflow reads that execution's own
# log lines back from Cloud Logging, the way Register Freshness does, and
# prints them with the task's exit code: the rows it selected, their outcomes,
# or why it stopped, all in the run log.
name: Report Extractor Repair

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: list the rows it would repair, write nothing"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: report-extractor-repair
  cancel-in-progress: false

env:
  PROJECT: rosy-clover-477102-t5
  REGION: australia-southeast2
  JOB: financial-report-extractor

jobs:
  repair:
    runs-on: ubuntu-latest
    # A handful of rows, each one digest call; the job's own timeout is 2h.
    timeout-minutes: 130
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Execute the repair
        id: run
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Actions runs this under `bash -e`: without +e a failed execution
          # ends the script at the pipeline below, before the execution name
          # and summary are recorded (the next step then has nothing to read).
          set +e -uo pipefail
          args="--repair-echo-digests,--workers,2"
          if [[ "$DRY_RUN" == "true" ]]; then args+=",--dry-run"; fi
          echo "Executing $JOB with args: $args"

          gcloud run jobs execute "$JOB" --project "$PROJECT" --region "$REGION" \
            --args="$args" --wait 2>&1 | tee "$RUNNER_TEMP/execute.log"
          rc=${PIPESTATUS[0]}

          # gcloud names the execution as "Execution [name]" on success and
          # as "executions describe name" on failure.
          execution="$(grep -oE 'Execution \[[a-z0-9-]+\]|executions describe [a-z0-9-]+' "$RUNNER_TEMP/execute.log" \
            | head -n1 | grep -oE '[a-z0-9-]+$|\[[a-z0-9-]+\]' | tr -d '[]' || true)"
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          {
            echo "## Report extractor echo repair $([[ "$DRY_RUN" == "true" ]] && echo "PREVIEW (dry run, nothing written)")"
            echo
            echo "Execution \`${execution:-unknown}\` exited $rc. Its log is in the next step."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # The execution's own output: the rows selected, each row's outcome and
      # the closing counts, or the reason it stopped. Logs can land a little
      # after the execution ends, so one short wait before reading.
      - name: Execution log
        if: always()
        env:
          EXECUTION: ${{ steps.run.outputs.execution }}
        run: |
          set -uo pipefail
          if [[ -z "$EXECUTION" ]]; then
            # Not parsed from gcloud's output: the job's newest execution is
            # this run's (the workflow's concurrency group allows one at a time).
            EXECUTION="$(gcloud run jobs executions list --job "$JOB" --project "$PROJECT" --region "$REGION" \
              --sort-by='~metadata.creationTimestamp' --limit 1 --format='value(metadata.name)' || true)"
          fi
          if [[ -z "$EXECUTION" ]]; then
            echo "::warning::could not resolve the execution name"
            exit 0
          fi
          echo "execution: $EXECUTION"
          gcloud run jobs executions describe "$EXECUTION" --project "$PROJECT" --region "$REGION" \
            --format='yaml(status.conditions,status.failedCount,status.succeededCount)' || true
          sleep 20
          log="$RUNNER_TEMP/execution.log"
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="'"$JOB"'" AND labels."run.googleapis.com/execution_name"="'"$EXECUTION"'"' \
            --project "$PROJECT" --freshness 3h --limit 500 --order asc \
            --format='value(textPayload)' > "$log" || true
          if [[ ! -s "$log" ]]; then
            echo "(no log lines recovered for $EXECUTION)" > "$log"
          fi
          cat "$log"
          {
            echo '```text'
            tail -n 80 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
