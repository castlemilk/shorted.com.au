name: Perf Budget

# Checks gzipped first-load JS per route against the committed baseline.
# The build and bundle budget remain blocking; Lighthouse is run locally when
# needed rather than starting browsers and a production server in every PR.
# This job uses public API configuration and requires no deployment secrets.
# Refresh an intentional baseline change with:
#   cd web && npm run build && npm run bundle:baseline

on:
  pull_request:
    paths:
      - "web/**"
      - "docs/perf/**"
      - ".github/workflows/perf-budget.yml"
      - "scripts/vercel-release.mjs"
      - "scripts/verify-web-release-artifact.mjs"
  workflow_dispatch:

concurrency:
  group: perf-budget-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Build-time public API base (client rewrites target the edge). No secret.
  NEXT_PUBLIC_API_URL: "https://api.shorted.com.au"

jobs:
  perf-budget:
    name: Bundle budget
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          # Partial clone uses the checkout action; avoids the native mirror path.
          filter: blob:none
          sparse-checkout: |
            web
            docs
            content
            api
            proto
            scripts

      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Production build
        id: production-build
        run: |
          set -euo pipefail
          SHORTED_RELEASE_SHA="$(git rev-parse HEAD)"
          export SHORTED_RELEASE_SHA
          echo "release-sha=$SHORTED_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p perf-results
          npx next build 2>&1 | tee perf-results/build.log

      - name: Verify compiled release identity and unchanged source
        env:
          RELEASE_SOURCE_SHA: ${{ steps.production-build.outputs.release-sha }}
        run: |
          node ../scripts/verify-web-release-artifact.mjs .next "$RELEASE_SOURCE_SHA"
          git diff --exit-code

      # Bundle budget (blocking)
      - name: Bundle budget vs baseline
        run: node scripts/bundle-budget.mjs --build-log perf-results/build.log --compare ../docs/perf/bundle-baseline.json

      # ISR gate (blocking): every stock route must be on-demand ISR.
      - name: Stock routes are ISR
        run: node scripts/route-kinds.mjs

      # Chart-code gate (blocking): only the chart tabs load the chart with the
      # page; the Overview's first-load chunks are every other tab's.
      - name: Only the chart tabs load the chart
        run: node scripts/stock-chart-chunks.mjs

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bundle-reports
          path: web/perf-results/bundle-*.json
          retention-days: 14
