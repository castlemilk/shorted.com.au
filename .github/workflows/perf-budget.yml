name: Perf Budget

# Checks gzipped first-load JS per route against the committed baseline.
# The build and bundle budget remain blocking; Lighthouse is run locally when
# needed rather than starting browsers and a production server in every PR.
# This job uses public API configuration and requires no deployment secrets.
# Refresh an intentional baseline change with:
#   cd web && npm run build && npm run bundle:baseline

on:
  pull_request:
    paths:
      - "web/**"
      - "docs/perf/**"
      - ".github/workflows/perf-budget.yml"
  workflow_dispatch:

concurrency:
  group: perf-budget-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Build-time public API base (client rewrites target the edge). No secret.
  NEXT_PUBLIC_API_URL: "https://api.shorted.com.au"

jobs:
  perf-budget:
    name: Bundle budget
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Production build
        run: npx next build

      # Bundle budget (blocking)
      - name: Bundle budget vs baseline
        run: node scripts/bundle-budget.mjs --compare ../docs/perf/bundle-baseline.json

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bundle-reports
          path: web/perf-results/bundle-*.json
          retention-days: 14
