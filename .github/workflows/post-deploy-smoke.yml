name: Post-Deploy Smoke Test

# Runs after Vercel production deployments to catch 500 errors.
# Triggered manually or on schedule (every 6 hours).
# Also triggered by pushes to main (Vercel auto-deploys on push).

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours — catch regressions from env var changes, Cloud Run redeployments, etc.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Wait for Vercel deploy to complete (triggered by same push)
    # Vercel typically deploys in 3-7 minutes
    steps:
      - name: Wait for deploy to settle
        if: github.event_name == 'push'
        run: sleep 300

      - name: Checkout
        uses: actions/checkout@v5

      # Bust + re-prime the static, data-backed ISR pages whose empty-at-build
      # shell would otherwise be served to the first visitor after this deploy
      # (see web/src/app/api/static-pages/warm-cache/route.ts). Best-effort: the
      # page's own revalidate + the 15-min warm cron backstop it, so a failed
      # warm must not fail the deploy smoke.
      #
      # Two steps: (1) call the endpoint to revalidatePath() the shells; (2) fetch
      # each page HERE with the Cloudflare testing bypass. Step 2 is essential —
      # Cloudflare bot protection 403s any plain server-side fetch (even a browser
      # UA), so only a request carrying the bypass UA + secret reaches Vercel to
      # trigger the regeneration that re-primes the cache with real data.
      - name: Warm static data pages
        env:
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
        run: |
          BASE_URL="https://shorted.com.au"
          CURL_ARGS=(-A "Mozilla/5.0 Shorted-E2E/1.0")
          if [ -n "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}" ]; then
            CURL_ARGS+=(-H "X-Shorted-Testing-Bypass: ${CLOUDFLARE_TESTING_BYPASS_SECRET}")
          else
            echo "::warning::CLOUDFLARE_TESTING_BYPASS_SECRET unset — re-prime fetches will be 403'd by Cloudflare."
          fi
          echo "1) Invalidating static page shells (revalidatePath)…"
          curl -s --max-time 60 "${CURL_ARGS[@]}" "${BASE_URL}/api/static-pages/warm-cache" | head -c 400 || true
          echo ""
          echo "2) Re-priming each page through the Cloudflare bypass…"
          for p in /market /housing /economy /compare; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${CURL_ARGS[@]}" "${BASE_URL}${p}")
            echo "   re-prime ${p}: HTTP ${code}"
          done

      - name: Smoke test critical routes
        env:
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
        run: |
          FAILED=0
          BASE_URL="https://shorted.com.au"
          CURL_ARGS=(-A "Mozilla/5.0 Shorted-E2E/1.0")
          if [ -n "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}" ]; then
            CURL_ARGS+=(-H "X-Shorted-Testing-Bypass: ${CLOUDFLARE_TESTING_BYPASS_SECRET}")
          fi

          for path in / /shorts /shorts/BHP /shorts/CBA /top /industry /screener /stocks; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${CURL_ARGS[@]}" "${BASE_URL}${path}")
            if [ "$status" -ge 400 ]; then
              echo "::error::FAIL: ${path} returned HTTP ${status}"
              FAILED=1
            else
              echo "OK: ${path} returned HTTP ${status}"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more routes returned 4xx/5xx. Check Cloudflare challenges/rate limits and Vercel logs."
            exit 1
          fi

          echo ""
          echo "All routes healthy."

      - name: Smoke test API endpoints
        env:
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
        run: |
          BASE_URL="https://shorted.com.au"
          CURL_ARGS=(-A "Mozilla/5.0 Shorted-E2E/1.0")
          if [ -n "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}" ]; then
            CURL_ARGS+=(-H "X-Shorted-Testing-Bypass: ${CLOUDFLARE_TESTING_BYPASS_SECRET}")
          fi

          # Health endpoint
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${CURL_ARGS[@]}" "${BASE_URL}/api/health")
          if [ "$status" -ge 400 ]; then
            echo "::error::FAIL: /api/health returned HTTP ${status}"
            exit 1
          fi
          echo "OK: /api/health returned HTTP ${status}"

          # Search endpoint
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${CURL_ARGS[@]}" "${BASE_URL}/api/stocks/search?q=BHP&limit=1")
          if [ "$status" -ge 400 ]; then
            echo "::error::FAIL: /api/stocks/search returned HTTP ${status}"
            exit 1
          fi
          echo "OK: /api/stocks/search returned HTTP ${status}"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run production release smoke
        working-directory: web
        timeout-minutes: 12
        env:
          BASE_URL: https://shorted.com.au
          RELEASE_API_BASE_URL: https://api.shorted.com.au
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
        run: |
          if [ -z "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}" ]; then
            echo "::error::CLOUDFLARE_TESTING_BYPASS_SECRET is required for production smoke through Cloudflare"
            exit 1
          fi

          node e2e/release-smoke-ci.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: post-deploy-smoke-playwright-report
          path: web/playwright-report
          retention-days: 7
