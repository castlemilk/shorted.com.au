name: Production Health Smoke Test

# Periodic/manual health of the currently serving production release.
# Release-specific smoke runs in terraform-deploy.yml after promotion.
# Do not treat this independent health check as evidence for a new commit.

on:
  schedule:
    # Every 6 hours: catch regressions from env var changes, Cloud Run redeployments, etc.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  smoke-test:
    name: Current Production Health
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Repair the static, data-backed ISR pages whose empty-at-build
      # shell may survive a failed post-promote prime
      # (see web/src/app/api/static-pages/warm-cache/route.ts). Best-effort: the
      # page's own revalidate + the hourly repair cron backstop it, so a failed
      # warm must not fail the deploy smoke.
      # This job names no environment, so REVALIDATION_SECRET here is the project-level
      # copy. Without it, and without CACHE_WARM_SECRET, the warm call answers 401, which
      # this step ignores.
      #
      # Two steps: (1) repair only confirmed empty shells; (2) fetch
      # each page HERE with the Cloudflare testing bypass. Step 2 is essential:
      # Cloudflare bot protection 403s any plain server-side fetch (even a browser
      # UA), so only a request carrying the bypass UA + secret reaches Vercel to
      # trigger the regeneration that re-primes the cache with real data.
      - name: Warm static data pages
        env:
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
          CACHE_WARM_SECRET: ${{ secrets.CACHE_WARM_SECRET }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          BASE_URL="https://shorted.com.au"
          CURL_ARGS=(-A "Mozilla/5.0 Shorted-E2E/1.0")
          if [ -n "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}" ]; then
            CURL_ARGS+=(-H "X-Shorted-Testing-Bypass: ${CLOUDFLARE_TESTING_BYPASS_SECRET}")
          else
            echo "::warning::CLOUDFLARE_TESTING_BYPASS_SECRET unset; re-prime fetches will be 403'd by Cloudflare."
          fi
          WARM_MODE="repair"
          WARM_ARGS=("${CURL_ARGS[@]}")
          if [ -n "${REVALIDATION_SECRET:-}" ]; then
            WARM_ARGS+=(-H "Authorization: Bearer ${REVALIDATION_SECRET}")
          fi
          if [ -n "${CACHE_WARM_SECRET:-}" ]; then
            WARM_ARGS+=(-H "X-Cache-Warm-Secret: ${CACHE_WARM_SECRET}")
          fi
          echo "1) Static page warm mode: ${WARM_MODE}"
          curl -s --max-time 145 "${WARM_ARGS[@]}" "${BASE_URL}/api/static-pages/warm-cache?mode=${WARM_MODE}" | head -c 400 || true
          echo ""
          echo "2) Re-priming each page through the Cloudflare bypass…"
          # Driven from config/isr-shell-pages.json, NOT a hardcoded list. The
          # list here had drifted to four paths and omitted /price-drops, so that
          # page's shell was invalidated by warm-cache but never re-primed
          # through the public host. Reading the same file warm-cache reads means
          # adding a shell page needs one edit, not three.
          SHELL_PAGES=$(node -e '
            const fs = require("node:fs");
            const pages = JSON.parse(fs.readFileSync("web/src/config/isr-shell-pages.json", "utf8"));
            if (!Array.isArray(pages) || pages.length === 0 || pages.some((p) => typeof p !== "string" || !p.startsWith("/"))) {
              throw new Error("web/src/config/isr-shell-pages.json must be a non-empty array of /-prefixed paths");
            }
            process.stdout.write(pages.join(" "));
          ')
          echo "   re-priming ${SHELL_PAGES}"
          # Eight at a time, as warm-cache reads them. A batch waits for its slowest page,
          # so the warm call (at most 145 s, above) plus this loop (at most 90 s a batch)
          # is 145 + ceil(n / 8) * 90 s: 415 s for the 23 shell pages, under this job's
          # 25 minutes. curl's own exit status is ignored, so every page prints its line,
          # a timeout included (000).
          BATCH=8
          read -r -a PAGES <<< "${SHELL_PAGES}"
          for ((start = 0; start < ${#PAGES[@]}; start += BATCH)); do
            for p in "${PAGES[@]:start:BATCH}"; do
              (
                code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${CURL_ARGS[@]}" "${BASE_URL}${p}" || true)
                echo "   re-prime ${p}: HTTP ${code}"
              ) &
            done
            wait
          done

      - name: Smoke test critical routes
        env:
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
        run: |
          FAILED=0
          BASE_URL="https://shorted.com.au"
          CURL_ARGS=(-A "Mozilla/5.0 Shorted-E2E/1.0")
          if [ -n "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}" ]; then
            CURL_ARGS+=(-H "X-Shorted-Testing-Bypass: ${CLOUDFLARE_TESTING_BYPASS_SECRET}")
          fi

          for path in / /shorts /shorts/BHP /shorts/CBA /top /industry /screener /stocks; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${CURL_ARGS[@]}" "${BASE_URL}${path}")
            if [ "$status" -ge 400 ]; then
              echo "::error::FAIL: ${path} returned HTTP ${status}"
              FAILED=1
            else
              echo "OK: ${path} returned HTTP ${status}"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more routes returned 4xx/5xx. Check Cloudflare challenges/rate limits and Vercel logs."
            exit 1
          fi

          echo ""
          echo "All routes healthy."

      - name: Smoke test API endpoints
        env:
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
        run: |
          BASE_URL="https://shorted.com.au"
          CURL_ARGS=(-A "Mozilla/5.0 Shorted-E2E/1.0")
          if [ -n "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}" ]; then
            CURL_ARGS+=(-H "X-Shorted-Testing-Bypass: ${CLOUDFLARE_TESTING_BYPASS_SECRET}")
          fi

          # Health endpoint
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${CURL_ARGS[@]}" "${BASE_URL}/api/health")
          if [ "$status" -ge 400 ]; then
            echo "::error::FAIL: /api/health returned HTTP ${status}"
            exit 1
          fi
          echo "OK: /api/health returned HTTP ${status}"

          # Search endpoint
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${CURL_ARGS[@]}" "${BASE_URL}/api/stocks/search?q=BHP&limit=1")
          if [ "$status" -ge 400 ]; then
            echo "::error::FAIL: /api/stocks/search returned HTTP ${status}"
            exit 1
          fi
          echo "OK: /api/stocks/search returned HTTP ${status}"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run production release smoke
        working-directory: web
        timeout-minutes: 12
        env:
          BASE_URL: https://shorted.com.au
          RELEASE_API_BASE_URL: https://api.shorted.com.au
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
        run: |
          if [ -z "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}" ]; then
            echo "::error::CLOUDFLARE_TESTING_BYPASS_SECRET is required for production smoke through Cloudflare"
            exit 1
          fi

          node e2e/release-smoke-ci.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: post-deploy-smoke-playwright-report
          path: web/playwright-report
          retention-days: 7

