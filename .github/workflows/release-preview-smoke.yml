name: Release Preview Smoke

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote the smoked preview deployment to production"
        required: true
        type: boolean
        default: false
      ref:
        description: "Git ref to release. Defaults to the selected workflow ref."
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Merges to main auto-promote (after smoke passes): without this, merge
  # deploys exist in Vercel but the shorted.com.au domain stays pinned to the
  # last manually-promoted deployment — changes look shipped while prod
  # silently serves the old build (bit us 2026-07-19). The `prod` environment
  # protection on promote-production still applies.
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  VERCEL_SCOPE: document-analyser
  VERCEL_ORG_ID: team_xE5DMN3hIo8aPqyHNkBybg8r
  VERCEL_PROJECT_ID: prj_FbJ12yJO63YCIG5wnUYh4Fbte20L
  RELEASE_API_BASE_URL: https://api.shorted.com.au

jobs:
  deploy-preview:
    name: Deploy Release Candidate Preview
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {"projectId":"${VERCEL_PROJECT_ID}","orgId":"${VERCEL_ORG_ID}","projectName":"shorted-com-au"}
          JSON

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RELEASE_SHORTS_SERVICE_ENDPOINT: ${{ secrets.RELEASE_SHORTS_SERVICE_ENDPOINT }}
          RELEASE_MARKET_DATA_API_URL: ${{ secrets.RELEASE_MARKET_DATA_API_URL }}
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
          # See the identical block in terraform-deploy.yml: `vercel build` runs
          # on this runner and cannot read Vercel SENSITIVE env vars, so the
          # prerender needs the SSR bypass secret handed to it explicitly.
          CLOUDFLARE_SSR_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_SSR_BYPASS_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_FIREBASE_PROJECT_ID: ${{ secrets.AUTH_FIREBASE_PROJECT_ID_PROD }}
          AUTH_FIREBASE_CLIENT_EMAIL: ${{ secrets.AUTH_FIREBASE_CLIENT_EMAIL_PROD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_PROD }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_PROD }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_PROD }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_PROD }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_PROD }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID_PROD }}
          ALGOLIA_INDEX: stocks
          NEXTAUTH_URL: https://shorted.com.au
          ADMIN_EMAILS: ben.ebsworth@gmail.com
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          STRIPE_API_ACCESS_PRICE_ID: ${{ secrets.STRIPE_API_ACCESS_PRICE_ID }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          NPM_CONFIG_FETCH_RETRIES: "5"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
        run: |
          set -euo pipefail
          deploy_args=(
            --yes
            --target production
            --force
            --skip-domain
            --scope "$VERCEL_SCOPE"
            --archive=tgz
            --token "$VERCEL_TOKEN"
          )

          add_env_pair() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              deploy_args+=(--env "${name}=${value}")
              export "${name}=${value}"
            fi
          }

          # Export for the BUILD only — never as --env, which would downgrade a
          # SENSITIVE Vercel variable to a plaintext one on every deployment.
          export_for_build_only() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              export "${name}=${value}"
            else
              echo "::warning::${name} is empty — the prerender will run " \
                "unverified against the API edge and will not skip the " \
                "Cloudflare zone rate limit."
            fi
          }

          export_for_build_only "SHORTED_SSR_BYPASS_SECRET" "${CLOUDFLARE_SSR_BYPASS_SECRET:-}"

          # An unset RELEASE_SHORTS_SERVICE_ENDPOINT is not benign: with VERCEL
          # set by `vercel build`, getServerShortsApiUrl() falls back to the
          # PUBLIC host (api.shorted.com.au), so the whole prerender goes
          # through Cloudflare from one runner IP instead of straight to the
          # Cloud Run origin. That is half of the August 2026 429 storm. Warn
          # loudly rather than fail — a degraded release build still beats a
          # blocked release.
          if [ -z "${RELEASE_SHORTS_SERVICE_ENDPOINT:-}" ]; then
            echo "::warning::RELEASE_SHORTS_SERVICE_ENDPOINT is not set — the" \
              "release prerender will target the public API host through" \
              "Cloudflare instead of the Cloud Run origin. Set the repository" \
              "secret to the shorts Cloud Run URL."
          fi
          add_env_pair "SHORTS_SERVICE_ENDPOINT" "${RELEASE_SHORTS_SERVICE_ENDPOINT:-}"
          add_env_pair "NEXT_PUBLIC_SHORTS_SERVICE_ENDPOINT" "${RELEASE_SHORTS_SERVICE_ENDPOINT:-}"
          add_env_pair "NEXT_PUBLIC_SHORTS_API_URL" "${RELEASE_SHORTS_SERVICE_ENDPOINT:-}"
          add_env_pair "MARKET_DATA_API_URL" "${RELEASE_MARKET_DATA_API_URL:-}"
          add_env_pair "NEXT_PUBLIC_MARKET_DATA_API_URL" "${RELEASE_MARKET_DATA_API_URL:-}"
          add_env_pair "SHORTED_CLOUDFLARE_TESTING_BYPASS_SECRET" "${CLOUDFLARE_TESTING_BYPASS_SECRET:-}"
          add_env_pair "AUTH_GOOGLE_ID" "${AUTH_GOOGLE_ID:-}"
          add_env_pair "AUTH_GOOGLE_SECRET" "${AUTH_GOOGLE_SECRET:-}"
          add_env_pair "AUTH_FIREBASE_PROJECT_ID" "${AUTH_FIREBASE_PROJECT_ID:-}"
          add_env_pair "AUTH_FIREBASE_CLIENT_EMAIL" "${AUTH_FIREBASE_CLIENT_EMAIL:-}"
          add_env_pair "NEXTAUTH_SECRET" "${NEXTAUTH_SECRET:-}"
          add_env_pair "NEXT_PUBLIC_ALGOLIA_APP_ID" "${NEXT_PUBLIC_ALGOLIA_APP_ID:-}"
          add_env_pair "NEXT_PUBLIC_ALGOLIA_SEARCH_KEY" "${NEXT_PUBLIC_ALGOLIA_SEARCH_KEY:-}"
          add_env_pair "NEXT_PUBLIC_FIREBASE_API_KEY" "${NEXT_PUBLIC_FIREBASE_API_KEY:-}"
          add_env_pair "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" "${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}"
          add_env_pair "NEXT_PUBLIC_FIREBASE_PROJECT_ID" "${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}"
          add_env_pair "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" "${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}"
          add_env_pair "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" "${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}"
          add_env_pair "NEXT_PUBLIC_FIREBASE_APP_ID" "${NEXT_PUBLIC_FIREBASE_APP_ID:-}"
          add_env_pair "ALGOLIA_INDEX" "${ALGOLIA_INDEX:-}"
          add_env_pair "NEXTAUTH_URL" "${NEXTAUTH_URL:-}"
          add_env_pair "ADMIN_EMAILS" "${ADMIN_EMAILS:-}"
          add_env_pair "STRIPE_SECRET_KEY" "${STRIPE_SECRET_KEY:-}"
          add_env_pair "STRIPE_PUBLISHABLE_KEY" "${STRIPE_PUBLISHABLE_KEY:-}"
          add_env_pair "STRIPE_WEBHOOK_SECRET" "${STRIPE_WEBHOOK_SECRET:-}"
          add_env_pair "STRIPE_PRO_PRICE_ID" "${STRIPE_PRO_PRICE_ID:-}"
          add_env_pair "STRIPE_API_ACCESS_PRICE_ID" "${STRIPE_API_ACCESS_PRICE_ID:-}"
          add_env_pair "INTERNAL_SERVICE_SECRET" "${INTERNAL_SERVICE_SECRET:-}"

          npm --prefix web ci
          npm --prefix web run firebase:preflight
          npm --prefix web run stripe:preflight

          npx -p vercel@54.10.2 vercel build \
            --yes \
            --target production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

          npx -p vercel@54.10.2 vercel deploy --prebuilt "${deploy_args[@]}" | tee /tmp/vercel-preview.log
          preview_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' /tmp/vercel-preview.log | tail -n 1)"
          if [ -z "$preview_url" ]; then
            echo "::error::Could not extract Vercel preview URL"
            exit 1
          fi
          echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"

  smoke-preview:
    name: Smoke Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: deploy-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run release smoke
        working-directory: web
        timeout-minutes: 12
        env:
          BASE_URL: ${{ needs.deploy-preview.outputs.preview-url }}
          RELEASE_API_BASE_URL: ${{ env.RELEASE_API_BASE_URL }}
          CLOUDFLARE_TESTING_BYPASS_SECRET: ${{ secrets.CLOUDFLARE_TESTING_BYPASS_SECRET }}
        run: node e2e/release-smoke-ci.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-playwright-report
          path: web/playwright-report
          retention-days: 7

  promote-production:
    name: Promote Production
    runs-on: ubuntu-latest
    needs: [deploy-preview, smoke-preview]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.promote == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: prod
    steps:
      - name: Promote smoked deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview-url }}
        run: |
          npx -p vercel@54.10.2 vercel promote "$PREVIEW_URL" \
            --scope "$VERCEL_SCOPE" \
            --yes \
            --token "$VERCEL_TOKEN"

      - name: Production release summary
        run: |
          echo "Promoted smoked deployment to production:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.deploy-preview.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"
