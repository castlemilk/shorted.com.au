name: 🚀 Deploy Infrastructure

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
      plan_only:
        description: "Plan only (no apply) - use for production dry-run"
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: "20"
  GO_VERSION: "1.26"
  PYTHON_VERSION: "3.11"
  GOWORK: "off"
  GOPRIVATE: github.com/skunkworq/*
  GONOSUMCHECK: github.com/skunkworq/*
  GONOSUMDB: github.com/skunkworq/*
  GCP_REGION: australia-southeast2
  ARTIFACT_REGISTRY: australia-southeast2-docker.pkg.dev
  TF_VERSION: "1.14.6"  # >=1.8 required for cross-type moved blocks (Cloudflare v5 migration)

permissions:
  contents: read
  id-token: write
  pull-requests: write
  deployments: write

concurrency:
  # Use separate concurrency groups for PR close (cleanup) vs other events
  # so cleanup runs are never cancelled by new pushes to the PR
  group: deploy-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' && 'cleanup' || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      project-id: ${{ steps.set-env.outputs.project-id }}
      image-tag: ${{ steps.set-env.outputs.image-tag }}
      commit-sha: ${{ steps.set-env.outputs.commit-sha }}
      is-preview: ${{ steps.set-env.outputs.is-preview }}
      pr-number: ${{ steps.set-env.outputs.pr-number }}
      wip-provider: ${{ steps.set-env.outputs.wip-provider }}
      sa-email: ${{ steps.set-env.outputs.sa-email }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "project-id=shorted-dev-aba5688f" >> $GITHUB_OUTPUT
            echo "image-tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "commit-sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            echo "is-preview=true" >> $GITHUB_OUTPUT
            echo "pr-number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "wip-provider=projects/234770780438/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> $GITHUB_OUTPUT
            echo "sa-email=github-actions-sa@shorted-dev-aba5688f.iam.gserviceaccount.com" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "release" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "project-id=rosy-clover-477102-t5" >> $GITHUB_OUTPUT
            echo "image-tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "commit-sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "is-preview=false" >> $GITHUB_OUTPUT
            echo "pr-number=" >> $GITHUB_OUTPUT
            echo "wip-provider=projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> $GITHUB_OUTPUT
            echo "sa-email=github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            if [ "$ENV" == "prod" ]; then
              echo "project-id=rosy-clover-477102-t5" >> $GITHUB_OUTPUT
              echo "wip-provider=projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> $GITHUB_OUTPUT
              echo "sa-email=github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com" >> $GITHUB_OUTPUT
            else
              echo "project-id=shorted-dev-aba5688f" >> $GITHUB_OUTPUT
              echo "wip-provider=projects/234770780438/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> $GITHUB_OUTPUT
              echo "sa-email=github-actions-sa@shorted-dev-aba5688f.iam.gserviceaccount.com" >> $GITHUB_OUTPUT
            fi
            echo "image-tag=manual-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "commit-sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "is-preview=false" >> $GITHUB_OUTPUT
            echo "pr-number=" >> $GITHUB_OUTPUT
          else
            # Push to main = prod deployment
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "project-id=rosy-clover-477102-t5" >> $GITHUB_OUTPUT
            echo "image-tag=main-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "commit-sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "is-preview=false" >> $GITHUB_OUTPUT
            echo "pr-number=" >> $GITHUB_OUTPUT
            echo "wip-provider=projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> $GITHUB_OUTPUT
            echo "sa-email=github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com" >> $GITHUB_OUTPUT
          fi

  validate-secrets:
    needs: determine-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: Prod-specific secrets for OAuth and Stripe are stored in GitHub Environments
      # (Settings -> Environments -> prod), not as repo-level secrets with _PROD suffix.
      # Firebase still uses repo-level _PROD suffix secrets.
      - name: Validate required secrets
        env:
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          # Common secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          # Google OAuth (dev - prod uses environment secrets)
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          # Firebase - Dev
          AUTH_FIREBASE_PROJECT_ID: ${{ secrets.AUTH_FIREBASE_PROJECT_ID }}
          AUTH_FIREBASE_CLIENT_EMAIL: ${{ secrets.AUTH_FIREBASE_CLIENT_EMAIL }}
          AUTH_FIREBASE_PRIVATE_KEY: ${{ secrets.AUTH_FIREBASE_PRIVATE_KEY }}
          # Firebase - Prod (repo-level with _PROD suffix)
          AUTH_FIREBASE_PROJECT_ID_PROD: ${{ secrets.AUTH_FIREBASE_PROJECT_ID_PROD }}
          AUTH_FIREBASE_CLIENT_EMAIL_PROD: ${{ secrets.AUTH_FIREBASE_CLIENT_EMAIL_PROD }}
          AUTH_FIREBASE_PRIVATE_KEY_PROD: ${{ secrets.AUTH_FIREBASE_PRIVATE_KEY_PROD }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          # Deployment
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          # Stripe (dev - prod uses environment secrets)
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          STRIPE_API_ACCESS_PRICE_ID: ${{ secrets.STRIPE_API_ACCESS_PRICE_ID || secrets.STRIPE_PRO_PRICE_ID }}
        run: |
          echo "=============================================="
          echo "🔐 Secrets Validation: ${ENVIRONMENT^^}"
          echo "=============================================="
          
          MISSING=()
          
          # Check common required secrets
          check_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              MISSING+=("$name")
              echo "❌ $name - MISSING"
            else
              echo "✅ $name - configured"
            fi
          }
          
          echo ""
          echo "📋 Common Secrets"
          echo "-------------------------------------------"
          check_secret "DATABASE_URL"
          check_secret "NEXTAUTH_SECRET"
          check_secret "ALGOLIA_APP_ID"
          check_secret "ALGOLIA_SEARCH_KEY"
          
          echo ""
          echo "📋 Google OAuth Secrets (repo-level for dev)"
          echo "-------------------------------------------"
          check_secret "AUTH_GOOGLE_ID"
          check_secret "AUTH_GOOGLE_SECRET"
          echo "ℹ️  Prod OAuth secrets are in GitHub Environment 'prod'"
          
          echo ""
          echo "📋 Firebase Secrets (Dev)"
          echo "-------------------------------------------"
          check_secret "AUTH_FIREBASE_PROJECT_ID"
          check_secret "AUTH_FIREBASE_CLIENT_EMAIL"
          check_secret "AUTH_FIREBASE_PRIVATE_KEY"
          
          echo ""
          echo "📋 Firebase Secrets (Prod)"
          echo "-------------------------------------------"
          check_secret "AUTH_FIREBASE_PROJECT_ID_PROD"
          check_secret "AUTH_FIREBASE_CLIENT_EMAIL_PROD"
          check_secret "AUTH_FIREBASE_PRIVATE_KEY_PROD"
          
          echo ""
          echo "📋 Deployment Secrets"
          echo "-------------------------------------------"
          check_secret "VERCEL_TOKEN"
          check_secret "OPENAI_API_KEY"
          
          echo ""
          echo "📋 Stripe Secrets (repo-level for dev)"
          echo "-------------------------------------------"
          check_secret "STRIPE_SECRET_KEY"
          check_secret "STRIPE_PUBLISHABLE_KEY"
          check_secret "STRIPE_WEBHOOK_SECRET"
          check_secret "STRIPE_PRO_PRICE_ID"
          check_secret "STRIPE_API_ACCESS_PRICE_ID"
          echo "ℹ️  Prod Stripe secrets are in GitHub Environment 'prod'"
          
          # Service authentication checks
          echo ""
          echo "📋 Service Authentication"
          echo "-------------------------------------------"
          check_secret "INTERNAL_SERVICE_SECRET"
          
          echo ""
          echo "=============================================="
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "✅ All required secrets configured for $ENVIRONMENT"
          else
            echo "❌ Missing ${#MISSING[@]} required secret(s):"
            for secret in "${MISSING[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "Please configure these secrets in GitHub repository settings."
            exit 1
          fi

  build-docker-images:
    needs: [determine-environment, validate-secrets]
    # Skip Docker builds on PRs unless the 'deploy-preview' label is set.
    # ci-fast.yml already validates Go compilation; Docker builds are only
    # needed for actual deployments (main, release, manual, labeled PRs).
    # IMPORTANT: Do NOT build on PR close — cleanup doesn't need images.
    if: >-
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-preview')) &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: shorts
            dockerfile: services/shorts/Dockerfile
            context: services
          - name: stock-price-ingestion
            dockerfile: services/stock-price-ingestion/Dockerfile
            context: services/stock-price-ingestion
          - name: short-data-sync
            dockerfile: services/daily-sync/Dockerfile
            context: services/daily-sync
          - name: asx-discovery
            dockerfile: services/asx-discovery/Dockerfile
            context: services
          - name: market-data-sync
            dockerfile: services/market-data-sync/Dockerfile
            context: services
          - name: enrichment-processor
            dockerfile: services/enrichment-processor/Dockerfile
            context: services
          - name: news-aggregator
            dockerfile: services/news-aggregator/Dockerfile
            context: services
          - name: asx-announcement-crawler
            dockerfile: services/asx-announcement-crawler/Dockerfile
            context: services
          - name: signals-collector
            dockerfile: services/signals-collector/Dockerfile
            context: services/signals-collector
          - name: report-extractor
            dockerfile: services/report-extractor/Dockerfile
            context: services/report-extractor
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.determine-environment.outputs.wip-provider }}
          service_account: ${{ needs.determine-environment.outputs.sa-email }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/${{ matrix.service.name }}:${{ needs.determine-environment.outputs.image-tag }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          secrets: |
            github_token=${{ secrets.STEALTH_PAT }}

  build-ko-images:
    needs: [determine-environment, validate-secrets]
    # IMPORTANT: Do NOT build on PR close — cleanup doesn't need images.
    if: >-
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-preview')) &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: market-data
            importpath: ./market-data
          - name: weekly-report-generator
            importpath: ./weekly-report-generator
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum

      - name: Setup ko
        uses: ko-build/setup-ko@v0.9

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.determine-environment.outputs.wip-provider }}
          service_account: ${{ needs.determine-environment.outputs.sa-email }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}

      - name: Configure private Go module access
        run: git config --global url."https://x-access-token:${{ secrets.STEALTH_PAT }}@github.com/skunkworq/".insteadOf "https://github.com/skunkworq/"

      - name: Build and push ${{ matrix.service.name }}
        working-directory: services
        env:
          KO_DOCKER_REPO: ${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/${{ matrix.service.name }}
        run: |
          ko build ${{ matrix.service.importpath }} \
            --bare \
            --platform=linux/amd64 \
            --tags="${{ needs.determine-environment.outputs.image-tag }},latest"

  terraform-plan:
    needs: [determine-environment, validate-secrets, build-docker-images, build-ko-images]
    # Run even when image builds are skipped (PR without deploy-preview label)
    if: |
      always() &&
      needs.determine-environment.result == 'success' &&
      needs.validate-secrets.result == 'success' &&
      (needs.build-docker-images.result == 'success' || needs.build-docker-images.result == 'skipped') &&
      (needs.build-ko-images.result == 'success' || needs.build-ko-images.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      plan-output: ${{ steps.plan.outputs.stdout }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.determine-environment.outputs.wip-provider }}
          service_account: ${{ needs.determine-environment.outputs.sa-email }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ needs.determine-environment.outputs.environment }}
        run: terraform init

      - name: Ensure secrets exist in Secret Manager
        env:
          GCP_PROJECT_ID: ${{ needs.determine-environment.outputs.project-id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          # Ensure a secret exists and only add a new version if the value has changed.
          # This prevents version bloat ($0.06/version/month) from identical re-deploys.
          ensure_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "⚠️ $name not set, skipping"
              return 0
            fi
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" &>/dev/null; then
              echo "Creating secret: $name"
              printf "%s" "$value" | gcloud secrets create "$name" --data-file=- --replication-policy="automatic" --project "$GCP_PROJECT_ID"
              return 0
            fi
            CURRENT=$(gcloud secrets versions access latest --secret="$name" --project "$GCP_PROJECT_ID" 2>/dev/null || true)
            if [ "$CURRENT" = "$value" ]; then
              echo "✅ $name unchanged, skipping"
            else
              echo "🔄 $name changed, adding new version"
              printf "%s" "$value" | gcloud secrets versions add "$name" --data-file=- --project "$GCP_PROJECT_ID"
            fi
          }

          ensure_secret "OPENAI_API_KEY" "$OPENAI_API_KEY"
          ensure_secret "INTERNAL_SERVICE_SECRET" "$INTERNAL_SERVICE_SECRET"
          ensure_secret "OTEL_EXPORTER_OTLP_HEADERS" "$OTEL_EXPORTER_OTLP_HEADERS"

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/${{ needs.determine-environment.outputs.environment }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cache_purge_secret: ${{ secrets.CACHE_PURGE_SECRET }}
        run: |
          terraform plan \
            -var="stock_price_ingestion_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/stock-price-ingestion:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="short_data_sync_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/short-data-sync:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="shorts_api_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/shorts:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="asx_discovery_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/asx-discovery:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="market_data_sync_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/market-data-sync:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="market_data_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/market-data:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="enrichment_processor_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/enrichment-processor:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="news_aggregator_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/news-aggregator:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="asx_announcement_crawler_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/asx-announcement-crawler:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="signals_collector_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/signals-collector:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="report_extractor_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/report-extractor:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="grafana_auth=${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}" \
            -out=tfplan
        # No continue-on-error: a failing plan must fail the PR check. This was
        # advisory-only for months and silently swallowed a missing-variable
        # error on every PR (fixed by defaulting dev cloudflare_zone_id).

      - name: Save plan output
        if: github.event_name == 'pull_request'
        working-directory: terraform/environments/${{ needs.determine-environment.outputs.environment }}
        run: |
          terraform show -no-color tfplan > ${{ runner.temp }}/plan.txt 2>/dev/null || echo "No plan file found" > ${{ runner.temp }}/plan.txt
          # Truncate to avoid GitHub comment size limits (65536 chars max)
          if [ $(wc -c < ${{ runner.temp }}/plan.txt) -gt 60000 ]; then
            head -c 60000 ${{ runner.temp }}/plan.txt > ${{ runner.temp }}/plan_truncated.txt
            echo -e "\n\n... (truncated — full plan available in workflow logs)" >> ${{ runner.temp }}/plan_truncated.txt
            mv ${{ runner.temp }}/plan_truncated.txt ${{ runner.temp }}/plan.txt
          fi

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.RUNNER_TEMP + '/plan.txt', 'utf8');
            const body = `#### Terraform Plan 📝

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Environment: ${{ needs.determine-environment.outputs.environment }}*
            *Project: ${{ needs.determine-environment.outputs.project-id }}*
            *Image Tag: ${{ needs.determine-environment.outputs.image-tag }}*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Plan-only summary
        if: github.event.inputs.plan_only == 'true'
        run: |
          echo "## 🔍 Terraform Plan Only (Dry Run)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ needs.determine-environment.outputs.project-id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ needs.determine-environment.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Plan completed successfully** - No changes were applied." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To apply these changes:" >> $GITHUB_STEP_SUMMARY
          echo "1. Create a GitHub Release (for prod)" >> $GITHUB_STEP_SUMMARY
          echo "2. Or re-run this workflow with \`plan_only: false\`" >> $GITHUB_STEP_SUMMARY

  deploy-preview:
    needs: [determine-environment, validate-secrets, build-docker-images, build-ko-images]
    runs-on: ubuntu-latest
    # Only deploy preview when images were actually built (requires 'deploy-preview' label)
    if: >-
      github.event_name == 'pull_request' &&
      needs.determine-environment.outputs.is-preview == 'true' &&
      needs.build-docker-images.result == 'success' &&
      needs.build-ko-images.result == 'success'
    environment: dev
    outputs:
      shorts-url: ${{ steps.deploy.outputs.shorts_url }}
      market-data-url: ${{ steps.deploy.outputs.market_data_url }}
      enrichment-processor-url: ${{ steps.deploy.outputs.enrichment_processor_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.determine-environment.outputs.wip-provider }}
          service_account: ${{ needs.determine-environment.outputs.sa-email }}

      - name: Create Terraform workspace for PR
        id: deploy
        working-directory: terraform
        env:
          PR_NUMBER: ${{ needs.determine-environment.outputs.pr-number }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          GCP_PROJECT_ID: ${{ needs.determine-environment.outputs.project-id }}
          GCP_REGION: ${{ env.GCP_REGION }}
          ARTIFACT_REGISTRY: ${{ env.ARTIFACT_REGISTRY }}
          IMAGE_TAG: ${{ needs.determine-environment.outputs.image-tag }}
          COMMIT_SHA: ${{ needs.determine-environment.outputs.commit-sha }}
        run: |
          # Parse DATABASE_URL
          DB_USER=$(echo $DATABASE_URL | sed -n 's|postgresql://\([^:]*\):.*|\1|p')
          DB_PASS=$(echo $DATABASE_URL | sed -n 's|postgresql://[^:]*:\([^@]*\)@.*|\1|p')
          DB_HOST=$(echo $DATABASE_URL | sed -n 's|.*@\([^:]*\):.*|\1|p')
          DB_PORT=$(echo $DATABASE_URL | sed -n 's|.*:\([0-9]*\)/.*|\1|p')
          DB_NAME=$(echo $DATABASE_URL | sed -n 's|.*/\([^?]*\).*|\1|p')
          DB_ADDRESS="${DB_HOST}:${DB_PORT}"

          # Ensure secrets exist (only add new version if value changed)
          ensure_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then echo "⚠️ $name not set, skipping"; return 0; fi
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" &>/dev/null; then
              printf "%s" "$value" | gcloud secrets create "$name" --data-file=- --replication-policy="automatic" --project "$GCP_PROJECT_ID"
              return 0
            fi
            CURRENT=$(gcloud secrets versions access latest --secret="$name" --project "$GCP_PROJECT_ID" 2>/dev/null || true)
            if [ "$CURRENT" = "$value" ]; then echo "✅ $name unchanged"; else
              printf "%s" "$value" | gcloud secrets versions add "$name" --data-file=- --project "$GCP_PROJECT_ID"
            fi
          }
          ensure_secret "OPENAI_API_KEY" "$OPENAI_API_KEY"
          ensure_secret "INTERNAL_SERVICE_SECRET" "$INTERNAL_SERVICE_SECRET"

          # Create preview config directory
          mkdir -p preview-pr-${PR_NUMBER}
          cd preview-pr-${PR_NUMBER}

          # Create Terraform config for this PR with GCS backend
          cat > main.tf <<EOF
          terraform {
            required_version = ">= 1.0"
            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 5.0"
              }
            }
            backend "gcs" {
              bucket = "${GCP_PROJECT_ID}-terraform-state"
              prefix = "preview/pr-${PR_NUMBER}"
            }
          }

          provider "google" {
            project = "${GCP_PROJECT_ID}"
            region  = "${GCP_REGION}"
          }

          module "preview" {
            source = "../modules/preview"

            project_id                 = "${GCP_PROJECT_ID}"
            region                     = "${GCP_REGION}"
            pr_number                  = "${PR_NUMBER}"
            shorts_api_image           = "${ARTIFACT_REGISTRY}/${GCP_PROJECT_ID}/shorted/shorts:${IMAGE_TAG}"
            market_data_image          = "${ARTIFACT_REGISTRY}/${GCP_PROJECT_ID}/shorted/market-data:${IMAGE_TAG}"
            enrichment_processor_image = "${ARTIFACT_REGISTRY}/${GCP_PROJECT_ID}/shorted/enrichment-processor:${IMAGE_TAG}"
            shorts_service_account     = "shorts@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
            postgres_address           = "${DB_ADDRESS}"
            postgres_database          = "${DB_NAME}"
            postgres_username          = "${DB_USER}"
            image_tag                  = "${COMMIT_SHA}"
          }

          output "shorts_url" {
            value = module.preview.shorts_url
          }

          output "market_data_url" {
            value = module.preview.market_data_url
          }

          output "enrichment_processor_url" {
            value = module.preview.enrichment_processor_url
          }
          EOF

          # Initialize Terraform with GCS backend
          terraform init

          # Function to check if resource is in terraform state
          is_in_state() {
            terraform state list 2>/dev/null | grep -q "$1"
          }

          # Clean up orphaned services (exist in GCP but not in Terraform state)
          # This prevents revision conflicts when services were created by gcloud
          echo "Checking for orphaned services..."

          if gcloud run services describe shorts-service-pr-${PR_NUMBER} --region=${GCP_REGION} --project=${GCP_PROJECT_ID} &>/dev/null; then
            if ! is_in_state "module.preview.google_cloud_run_v2_service.shorts_preview"; then
              echo "Deleting orphaned shorts service (not in Terraform state)..."
              gcloud run services delete shorts-service-pr-${PR_NUMBER} \
                --region=${GCP_REGION} --project=${GCP_PROJECT_ID} --quiet || true
            fi
          fi

          if gcloud run services describe market-data-service-pr-${PR_NUMBER} --region=${GCP_REGION} --project=${GCP_PROJECT_ID} &>/dev/null; then
            if ! is_in_state "module.preview.google_cloud_run_v2_service.market_data_preview"; then
              echo "Deleting orphaned market-data service (not in Terraform state)..."
              gcloud run services delete market-data-service-pr-${PR_NUMBER} \
                --region=${GCP_REGION} --project=${GCP_PROJECT_ID} --quiet || true
            fi
          fi

          if gcloud run services describe enrichment-processor-pr-${PR_NUMBER} --region=${GCP_REGION} --project=${GCP_PROJECT_ID} &>/dev/null; then
            if ! is_in_state "module.preview.module.enrichment_processor_preview.google_cloud_run_v2_service.enrichment_processor"; then
              echo "Deleting orphaned enrichment-processor service (not in Terraform state)..."
              gcloud run services delete enrichment-processor-pr-${PR_NUMBER} \
                --region=${GCP_REGION} --project=${GCP_PROJECT_ID} --quiet || true
            fi
          fi

          # Apply configuration (will create new or update existing)
          terraform apply -auto-approve

          # Cost guardrail: force minScale=0 on all preview services
          echo "🛡️ Enforcing minScale=0 on preview services..."
          for svc in shorts-service-pr-${PR_NUMBER} market-data-service-pr-${PR_NUMBER} enrichment-processor-pr-${PR_NUMBER}; do
            MIN_SCALE=$(gcloud run services describe "$svc" \
              --region=${GCP_REGION} --project=${GCP_PROJECT_ID} \
              --format="value(spec.template.metadata.annotations['autoscaling.knative.dev/minScale'])" 2>/dev/null || echo "0")
            if [ -n "$MIN_SCALE" ] && [ "$MIN_SCALE" != "0" ]; then
              echo "  Fixing $svc: minScale=$MIN_SCALE -> 0"
              gcloud run services update "$svc" \
                --region=${GCP_REGION} --project=${GCP_PROJECT_ID} \
                --min-instances=0 --quiet 2>&1 || true
            fi
          done

          # Capture outputs
          SHORTS_URL=$(terraform output -raw shorts_url)
          MARKET_DATA_URL=$(terraform output -raw market_data_url)
          
          # Try to get enrichment-processor URL, but handle case where it might not exist in state yet
          # This can happen if the output was just added but Terraform hasn't refreshed the state
          # Use set +e to prevent script from failing if output doesn't exist
          set +e
          ENRICHMENT_PROCESSOR_URL=$(terraform output -raw enrichment_processor_url 2>&1)
          EXIT_CODE=$?
          set -e
          
          # Check if the output is valid (not an error message and not empty)
          if [ $EXIT_CODE -eq 0 ] && [ -n "$ENRICHMENT_PROCESSOR_URL" ] && ! echo "$ENRICHMENT_PROCESSOR_URL" | grep -q "Error:"; then
            echo "✅ enrichment_processor_url: $ENRICHMENT_PROCESSOR_URL"
          else
            echo "⚠️  enrichment_processor_url output not found in Terraform state"
            echo "   This is expected if the output was just added. It will be available after the next apply."
            ENRICHMENT_PROCESSOR_URL=""
            # Try to get it directly from gcloud as a fallback
            set +e
            GCLOUD_URL=$(gcloud run services describe enrichment-processor-pr-${PR_NUMBER} \
              --region=${GCP_REGION} \
              --project=${GCP_PROJECT_ID} \
              --format='value(status.url)' 2>&1)
            GCLOUD_EXIT_CODE=$?
            set -e
            if [ $GCLOUD_EXIT_CODE -eq 0 ] && [ -n "$GCLOUD_URL" ]; then
              ENRICHMENT_PROCESSOR_URL="$GCLOUD_URL"
              echo "   Found via gcloud: $ENRICHMENT_PROCESSOR_URL"
            fi
          fi

          echo "shorts_url=$SHORTS_URL" >> $GITHUB_OUTPUT
          echo "market_data_url=$MARKET_DATA_URL" >> $GITHUB_OUTPUT
          echo "enrichment_processor_url=$ENRICHMENT_PROCESSOR_URL" >> $GITHUB_OUTPUT

      # NOTE: AUTH_FIREBASE_PRIVATE_KEY must be set in Vercel Dashboard
      # (Settings -> Environment Variables -> Preview) because it contains
      # special characters that break CLI argument parsing.
      - name: Deploy to Vercel (Preview)
        id: vercel-deploy
        uses: amondnet/vercel-action@v25.2.0
        env:
          VERCEL_ENV: dev
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_xE5DMN3hIo8aPqyHNkBybg8r
          vercel-project-id: shorted-com-au
          scope: team_xE5DMN3hIo8aPqyHNkBybg8r
          vercel-version: 54.1.0
          alias-domains: preview.shorted.com.au
          vercel-args: >-
            --build-env NEXT_PUBLIC_SHORTS_SERVICE_ENDPOINT=${{ steps.deploy.outputs.shorts_url }}
            --build-env NEXT_PUBLIC_MARKET_DATA_API_URL=${{ steps.deploy.outputs.market_data_url }}
            --build-env NEXT_PUBLIC_SHORTS_API_URL=${{ steps.deploy.outputs.shorts_url }}
            --build-env SHORTS_SERVICE_ENDPOINT=${{ steps.deploy.outputs.shorts_url }}
            --build-env ENRICHMENT_PROCESSOR_URL=${{ steps.deploy.outputs.enrichment_processor_url }}
            --build-env NEXT_PUBLIC_ENRICHMENT_PROCESSOR_URL=${{ steps.deploy.outputs.enrichment_processor_url }}
            --build-env AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
            --build-env AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            --build-env AUTH_FIREBASE_PROJECT_ID=${{ secrets.AUTH_FIREBASE_PROJECT_ID }}
            --build-env AUTH_FIREBASE_CLIENT_EMAIL=${{ secrets.AUTH_FIREBASE_CLIENT_EMAIL }}
            --build-env NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            --build-env NEXT_PUBLIC_ALGOLIA_APP_ID=${{ secrets.ALGOLIA_APP_ID }}
            --build-env NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${{ secrets.ALGOLIA_SEARCH_KEY }}
            --build-env NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            --build-env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            --build-env NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            --build-env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            --build-env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            --build-env NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            --env NEXT_PUBLIC_SHORTS_SERVICE_ENDPOINT=${{ steps.deploy.outputs.shorts_url }}
            --env NEXT_PUBLIC_MARKET_DATA_API_URL=${{ steps.deploy.outputs.market_data_url }}
            --env NEXT_PUBLIC_SHORTS_API_URL=${{ steps.deploy.outputs.shorts_url }}
            --env SHORTS_SERVICE_ENDPOINT=${{ steps.deploy.outputs.shorts_url }}
            --env ENRICHMENT_PROCESSOR_URL=${{ steps.deploy.outputs.enrichment_processor_url }}
            --env NEXT_PUBLIC_ENRICHMENT_PROCESSOR_URL=${{ steps.deploy.outputs.enrichment_processor_url }}
            --env AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
            --env AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            --env AUTH_FIREBASE_PROJECT_ID=${{ secrets.AUTH_FIREBASE_PROJECT_ID }}
            --env AUTH_FIREBASE_CLIENT_EMAIL=${{ secrets.AUTH_FIREBASE_CLIENT_EMAIL }}
            --env NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            --env NEXT_PUBLIC_ALGOLIA_APP_ID=${{ secrets.ALGOLIA_APP_ID }}
            --env NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${{ secrets.ALGOLIA_SEARCH_KEY }}
            --env NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            --env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            --env NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            --env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            --env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            --env NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            --env ALGOLIA_INDEX=stocks
            --env NEXTAUTH_URL=https://preview.shorted.com.au
            --env ALLOW_E2E_AUTH=true
            --env ADMIN_EMAILS=ben.ebsworth@gmail.com,e2e-test@shorted.com.au
            --build-env STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            --build-env STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            --build-env STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            --build-env STRIPE_PRO_PRICE_ID=${{ secrets.STRIPE_PRO_PRICE_ID }}
            --build-env STRIPE_API_ACCESS_PRICE_ID=${{ secrets.STRIPE_API_ACCESS_PRICE_ID || secrets.STRIPE_PRO_PRICE_ID }}
            --build-env INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}
            --env STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            --env STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            --env STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            --env STRIPE_PRO_PRICE_ID=${{ secrets.STRIPE_PRO_PRICE_ID }}
            --env STRIPE_API_ACCESS_PRICE_ID=${{ secrets.STRIPE_API_ACCESS_PRICE_ID || secrets.STRIPE_PRO_PRICE_ID }}
            --env INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}

      - name: Comment PR with deployment URLs
        uses: actions/github-script@v7
        with:
          script: |
            const shortsUrl = '${{ steps.deploy.outputs.shorts_url }}';
            const marketDataUrl = '${{ steps.deploy.outputs.market_data_url }}';
            const enrichmentProcessorUrl = '${{ steps.deploy.outputs.enrichment_processor_url }}';
            const vercelUrl = '${{ steps.vercel-deploy.outputs.preview-url }}';

            const body = `## 🏗️ Infrastructure Deployment (Terraform)

            ### ✅ Backend Services Ready

            | Service | URL | Status |
            |---------|-----|--------|
            | **Shorts API** | ${shortsUrl} | 🟢 Live |
            | **Market Data API** | ${marketDataUrl} | 🟢 Live |
            | **Enrichment Processor** | ${enrichmentProcessorUrl || '(not deployed)'} | ${enrichmentProcessorUrl ? '🟢 Live' : '⚪ N/A'} |

            ### ✅ Frontend Deployed

            | Environment | URL |
            |-------------|-----|
            | **Vercel Preview** | ${vercelUrl} |

            ### 📦 Services Deployed
            - \`shorts-service-pr-${{ needs.determine-environment.outputs.pr-number }}\` (256Mi RAM, 0-2 instances)
            - \`market-data-service-pr-${{ needs.determine-environment.outputs.pr-number }}\` (256Mi RAM, 0-2 instances)
            - \`enrichment-processor-pr-${{ needs.determine-environment.outputs.pr-number }}\` (4Gi RAM, 0-1 instances)

            ### 🔧 Infrastructure Details
            - **Environment**: Preview (PR #${{ needs.determine-environment.outputs.pr-number }})
            - **Image Tag**: \`${{ needs.determine-environment.outputs.image-tag }}\`
            - **Managed by**: Terraform (GCS State)
            - **Auto-cleanup**: On PR close

            <details>
            <summary>📊 View Deployment Details</summary>

            **Project**: \`shorted-dev-aba5688f\`
            **Region**: \`australia-southeast2\`
            **State**: \`gs://shorted-dev-aba5688f-terraform-state/preview/pr-${{ needs.determine-environment.outputs.pr-number }}/\`

            **Environment Variables passed to Vercel**:
            - \`ENRICHMENT_PROCESSOR_URL=${enrichmentProcessorUrl || '(empty)'}\`
            - \`SHORTS_SERVICE_ENDPOINT=${shortsUrl}\`

            </details>
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Infrastructure Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  terraform-apply:
    needs: [determine-environment, validate-secrets, terraform-plan]
    runs-on: ubuntu-latest
    # Only apply on main branch push, release, or manual workflow dispatch (unless plan_only)
    # PRs will only plan, not apply
    # Manual dispatches with plan_only=true will skip apply
    if: >-
      github.event_name != 'pull_request' &&
      github.event.inputs.plan_only != 'true' &&
      needs.terraform-plan.result == 'success'
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
    outputs:
      shorts-url: ${{ steps.outputs.outputs.shorts_url }}
      stock-price-url: ${{ steps.outputs.outputs.stock_price_url }}
      market-data-url: ${{ steps.outputs.outputs.market_data_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.determine-environment.outputs.wip-provider }}
          service_account: ${{ needs.determine-environment.outputs.sa-email }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ needs.determine-environment.outputs.environment }}
        run: terraform init

      - name: Ensure all secrets exist in Secret Manager
        env:
          GCP_PROJECT_ID: ${{ needs.determine-environment.outputs.project-id }}
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          DATABASE_URL_DEV: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          # Only add a new version if the value has actually changed.
          # This prevents version bloat ($0.06/version/month — was costing $130+/month).
          ensure_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "⚠️ $name not set, skipping"
              return 0
            fi
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" &>/dev/null; then
              echo "🆕 Creating secret: $name"
              printf "%s" "$value" | gcloud secrets create "$name" --data-file=- --replication-policy="automatic" --project "$GCP_PROJECT_ID"
              return 0
            fi
            CURRENT=$(gcloud secrets versions access latest --secret="$name" --project "$GCP_PROJECT_ID" 2>/dev/null || true)
            if [ "$CURRENT" = "$value" ]; then
              echo "✅ $name unchanged, skipping"
            else
              echo "🔄 $name changed, adding new version"
              printf "%s" "$value" | gcloud secrets versions add "$name" --data-file=- --project "$GCP_PROJECT_ID"
            fi
          }

          # Core secrets
          ensure_secret "OPENAI_API_KEY" "$OPENAI_API_KEY"
          ensure_secret "INTERNAL_SERVICE_SECRET" "$INTERNAL_SERVICE_SECRET"
          ensure_secret "OTEL_EXPORTER_OTLP_HEADERS" "$OTEL_EXPORTER_OTLP_HEADERS"
          ensure_secret "ALGOLIA_APP_ID" "$ALGOLIA_APP_ID"
          ensure_secret "ALGOLIA_SEARCH_KEY" "$ALGOLIA_SEARCH_KEY"

          # Alpha Vantage (with placeholder fallback)
          AV_KEY="${ALPHA_VANTAGE_API_KEY:-placeholder-set-in-secret-manager}"
          ensure_secret "ALPHA_VANTAGE_API_KEY" "$AV_KEY"

          # Revalidation secret (event-driven cache invalidation; must match the
          # frontend Vercel REVALIDATION_SECRET env). Maintained from the GH secret.
          ensure_secret "REVALIDATION_SECRET" "$REVALIDATION_SECRET"

          # Database secrets (environment-specific)
          if [ "$ENVIRONMENT" = "prod" ] && [ -n "$DATABASE_URL_PROD" ]; then
            DATABASE_URL="$DATABASE_URL_PROD"
          else
            DATABASE_URL="$DATABASE_URL_DEV"
          fi

          DB_URL_CLEAN=$(printf "%s" "$DATABASE_URL" | tr -d '\n\r')
          ensure_secret "DATABASE_URL" "$DB_URL_CLEAN"

          DB_PASS=$(echo "$DATABASE_URL" | sed -n 's|postgresql://[^:]*:\([^@]*\)@.*|\1|p' | tr -d '\n\r')
          if [ -n "$DB_PASS" ]; then
            ensure_secret "postgres-password" "$DB_PASS"
            ensure_secret "APP_STORE_POSTGRES_PASSWORD" "$DB_PASS"
          fi

      - name: Import pre-existing Cloudflare resources
        # Idempotent: imports any Cloudflare resources that exist on the
        # account but are missing from Terraform state. Safe to run on every
        # apply; each block is a no-op once the resource is in state.
        # Only runs in the prod environment because the import IDs are
        # specific to the production Cloudflare zone/account.
        if: needs.determine-environment.outputs.environment == 'prod'
        working-directory: terraform/environments/${{ needs.determine-environment.outputs.environment }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GRAFANA_AUTH: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -x ./import-existing-cloudflare.sh ]; then
            ./import-existing-cloudflare.sh
          else
            echo "import script not present — skipping"
          fi

      - name: Terraform Apply
        working-directory: terraform/environments/${{ needs.determine-environment.outputs.environment }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cache_purge_secret: ${{ secrets.CACHE_PURGE_SECRET }}
        run: |
          terraform apply \
            -var="stock_price_ingestion_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/stock-price-ingestion:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="short_data_sync_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/short-data-sync:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="shorts_api_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/shorts:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="asx_discovery_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/asx-discovery:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="market_data_sync_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/market-data-sync:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="market_data_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/market-data:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="enrichment_processor_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/enrichment-processor:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="news_aggregator_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/news-aggregator:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="asx_announcement_crawler_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/asx-announcement-crawler:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="signals_collector_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/signals-collector:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="report_extractor_image=${{ env.ARTIFACT_REGISTRY }}/${{ needs.determine-environment.outputs.project-id }}/shorted/report-extractor:${{ needs.determine-environment.outputs.image-tag }}" \
            -var="grafana_auth=${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}" \
            -var="image_tag=${{ needs.determine-environment.outputs.image-tag }}" \
            -auto-approve

      - name: Get Terraform Outputs
        id: outputs
        working-directory: terraform/environments/${{ needs.determine-environment.outputs.environment }}
        run: |
          echo "shorts_url=$(terraform output -raw shorts_api_url)" >> $GITHUB_OUTPUT
          echo "stock_price_url=$(terraform output -raw stock_price_ingestion_url)" >> $GITHUB_OUTPUT
          echo "market_data_url=$(terraform output -raw market_data_url)" >> $GITHUB_OUTPUT

      - name: Verify Deployed Services
        env:
          GCP_PROJECT_ID: ${{ needs.determine-environment.outputs.project-id }}
          GCP_REGION: ${{ env.GCP_REGION }}
        run: |
          echo "🔍 Verifying deployed services..."
          echo ""
          
          # List all deployed services
          echo "📋 Cloud Run Services:"
          gcloud run services list --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format="table(name,status.url,status.conditions[0].type)"
          
          echo ""
          echo "📋 Cloud Run Jobs:"
          gcloud run jobs list --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format="table(name,status.executionCount)" 2>/dev/null || echo "No jobs found"
          
          echo ""
          echo "📋 Cloud Scheduler Jobs:"
          gcloud scheduler jobs list --project "$GCP_PROJECT_ID" --location australia-southeast1 --format="table(name,state,schedule)" 2>/dev/null || echo "No scheduler jobs found"

      - name: Enforce minScale=0 on all services
        env:
          GCP_PROJECT_ID: ${{ needs.determine-environment.outputs.project-id }}
          GCP_REGION: ${{ env.GCP_REGION }}
        run: |
          echo "🛡️ Cost guardrail: verifying all services have minScale=0..."
          VIOLATIONS=0
          for svc in $(gcloud run services list --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format="value(name)"); do
            MIN_SCALE=$(gcloud run services describe "$svc" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format="value(spec.template.metadata.annotations['autoscaling.knative.dev/minScale'])" 2>/dev/null)
            if [ -n "$MIN_SCALE" ] && [ "$MIN_SCALE" != "0" ]; then
              VIOLATIONS=$((VIOLATIONS + 1))
              echo "⚠️ VIOLATION: $svc has minScale=$MIN_SCALE — fixing to 0"
              gcloud run services update "$svc" \
                --project="$GCP_PROJECT_ID" \
                --region="$GCP_REGION" \
                --min-instances=0 \
                --quiet 2>&1 || echo "  Failed to fix $svc"
            fi
          done
          if [ "$VIOLATIONS" -eq 0 ]; then
            echo "✅ All services have minScale=0"
          else
            echo "⚠️ Fixed $VIOLATIONS services with non-zero minScale"
          fi

      - name: Health Check Services
        env:
          SHORTS_URL: ${{ steps.outputs.outputs.shorts_url }}
        run: |
          echo "🏥 Running health checks..."
          
          # Wait for services to be ready
          sleep 10
          
          # Check Shorts API
          if [ -n "$SHORTS_URL" ]; then
            echo "Testing Shorts API: $SHORTS_URL"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SHORTS_URL/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Shorts API health check passed"
            else
              echo "⚠️ Shorts API health check returned: $HTTP_CODE (may need warm-up)"
            fi
            
            # Test a simple query
            echo "Testing Shorts API query..."
            RESPONSE=$(curl -s -X POST "$SHORTS_URL/shorts.v1alpha1.ShortedStocksService/GetTopShorts" \
              -H "Content-Type: application/json" \
              -d '{"limit": 1}' 2>/dev/null || echo '{"error": "failed"}')
            if echo "$RESPONSE" | grep -q "error"; then
              echo "⚠️ Shorts API query test: Service may need warm-up"
            else
              echo "✅ Shorts API query test passed"
            fi
          fi

      - name: Deployment Summary
        env:
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ needs.determine-environment.outputs.project-id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ needs.determine-environment.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Service URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Shorts API | ${{ steps.outputs.outputs.shorts_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stock Price Ingestion | ${{ steps.outputs.outputs.stock_price_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "### ⚠️ Production Cutover Checklist" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Before routing production traffic:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. ✅ Services deployed and running" >> $GITHUB_STEP_SUMMARY
            echo "2. ⏳ Verify health checks pass (see logs above)" >> $GITHUB_STEP_SUMMARY
            echo "3. ⏳ Test API endpoints manually" >> $GITHUB_STEP_SUMMARY
            echo "4. ⏳ Verify database connectivity" >> $GITHUB_STEP_SUMMARY
            echo "5. ⏳ Update DNS/Vercel to point to prod services" >> $GITHUB_STEP_SUMMARY
            echo "6. ⏳ Monitor logs for errors" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 Quick Test Commands" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Test Shorts API" >> $GITHUB_STEP_SUMMARY
            echo "curl -X POST ${{ steps.outputs.outputs.shorts_url }}/shorts.v1alpha1.ShortedStocksService/GetTopShorts \\\\" >> $GITHUB_STEP_SUMMARY
            echo "  -H 'Content-Type: application/json' \\\\" >> $GITHUB_STEP_SUMMARY
            echo "  -d '{\"limit\": 5}'" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-vercel-prod:
    needs: [determine-environment, validate-secrets, terraform-apply]
    runs-on: ubuntu-latest
    # Deploy Vercel even if terraform-apply fails (e.g. non-critical service
    # like market-data-sync fails startup probe). We query the shorts URL from
    # gcloud as a fallback so Vercel isn't blocked by Terraform failures.
    if: |
      always() &&
      needs.determine-environment.outputs.environment == 'prod' &&
      needs.validate-secrets.result == 'success'
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.determine-environment.outputs.wip-provider }}
          service_account: ${{ needs.determine-environment.outputs.sa-email }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Service URLs
        id: resolve-urls
        env:
          TERRAFORM_SHORTS_URL: ${{ needs.terraform-apply.outputs.shorts-url }}
          TERRAFORM_MARKET_DATA_URL: ${{ needs.terraform-apply.outputs.market-data-url }}
          GCP_PROJECT_ID: ${{ needs.determine-environment.outputs.project-id }}
        run: |
          # Use terraform output if available, otherwise query from gcloud
          SHORTS_URL="$TERRAFORM_SHORTS_URL"
          if [ -z "$SHORTS_URL" ]; then
            echo "⚠️ Terraform output unavailable, querying gcloud for shorts URL..."
            SHORTS_URL=$(gcloud run services describe shorts \
              --region ${{ env.GCP_REGION }} \
              --project "$GCP_PROJECT_ID" \
              --format 'value(status.url)' 2>/dev/null || echo "")
          fi

          if [ -z "$SHORTS_URL" ]; then
            echo "❌ Could not resolve Shorts API URL from terraform or gcloud"
            exit 1
          fi

          echo "✅ Shorts API URL: $SHORTS_URL"
          echo "shorts_url=$SHORTS_URL" >> $GITHUB_OUTPUT

          # Resolve Market Data API URL
          MARKET_DATA_URL="$TERRAFORM_MARKET_DATA_URL"
          if [ -z "$MARKET_DATA_URL" ]; then
            echo "⚠️ Terraform output unavailable, querying gcloud for market-data URL..."
            MARKET_DATA_URL=$(gcloud run services describe market-data \
              --region ${{ env.GCP_REGION }} \
              --project "$GCP_PROJECT_ID" \
              --format 'value(status.url)' 2>/dev/null || echo "")
          fi

          if [ -n "$MARKET_DATA_URL" ]; then
            echo "✅ Market Data API URL: $MARKET_DATA_URL"
          else
            echo "⚠️ Market Data API URL not available"
          fi
          echo "market_data_url=$MARKET_DATA_URL" >> $GITHUB_OUTPUT

      # NOTE: AUTH_FIREBASE_PRIVATE_KEY must be set in the prod environment
      # or Vercel Dashboard because it contains special characters that break CLI parsing.
      # Environment secrets (prod) override repository secrets with same name.
      - name: Deploy to Vercel (Production)
        id: vercel-deploy
        uses: amondnet/vercel-action@v25.2.0
        env:
          VERCEL_ENV: production
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_xE5DMN3hIo8aPqyHNkBybg8r
          vercel-project-id: shorted-com-au
          scope: team_xE5DMN3hIo8aPqyHNkBybg8r
          vercel-version: 54.1.0
          vercel-args: >-
            --prod
            --build-env NEXT_PUBLIC_SHORTS_SERVICE_ENDPOINT=${{ steps.resolve-urls.outputs.shorts_url }}
            --build-env NEXT_PUBLIC_SHORTS_API_URL=${{ steps.resolve-urls.outputs.shorts_url }}
            --build-env SHORTS_SERVICE_ENDPOINT=${{ steps.resolve-urls.outputs.shorts_url }}
            --build-env AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
            --build-env AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            --build-env AUTH_FIREBASE_PROJECT_ID=${{ secrets.AUTH_FIREBASE_PROJECT_ID_PROD }}
            --build-env AUTH_FIREBASE_CLIENT_EMAIL=${{ secrets.AUTH_FIREBASE_CLIENT_EMAIL_PROD }}
            --build-env NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            --build-env NEXT_PUBLIC_ALGOLIA_APP_ID=${{ secrets.ALGOLIA_APP_ID }}
            --build-env NEXT_PUBLIC_ALGOLIA_SEARCH_KEY=${{ secrets.ALGOLIA_SEARCH_KEY }}
            --build-env NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_PROD }}
            --build-env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_PROD }}
            --build-env NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_PROD }}
            --build-env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_PROD }}
            --build-env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_PROD }}
            --build-env NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID_PROD }}
            --build-env STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            --build-env STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            --build-env STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            --build-env STRIPE_PRO_PRICE_ID=${{ secrets.STRIPE_PRO_PRICE_ID }}
            --build-env STRIPE_API_ACCESS_PRICE_ID=${{ secrets.STRIPE_API_ACCESS_PRICE_ID || secrets.STRIPE_PRO_PRICE_ID }}
            --build-env INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}
            --build-env NEXT_PUBLIC_MARKET_DATA_API_URL=${{ steps.resolve-urls.outputs.market_data_url }}
