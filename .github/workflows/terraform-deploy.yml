          echo "### Backend Services" >> $GITHUB_STEP_SUMMARY
          echo "- **Shorts API**: ${{ steps.resolve-urls.outputs.shorts_url }}" >> $GITHUB_STEP_SUMMARY

  run-tests:
    needs: [determine-environment, build-docker-images, build-ko-images]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/go.sum
            test/integration/go.sum

      - name: Configure private Go module access
        run: git config --global url."https://x-access-token:${{ secrets.STEALTH_PAT }}@github.com/skunkworq/".insteadOf "https://github.com/skunkworq/"

      - name: Run integration tests
        run: |
          echo "🧪 Running integration tests (local testcontainers)..."
          cd services
          make test-integration-ci

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    env:
      # Preview environments are always in dev project
      DEV_PROJECT_ID: shorted-dev-aba5688f
      DEV_WIP_PROVIDER: projects/234770780438/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      DEV_SA_EMAIL: github-actions-sa@shorted-dev-aba5688f.iam.gserviceaccount.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIP_PROVIDER }}
          service_account: ${{ env.DEV_SA_EMAIL }}

      - name: Destroy preview environment
        working-directory: terraform
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GCP_PROJECT_ID: shorted-dev-aba5688f
          GCP_REGION: australia-southeast2
        run: |
          echo "🧹 Cleaning up preview environment for PR #${PR_NUMBER}..."

          # Create temporary directory to destroy resources
          mkdir -p preview-pr-${PR_NUMBER}-destroy
          cd preview-pr-${PR_NUMBER}-destroy

          # Create minimal Terraform config with GCS backend
          cat > main.tf <<EOF
          terraform {
            required_version = ">= 1.0"
            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 5.0"
              }
            }
            backend "gcs" {
              bucket = "${GCP_PROJECT_ID}-terraform-state"
              prefix = "preview/pr-${PR_NUMBER}"
            }
          }

          provider "google" {
            project = "${GCP_PROJECT_ID}"
            region  = "${GCP_REGION}"
          }

          module "preview" {
            source = "../modules/preview"

            project_id                 = "${GCP_PROJECT_ID}"
            region                     = "${GCP_REGION}"
            pr_number                  = "${PR_NUMBER}"
            shorts_api_image           = "australia-southeast2-docker.pkg.dev/${GCP_PROJECT_ID}/shorted/shorts:pr-${PR_NUMBER}"
            market_data_image          = "australia-southeast2-docker.pkg.dev/${GCP_PROJECT_ID}/shorted/market-data:pr-${PR_NUMBER}"
            enrichment_processor_image = "australia-southeast2-docker.pkg.dev/${GCP_PROJECT_ID}/shorted/enrichment-processor:pr-${PR_NUMBER}"
            shorts_service_account     = "shorts@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
            postgres_address           = "dummy:5432"
            postgres_database          = "dummy"
            postgres_username          = "dummy"
            image_tag                  = "cleanup"
          }
          EOF

          # Initialize and destroy
          terraform init
          terraform destroy -auto-approve || {
            echo "⚠️ Terraform destroy failed, attempting direct cleanup..."
          }

          # Always run direct cleanup as belt-and-suspenders
          # This catches resources that Terraform missed or that were created outside Terraform
          echo "Running direct resource cleanup..."

          gcloud run services delete shorts-service-pr-${PR_NUMBER} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT_ID} \
            --quiet 2>/dev/null || echo "  shorts-service-pr-${PR_NUMBER} not found"

          gcloud run services delete market-data-service-pr-${PR_NUMBER} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT_ID} \
            --quiet 2>/dev/null || echo "  market-data-service-pr-${PR_NUMBER} not found"

          gcloud run services delete enrichment-processor-pr-${PR_NUMBER} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT_ID} \
            --quiet 2>/dev/null || echo "  enrichment-processor-pr-${PR_NUMBER} not found"

          # Clean up Pub/Sub resources
          gcloud pubsub subscriptions delete enrichment-jobs-subscription-pr-${PR_NUMBER} \
            --project ${GCP_PROJECT_ID} \
            --quiet 2>/dev/null || echo "  enrichment-jobs-subscription-pr-${PR_NUMBER} not found"

          gcloud pubsub topics delete enrichment-jobs-pr-${PR_NUMBER} \
            --project ${GCP_PROJECT_ID} \
            --quiet 2>/dev/null || echo "  enrichment-jobs-pr-${PR_NUMBER} not found"

          # Clean up PR-specific Docker images from Artifact Registry
          for img in shorts market-data enrichment-processor; do
            gcloud artifacts docker images delete \
              "australia-southeast2-docker.pkg.dev/${GCP_PROJECT_ID}/shorted/${img}:pr-${PR_NUMBER}" \
              --quiet 2>/dev/null || echo "  ${img}:pr-${PR_NUMBER} image not found"
          done

          # Clean up Terraform state for this PR
          gsutil -m rm -r "gs://${GCP_PROJECT_ID}-terraform-state/preview/pr-${PR_NUMBER}/" 2>/dev/null || echo "  Terraform state not found"

          cd ..
          rm -rf preview-pr-${PR_NUMBER}-destroy
          echo "✅ Preview environment destroyed"

      - name: Comment PR with cleanup status
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🧹 Preview Environment Cleaned Up

            Preview services for PR #${{ github.event.pull_request.number }} have been removed:
            - \`shorts-service-pr-${{ github.event.pull_request.number }}\` ❌
            - \`market-data-service-pr-${{ github.event.pull_request.number }}\` ❌
            - \`enrichment-processor-pr-${{ github.event.pull_request.number }}\` ❌

            *Terraform infrastructure and Pub/Sub resources destroyed automatically*
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
