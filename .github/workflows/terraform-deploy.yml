            --env NEXT_PUBLIC_SHORTS_SERVICE_ENDPOINT=${{ steps.resolve-urls.outputs.shorts_url }}
            --env NEXT_PUBLIC_SHORTS_API_URL=${{ steps.resolve-urls.outputs.shorts_url }}
            --env SHORTS_SERVICE_ENDPOINT=${{ steps.resolve-urls.outputs.shorts_url }}
            --env AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
