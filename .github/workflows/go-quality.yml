# Go quality gate.
#
# This exists because two things were true at once and nobody noticed:
#
#   1. golangci-lint ran in NO CI job at all. The pre-push hook was the only
#      gate on Go quality, and it was failing on pre-existing issues — which
#      trains everyone to push with --no-verify, which removes the gate.
#   2. `run-tests` in terraform-deploy.yml runs only the services/jobs module
#      and the integration suite. Nothing ran `go test` over the main `services`
#      module, so two housing unit tests sat red on main unnoticed.
#
# It runs on pull_request as well as push, unlike run-tests (which is
# `if: github.event_name != 'pull_request'` and therefore gates the DEPLOY, not
# the PR). A gate that only fires after merge is not a gate.
name: Go quality

on:
  pull_request:
  push:
    branches: [main]
  # Nightly run of the extended lane below. Nothing gates on it.
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  # Pin the linter. golangci-lint v2 reads the `version: "2"` config in
  # services/.golangci.yaml; a v1 binary silently ignores it and reports a
  # different issue set, which would make this gate mean something different
  # from `make lint-backend` on a developer's machine.
  GOLANGCI_VERSION: "v2.15.0"

concurrency:
  group: go-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # PRs lint against their merge base (below), which needs history.
          fetch-depth: 0

      # v6.5.0, not v6: Cuttlefish resolves an action's ref through GitHub's
      # commits API, which answers 422 "No commit found for SHA: v6" for
      # setup-go's short tag (first seen 2026-10-15; refs/tags/v6 and v6.5.0
      # are the same commit and still resolve). Every Go job failed at "Set up
      # job" on it.
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: false is deliberate and load-bearing — setup-go's cache SAVE
          # hangs on these self-hosted runners. The module and build caches
          # persist on the runner's own disk, so there is nothing to gain and a
          # multi-minute hang to lose. See housing-lifecycle.test.mjs.
          cache: false

      - name: Configure private Go module access
        run: git config --global url."https://x-access-token:${{ secrets.STEALTH_PAT }}@github.com/skunkworq/".insteadOf "https://github.com/skunkworq/"

      # The checkout doesn't always create origin/<base>; without it
      # --new-from-merge-base silently falls back to reporting every issue.
      - name: Fetch PR base
        if: github.base_ref != ''
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Lint services
        uses: golangci/golangci-lint-action@v8
        env:
          # services/go.work carries `replace github.com/skunkworq/stealth =>
          # ../../stealth`, a sibling checkout that exists on a developer machine
          # and never on a runner. With the workspace active the linter cannot
          # resolve it and every package fails typecheck. GOWORK=off makes CI
          # resolve stealth from the module proxy via STEALTH_PAT, which is the
          # same thing every `go test` invocation in this repo already does.
          GOWORK: "off"
          GOPRIVATE: github.com/skunkworq/*
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: services
          # verify: false is deliberate. The action's default pre-step runs
          # `golangci-lint config verify`, which downloads the JSON schema from
          # golangci-lint.run on every run. From the self-hosted runners that
          # fetch times out ("context deadline exceeded"), failing the job
          # before a single file is linted. That broke main at 6240fd95 on code
          # that had passed lint 50 minutes earlier. The lint run itself still
          # loads and rejects a malformed config; schema-check it locally with
          # `golangci-lint config verify` in services/ when editing it.
          verify: false
          # --concurrency 1 mirrors `make lint-backend`: the linter OOMs on this
          # module at higher concurrency on constrained runners.
          # On PRs, only issues new against the merge base; pushes to main
          # lint the whole module. (The action's only-new-issues fetches the
          # PR patch from the GitHub API; the merge base needs no API.)
          args: --concurrency 1 --timeout 300s ${{ github.base_ref && format('--new-from-merge-base=origin/{0}', github.base_ref) || '' }} ./...

  unit-tests:
    name: Go unit tests
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # v6.5.0, not v6: see the lint job above.
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: false is deliberate and load-bearing — setup-go's cache SAVE
          # hangs on these self-hosted runners. The module and build caches
          # persist on the runner's own disk, so there is nothing to gain and a
          # multi-minute hang to lose. See housing-lifecycle.test.mjs.
          cache: false

      - name: Configure private Go module access
        run: git config --global url."https://x-access-token:${{ secrets.STEALTH_PAT }}@github.com/skunkworq/".insteadOf "https://github.com/skunkworq/"

      # The integration job's image prefetcher (make test-integration-ci). Its
      # tests fake Docker, so they need no daemon or registry.
      - name: Integration image prefetch tests
        run: GOWORK=off go test -p=1 -timeout=30s ./scripts/prefetch-integration-images/*.go

      # tidy resolves every GOOS and build tag; a build on a Mac does not. The
      # jobs module once lacked go.sum entries that only archive_linux.go under
      # the testcontainers tag needs, so it built on every laptop and in every
      # PR, and failed run-tests on main, which cancelled the deploy.
      - name: go.mod and go.sum are tidy
        env:
          GOWORK: off
          GOPRIVATE: github.com/skunkworq/*
        run: |
          (cd services && go mod tidy -diff)
          (cd services/jobs && go mod tidy -diff)

      # -short is what scripts/local-verify.sh runs, and it is what keeps this
      # job free of Docker and live network: the testcontainer and RUN_LIVE
      # suites stay in the integration job.
      - name: services module
        working-directory: services
        env:
          GOWORK: off
          GOPRIVATE: github.com/skunkworq/*
        run: go test ./... -short

      - name: services/jobs module
        working-directory: services/jobs
        env:
          GOWORK: off
          GOPRIVATE: github.com/skunkworq/*
        run: go test ./... -short

  # Extended lane: the slow suites that used to sit on the PR and deploy gates.
  # It runs after a push to main, nightly and on demand, and it REPORTS ONLY.
  # No job lists `extended` in `needs`, so a red run here never blocks a PR or a
  # deploy; it shows up as a red check on main and in the nightly history.
  # What it holds, and why it is not on the gate:
  #   - the race detector over the collector and housingcrawl (a full -race run
  #     is several minutes of the gate's budget);
  #   - the non-short collector suite, whose wall-clock tests the -short PR run
  #     skips (each one carries a testing.Short() guard with the reason);
  #   - the integration and alerts end-to-end suites, which need a Postgres
  #     container and so are the slowest and least deterministic on the runner.
  extended:
    name: Extended suites (non-gating)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # v6.5.0, not v6: see the lint job above.
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: false: see the unit-tests job.
          cache: false

      - name: Configure private Go module access
        run: git config --global url."https://x-access-token:${{ secrets.STEALTH_PAT }}@github.com/skunkworq/".insteadOf "https://github.com/skunkworq/"

      - name: Collector and housingcrawl, non-short, with -race
        working-directory: services
        env:
          GOWORK: "off"
          GOPRIVATE: github.com/skunkworq/*
        run: go test -count=1 -race -timeout 20m ./house-price-collector ./pkg/housingcrawl

      # The collector's own Postgres suites (server job, crawl ingest). Off the
      # PR gate: the -tags=testcontainers run re-ran the whole package on every
      # PR, which is what made housing-contract-tests slow.
      - name: Collector testcontainers Postgres suites
        working-directory: services
        env:
          GOWORK: "off"
          GOPRIVATE: github.com/skunkworq/*
          HOUSING_TESTCONTAINERS: "1"
          CGO_ENABLED: "0"
        run: go test -count=1 -p 1 -tags=testcontainers ./house-price-collector

      - name: Integration suites (testcontainers Postgres)
        working-directory: services
        env:
          GOWORK: "off"
          GOPRIVATE: github.com/skunkworq/*
        run: make test-integration-ci

      - name: Alerts evaluator end-to-end suite (postgres container)
        working-directory: services
        env:
          GOWORK: "off"
          GOPRIVATE: github.com/skunkworq/*
        run: make test-alerts-e2e
