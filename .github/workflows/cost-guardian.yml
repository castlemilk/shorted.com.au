name: Cost Guardian

# Safety net: enforces min_instances=0 on all Cloud Run services
# and cleans up orphaned PR preview environments.
# Runs daily and can be triggered manually.

on:
  schedule:
    # Run daily at 6 AM AEST (8 PM UTC previous day)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no changes)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: australia-southeast2

jobs:
  enforce-scaling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: shorted-dev-aba5688f
            wip_provider: projects/234770780438/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@shorted-dev-aba5688f.iam.gserviceaccount.com
          - project: rosy-clover-477102-t5
            wip_provider: projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.wip_provider }}
          service_account: ${{ matrix.sa_email }}

      - name: Enforce minScale=0 on all services
        env:
          PROJECT: ${{ matrix.project }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "=== Cost Guardian: $PROJECT ==="
          echo ""

          VIOLATIONS=0

          # Check all Cloud Run services for minScale > 0
          for svc in $(gcloud run services list --project="$PROJECT" --region="$GCP_REGION" --format="value(name)"); do
            MIN_SCALE=$(gcloud run services describe "$svc" \
              --project="$PROJECT" \
              --region="$GCP_REGION" \
              --format="value(spec.template.metadata.annotations['autoscaling.knative.dev/minScale'])" 2>/dev/null)

            if [ -n "$MIN_SCALE" ] && [ "$MIN_SCALE" != "0" ]; then
              VIOLATIONS=$((VIOLATIONS + 1))
              CPU=$(gcloud run services describe "$svc" \
                --project="$PROJECT" \
                --region="$GCP_REGION" \
                --format="value(spec.template.spec.containers[0].resources.limits.cpu)" 2>/dev/null)
              MEM=$(gcloud run services describe "$svc" \
                --project="$PROJECT" \
                --region="$GCP_REGION" \
                --format="value(spec.template.spec.containers[0].resources.limits.memory)" 2>/dev/null)

              echo "VIOLATION: $svc has minScale=$MIN_SCALE (cpu=$CPU, mem=$MEM)"

              if [ "$DRY_RUN" = "false" ]; then
                echo "  -> Setting minScale=0..."
                gcloud run services update "$svc" \
                  --project="$PROJECT" \
                  --region="$GCP_REGION" \
                  --min-instances=0 \
                  --quiet 2>&1 || echo "  -> FAILED to update $svc"
              else
                echo "  -> DRY RUN: Would set minScale=0"
              fi
            fi
          done

          if [ "$VIOLATIONS" -eq 0 ]; then
            echo "All services have minScale=0"
          else
            echo ""
            echo "Fixed $VIOLATIONS scaling violations"
          fi

  cleanup-orphaned-previews:
    runs-on: ubuntu-latest
    env:
      PROJECT: shorted-dev-aba5688f
      WIP_PROVIDER: projects/234770780438/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      SA_EMAIL: github-actions-sa@shorted-dev-aba5688f.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIP_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Find and clean orphaned PR services
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Cleaning orphaned PR preview services ==="
          echo ""

          DELETED=0

          # Find all PR-suffixed Cloud Run services
          for svc in $(gcloud run services list --project="$PROJECT" --region="$GCP_REGION" --format="value(name)" | grep -E "\-pr-[0-9]+$"); do
            # Extract PR number
            PR_NUM=$(echo "$svc" | grep -oE "[0-9]+$")

            # Check if PR is still open
            PR_STATE=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")

            if [ "$PR_STATE" != "OPEN" ]; then
              DELETED=$((DELETED + 1))
              echo "ORPHAN: $svc (PR #$PR_NUM state: $PR_STATE)"

              if [ "$DRY_RUN" = "false" ]; then
                echo "  -> Deleting..."
                gcloud run services delete "$svc" \
                  --project="$PROJECT" \
                  --region="$GCP_REGION" \
                  --quiet 2>&1 || echo "  -> FAILED to delete $svc"
              else
                echo "  -> DRY RUN: Would delete"
              fi
            fi
          done

          # Clean up orphaned Pub/Sub resources
          for topic in $(gcloud pubsub topics list --project="$PROJECT" --format="value(name)" 2>/dev/null | grep -oE "enrichment-jobs-pr-[0-9]+" || true); do
            PR_NUM=$(echo "$topic" | grep -oE "[0-9]+$")
            PR_STATE=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")

            if [ "$PR_STATE" != "OPEN" ]; then
              echo "ORPHAN TOPIC: $topic (PR #$PR_NUM state: $PR_STATE)"
              if [ "$DRY_RUN" = "false" ]; then
                # Delete subscription first, then topic
                gcloud pubsub subscriptions delete "enrichment-jobs-subscription-pr-${PR_NUM}" \
                  --project="$PROJECT" --quiet 2>/dev/null || true
                gcloud pubsub topics delete "$topic" \
                  --project="$PROJECT" --quiet 2>/dev/null || true
              fi
            fi
          done

          if [ "$DELETED" -eq 0 ]; then
            echo "No orphaned preview services found"
          else
            echo ""
            echo "Cleaned up $DELETED orphaned services"
          fi

  cleanup-artifact-registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: shorted-dev-aba5688f
            wip_provider: projects/234770780438/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@shorted-dev-aba5688f.iam.gserviceaccount.com
          - project: rosy-clover-477102-t5
            wip_provider: projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.wip_provider }}
          service_account: ${{ matrix.sa_email }}

      - name: Clean up old Docker images
        env:
          PROJECT: ${{ matrix.project }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Keep the 5 most recent tagged versions per image
          KEEP_COUNT: 5
        run: |
          echo "=== Artifact Registry cleanup: $PROJECT ==="
          REGISTRY="australia-southeast2-docker.pkg.dev/${PROJECT}/shorted"

          TOTAL_DELETED=0

          for pkg in $(gcloud artifacts docker images list "$REGISTRY" --format="value(package)" 2>/dev/null | sort -u); do
            IMAGE_NAME=$(basename "$pkg")
            echo ""
            echo "--- $IMAGE_NAME ---"

            # List all digests sorted by upload time (oldest first), skip the newest KEEP_COUNT
            DIGESTS=$(gcloud artifacts docker images list "$pkg" \
              --sort-by="~UPDATE_TIME" \
              --format="value(version)" 2>/dev/null | tail -n +$((KEEP_COUNT + 1)))

            COUNT=$(echo "$DIGESTS" | grep -c "sha256" || true)
            echo "  Found $COUNT versions to delete (keeping newest $KEEP_COUNT)"

            if [ "$COUNT" -gt 0 ] && [ "$DRY_RUN" = "false" ]; then
              echo "$DIGESTS" | while read -r digest; do
                [ -z "$digest" ] && continue
                gcloud artifacts docker images delete "${pkg}@${digest}" \
                  --quiet --delete-tags 2>/dev/null && \
                  TOTAL_DELETED=$((TOTAL_DELETED + 1)) || \
                  echo "  Failed to delete ${digest}"
              done
            fi
          done

          echo ""
          echo "=== Cleanup complete ==="

  cleanup-secret-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: shorted-dev-aba5688f
            wip_provider: projects/234770780438/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@shorted-dev-aba5688f.iam.gserviceaccount.com
          - project: rosy-clover-477102-t5
            wip_provider: projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.wip_provider }}
          service_account: ${{ matrix.sa_email }}

      - name: Disable old secret versions (keep latest 2 enabled)
        env:
          PROJECT: ${{ matrix.project }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Keep the 2 most recent enabled versions to avoid breaking
          # Cloud Run services that reference "latest" (which resolves to
          # a specific version number at deploy time). Destroying the
          # active version causes container startup failures.
          KEEP_COUNT: 2
        run: |
          echo "=== Secret Manager cleanup: $PROJECT ==="
          echo "Disabling old versions (keeping $KEEP_COUNT most recent enabled)"
          echo ""

          TOTAL_DISABLED=0

          for secret in $(gcloud secrets list --project="$PROJECT" --format="value(name)"); do
            VERSIONS=$(gcloud secrets versions list "$secret" \
              --project="$PROJECT" \
              --filter="state=enabled" \
              --sort-by="~name" \
              --format="value(name)" 2>/dev/null)

            COUNT=$(echo "$VERSIONS" | grep -c "." 2>/dev/null || echo "0")

            if [ "$COUNT" -le "$KEEP_COUNT" ]; then
              continue
            fi

            # Skip the newest KEEP_COUNT versions, disable the rest
            OLD_VERSIONS=$(echo "$VERSIONS" | tail -n +$((KEEP_COUNT + 1)))
            OLD_COUNT=$((COUNT - KEEP_COUNT))
            echo "$secret: disabling $OLD_COUNT old versions (keeping $KEEP_COUNT)"

            if [ "$DRY_RUN" = "false" ]; then
              echo "$OLD_VERSIONS" | while read -r ver; do
                [ -z "$ver" ] && continue
                gcloud secrets versions disable "$ver" \
                  --secret="$secret" \
                  --project="$PROJECT" \
                  --quiet 2>/dev/null && \
                  TOTAL_DISABLED=$((TOTAL_DISABLED + 1)) || \
                  echo "  Failed to disable $secret version $ver"
              done
            fi
          done

          echo ""
          echo "=== Secret version cleanup complete ==="
