name: Cost Guardian

# Safety net: enforces min_instances=0 and cleans up retained production
# artifacts and secret versions.
# Runs daily and can be triggered manually.

on:
  schedule:
    # Run daily at 6 AM AEST (8 PM UTC previous day)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no changes)"
        type: boolean
        default: false
      secrets_only:
        description: "Run only Secret Manager cleanup; skip scaling and artifact cleanup"
        type: boolean
        default: false
      destroy_old_secret_versions:
        description: >-
          Also DESTROY disabled, unreferenced secret versions older than 90 days.
          Off by default: destroy is irreversible, and it is the only thing that
          actually stops Secret Manager billing (disabled versions still bill).
        type: boolean
        default: false
      secret_name:
        description: "Optional exact secret name to clean (blank means all secrets)"
        type: string
        default: ""
      destroy_age_days:
        description: >-
          Minimum age, in days, before a disabled secret version may be
          destroyed. Defaults to 90 and the scheduled run always uses 90;
          only a manual dispatch can lower it.

          Lower this to clear a backlog created by a known incident sooner
          than the default window allows. The 2026-07-26 INTERNAL_SERVICE_SECRET
          bug added a version per deploy; those versions are disabled and
          still billing, but do not reach 90 days until late October.
        type: string
        default: "90"
      destroy_min_version:
        description: "Optional inclusive minimum version for destruction"
        type: string
        default: ""
      destroy_max_version:
        description: "Optional inclusive maximum version for destruction"
        type: string
        default: ""
      skip_disable:
        description: "Skip the enabled-version hygiene pass"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: australia-southeast2

jobs:
  enforce-scaling:
    if: ${{ github.event_name == 'schedule' || inputs.secrets_only != true }}
    runs-on: [self-hosted, cuttlefish, linux]
    strategy:
      matrix:
        include:
          - project: rosy-clover-477102-t5
            wip_provider: projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ matrix.wip_provider }}
          service_account: ${{ matrix.sa_email }}

      - name: Enforce minScale=0 on all services
        env:
          PROJECT: ${{ matrix.project }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "=== Cost Guardian: $PROJECT ==="
          echo ""

          VIOLATIONS=0

          # Check all Cloud Run services for minScale > 0
          for svc in $(gcloud run services list --project="$PROJECT" --region="$GCP_REGION" --format="value(name)"); do
            MIN_SCALE=$(gcloud run services describe "$svc" \
              --project="$PROJECT" \
              --region="$GCP_REGION" \
              --format="value(spec.template.metadata.annotations['autoscaling.knative.dev/minScale'])" 2>/dev/null)

            if [ -n "$MIN_SCALE" ] && [ "$MIN_SCALE" != "0" ]; then
              VIOLATIONS=$((VIOLATIONS + 1))
              CPU=$(gcloud run services describe "$svc" \
                --project="$PROJECT" \
                --region="$GCP_REGION" \
                --format="value(spec.template.spec.containers[0].resources.limits.cpu)" 2>/dev/null)
              MEM=$(gcloud run services describe "$svc" \
                --project="$PROJECT" \
                --region="$GCP_REGION" \
                --format="value(spec.template.spec.containers[0].resources.limits.memory)" 2>/dev/null)

              echo "VIOLATION: $svc has minScale=$MIN_SCALE (cpu=$CPU, mem=$MEM)"

              if [ "$DRY_RUN" = "false" ]; then
                echo "  -> Setting minScale=0..."
                gcloud run services update "$svc" \
                  --project="$PROJECT" \
                  --region="$GCP_REGION" \
                  --min-instances=0 \
                  --quiet 2>&1 || echo "  -> FAILED to update $svc"
              else
                echo "  -> DRY RUN: Would set minScale=0"
              fi
            fi
          done

          if [ "$VIOLATIONS" -eq 0 ]; then
            echo "All services have minScale=0"
          else
            echo ""
            echo "Fixed $VIOLATIONS scaling violations"
          fi

  cleanup-artifact-registry:
    if: ${{ github.event_name == 'schedule' || inputs.secrets_only != true }}
    runs-on: [self-hosted, cuttlefish, linux]
    strategy:
      matrix:
        include:
          - project: rosy-clover-477102-t5
            wip_provider: projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ matrix.wip_provider }}
          service_account: ${{ matrix.sa_email }}

      - name: Clean up old Docker images
        env:
          PROJECT: ${{ matrix.project }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Keep the 20 most recent tagged versions per image.
          # Was 5 — too aggressive: rarely-rebuilt images (short-data-sync,
          # asx-announcement-crawler, weekly-report-generator, etc.) were
          # being fully pruned because the matrix builds them all on every
          # main push but pruning kept only 5, and unrelated rebuilds of
          # the high-cadence services pushed them out.
          KEEP_COUNT: 20
        run: |
          echo "=== Artifact Registry cleanup: $PROJECT ==="
          REGISTRY="australia-southeast2-docker.pkg.dev/${PROJECT}/shorted"

          TOTAL_DELETED=0

          # Collect image references currently in use by live Cloud Run services
          # and jobs across all regions. Any image (by repo path or digest) in
          # this set is protected from deletion regardless of age — this prevents
          # the 2026-05 incident where rarely-rebuilt images were pruned out
          # from under their Cloud Run job specs.
          echo "Collecting live image references across regions..."
          IN_USE_FILE=$(mktemp)
          for region in australia-southeast2 us-central1 asia-southeast1; do
            gcloud run services list --project="$PROJECT" --region="$region" \
              --format='value(spec.template.spec.containers[0].image)' 2>/dev/null >> "$IN_USE_FILE" || true
            gcloud run jobs list --project="$PROJECT" --region="$region" \
              --format='value(spec.template.spec.template.spec.containers[0].image)' 2>/dev/null >> "$IN_USE_FILE" || true
          done
          IN_USE_COUNT=$(sort -u "$IN_USE_FILE" | grep -c . || true)
          echo "  Protected: $IN_USE_COUNT distinct live image references"

          # Sanity floor: if the collection produced near-zero refs the API
          # listing likely failed (transient blip, IAM, region rename). Refuse
          # to prune rather than fall through to the original 2026-05 footgun.
          # Prod has ~13 image refs across regions; 5 is a safe margin.
          if [ "$IN_USE_COUNT" -lt 5 ]; then
            echo "ABORT: only $IN_USE_COUNT live image refs collected — collection likely failed; refusing to prune"
            rm -f "$IN_USE_FILE"
            exit 1
          fi

          for pkg in $(gcloud artifacts docker images list "$REGISTRY" --format="value(package)" 2>/dev/null | sort -u); do
            IMAGE_NAME=$(basename "$pkg")
            echo ""
            echo "--- $IMAGE_NAME ---"

            # List all digests sorted by upload time (oldest first), skip the newest KEEP_COUNT
            DIGESTS=$(gcloud artifacts docker images list "$pkg" \
              --sort-by="~UPDATE_TIME" \
              --format="value(version)" 2>/dev/null | tail -n +$((KEEP_COUNT + 1)))

            COUNT=$(echo "$DIGESTS" | grep -c "sha256" || true)
            echo "  Found $COUNT versions to delete (keeping newest $KEEP_COUNT)"

            if [ "$COUNT" -gt 0 ] && [ "$DRY_RUN" = "false" ]; then
              # Use process substitution (not `... | while`) so TOTAL_DELETED
              # increments persist to the parent shell.
              while read -r digest; do
                [ -z "$digest" ] && continue
                # Skip if this digest OR any of its tags is referenced by a
                # live Cloud Run service/job. Match by both `pkg@digest` and
                # `pkg:tag` since job specs typically use tags.
                if grep -qF "${pkg}@${digest}" "$IN_USE_FILE"; then
                  echo "  PROTECTED ${digest} — referenced by live Cloud Run resource (by digest)"
                  continue
                fi
                # Check if any tag pointing at this digest is in use
                TAGS_FOR_DIGEST=$(gcloud artifacts docker tags list "$pkg" \
                  --filter="version=${digest}" \
                  --format='value(name)' 2>/dev/null)
                TAG_PROTECTED=false
                for tag_name in $TAGS_FOR_DIGEST; do
                  short_tag=$(basename "$tag_name")
                  if grep -qF "${pkg}:${short_tag}" "$IN_USE_FILE"; then
                    echo "  PROTECTED ${digest} — tag ${short_tag} referenced by live Cloud Run resource"
                    TAG_PROTECTED=true
                    break
                  fi
                done
                [ "$TAG_PROTECTED" = "true" ] && continue

                if gcloud artifacts docker images delete "${pkg}@${digest}" \
                    --quiet --delete-tags 2>/dev/null; then
                  TOTAL_DELETED=$((TOTAL_DELETED + 1))
                else
                  echo "  Failed to delete ${digest}"
                fi
              done < <(echo "$DIGESTS")
            fi
          done
          rm -f "$IN_USE_FILE"

          echo ""
          echo "=== Cleanup complete: deleted $TOTAL_DELETED image versions ==="

  cleanup-secret-versions:
    runs-on: [self-hosted, cuttlefish, linux]
    strategy:
      matrix:
        include:
          - project: rosy-clover-477102-t5
            wip_provider: projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
            sa_email: github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ matrix.wip_provider }}
          service_account: ${{ matrix.sa_email }}

      # The version-selection logic lives in scripts/secret-version-cleanup.sh
      # so it can be unit tested (scripts/secret-version-cleanup.test.mjs).
      #
      # 2026-07-26 INCIDENT: the previous inline version used
      # `--sort-by="~name"` (LEXICOGRAPHIC). Past 1000 versions "999" sorted
      # above "1002", so it disabled 1000/1001/1002 of INTERNAL_SERVICE_SECRET
      # — including the version `latest` resolves to — and every new shorts
      # Cloud Run instance failed to start. See
      # docs/incidents/2026-07-26-internal-service-secret.md.
      #
      # The script now guarantees: numeric ordering, the numeric-latest version
      # is never touched, versions referenced by live Cloud Run services/jobs
      # are never touched, and a failure to enumerate those references is fatal.
      #
      # BILLING NOTE: disabling a version does NOT stop it billing — only
      # DESTROYED versions do. The disable pass is hygiene only; the cost
      # saving comes from the destroy pass below.
      #
      # The scheduled run now enables destroy. Previously DESTROY was wired
      # only to the workflow_dispatch input, and `inputs.*` is empty on a
      # `schedule` trigger, so the nightly run could only ever disable. Every
      # disabled version kept billing at ~$0.06/mo indefinitely, which grew
      # into the single largest line item on the GCP bill (~$34/mo, roughly
      # 567 still-active versions). Destroy remains guarded by the script:
      # numeric-latest is never touched, versions referenced by live Cloud Run
      # services/jobs are never touched, only already-disabled versions older
      # than --destroy-age-days are eligible, and --destroy-cap bounds each run.
      - name: Clean up old secret versions (keep 2 newest enabled, protect in-use)
        env:
          PROJECT: ${{ matrix.project }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DESTROY: ${{ (github.event_name == 'schedule' || inputs.destroy_old_secret_versions) && 'true' || 'false' }}
          SECRET_NAME: ${{ inputs.secret_name || '' }}
          DESTROY_AGE_DAYS: ${{ github.event_name == 'schedule' && '90' || (inputs.destroy_age_days || '90') }}
          DESTROY_MIN_VERSION: ${{ inputs.destroy_min_version || '' }}
          DESTROY_MAX_VERSION: ${{ inputs.destroy_max_version || '' }}
          SKIP_DISABLE: ${{ inputs.skip_disable || 'false' }}
        run: |
          ARGS=(--project "$PROJECT" --keep 2)  # regions are discovered by the script, never hardcoded
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$DESTROY" = "true" ]; then
            ARGS+=(--destroy --destroy-age-days "$DESTROY_AGE_DAYS" --destroy-cap 200)
          fi
          if [ -n "$SECRET_NAME" ]; then
            ARGS+=(--only-secret "$SECRET_NAME")
          fi
          if [ -n "$DESTROY_MIN_VERSION" ]; then
            ARGS+=(--destroy-min-version "$DESTROY_MIN_VERSION")
          fi
          if [ -n "$DESTROY_MAX_VERSION" ]; then
            ARGS+=(--destroy-max-version "$DESTROY_MAX_VERSION")
          fi
          if [ "$SKIP_DISABLE" = "true" ]; then
            ARGS+=(--skip-disable)
          fi
          bash "$GITHUB_WORKSPACE/scripts/secret-version-cleanup.sh" "${ARGS[@]}"
