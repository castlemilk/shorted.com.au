name: Community integration

# Test-only lane: no manual dispatch, push/release event, secrets, deployment or
# external datastore. This must fail if a service/browser is unavailable.
on:
  pull_request:
    paths:
      - "web/**"
      - "services/migrations/000072_add_community_postgres_tables.up.sql"
      - ".github/workflows/community-integration.yml"

permissions:
  contents: read

jobs:
  community-integration:
    name: Community real stores and browser
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify test network isolation
        run: node --test scripts/community-integration/isolation.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download pinned official Firestore emulator
        # URL/hash from firebase-tools v14.22.0 downloadableEmulatorInfo.json.
        # Verification is repeated inside the harness before executing the JAR.
        run: |
          set -euo pipefail
          emulator_jar="$(mktemp "${RUNNER_TEMP:-/tmp}/shorted-firestore-XXXXXX.jar")"
          printf 'FIRESTORE_EMULATOR_JAR=%s\n' "$emulator_jar" >> "$GITHUB_ENV"
          curl --fail --location --retry 2 --max-time 120 \
            https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar \
            --output "$emulator_jar"
          echo "9d43599ed6151199e8d604dc87fac51218e49e5f3a48519b1ae560bbe5e3382d  $emulator_jar" | sha256sum --check
      - name: Real adapters and authenticated browser journey
        id: integration
        run: node scripts/community-integration/run.mjs
      - name: Remove the owned test database if interrupted
        if: always() && steps.integration.outputs.container_name != ''
        env:
          COMMUNITY_TEST_CONTAINER: ${{ steps.integration.outputs.container_name }}
        run: |
          set -euo pipefail
          [[ "$COMMUNITY_TEST_CONTAINER" =~ ^shorted-community-[0-9a-f-]{36}$ ]]
          export DOCKER_HOST="${DOCKER_HOST:-unix:///var/run/docker.sock}"
          if timeout 10s docker container inspect "$COMMUNITY_TEST_CONTAINER" >/dev/null 2>&1; then
            timeout 20s docker rm --force --volumes "$COMMUNITY_TEST_CONTAINER"
          fi
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: community-integration-evidence
          path: web/test-results/community-integration/
          if-no-files-found: warn
          retention-days: 7
