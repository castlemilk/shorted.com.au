name: Repository Hygiene

on:
  pull_request:
    paths:
      - "services/**/testdata/**"
      - "web/**"
      - "scripts/check-portal-content-provenance.mjs"
      - "scripts/generate-synthetic-housing-pagemeta-fixtures.mjs"
      - "scripts/tests/portal-content-provenance.test.mjs"
      - ".github/workflows/repo-hygiene.yml"
  workflow_dispatch:

jobs:
  portal-content-provenance:
    name: Portal content provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test repository hygiene tooling
        run: node --test scripts/tests/portal-content-provenance.test.mjs

      - name: Reject captured portal payloads
        run: node scripts/check-portal-content-provenance.mjs
