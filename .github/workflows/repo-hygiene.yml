name: Repository Hygiene

on:
  pull_request:
    paths:
      - "services/**"
      - "web/**"
      - "proto/**"
      - "api/schema/**"
      # The `openapi` target itself is drift-relevant: a PR that only breaks a
      # flag or repoints -base would otherwise merge unchecked, and surface on
      # the next unrelated PR where it reads as that PR's fault.
      - "Makefile"
      - "docs/housing-architecture.md"
      - "scripts/check-portal-content-provenance.mjs"
      - "scripts/take-writer/**"
      - "scripts/generate-synthetic-housing-pagemeta-fixtures.mjs"
      - "scripts/tests/housing-deploy-hygiene.test.mjs"
      - "scripts/tests/openapi-drift.test.mjs"
      - "scripts/tests/portal-content-provenance.test.mjs"
      - "scripts/tests/scheduler-override-body.test.mjs"
      # Drift guard: prod does not run `migrate up`, so a migration that is
      # neither allowlisted nor recorded in PROD_APPLIED.md never reaches it.
      - "scripts/tests/migration-drift.test.mjs"
      # Guard: a self-hosted job must not depend on tooling that happens to be
      # baked into a hand-built runner image (see the test's own preamble).
      - "scripts/tests/self-hosted-toolchain.test.mjs"
      - ".github/workflows/perf-budget.yml"
      - "scripts/release-pipeline.test.mjs"
      - "scripts/bundle-budget-ci.test.mjs"
      - "scripts/tests/browser-analytics-isolation.test.mjs"
      - "scripts/tests/scoped-release-headers.test.mjs"
      - "scripts/tests/stock-tab-redirects.test.mjs"
      - "web/e2e/helpers/release-page-readiness.mjs"
      - "web/e2e/helpers/scoped-release-headers.mjs"
      - "web/e2e/release-smoke-ci.mjs"
      - "web/e2e/release-smoke.spec.ts"
      - "services/migrations/**"
      - ".github/workflows/terraform-deploy.yml"
      - "terraform/modules/**"
      # cost-guardrails.test.mjs pins prod's report_extractor limits too.
      - "terraform/environments/prod/main.tf"
      - ".github/workflows/repo-hygiene.yml"
      # Scheduled jobs on Kubernetes: the chart, its scripts, and the guard
      # that keeps local.jobs_on_vke and the chart's `enabled` list in step.
      - "deploy/kubernetes/jobs/**"
      - "scripts/tests/vke-jobs-cutover.test.mjs"
  workflow_dispatch:

# Supersede a PR's own earlier runs. Every job here competes for the shared
# self-hosted box, so a rapid series of pushes otherwise queues N full runs of
# work nobody is waiting on. Cancellation is scoped to pull_request on purpose:
# a push to main must always run to completion, because its result is the
# signal that main is healthy.
concurrency:
  group: repo-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  newsroom-tests:
    name: Newsroom publication tests
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            scripts/take-writer
            content/news
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install newsroom dependencies
        working-directory: scripts/take-writer
        run: npm ci --no-audit --no-fund
      - name: Test publication and newsroom contracts without external services
        working-directory: scripts/take-writer
        run: npm test
      - name: Check newsroom types
        working-directory: scripts/take-writer
        run: npx --no-install tsc --noEmit

  portal-content-provenance:
    name: Portal content provenance
    runs-on: [self-hosted, cuttlefish, linux]
    # Cold partial checkout took 4m15s; leave time for Node setup and assertions.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          # Partial clone uses the checkout action; avoids the native mirror path.
          filter: blob:none
          sparse-checkout: |
            services
            web
            scripts
            terraform
            deploy
            docs
            proto
            api
            content
            .github

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # cost-guardrails pins the paid-Gemini report extractor's run size,
      # workers, pages, budget and retries (contract fundamentals-coverage
      # 6.2); until it was listed here it ran in no CI job.
      - name: Test repository hygiene tooling
        run: node --test scripts/tests/portal-content-provenance.test.mjs scripts/tests/housing-deploy-hygiene.test.mjs scripts/tests/scheduler-override-body.test.mjs scripts/tests/migration-drift.test.mjs scripts/tests/self-hosted-toolchain.test.mjs scripts/tests/vke-jobs-cutover.test.mjs terraform/modules/report-extractor/cost-guardrails.test.mjs scripts/release-pipeline.test.mjs scripts/bundle-budget-ci.test.mjs scripts/tests/browser-analytics-isolation.test.mjs scripts/tests/scoped-release-headers.test.mjs scripts/tests/stock-tab-redirects.test.mjs

      # These assert properties of migrations that prod REPLAYS on every deploy
      # from a hardcoded allowlist — most importantly that 000095 stays last, so
      # the hardened refresh_all_materialized_views() is not silently reverted
      # by an earlier migration's CREATE OR REPLACE. That is the defect which
      # left five materialized views stale for 19 days. Until now these tests
      # ran in no CI job at all and only fired if someone remembered to run
      # them by hand, which is no guard.
      - name: Migration contracts
        run: node --test services/migrations/*.test.mjs

      - name: Reject captured portal payloads
        run: node scripts/check-portal-content-provenance.mjs

  # The financial-report extractor's Python tests: the langextract pin and the
  # BudgetedGemini hook guard (a bump that moves either hook would silently
  # bill thinking tokens again), model failures never stored as "no metrics",
  # and the Python half of the shared extractiontrust fixtures
  # (results_titles.json, document_meta_cases.json), whose Go half runs in
  # go-quality. Tests that need a database skip here (they are gated on
  # REPORT_EXTRACTOR_TEST_DATABASE_URL). Runs on every PR this workflow
  # triggers on: services/** covers both the extractor and the fixtures.
  report-extractor-tests:
    name: Report extractor tests
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Partial clone uses the checkout action; avoids the native mirror path.
          filter: blob:none
          sparse-checkout: |
            services/report-extractor
            services/pkg/extractiontrust

      # The runner image is not a contract (scripts/tests/self-hosted-toolchain
      # .test.mjs): ask for Python explicitly. 3.11 is what the job's image
      # (python:3.11-slim) runs in production.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install extractor dependencies
        run: python -m pip install -r services/report-extractor/requirements.txt pytest

      - name: Run the extractor tests
        working-directory: services/report-extractor
        run: python -m pytest -q

  # deploy/kubernetes/jobs: the CronJob chart Paprika delivers to omega. The
  # render contract pins every schedule to the Cloud Scheduler trigger it
  # replaces, per-workload Gemini key isolation, keyless GCP auth scope and
  # nothing-runs-by-default; the Python tests cover the Telesis monitor
  # registration maths. Tools are installed explicitly: the runner image is not
  # a contract (scripts/tests/self-hosted-toolchain.test.mjs).
  vke-jobs-chart:
    name: VKE jobs chart
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Partial clone uses the checkout action; avoids the native mirror path.
          filter: blob:none
          sparse-checkout: |
            deploy/kubernetes/jobs
            terraform

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install yq
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          arch="$(uname -m)"; case "${arch}" in x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; esac
          curl -fsSL -o "${RUNNER_TEMP}/bin/yq" "https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_${arch}"
          chmod +x "${RUNNER_TEMP}/bin/yq"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Chart render contract
        run: deploy/kubernetes/jobs/chart/tests/render.sh

      - name: Monitor registration tests
        run: |
          python -m pip install --quiet pyyaml
          python -m unittest discover -s deploy/kubernetes/jobs/scripts -p 'test_*.py' -v

  # web/public/openapi.{json,yaml} is a generated, PUBLISHED artifact. A stale
  # one is worse than none: it reads as authoritative while documenting an API
  # we no longer serve. This job regenerates it from the protos and diffs.
  #
  # It is a separate job from portal-content-provenance on purpose — that one
  # is Node-only, and `make openapi` needs Go, buf, and web's node_modules
  # (buf.gen.yaml runs protoc-gen-es out of web/node_modules/.bin).
  openapi-drift:
    name: OpenAPI spec is not stale
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Partial clone uses the checkout action; avoids the native mirror path.
          filter: blob:none
          sparse-checkout: |
            proto
            api
            services/cmd/openapi-postprocess
            services/gen/proto
            services/pkg
            sdks/java
            web
            scripts
            docs

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache: false

      # `services` depends on the private github.com/skunkworq/stealth module.
      # Same step every other Go job in this repo runs.
      - name: Configure private Go module access
        run: git config --global url."https://x-access-token:${{ secrets.STEALTH_PAT }}@github.com/skunkworq/".insteadOf "https://github.com/skunkworq/"

      # protoc-gen-es is resolved from web/node_modules/.bin by buf.gen.yaml,
      # so buf generate cannot run without web's dependencies installed.
      - name: Install web dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - uses: bufbuild/buf-action@v1
        with:
          # Pinned so CI generates with the same CLI developers do; an
          # unpinned bump would surface here as unexplained "drift".
          version: 1.47.2
          setup_only: true

      - name: Regenerate and diff
        env:
          GOPRIVATE: github.com/skunkworq/*
        run: node --test scripts/tests/openapi-drift.test.mjs
