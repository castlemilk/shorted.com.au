# Housing official-ingest and listings-event freshness sentinel.
#
# This runs daily against the production database inside ONE read-only
# transaction. Checks: official ingest errors, cursor/fact period regressions,
# global event silence (72h), materialized-view refresh age (72h), and —
# because a limping crawl keeps the global check green forever — per-suburb
# catalog staleness (oldest covered suburb > 132h) plus the rig's own
# crawl_run_status health (error/blocked, or a daily delta that has not
# finished in 30h).
name: Housing Freshness

on:
  schedule:
    # Daily at 22:11 UTC (08:11 AEST / 09:11 AEDT).
    - cron: "11 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The sentinel files a GitHub issue when a check fails. This is the notification
  # channel: CRAWL_FRESHNESS_WEBHOOK has never been set, so for its whole life this
  # workflow could only go red on a page nobody opens. An issue emails the repo
  # watchers with no external secret to configure.
  issues: write

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
  CRAWL_FRESHNESS_WEBHOOK: ${{ secrets.CRAWL_FRESHNESS_WEBHOOK }}
  # No PGOPTIONS. This used to carry "-c default_transaction_read_only=on
  # -c statement_timeout=60000" with the comment "PostgreSQL enforces read-only
  # access even if this workflow is edited badly". It enforced nothing:
  # Supabase's pooler (Supavisor) drops libpq startup options, so the session
  # read back default_transaction_read_only=off and the role's 2-minute timeout
  # (measured 2026-09-23). The guard now lives in the SQL itself: BEGIN READ
  # ONLY and SET LOCAL, checked by a DO block before the query runs.

jobs:
  freshness:
    # GitHub-hosted on purpose. This is the alarm for a dead crawl rig, and the
    # self-hosted Cuttlefish runners are containers on that same laptop: when
    # the rig was down they were down too, and the sentinel queued until
    # GitHub cancelled it (2026-09-21 and 09-22). It ran on ubuntu-latest with
    # the same DATABASE_URL_PROD secret until #600, and passed daily from
    # there (2026-08-11..18), so the hosted path can reach the database.
    # psql still comes from the pinned container below, not the image.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check housing freshness
        shell: bash
        run: |
          set -Eeuo pipefail

          raw_file="$RUNNER_TEMP/housing-freshness-raw.txt"
          report_file="$RUNNER_TEMP/housing-freshness-report.txt"
          info_file="$RUNNER_TEMP/housing-freshness-info.txt"
          query_error_file="$RUNNER_TEMP/housing-freshness-query-error.txt"

          # Cursor names do not always equal fact-source names. Keeping this map
          # explicit also excludes non-fact cursors such as listings and census.
          set +e
          # psql runs from a pinned container, not from whatever the runner
          # image ships: the self-hosted runner had no psql binary, so this step
          # exited 127 in ~9ms on every scheduled run from 2026-08-29 onward.
          # `-i` keeps the heredoc on stdin.
          #
          # The read-only guard is the transaction: BEGIN READ ONLY and
          # SET LOCAL, both of which end with it on any pooler, then a DO block
          # that refuses to continue unless the guard is in effect. psql sends
          # the heredoc's statements one by one on ONE connection, and an open
          # transaction keeps the same backend even on the transaction pooler.
          docker run --rm -i postgres:15-alpine \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --dbname="$DATABASE_URL" \
            --tuples-only --no-align --quiet \
            >"$raw_file" 2>"$query_error_file" <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '60s';
          DO $guard$
          BEGIN
            IF current_setting('transaction_read_only') <> 'on' THEN
              RAISE EXCEPTION 'read-only guard not in effect (transaction_read_only=%)',
                current_setting('transaction_read_only');
            END IF;
          END
          $guard$;
          WITH expected_fact_sources(cursor_source, fact_source, fact_measure) AS (
            VALUES
              ('abs_res_dwell_st', 'abs_res_dwell_st', NULL),
              ('abs_res_dwell', 'abs_res_dwell', 'median_price'),
              ('abs_rppi', 'abs_rppi', 'price_index'),
              ('abs_lend_housing', 'abs_lend_housing', NULL),
              ('abs_derived_index', 'abs_derived', 'price_index_derived'),
              ('rba', 'rba', 'debt_to_income'),
              ('rba_f6_rates', 'rba_f6', NULL),
              ('rba_cash_rate', 'rba_f11', 'cash_rate'),
              ('rba_housing_credit', 'rba_d1', NULL),
              ('rba_balance_sheet', 'rba_e1', NULL),
              ('abs_wpi', 'abs_wpi', 'wage_index'),
              ('abs_cpi_rents', 'abs_cpi', 'rents_index'),
              ('abs_price_to_income', 'abs_derived', 'price_to_income'),
              ('vg_sa', 'vg_sa', 'median_price'),
              ('vg_vic', 'vg_vic', 'median_price'),
              ('vg_nsw', 'vg_nsw', 'median_price')
          ),
          fact_maxima AS (
            SELECT source, measure, MAX(period) AS max_period
            FROM house_prices
            GROUP BY source, measure
          ),
          mapped_fact_maxima AS (
            SELECT
              e.cursor_source,
              e.fact_source,
              e.fact_measure,
              MAX(f.max_period) AS max_period
            FROM expected_fact_sources AS e
            LEFT JOIN fact_maxima AS f
              ON f.source = e.fact_source
             AND (e.fact_measure IS NULL OR f.measure = e.fact_measure)
            GROUP BY e.cursor_source, e.fact_source, e.fact_measure
          ),
          event_maximum AS (
            SELECT MAX(observed_at) AS max_observed_at
            FROM property_price_events
          ),
          -- Every catalog suburb whose newest listing sighting is past the 132h
          -- line, computed ONCE so the report can show both the worst few rows
          -- and the true total (a LIMIT 5 with no count made a 200-suburb
          -- outage read as a 5-suburb one).
          stale_suburbs AS (
            SELECT
              lower(suburb) AS suburb,
              upper(state_code) AS state_code,
              trim(postcode) AS postcode,
              MAX(last_seen_at) AS last_seen
            FROM property_listings
            WHERE suburb IS NOT NULL
              AND state_code IS NOT NULL
              AND postcode IS NOT NULL
            GROUP BY 1, 2, 3
            HAVING MAX(last_seen_at) < now() - interval '132 hours'
          ),
          stale_suburb_total AS (
            SELECT COUNT(*) AS stale_total FROM stale_suburbs
          ),
          -- When each housing materialized view was last refreshed, from
          -- housing_mv_refresh (migration 000124). That table may not exist
          -- yet, and naming a missing table fails the whole query at parse
          -- time, so it is read through query_to_xml only when to_regclass
          -- finds it. Empty when absent; the MV check then falls back below.
          mv_refresh AS (
            SELECT
              (xpath('/row/mv_name/text()', r))[1]::text AS mv_name,
              (xpath('/row/refreshed_at/text()', r))[1]::text::timestamptz AS refreshed_at
            FROM unnest(
              CASE
                WHEN to_regclass('public.housing_mv_refresh') IS NULL THEN ARRAY[]::xml[]
                ELSE xpath('/table/row', query_to_xml(
                  'SELECT mv_name, refreshed_at FROM public.housing_mv_refresh', false, false, ''))
              END
            ) AS r
          ),
          violations AS (
            SELECT
              'INGEST_ERROR'::text AS check_name,
              r.source,
              COALESCE(
                NULLIF(regexp_replace(r.detail, E'[\\n\\r\\t]+', ' ', 'g'), ''),
                'no detail recorded'
              ) AS detail
            FROM house_price_ingest_runs AS r
            JOIN expected_fact_sources AS e
              ON e.cursor_source = r.source
            WHERE r.status = 'error'

            UNION ALL

            SELECT
              'PERIOD_REGRESSION',
              m.cursor_source,
              format(
                'preserved cursor=%s fact max=%s (fact source=%s measure=%s)',
                r.last_period,
                COALESCE(m.max_period::text, 'NULL'),
                m.fact_source,
                COALESCE(m.fact_measure, '*')
              )
            FROM mapped_fact_maxima AS m
            JOIN house_price_ingest_runs AS r
              ON r.source = m.cursor_source
            WHERE r.last_period IS NOT NULL
              AND (m.max_period IS NULL OR m.max_period < r.last_period)

            UNION ALL

            SELECT
              'EVENT_SILENCE',
              'property_price_events',
              CASE
                WHEN max_observed_at IS NULL THEN 'MAX(observed_at) is NULL'
                ELSE format(
                  'latest event=%s; older than the 72-hour threshold',
                  max_observed_at
                )
              END
            FROM event_maximum
            WHERE max_observed_at IS NULL
               OR max_observed_at < now() - interval '72 hours'

            UNION ALL

            -- CATALOG_STALENESS: the per-suburb statistic the global
            -- EVENT_SILENCE check cannot see. A crawl limping at any rate
            -- keeps max(observed_at) fresh while individual suburbs age
            -- without bound (measured 2026-08-18: median 117h, oldest 305h,
            -- sentinel green). Mirrors classifyFreshness (crawl_freshness.go):
            -- oldest COVERED suburb, keyed like queryCatalogFreshness. The
            -- 132-hour line is the rig's 120h alarm + half a day of margin so
            -- the rig-side alarm always fires first. Worst 5 suburbs only —
            -- a wholesale-stale catalog must not file a 500-row issue — but
            -- the worst 5 ALONE hide the scale (measured 2026-08-18: 255
            -- suburbs past the line, an issue that reads as five), so the
            -- TOTAL row below states how big the outage really is.
            SELECT
              'CATALOG_STALENESS',
              format('%s %s %s', s.suburb, s.state_code, s.postcode),
              format(
                'suburb last crawled %s (%s hours ago; threshold 132h)',
                s.last_seen,
                to_char(extract(epoch FROM now() - s.last_seen) / 3600.0, 'FM999990')
              )
            FROM (
              SELECT * FROM stale_suburbs ORDER BY last_seen ASC LIMIT 5
            ) AS s

            UNION ALL

            SELECT
              'CATALOG_STALENESS',
              'TOTAL',
              format(
                '%s suburb(s) past the 132h threshold in total (the worst 5 are listed individually)',
                t.stale_total
              )
            FROM stale_suburb_total AS t
            WHERE t.stale_total > 0

            UNION ALL

            -- RIG_STATUS: the rig's own health record (migration 000089).
            -- error/blocked is critical immediately; a delta row whose
            -- finished_at is older than 30 hours means the daily 10:00 run
            -- did not complete — launchd unloaded, lock wedged, machine
            -- asleep, or the rig is off. (30h matches crawlStaleAfter("delta")
            -- in crawl_jobs.go.) The fortnightly full pass is deliberately
            -- not aged here — its 16-day cadence belongs to /admin.
            --
            -- ...EXCEPT while a full pass is actually running. All housing
            -- drainers share ONE host Chrome and ONE residential IP, so they
            -- serialize on the single-drainer lock (hc_acquire_lock): the daily
            -- delta SKIPS cleanly — exit 0, no upsert — for the ~1.5+ days a
            -- 500-suburb full pass takes. delta.finished_at therefore ages past
            -- 30h on every healthy fortnightly full, and this check filed a
            -- false issue twice a month. Suppress it only while the SAME HOST's
            -- full row is itself FRESH within the same 30h bar we hold the delta
            -- to: an in-flight full re-upserts finished_at=now() every round, so
            -- a fresh full row means "the rig is alive and mid-pass", and it also
            -- covers the ~24h after a pass ends before the next delta finishes.
            -- Self-limiting: if the full pass dies, its row goes stale inside 30h
            -- and the delta alarm switches itself back on.
            SELECT
              'RIG_STATUS',
              format('%s/%s', c.run_type, c.host),
              format('status=%s finished_at=%s', c.status, c.finished_at)
            FROM crawl_run_status AS c
            WHERE c.status IN ('error', 'blocked')
               OR (
                    c.run_type = 'delta'
                AND c.finished_at < now() - interval '30 hours'
                AND NOT EXISTS (
                      SELECT 1
                      FROM crawl_run_status AS f
                      WHERE f.host = c.host
                        AND f.run_type = 'full'
                        AND f.finished_at > now() - interval '30 hours'
                    )
                  )

            UNION ALL

            -- DROP_INDEX_STALENESS: the daily drop_index compute writes one
            -- snapshot_date per day into housing_drop_index_daily. Its Cloud
            -- Scheduler trigger shipped born-broken in #436 (v2 timeout field
            -- in a v1 body → INVALID_ARGUMENT on every attempt) and NOTHING
            -- alerted for 4 days: the Cloud Run job never started, so
            -- execution-based monitoring saw nothing. Only a data-freshness
            -- check catches a schedule dying silently for ANY reason. 54h
            -- threshold = one missed daily run (18:00 UTC) + generous margin;
            -- the /price-drops surface leads with this number.
            SELECT
              'DROP_INDEX_STALENESS',
              'housing_drop_index_daily',
              CASE
                WHEN d.max_date IS NULL THEN 'no national drop_index rows at all'
                ELSE format(
                  'latest snapshot_date=%s (threshold: 54h behind now)',
                  d.max_date
                )
              END
            FROM (
              SELECT MAX(snapshot_date) AS max_date
              FROM housing_drop_index_daily
              WHERE grain = 'national'
            ) AS d
            WHERE d.max_date IS NULL
               OR d.max_date < (now() - interval '54 hours')::date

            UNION ALL

            -- MV_REFRESH_AGE: what /price-drops and the suburb pages actually
            -- serve. The collector refreshes the housing MVs after every crawl
            -- that wrote anything, and refresh_housing_materialized_views()
            -- turns a failed view into a WARNING and carries on, so a view can
            -- stop refreshing while every run reports success. 72h: longer
            -- than a fortnightly full pass (~1.5 days, refreshed only at its
            -- end) plus the delta gap before it, so a healthy rig never trips
            -- it. One row for all stale views, not one per view.
            SELECT
              'MV_REFRESH_AGE',
              string_agg(m.mv_name, ',' ORDER BY m.mv_name),
              format(
                '%s view(s) not refreshed within the 72-hour threshold; oldest refreshed_at=%s; newest event=%s',
                COUNT(*),
                MIN(m.refreshed_at),
                COALESCE((SELECT max_observed_at::text FROM event_maximum), 'NULL')
              )
            FROM mv_refresh AS m
            WHERE m.refreshed_at < now() - interval '72 hours'
            HAVING COUNT(*) > 0

            UNION ALL

            -- Fallback while housing_mv_refresh is absent or empty: the refresh
            -- follows every crawl write, so the newest event is the best
            -- available bound on the last refresh.
            SELECT
              'MV_REFRESH_AGE',
              'property_price_events (fallback)',
              format(
                'housing_mv_refresh %s; newest event=%s, older than the 72-hour threshold',
                CASE
                  WHEN to_regclass('public.housing_mv_refresh') IS NULL THEN 'not present (migration 000124 not applied)'
                  ELSE 'has no rows'
                END,
                COALESCE(e.max_observed_at::text, 'NULL')
              )
            FROM event_maximum AS e
            WHERE NOT EXISTS (SELECT 1 FROM mv_refresh)
              AND (e.max_observed_at IS NULL OR e.max_observed_at < now() - interval '72 hours')
          )
          -- Ordered by CAUSALITY, not alphabetically.
          --
          -- ORDER BY check_name put CATALOG_STALENESS first and RIG_STATUS last
          -- purely because C sorts before R. On 2026-09-06 that produced a
          -- report opening with "533 suburb(s) past the 132h threshold" and five
          -- named suburbs, while the two lines that actually explained it —
          -- both rigs status=error, claim failing with a 401 — sat at the
          -- bottom under a wall of symptoms. Everything above them was
          -- downstream of those two lines.
          --
          -- A rig that cannot claim work makes every suburb stale and silences
          -- every event, so it is read first. EVENT_SILENCE next: it is the
          -- earliest downstream signal and narrows whether the crawl is dead or
          -- merely slow. The staleness counts come last — they are the widest
          -- and least specific thing in the report, and they are what a healthy
          -- rig fixes by itself.
          --
          -- One INFO row rides along for the step summary: which source the MV
          -- age was judged by. The shell splits it off; it is never a failure.
          SELECT line
          FROM (
            SELECT
              -1 AS rank,
              concat_ws(
                E'\t', 'INFO', 'mv_age_source',
                CASE
                  WHEN EXISTS (SELECT 1 FROM mv_refresh) THEN 'housing_mv_refresh'
                  ELSE 'newest property_price_events.observed_at (housing_mv_refresh absent or empty)'
                END
              ) AS line,
              '' AS check_name,
              '' AS source

            UNION ALL

            SELECT
              CASE check_name
                WHEN 'RIG_STATUS'            THEN 0  -- cause: the crawl itself
                WHEN 'EVENT_SILENCE'         THEN 1  -- first downstream signal
                WHEN 'DROP_INDEX_STALENESS'  THEN 2
                WHEN 'MV_REFRESH_AGE'        THEN 3  -- what the pages serve
                WHEN 'CATALOG_STALENESS'     THEN 4  -- broadest symptom
                ELSE 5
              END,
              concat_ws(E'\t', check_name, source, detail),
              check_name,
              source
            FROM violations
          ) AS out
          ORDER BY rank, check_name, source;
          ROLLBACK;
          SQL
          check_rc=$?
          set -e

          # INFO rows describe the run; everything else is a violation.
          grep $'^INFO\t' "$raw_file" >"$info_file" || true
          grep -v $'^INFO\t' "$raw_file" >"$report_file" || true

          if (( check_rc != 0 )); then
            query_error="$(sed -n '1,20p' "$query_error_file" | tr '\r\n\t' '   ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-2000)"
            if [[ -z "$query_error" ]]; then
              query_error="psql produced no stderr"
            fi
            printf 'CHECK_FAILURE\tpsql\tread-only freshness query failed (exit %d): %s\n' \
              "$check_rc" "$query_error" >"$report_file"
          elif [[ -s "$report_file" ]]; then
            check_rc=1
          fi

          {
            echo "## Housing freshness report"
            echo
            echo "Thresholds: event silence **72h** · MV refresh age **72h** · catalog per-suburb **132h** · delta run age **30h** (suppressed while a full pass is in flight)."
            echo
            if [[ -s "$info_file" ]]; then
              echo "MV age judged by: $(cut -f3 "$info_file" | head -1)."
              echo
            fi
            if [[ -s "$report_file" ]]; then
              echo '```text'
              echo -e "CHECK\tSOURCE\tDETAIL"
              sed -n '1,100p' "$report_file"
              echo '```'
            else
              echo "All checks passed: no ingest errors, period regressions, event silence, stale views, or stale suburbs."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          if (( check_rc != 0 )); then
            if [[ -n "$CRAWL_FRESHNESS_WEBHOOK" ]]; then
              violation_count="$(wc -l <"$report_file" | tr -d ' ')"
              payload="$(jq -cn \
                --arg text "Housing freshness failed ($violation_count check(s)): https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                '{text: $text}')"
              curl --fail --silent --show-error --max-time 10 \
                -X POST -H 'Content-Type: application/json' \
                --data "$payload" "$CRAWL_FRESHNESS_WEBHOOK" >/dev/null \
                || echo "::warning::Housing freshness webhook delivery failed"
            fi
            exit "$check_rc"
          fi

      # A red workflow run is only a notification if somebody is looking at it.
      # This files (or updates) a single tracking issue so the failure reaches
      # the repo watchers' inbox. It deliberately reuses ONE open issue rather
      # than opening a new one per run: a daily sentinel that opens a daily issue
      # becomes noise within a week, and noise is how the last one was missed.
      # This step only BUILDS the issue body; the step after it files the issue
      # through the Actions runtime, because the runner has no gh binary.
      - name: Compose the freshness alert body
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          report_file="$RUNNER_TEMP/housing-freshness-report.txt"
          title="Housing freshness sentinel is failing"

          body_file="$RUNNER_TEMP/issue-body.md"
          {
            echo "The housing freshness sentinel failed on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Run: $RUN_URL"
            echo
            if [[ -s "$report_file" ]]; then
              echo '```text'
              echo -e "CHECK\tSOURCE\tDETAIL"
              sed -n '1,100p' "$report_file"
              echo '```'
            else
              echo "The check failed before producing a report — see the run log."
            fi
            echo
            echo "Runbook: \`docs/feature/housing/operations.md\`."
            echo "This issue is reused by every failing run; it closes on the next green run."
          } >"$body_file"

          echo "$title" >"$RUNNER_TEMP/issue-title.txt"

      # The runner has no `gh` binary, so the filing step exited 127 and the
      # alarm never reached anyone — the same silent-failure class the sentinel
      # exists to catch. github-script runs in the Actions node runtime and
      # needs nothing installed on the runner.
      - name: File or update the freshness alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const label = "housing-freshness";
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/issue-body.md`, "utf8");
            const title = fs.readFileSync(`${process.env.RUNNER_TEMP}/issue-title.txt`, "utf8").trim();
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label, per_page: 1,
            });
            if (open.data.length) {
              const number = open.data[0].number;
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              core.info(`commented on existing issue #${number}`);
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "B60205",
                description: "Housing ingest freshness sentinel",
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422 = the label already exists
            }
            const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            core.info(`opened issue #${created.data.number}`);

      # Close the tracking issue once the sentinel is green again, so an open
      # issue always means "currently broken" rather than "broke once".
      - name: Resolve the freshness alert issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "housing-freshness";
            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label, per_page: 1,
            });
            if (!open.data.length) return;
            const number = open.data[0].number;
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: `Housing freshness is green again: ${runUrl}`,
            });
            await github.rest.issues.update({ owner, repo, issue_number: number, state: "closed" });
            core.info(`closed issue #${number}`);
