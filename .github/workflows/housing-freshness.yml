# Housing official-ingest and listings-event freshness sentinel.
#
# This runs daily against the production database using read-only transactions.
# Four checks: official ingest errors, cursor/fact period regressions, global
# event silence (72h), and — because a limping crawl keeps the global check
# green forever — per-suburb catalog staleness (oldest covered suburb > 132h)
# plus the rig's own crawl_run_status health (error/blocked, or a daily delta
# that has not finished in 30h).
name: Housing Freshness

on:
  schedule:
    # Daily at 22:11 UTC (08:11 AEST / 09:11 AEDT).
    - cron: "11 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The sentinel files a GitHub issue when a check fails. This is the notification
  # channel: CRAWL_FRESHNESS_WEBHOOK has never been set, so for its whole life this
  # workflow could only go red on a page nobody opens. An issue emails the repo
  # watchers with no external secret to configure.
  issues: write

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
  CRAWL_FRESHNESS_WEBHOOK: ${{ secrets.CRAWL_FRESHNESS_WEBHOOK }}
  # PostgreSQL enforces read-only access even if this workflow is edited badly.
  PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000"

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check housing freshness
        shell: bash
        run: |
          set -Eeuo pipefail

          report_file="$RUNNER_TEMP/housing-freshness-report.txt"
          query_error_file="$RUNNER_TEMP/housing-freshness-query-error.txt"

          # Cursor names do not always equal fact-source names. Keeping this map
          # explicit also excludes non-fact cursors such as listings and census.
          set +e
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --dbname="$DATABASE_URL" \
            --tuples-only --no-align --quiet \
            >"$report_file" 2>"$query_error_file" <<'SQL'
          WITH expected_fact_sources(cursor_source, fact_source, fact_measure) AS (
            VALUES
              ('abs_res_dwell_st', 'abs_res_dwell_st', NULL),
              ('abs_res_dwell', 'abs_res_dwell', 'median_price'),
              ('abs_rppi', 'abs_rppi', 'price_index'),
              ('abs_lend_housing', 'abs_lend_housing', NULL),
              ('abs_derived_index', 'abs_derived', 'price_index_derived'),
              ('rba', 'rba', 'debt_to_income'),
              ('rba_f6_rates', 'rba_f6', NULL),
              ('rba_cash_rate', 'rba_f11', 'cash_rate'),
              ('rba_housing_credit', 'rba_d1', NULL),
              ('rba_balance_sheet', 'rba_e1', NULL),
              ('abs_wpi', 'abs_wpi', 'wage_index'),
              ('abs_cpi_rents', 'abs_cpi', 'rents_index'),
              ('abs_price_to_income', 'abs_derived', 'price_to_income'),
              ('vg_sa', 'vg_sa', 'median_price'),
              ('vg_vic', 'vg_vic', 'median_price'),
              ('vg_nsw', 'vg_nsw', 'median_price')
          ),
          fact_maxima AS (
            SELECT source, measure, MAX(period) AS max_period
            FROM house_prices
            GROUP BY source, measure
          ),
          mapped_fact_maxima AS (
            SELECT
              e.cursor_source,
              e.fact_source,
              e.fact_measure,
              MAX(f.max_period) AS max_period
            FROM expected_fact_sources AS e
            LEFT JOIN fact_maxima AS f
              ON f.source = e.fact_source
             AND (e.fact_measure IS NULL OR f.measure = e.fact_measure)
            GROUP BY e.cursor_source, e.fact_source, e.fact_measure
          ),
          event_maximum AS (
            SELECT MAX(observed_at) AS max_observed_at
            FROM property_price_events
          ),
          -- Every catalog suburb whose newest listing sighting is past the 132h
          -- line, computed ONCE so the report can show both the worst few rows
          -- and the true total (a LIMIT 5 with no count made a 200-suburb
          -- outage read as a 5-suburb one).
          stale_suburbs AS (
            SELECT
              lower(suburb) AS suburb,
              upper(state_code) AS state_code,
              trim(postcode) AS postcode,
              MAX(last_seen_at) AS last_seen
            FROM property_listings
            WHERE suburb IS NOT NULL
              AND state_code IS NOT NULL
              AND postcode IS NOT NULL
            GROUP BY 1, 2, 3
            HAVING MAX(last_seen_at) < now() - interval '132 hours'
          ),
          stale_suburb_total AS (
            SELECT COUNT(*) AS stale_total FROM stale_suburbs
          ),
          violations AS (
            SELECT
              'INGEST_ERROR'::text AS check_name,
              r.source,
              COALESCE(
                NULLIF(regexp_replace(r.detail, E'[\\n\\r\\t]+', ' ', 'g'), ''),
                'no detail recorded'
              ) AS detail
            FROM house_price_ingest_runs AS r
            JOIN expected_fact_sources AS e
              ON e.cursor_source = r.source
            WHERE r.status = 'error'

            UNION ALL

            SELECT
              'PERIOD_REGRESSION',
              m.cursor_source,
              format(
                'preserved cursor=%s fact max=%s (fact source=%s measure=%s)',
                r.last_period,
                COALESCE(m.max_period::text, 'NULL'),
                m.fact_source,
                COALESCE(m.fact_measure, '*')
              )
            FROM mapped_fact_maxima AS m
            JOIN house_price_ingest_runs AS r
              ON r.source = m.cursor_source
            WHERE r.last_period IS NOT NULL
              AND (m.max_period IS NULL OR m.max_period < r.last_period)

            UNION ALL

            SELECT
              'EVENT_SILENCE',
              'property_price_events',
              CASE
                WHEN max_observed_at IS NULL THEN 'MAX(observed_at) is NULL'
                ELSE format(
                  'latest event=%s; older than the 72-hour threshold',
                  max_observed_at
                )
              END
            FROM event_maximum
            WHERE max_observed_at IS NULL
               OR max_observed_at < now() - interval '72 hours'

            UNION ALL

            -- CATALOG_STALENESS: the per-suburb statistic the global
            -- EVENT_SILENCE check cannot see. A crawl limping at any rate
            -- keeps max(observed_at) fresh while individual suburbs age
            -- without bound (measured 2026-08-18: median 117h, oldest 305h,
            -- sentinel green). Mirrors classifyFreshness (crawl_freshness.go):
            -- oldest COVERED suburb, keyed like queryCatalogFreshness. The
            -- 132-hour line is the rig's 120h alarm + half a day of margin so
            -- the rig-side alarm always fires first. Worst 5 suburbs only —
            -- a wholesale-stale catalog must not file a 500-row issue — but
            -- the worst 5 ALONE hide the scale (measured 2026-08-18: 200+
            -- suburbs past the line, an issue that reads as five), so the
            -- TOTAL row below states how big the outage really is.
            SELECT
              'CATALOG_STALENESS',
              format('%s %s %s', s.suburb, s.state_code, s.postcode),
              format(
                'suburb last crawled %s (%s hours ago; threshold 132h)',
                s.last_seen,
                to_char(extract(epoch FROM now() - s.last_seen) / 3600.0, 'FM999990')
              )
            FROM (
              SELECT * FROM stale_suburbs ORDER BY last_seen ASC LIMIT 5
            ) AS s

            UNION ALL

            SELECT
              'CATALOG_STALENESS',
              'TOTAL',
              format(
                '%s suburb(s) past the 132h threshold in total (the worst 5 are listed individually)',
                t.stale_total
              )
            FROM stale_suburb_total AS t
            WHERE t.stale_total > 0

            UNION ALL

            -- RIG_STATUS: the rig's own health record (migration 000089).
            -- error/blocked is critical immediately; a delta row whose
            -- finished_at is older than 30 hours means the daily 10:00 run
            -- did not complete — launchd unloaded, lock wedged, machine
            -- asleep, or the rig is off. (30h matches crawlStaleAfter("delta")
            -- in crawl_jobs.go.) The fortnightly full pass is deliberately
            -- not aged here — its 16-day cadence belongs to /admin.
            SELECT
              'RIG_STATUS',
              format('%s/%s', run_type, host),
              format('status=%s finished_at=%s', status, finished_at)
            FROM crawl_run_status
            WHERE status IN ('error', 'blocked')
               OR (run_type = 'delta' AND finished_at < now() - interval '30 hours')
          )
          SELECT concat_ws(E'\t', check_name, source, detail)
          FROM violations
          ORDER BY check_name, source;
          SQL
          check_rc=$?
          set -e

          if (( check_rc != 0 )); then
            query_error="$(sed -n '1,20p' "$query_error_file" | tr '\r\n\t' '   ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-2000)"
            if [[ -z "$query_error" ]]; then
              query_error="psql produced no stderr"
            fi
            printf 'CHECK_FAILURE\tpsql\tread-only freshness query failed (exit %d): %s\n' \
              "$check_rc" "$query_error" >"$report_file"
          elif [[ -s "$report_file" ]]; then
            check_rc=1
          fi

          {
            echo "## Housing freshness report"
            echo
            echo "Thresholds: event silence **72h** · catalog per-suburb **132h** · delta run age **30h**."
            echo
            if [[ -s "$report_file" ]]; then
              echo '```text'
              echo -e "CHECK\tSOURCE\tDETAIL"
              sed -n '1,100p' "$report_file"
              echo '```'
            else
              echo "All checks passed: no ingest errors, period regressions, or event silence."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          if (( check_rc != 0 )); then
            if [[ -n "$CRAWL_FRESHNESS_WEBHOOK" ]]; then
              violation_count="$(wc -l <"$report_file" | tr -d ' ')"
              payload="$(jq -cn \
                --arg text "Housing freshness failed ($violation_count check(s)): https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                '{text: $text}')"
              curl --fail --silent --show-error --max-time 10 \
                -X POST -H 'Content-Type: application/json' \
                --data "$payload" "$CRAWL_FRESHNESS_WEBHOOK" >/dev/null \
                || echo "::warning::Housing freshness webhook delivery failed"
            fi
            exit "$check_rc"
          fi

      # A red workflow run is only a notification if somebody is looking at it.
      # This files (or updates) a single tracking issue so the failure reaches
      # the repo watchers' inbox. It deliberately reuses ONE open issue rather
      # than opening a new one per run: a daily sentinel that opens a daily issue
      # becomes noise within a week, and noise is how the last one was missed.
      - name: File or update the freshness alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          report_file="$RUNNER_TEMP/housing-freshness-report.txt"
          title="Housing freshness sentinel is failing"

          body_file="$RUNNER_TEMP/issue-body.md"
          {
            echo "The housing freshness sentinel failed on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Run: $RUN_URL"
            echo
            if [[ -s "$report_file" ]]; then
              echo '```text'
              echo -e "CHECK\tSOURCE\tDETAIL"
              sed -n '1,100p' "$report_file"
              echo '```'
            else
              echo "The check failed before producing a report — see the run log."
            fi
            echo
            echo "Runbook: \`docs/feature/housing/operations.md\`."
            echo "This issue is reused by every failing run; it closes on the next green run."
          } >"$body_file"

          existing="$(gh issue list --state open --label housing-freshness \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "commented on existing issue #$existing"
          else
            gh label create housing-freshness --color B60205 \
              --description "Housing ingest freshness sentinel" 2>/dev/null || true
            gh issue create --title "$title" --label housing-freshness --body-file "$body_file"
          fi

      # Close the tracking issue once the sentinel is green again, so an open
      # issue always means "currently broken" rather than "broke once".
      - name: Resolve the freshness alert issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --label housing-freshness \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --comment "Housing freshness is green again: $RUN_URL"
            echo "closed issue #$existing"
          fi
