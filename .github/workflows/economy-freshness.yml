# Economy data freshness sentinel.
#
# Runs `-mode freshness` as a prod Cloud Run job execution a few days after
# the monthly ingest scheduler (5th, 17:00 UTC). A STALE source (or an aged
# correlation matrix) exits non-zero -> this workflow fails -> GitHub
# notifies. Investigation runbook: the `$economy-data` skill
# (.claude/skills/economy-data/SKILL.md) — sweep procedure in §1.
#
# FROZEN sources (upstream-discontinued, e.g. abs-retail-trade) are reported
# but never fail the run. Threshold calibration lives in
# services/jobs/internal/jobs/economy/freshness.go.
#
# This targets `shorted-economy-freshness` — a SEPARATE Cloud Run job from the
# monthly `shorted-economy` ingest, same image and env (both are
# terraform/modules/shorted-job instantiations of the consolidated `shorted`
# binary). They were one job until 2026-08: a false-positive stale verdict then
# surfaced everywhere as "the monthly economy ingest failed". Keep them split.
#
# The legacy `economy-collector` job still exists with its scheduler paused;
# if you roll the cutover back, repoint the job name AND drop the `economy`
# subcommand from --args here.
name: Economy Freshness

on:
  schedule:
    # 8th of each month, 21:23 UTC (collector ingests on the 5th).
    - cron: "23 21 8 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  # A red workflow is a page nobody opens (this sentinel ran red for its whole
  # life — 3/3 runs — before anyone noticed via the admin console). An issue
  # emails the repo watchers; same pattern as housing-freshness.yml.
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/334313144667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@rosy-clover-477102-t5.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Post-cutover this runs the consolidated `shorted` binary, so the args
      # MUST carry the `economy` subcommand — a bare `-mode` exits 2 with usage.
      - name: Run freshness check on prod
        run: |
          gcloud run jobs execute shorted-economy-freshness \
            --project rosy-clover-477102-t5 \
            --region australia-southeast2 \
            --args="economy,-mode,freshness" \
            --wait

      # Echo the per-source report into the step LOG (not just the summary tab)
      # so `gh run view --log` is self-sufficient for triage, and keep a copy
      # for the issue body.
      - name: Surface report in summary
        if: always()
        run: |
          report_file="$RUNNER_TEMP/economy-freshness-report.txt"
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="shorted-economy-freshness" AND (textPayload:"source_key=" OR textPayload:"freshness:")' \
            --project rosy-clover-477102-t5 --freshness 30m --limit 40 \
            --format="value(textPayload)" | sort > "$report_file" || true
          echo "REPORT_FILE=$report_file" >> "$GITHUB_ENV"
          cat "$report_file"
          {
            echo "## Economy freshness report"
            echo '```'
            cat "$report_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File or update the freshness alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Economy data freshness check failed"
          body_file="$RUNNER_TEMP/economy-issue-body.md"
          {
            echo "The scheduled economy freshness check reported stale data."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            cat "${REPORT_FILE:-/dev/null}" 2>/dev/null || echo "(report unavailable)"
            echo '```'
            echo
            echo "Runbook: the \`\$economy-data\` skill — sweep procedure in §1."
            echo "Threshold calibration: services/jobs/internal/jobs/economy/freshness.go."
          } >"$body_file"

          existing="$(gh issue list --state open --label economy-freshness \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "commented on existing issue #$existing"
          else
            gh label create economy-freshness --color B60205 \
              --description "Economy data freshness sentinel" 2>/dev/null || true
            gh issue create --title "$title" --label economy-freshness --body-file "$body_file"
          fi

      # Close the tracking issue once the sentinel is green again, so an open
      # issue always means "currently broken" rather than "broke once".
      - name: Resolve the freshness alert issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --label economy-freshness \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --comment "Economy freshness is green again: $RUN_URL"
            echo "closed issue #$existing"
          fi
