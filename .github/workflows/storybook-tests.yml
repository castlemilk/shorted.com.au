name: Storybook Tests

# Runs the dashboard component harness on every PR that touches the frontend:
#  - interaction tests (Storybook play functions via the Vitest browser runner)
#  - visual regression (Playwright screenshots vs committed PNG baselines)
#
# Debian Bookworm keeps the same FreeType and fontconfig stack as the committed
# visual baselines. The browser installer uses Node 22 for Playwright 1.52.0,
# which stalls while unpacking Chromium on Node 26 Linux. The test runner
# uses tsx on Node 26 for test discovery. See
# web/tests/visual/README.md for intentional baseline updates.

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/storybook-tests.yml"

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

# Storybook mocks all data modules, so no real backend/env is needed. Skip the
# t3-env validation (src/env.js) that otherwise fails the build/test in CI where
# the local .env vars are absent.
env:
  SKIP_ENV_VALIDATION: "1"

jobs:
  interaction:
    name: Interaction tests (Vitest)
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          # Partial clone uses the checkout action; avoids the native mirror path.
          filter: blob:none
          sparse-checkout: |
            web
            docs
            content
            api
            proto
            scripts

      - uses: actions/setup-node@v5
        with:
          node-version: "26.13.1"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Session cookie compatibility (beta.22 fixtures)
        run: npm run test:session-cookies

      - name: Install Playwright Chromium
        run: node scripts/playwright.mjs install --with-deps chromium

      - name: Run Storybook interaction tests
        run: npm run test:storybook

  visual:
    name: Visual regression
    runs-on: [self-hosted, cuttlefish, linux]
    timeout-minutes: 25
    # Keep the Bookworm rendering stack used to generate the committed baselines.
    container:
      image: node:26.13.1-bookworm-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: node scripts/playwright.mjs install --with-deps chromium

      - name: Run visual regression
        run: npm run test:visual

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
