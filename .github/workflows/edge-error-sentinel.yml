# Cloudflare edge error-rate sentinel.
#
# Reads the zone's Cloudflare GraphQL analytics once a day and alerts on the
# share of GENUINE 5xx responses. The filtering is the entire point: unfiltered,
# this zone reports 20-25% 5xx forever, because most 5xx rows are not failed
# requests — they are Cloudflare Early Hints probes (frontend) and the edge
# worker's own Cache API operations (api host). See the long comment at the top
# of edge-error-sentinel.mjs for the measurements.
#
# Read-only: the token carries Zone > Analytics > Read and nothing else.
name: Edge Error Sentinel

on:
  schedule:
    # Daily at 21:40 UTC (07:40 AEST / 08:40 AEDT) — before the housing and
    # economy sentinels so a broad edge failure is seen first.
    - cron: "40 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Same notification channel as the other sentinels: an issue emails the repo
  # watchers with no external secret to configure. A red workflow alone is a
  # page nobody opens.
  issues: write

jobs:
  edge-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify the sentinel's own logic
        # Cheap, and it means a broken threshold or a broken exclusion is caught
        # here rather than by a silent false-negative at 21:40 UTC.
        run: node --test .github/workflows/edge-error-sentinel.test.mjs

      - name: Check edge error rates
        id: check
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          set -Eeuo pipefail
          report_file="$RUNNER_TEMP/edge-error-report.txt"
          set +e
          node .github/workflows/edge-error-sentinel.mjs | tee "$report_file"
          status=${PIPESTATUS[0]}
          set -e
          echo "report_file=$report_file" >> "$GITHUB_OUTPUT"
          {
            echo "### Edge error sentinel"
            echo
            echo '```'
            cat "$report_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: File or update the edge error alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Edge error rate above threshold"
          body_file="$RUNNER_TEMP/edge-issue-body.md"
          {
            echo "The daily edge error sentinel reported an elevated 5xx rate."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            cat "$RUNNER_TEMP/edge-error-report.txt" 2>/dev/null || echo "(report unavailable)"
            echo '```'
            echo
            echo "**Before investigating, know what does NOT count:**"
            echo
            echo "- On \`api.shorted.com.au\`, GET rows are the worker's Cache API"
            echo "  operations (\`cache.match\`/\`cache.put\` against a synthesized GET key),"
            echo "  not requests. The real origin is a \`*.run.app\` host outside this zone,"
            echo "  so a genuine worker->origin fetch cannot appear in zone analytics at all."
            echo "  This check already filters to POST."
            echo "- On the frontend, \`*early hints*\` user-agents are Cloudflare's own probes."
            echo "  This check already excludes them. If EARLY_HINTS_REENABLED fired, someone"
            echo "  turned \`early_hints\` back on in terraform/modules/cloudflare-edge/main.tf."
            echo
            echo "Thresholds and their measured baselines: .github/workflows/edge-error-sentinel.mjs"
            echo "Background: memory topic \`edge-504-early-hints-and-swr\`, PR #477."
          } >"$body_file"

          existing="$(gh issue list --state open --label edge-errors \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "commented on existing issue #$existing"
          else
            gh label create edge-errors --color B60205 \
              --description "Cloudflare edge error-rate sentinel" 2>/dev/null || true
            gh issue create --title "$title" --label edge-errors --body-file "$body_file"
          fi

      # Close the tracking issue once the sentinel is green again, so an open
      # issue always means "currently broken" rather than "broke once".
      - name: Resolve the edge error alert issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --label edge-errors \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --comment "Edge error rate is back within threshold: $RUN_URL"
            echo "closed issue #$existing"
          fi
