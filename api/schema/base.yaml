openapi: 3.1.0
# NOTE: the plugin applies this `info` block FIRST and then lets the
# file-level gnostic.openapi.v3.document option in shorts.proto override it,
# so these values do not survive into api/schema/generated/openapi.yaml.
# services/cmd/openapi-postprocess reads this block and stamps it back over
# the generated document — so this file IS the source of truth for `info`,
# just not via the plugin. Fix the licence and contact here, not in the proto.
info:
  title: Shorted Public API
  version: "1.0.0"
  x-logo:
    url: https://shorted.com.au/logo.png
  description: |
    Programmatic access to Australian market and public-interest data:
    ASIC short positions for ASX-listed securities, Australian house prices
    and suburb metrics, ABS/RBA economic series, and the federal register of
    members' and senators' interests.

    Every endpoint is a Connect-RPC method. Call it with an HTTP POST, a JSON
    body, and the `Connect-Protocol-Version: 1` header.

    Send an identifying `User-Agent`. The edge rejects the default `curl/...`
    agent with a 403 (`permission_denied`), so an example without one fails on
    first run — which is why every sample here sets it.

    ```bash
    curl -X POST https://api.shorted.com.au/shorts.v1alpha1.StockService/GetStock \
      -A 'my-app/1.0' \
      -H 'Content-Type: application/json' \
      -H 'Connect-Protocol-Version: 1' \
      -d '{"productCode":"BHP"}'
    ```

    Authentication is optional for public endpoints; a bearer token raises
    your rate limits. See https://shorted.com.au/docs/api for tiers.
  contact:
    name: Shorted Support
    url: https://shorted.com.au
    email: support@shorted.com.au
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
# Hand-written paths. These are real, working, publicly useful HTTP surfaces
# that are NOT proto methods, so no generator will ever emit them — if they are
# not here, they appear in no published spec at all. openapi-postprocess merges
# this block into the document AFTER pruning, so nothing here needs to (or can)
# be VISIBILITY_PUBLIC.
#
# Both live on https://shorted.com.au, NOT on the document's top-level server
# https://api.shorted.com.au — hence the path-level `servers` override on each.
# Getting that wrong tells an agent to call a URL that 404s.
paths:
  # Unlike the two web-app paths below, this one lives on the API host, so it
  # takes the document's top-level server and needs no override.
  /v1/panel:
    get:
      operationId: exportPanel
      summary: Export the whole short-position panel for a date range
      description: |
        The complete ASIC short-position panel — every security on every
        trading date in the window — as CSV or NDJSON, in ONE request.

        Building a research panel from `GetMarketByDate` costs one request per
        trading date: about 2,500 for a decade, against an anonymous quota of
        500 a month. This endpoint replaces that, and is cheaper for us to
        serve than the pattern it replaces. It is metered at 50 requests
        against your quota rather than one, because it does considerably more
        than one request's work.

        Rows are streamed and ordered by `(date, product_code)`, so a repeated
        export of the same window is byte-identical and can be diffed or
        resumed. `reported_short_positions` is a raw SHARE COUNT and
        `total_product_in_issue` is the denominator behind `percent_shorted` —
        shares on issue moves with placements and buybacks, so the percent can
        change with no change in short positioning at all.

        Because the response streams, the HTTP status is committed before the
        first row. A failure part-way through therefore cannot be a 5xx: the
        body ends with a line beginning `#ERROR`. Check for it before trusting
        a file to be complete.

        ```bash
        curl -A 'my-app/1.0' \
          'https://api.shorted.com.au/v1/panel?from=2015-01-01&to=2025-12-31' \
          -o panel.csv
        ```
      parameters:
        - name: from
          in: query
          required: true
          description: First trading date to include, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last trading date to include, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          description: Output encoding.
          schema:
            type: string
            enum: [csv, ndjson]
            default: csv
        - name: codes
          in: query
          required: false
          description: >-
            Comma-separated ASX codes to restrict the export to. Omit for every
            security. Case-insensitive.
          schema:
            type: string
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time filter, YYYY-MM-DD. Returns only observations that had
            been PUBLISHED by this date. ASIC publishes T+4, so an export for a
            historical window otherwise contains up to four days of data nobody
            could have had on the dates it is dated — lookahead a backtest
            cannot detect from the outside. Every row also carries
            available_from, so the lag can be checked rather than assumed.

            This covers publication LAG only. ASIC can also revise a position
            after the fact; the store updates in place, so a historical query
            returns the as-revised value and no field here identifies it as
            revised.
          schema:
            type: string
            format: date
        - name: ordinary_only
          in: query
          required: false
          description: >-
            Restrict the panel to ordinary share lines, excluding ETFs, bonds,
            hybrids, secondary lines and micro-instruments. Off by default, so
            the export stays a faithful record of what ASIC reported.

            Short interest is a percent of shares on issue, and that quantity is
            not comparable across instrument types — a warrant or ETF unit
            produces a number that looks like an ordinary share's short
            percentage without being one. Every row carries security_type
            (ordinary / etf / debt / other) so the decision can also be made
            client-side.
          schema:
            type: boolean
            default: false
        - name: include_zero
          in: query
          required: false
          description: >-
            Include securities whose reported short position was zero on a
            date. Off by default, which suits a "most shorted" view; turn it on
            when building a research universe, since excluding the
            zero-interest names biases anything that sorts on short interest.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The panel, streamed.
          content:
            text/csv:
              schema:
                type: string
                description: >-
                  Header row followed by one row per (date, security):
                  date, available_from, security_type, product_code,
                  product_name, reported_short_positions,
                  total_product_in_issue, percent_shorted.
            application/x-ndjson:
              schema:
                type: string
                description: One JSON object per line, same fields as the CSV columns.
        "400":
          description: >-
            Missing or unparseable from/to, a reversed window, a window longer
            than 30 years, or an unknown format.
        "429":
          description: Rate limit exceeded. This endpoint costs 50 units.

  /api/search/stocks:
    servers:
      - url: https://shorted.com.au
        description: Production (web app, not the API host)
    get:
      operationId: searchStocks
      summary: Search ASX stocks by code or name
      description: |
        Case-insensitive substring match over a curated in-process list of
        ~70 well-known ASX securities (not the full ASX register, and not the
        short-position corpus). Returns at most 10 results. For programmatic
        search over the full corpus use the Connect-RPC SearchService.
      parameters:
        - name: q
          in: query
          required: true
          description: Ticker or partial company name, e.g. `BHP` or `Commonwealth`. An empty or missing value returns an empty result list.
          schema:
            type: string
      responses:
        "200":
          description: Matching stocks, capped at 10.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: ASX ticker, e.g. `BHP`.
                        name:
                          type: string
                          description: Company name.
                        exchange:
                          type: string
                          description: Always `ASX`.
        "429":
          description: Rate limited (per-minute browser bucket).
        "500":
          description: Search failed.
  /feed.xml:
    servers:
      - url: https://shorted.com.au
        description: Production (web app, not the API host)
    get:
      operationId: getRssFeed
      summary: RSS feed of editorial articles and short-selling reports
      responses:
        "200":
          description: RSS 2.0 XML.
          content:
            application/rss+xml:
              schema:
                type: string
