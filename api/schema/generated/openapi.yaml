    shorts.v1alpha1.GetPoliticianResponse:
      type: object
      properties:
        politician:
          title: politician
          description: (proto shorts.v1alpha1.Politician)
          $ref: '#/components/schemas/shorts.v1alpha1.Politician'
        canonicalSlug:
          type: string
          title: canonical_slug
          description: consumers redirect when it differs from the request (proto string)
        terms:
          type: array
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.PoliticianTerm'
          title: terms
          description: (proto shorts.v1alpha1.PoliticianTerm)
        interests:
          type: array
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.DeclaredInterest'
          title: interests
          description: (proto shorts.v1alpha1.DeclaredInterest)
        representedSuburbs:
          type: array
          items:
            type: string
          title: represented_suburbs
          description: |-
            Suburbs in the member's division, from the ABS boundary join. These are
             suburbs REPRESENTED, which has nothing to do with anything owned. (proto string)
        extractedParliaments:
          type: array
          items:
            type: integer
            format: int32
          title: extracted_parliaments
          description: |-
            Extraction coverage FOR THIS PERSON, so a consumer can never present
             "declared nothing" when the truth is "not yet read".

             A member's register documents are discovered long before they are parsed
             (the 44th and 45th Parliaments are scans awaiting the vision tier). Without
             these two lists an empty `interests` is indistinguishable from a member who
             genuinely declared nothing — an absence claim about a named individual,
             which influence-editorial-standards forbids.
             Three buckets, not two, and the threshold is a SHARE not "any".

             A parliament where one document out of 155 parsed is not a parliament we
             have read. Claiming it would make every member whose own document failed to
             parse render an empty list under a heading that says we looked — a false
             absence claim about a named individual. read in full (>= 95% of documents) (proto int32)
        partialParliaments:
          type: array
          items:
            type: integer
            format: int32
          title: partial_parliaments
          description: read in part — an empty list here proves nothing (proto int32)
        pendingParliaments:
          type: array
          items:
            type: integer
            format: int32
          title: pending_parliaments
          description: documents exist, none read (proto int32)
      title: GetPoliticianResponse
      additionalProperties: false
