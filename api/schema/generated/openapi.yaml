        avgAsking:
          type: number
          title: avg_asking
          format: double
          description: mean asking price of priced for-sale listings, AUD; 0 if none (proto double)
        medianAsking:
          type: number
          title: median_asking
          format: double
          description: median asking price, AUD; 0 if none (proto double)
        soldCount:
          type: integer
          title: sold_count
          format: int32
          description: recent sold listings captured (proto int32)
        avgSold:
          type: number
          title: avg_sold
          format: double
          description: mean sold price, AUD; 0 if none (proto double)
        medianSold:
          type: number
          title: median_sold
          format: double
          description: median sold price, AUD; 0 if none (proto double)
      title: SuburbListingStats
      additionalProperties: false
      description: |-
        Crawl-derived listing aggregates for one suburb (mv_suburb_listing_stats).

         This is the ONLY price signal available for the ~11,700 suburbs with no
         Valuer-General feed — QLD, WA, TAS, NT and ACT publish no open suburb-level
         median, and every commercial alternative is licensed.

         It is NOT a substitute for `SuburbSummary.latest_median_price` and must never
         be rendered as one:
           - it is derived from CURRENT portal listings, not settled transfers;
           - `median_sold` is the price listings were marked sold at, which is a
             different measure from a Valuer-General median and is not comparable with
             the NSW/VIC/SA figures;
           - it covers whatever the crawl catalog reaches (500 suburbs nationally), so
             it is not a population any rank can be computed against.

         LICENCE: these are DERIVED AGGREGATES. The underlying rows carry
         source_licence='proprietary-tos-restricted' and are never republished — see
         docs/feature/housing/data-sources.md. Counts and medians only.
    shorts.v1alpha1.SuburbMetricColumn:
      type: object
      properties:
        metricKey:
          type: string
          title: metric_key
          description: (proto string)
        values:
          type: array
          items:
            type: number
            format: float
          title: values
          description: |-
            Numeric values are float32 and repeated float values are packed by default in proto3.
             When null_mask marks a position, the corresponding zero is only a placeholder. (proto float)
        nullMask:
          type: string
          title: null_mask
          format: byte
          description: |-
            Explicit NULL bitset. Least-significant-bit first: position i is byte i/8,
             bit i%8; 1 means NULL and 0 means present. This keeps a genuine zero present. (proto bytes)
        categoryLabels:
          type: array
          items:
            type: string
          title: category_labels
          description: |-
            Non-empty for categorical metrics. Each present value is a zero-based
             integer index into this stable label dictionary. (proto string)
      title: SuburbMetricColumn
      additionalProperties: false
      description: One numeric metric aligned position-for-position with GetSuburbIndex.
