    shorts.v1alpha1.IndexDefinition:
      type: object
      properties:
        code:
          type: string
          title: code
          description: Stable Shorted code, e.g. "XJO". (proto string)
        name:
          type: string
          title: name
          description: '"S&P/ASX 200". (proto string)'
        returnType:
          type: string
          title: return_type
          description: |-
            "price" or "total". This is the field that decides whether a comparison is
             honest: a price-return benchmark excludes dividends and therefore
             understates the market by roughly the yield — measured on our own data,
             XJO returned 24.2% over a window in which XJT (the same index, dividends
             reinvested) returned 37.6%. A strategy measured against the price series
             looks 13 points better than it is. (proto string)
        currency:
          type: string
          title: currency
          description: Always "AUD" today; stated rather than assumed. (proto string)
        earliestDate:
          type: string
          title: earliest_date
          description: YYYY-MM-DD, first session held. (proto string)
        latestDate:
          type: string
          title: latest_date
          description: YYYY-MM-DD, most recent session held. (proto string)
        observations:
          type: integer
          title: observations
          format: int32
          description: (proto int32)
      title: IndexDefinition
      additionalProperties: false
      description: |-
        A benchmark index we hold a level series for.

         Absolute returns on the ASX are mostly beta, so without a benchmark every
         strategy result overstates itself — a 12-month hold reporting +38% is a
         market return with a strategy sitting on top of it. Alpha is the only number
         that means anything, and alpha needs one of these.
