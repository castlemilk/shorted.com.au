          items:
            $ref: '#/components/schemas/stocks.v1alpha1.Stock'
          title: stocks
          description: (proto stocks.v1alpha1.Stock)
        totalCount:
          type: integer
          title: total_count
          format: int32
          description: (proto int32)
        previousDate:
          type: string
