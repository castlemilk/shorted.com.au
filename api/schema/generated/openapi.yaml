          format: int32
          description: (proto int32)
        donationMadeCount:
          type: integer
          title: donation_made_count
          format: int32
          description: (proto int32)
        mpReturnCount:
          type: integer
          title: mp_return_count
          format: int32
          description: |-
            The member layer, and why it is thin. A member with no row here has NOT
             been shown to have received nothing — most members never lodge this return. (proto int32)
        mpReturnResolvedCount:
          type: integer
          title: mp_return_resolved_count
          format: int32
          description: (proto int32)
        candidateReturnCount:
          type: integer
          title: candidate_return_count
          format: int32
          description: (proto int32)
        candidateReturnResolvedCount:
          type: integer
          title: candidate_return_resolved_count
          format: int32
          description: (proto int32)
        nilCandidateReturnCount:
          type: integer
          title: nil_candidate_return_count
          format: int32
          description: A lodged nil return is a publishable fact, not missing data. (proto int32)
        candidateDonationCount:
          type: integer
          title: candidate_donation_count
          format: int32
          description: (proto int32)
        firstFinancialYearEnd:
          type: integer
          title: first_financial_year_end
          format: int32
          description: (proto int32)
        lastFinancialYearEnd:
          type: integer
          title: last_financial_year_end
          format: int32
          description: (proto int32)
        matchedPayerNameCount:
          type: integer
          title: matched_payer_name_count
          format: int32
          description: |-
            Donor/payer NAMES appearing in this corpus that resolve to an ASX listing,
             and the codes they resolve to (exact normalised name or curated alias,
             never fuzzy). These describe the corpus.

             They replace `listed_company_match_count`, which published the size of the
             matching SUBSTRATE — every listed company whose name COULD be matched — as
             though it were a count of companies found in the data. It read an order of
             magnitude high. (proto int32)
        matchedPayerCodeCount:
          type: integer
          title: matched_payer_code_count
          format: int32
          description: (proto int32)
        matchableCompanyNameCount:
          type: integer
          title: matchable_company_name_count
          format: int32
          description: |-
            How many company names the match layer can match against at all. A property
             of the company metadata, kept as the denominator that makes the matched
             figures legible, and never to be rendered as a number of donors. (proto int32)
      title: DonationsCorpusCounts
      additionalProperties: false
      description: |-
        DonationsCorpusCounts is the methodology band's raw material: what the corpus
         actually contains, so a surface can state its own boundaries instead of
         implying completeness.
