    shorts.v1alpha1.DropIndexPoint:
      type: object
      properties:
        snapshotDate:
          type: string
          title: snapshot_date
          description: '''YYYY-MM-DD'' (proto string)'
        dropRate:
          type: number
          title: drop_rate
          format: double
          description: 0..1 fraction, equal-weighted mean of per-suburb rates (proto double)
        medianDropPct:
          type: number
          title: median_drop_pct
          format: double
          description: 0..1 fraction, depth of the typical cut (proto double)
        panelSuburbs:
          type: integer
          title: panel_suburbs
          format: int32
          description: suburbs contributing to this point (proto int32)
        coverageRatio:
          type: number
          title: coverage_ratio
          format: double
          description: panel suburbs / full suburb catalog for this snapshot date (proto double)
        isGap:
          type: boolean
          title: is_gap
          description: coverage too low to be a fair reading (proto bool)
        activeAddresses:
          type: integer
          title: active_addresses
          format: int32
          description: (proto int32)
        droppedAddresses:
          type: integer
          title: dropped_addresses
          format: int32
          description: (proto int32)
        withdrawnThenRelisted:
          type: integer
          title: withdrawn_then_relisted
          format: int32
          description: |-
            Distinct listings withdrawn then relisted with a >7 day gap, in the
             trailing window (national grain only). The gap floor excludes crawl
             sweep noise: measured 2026-08-17, 188 of 450 REA delist->relist pairs
             land <=2 days apart (a known page-truncation artefact, not a vendor
             withdrawing), while Domain shows 57 of 94 pairs genuinely >7 days apart. (proto int32)
        delistedCount:
          type: integer
          title: delisted_count
          format: int32
          description: withdrawn events in the trailing window (national grain only) (proto int32)
      title: DropIndexPoint
      additionalProperties: false
      description: |-
        DropIndexPoint is one day of the discounting index.

         panel_suburbs, coverage_ratio and is_gap cross the wire deliberately: the
         client needs them to caption the chart and to draw a crawl outage as a break
         rather than a collapse in discounting. Computing that twice would let the two
         sides disagree.
