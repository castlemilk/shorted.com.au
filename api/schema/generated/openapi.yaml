    stocks.v1alpha1.TimeSeriesData:
      type: object
      properties:
        productCode:
          type: string
          title: product_code
          description: The stock code. (proto string)
        name:
          type: string
          title: name
          description: (proto string)
        latestShortPosition:
          type: number
          title: latest_short_position
          format: double
          description: The latest short position. (proto double)
        points:
          type: array
          items:
            $ref: '#/components/schemas/stocks.v1alpha1.TimeSeriesPoint'
          title: points
          description: The time series points. (proto stocks.v1alpha1.TimeSeriesPoint)
        max:
          title: max
          description: The maximum short position in the range (proto stocks.v1alpha1.TimeSeriesPoint)
          $ref: '#/components/schemas/stocks.v1alpha1.TimeSeriesPoint'
        min:
          title: min
          description: The minimum short position in the range (proto stocks.v1alpha1.TimeSeriesPoint)
          $ref: '#/components/schemas/stocks.v1alpha1.TimeSeriesPoint'
        industry:
          type: string
          title: industry
          description: Industry classification (populated in summary mode from company metadata). (proto string)
        totalObservations:
          type: integer
          title: total_observations
          format: int32
          description: |-
            How many observations exist in the requested window before any thinning,
             and whether `points` is thinner than that. A caller doing quantitative
             work must be able to tell a complete daily record from a series shaped for
             a chart; without these two fields the only way to find out was to notice
             that the point count was suspiciously round. (proto int32)
        downsampled:
          type: boolean
          title: downsampled
          description: (proto bool)
      title: TimeSeriesData
      additionalProperties: false
      description: TimeSeriesData represents time series data for a stock.
    stocks.v1alpha1.TimeSeriesPoint:
      type: object
      properties:
        timestamp:
          title: timestamp
          description: The point in time. (proto google.protobuf.Timestamp)
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        shortPosition:
          type: number
          title: short_position
          format: double
          description: The short position at this point in time, as a PERCENT of shares on issue. (proto double)
        reportedShortPositions:
          type: number
          title: reported_short_positions
          format: double
          description: |-
            The two raw quantities the percent is computed from. ASIC reports a share
             COUNT; the percent is that count over shares on issue, and shares on issue
             moves with placements, entitlement offers and buybacks. A capital raising
             therefore drops the percent overnight with no change in short positioning
             at all, and a signal built on change-in-percent reads that as covering.
             Both quantities are stored per observation, so exposing them lets a caller
             work in share counts and see the denominator move. Shares held short on this date (a COUNT, not a percent). (proto double)
        totalProductInIssue:
          type: number
          title: total_product_in_issue
          format: double
          description: Shares on issue on this date — the percent's denominator. (proto double)
        availableFrom:
          type: string
          title: available_from
          description: |-
            The date this observation became PUBLIC: four trading days after
             `timestamp`, because ASIC publishes T+4.

             Without it, a backtest that uses the value dated D on day D has four days
             of lookahead and nothing in the response says so. That is the difference
             between a result that is merely biased and one that cannot be checked from
             the outside. Pass `as_of` on the request to have the server withhold
             observations that were not yet published.

             This is DERIVED from the report date, not recorded per row: it is the
             known, fixed publication rule made machine-readable. It does not capture
             an unusually delayed publication, and it says nothing about REVISIONS —
             ASIC can restate a position, the store updates in place, and the original
             value is not retained. A historical query therefore returns the
             as-revised figure, and no field here can tell you it was revised. YYYY-MM-DD. (proto string)
      title: TimeSeriesPoint
      additionalProperties: false
      description: TimeSeriesPoint represents a single point in time for the time series data.
