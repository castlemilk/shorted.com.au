          description: House seat (proto string)
        stateCode:
          type: string
          title: state_code
          description: UPPERCASE (proto string)
        party:
          type: string
          title: party
          description: (proto string)
        partyAb:
          type: string
          title: party_ab
          description: (proto string)
        firstParliament:
          type: integer
          title: first_parliament
          format: int32
          description: (proto int32)
        lastParliament:
          type: integer
          title: last_parliament
          format: int32
          description: (proto int32)
        aphMpid:
          type: string
          title: aph_mpid
          description: opaque; absent for some members (proto string)
        declaredListedCount:
          type: integer
          title: declared_listed_count
          format: int32
          description: Counts only. Never a value. (proto int32)
        declaredPropertyCount:
          type: integer
          title: declared_property_count
          format: int32
          description: (proto int32)
        photoUrl:
          type: string
          title: photo_url
          description: |-
            Portrait photograph, from Wikimedia Commons via Wikidata — NEVER from
             aph.gov.au, whose images are Commonwealth artefacts that §3.1's posture
             forbids mirroring and which may carry a separate photographer copyright.

             THE ATTRIBUTION FIELDS TRAVEL WITH THE URL AND ARE NOT OPTIONAL. CC BY and
             CC BY-SA permit publication only WITH the credit and a link to the terms, so
             a consumer that renders photo_url while dropping photo_licence /
             photo_source_url is breaching the licence, not just being untidy. A database
             CHECK makes the unattributed state unstorable; carrying the fields together
             here makes it unrenderable by accident too.

             Empty for ~26% of members: no Wikidata portrait, or the surname+division
             match was ambiguous and was withheld rather than guessed. Consumers render a
             monogram, never a placeholder face and never another person's photograph. (proto string)
        photoLicence:
          type: string
          title: photo_licence
          description: 'as Commons states it: "CC BY-SA 4.0", "Public domain" (proto string)'
        photoAuthor:
          type: string
          title: photo_author
          description: the credit line the licence requires (proto string)
        photoSourceUrl:
          type: string
