    shorts.v1alpha1.GetIndexSeriesRequest:
      type: object
      properties:
        indexCode:
          type: string
          title: index_code
          description: e.g. "XJO", "XJT". Case-insensitive. (proto string)
        period:
          type: string
          title: period
          description: |-
            Lookback window: 1D, 1W, 1M, 3M, 6M, 1Y, 2Y, 5Y, 10Y or MAX. Ignored when
             `from` is set. Defaults to 1Y. (proto string)
        from:
          type: string
          title: from
          description: Explicit range, YYYY-MM-DD. (proto string)
        to:
          type: string
          title: to
          description: (proto string)
        maxPoints:
          type: integer
          title: max_points
          format: int32
          description: |-
            Cap on returned points, 0 for no cap. Thinning keeps the first and last
             session; `downsampled` reports whether it happened. (proto int32)
      title: GetIndexSeriesRequest
      additionalProperties: false
    shorts.v1alpha1.GetIndexSeriesResponse:
      type: object
      properties:
        index:
          title: index
          description: |-
            The series definition, including its FULL available coverage in
             earliest_date/latest_date — not the window served here. Read those against
             covered_from/covered_to to see whether the request was met. (proto shorts.v1alpha1.IndexDefinition)
          $ref: '#/components/schemas/shorts.v1alpha1.IndexDefinition'
        points:
          type: array
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.IndexPoint'
          title: points
          description: Oldest first. (proto shorts.v1alpha1.IndexPoint)
        totalObservations:
          type: integer
          title: total_observations
          format: int32
          description: Sessions in the window before thinning. (proto int32)
        downsampled:
          type: boolean
          title: downsampled
          description: (proto bool)
        requestedFrom:
          type: string
          title: requested_from
          description: |-
            What the request asked for, and what the data could actually answer.

             Asking for period "10Y" against a series holding two years used to return
             the two years and say nothing, so a caller reasonably believed they had ten
             — and a risk-adjusted number computed over the wrong span is wrong in a way
             nothing in the response reveals. Coverage differs sharply between series
             and cannot be guessed: XJO reaches 2006, XKO 2013, and XJT — the only
             total-return series, and the one worth benchmarking against — begins
             2019-04-29 because that is where it begins upstream. No backfill can move
             that date. YYYY-MM-DD, resolved from period or from/to. (proto string)
        requestedTo:
          type: string
          title: requested_to
          description: (proto string)
        coveredFrom:
          type: string
          title: covered_from
          description: YYYY-MM-DD of the first session actually served. (proto string)
        coveredTo:
          type: string
          title: covered_to
          description: (proto string)
        truncated:
          type: boolean
          title: truncated
          description: |-
            True when the series does not span the whole requested window. The dates
             above say by how much and at which end. (proto bool)
      title: GetIndexSeriesResponse
      additionalProperties: false
