    stocks.v1alpha1.Stock:
      type: object
      properties:
        productCode:
          type: string
          title: product_code
          description: The stock code, e.g., "CBA", "ZIP", "PLS". (proto string)
        name:
          type: string
          title: name
          description: The full name of the stock. (proto string)
        totalProductInIssue:
          type: number
          title: total_product_in_issue
          format: float
          description: (proto float)
        reportedShortPositions:
          type: number
          title: reported_short_positions
          format: float
          description: (proto float)
        percentageShorted:
          type: number
          title: percentage_shorted
          format: float
          description: (proto float)
        industry:
          type: string
          title: industry
          description: (proto string)
        tags:
          type: array
          items:
            type: string
          title: tags
          description: (proto string)
        logoUrl:
          type: string
          title: logo_url
          description: (proto string)
        marketCap:
          type: number
          title: market_cap
          format: double
          description: |-
            Size and liquidity.

             Without these a short-interest universe cannot be filtered or a position
             sized: a sweep across ~740 names is dominated by micro-caps where short
             interest is both noisy and untradeable, and the standard remedy — a floor
             on traded value — was not expressible. They also change what the headline
             percentage MEANS: 5% short on a mega-cap and 5% on a micro-cap are not the
             same signal, and with no size attached they are the same number.

             double, not the float used above, because a market capitalisation in
             dollars exceeds float32's exact-integer range by five orders of magnitude. Market capitalisation in AUD. 0 when unknown. (proto double)
        averageDailyValue20d:
          type: number
          title: average_daily_value_20d
          format: double
          description: 20-session mean of close x volume, in AUD. 0 when unknown. (proto double)
        liquidityBand:
          type: string
          title: liquidity_band
          description: |-
            Coarse liquidity bucket derived from average_daily_value_20d: "mega",
             "large", "mid", "small" or "micro"; empty when unknown. Present because a
             band is usable for filtering even where the underlying value is missing or
             stale, and it is what most callers actually want. (proto string)
        averageDailyVolume20d:
          type: number
          title: average_daily_volume_20d
          format: double
          description: |-
            Average daily VOLUME in shares over the same 20 sessions, and the
             short position expressed in days of that volume.

             Percent-of-issue and days-to-cover are the two standard measures of short
             interest, and they answer different questions. 5% short in a name that
             turns over 2% of its register a day is a 2.5-day unwind; 5% short in a
             name that turns over 0.1% a day is a 50-day unwind, and that is where
             squeezes come from. Percent-of-issue treats those as identical.

             days_to_cover = reported_short_positions / average_daily_volume_20d, and
             is 0 when the volume is unknown or zero — never a division artefact. Note
             this is share VOLUME, not the traded VALUE in average_daily_value_20d:
             dividing a share count by dollars would produce a number with no meaning. Shares per session. 0 when unknown. (proto double)
        daysToCover:
          type: number
          title: days_to_cover
          format: double
          description: Sessions of average volume. 0 when not computable. (proto double)
        securityType:
          type: string
          title: security_type
          description: |-
            Coarse instrument class: "ordinary", "etf", "debt" or "other".

             Short interest is reported as a percent of shares on issue, and that
             quantity does not mean the same thing across instrument types. A warrant,
             an ETF unit and a bond line each have a denominator, and dividing by it
             yields a number that looks exactly like an ordinary share's short
             percentage while not being comparable to one. The visible symptom is a
             position over 100% — GSBW34 at 132.54%, UYLD at 102.61% — but those are
             only the tip; the real problem is the ETF sitting at a plausible single
             digit, indistinguishable from an ordinary share in the response.

             Derived from the product name, code shape and shares on issue — the same
             rules mv_top_shorts and mv_screener_data already filter on — not from an
             authoritative instrument register, which we do not hold. Deliberately
             coarse for that reason: it does not attempt warrant-versus-stapled, which
             the data cannot support. (proto string)
        industrySource:
          type: string
          title: industry_source
          description: |-
            Where the `industry` label above came from, relative to the date being
             asked about.

               "observed" — a classification change we recorded on or before that date
               "seed"     — the label as it stood when capture began
               "current"  — no history covers that date, so this is TODAY'S label

             "current" is the one that matters, and it is the common case for any
             historical cross-section: sector history did not exist before capture
             started and cannot be reconstructed, so ranking a 2014 cross-section by
             these labels is lookahead. Mild, but real, and previously invisible — the
             field was returned with nothing to say which date it described.

             industry_as_of is the date the label was observed from, empty when the
             source is "current". (proto string)
        industryAsOf:
          type: string
          title: industry_as_of
          description: (proto string)
