          title: low
          format: double
          description: (proto double)
        close:
          type: number
          title: close
          format: double
          description: The index level. Compute returns from this. (proto double)
        volume:
          type:
            - integer
            - string
          title: volume
          format: int64
          description: 'Often 0: an index level has no meaningful traded volume. (proto int64)'
      title: IndexPoint
      additionalProperties: false
      description: One session of an index.
