        period:
          type: string
          title: period
          description: |-
            Lookback window: 1D, 1W, 1M, 3M, 6M, 1Y, 2Y, 5Y, 10Y or MAX. Ignored when
             `from` is set. Defaults to 1Y. (proto string)
        from:
          type: string
          title: from
          description: Explicit date range, YYYY-MM-DD. `from` alone runs to the end of the data. (proto string)
        to:
