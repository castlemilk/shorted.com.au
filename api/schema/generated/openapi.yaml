      description: |-
        Request for GetStockPrices RPC.

         This exists so that short interest can be joined to returns without leaving
         the API. Doing it outside meant reconciling two ticker conventions (BHP here
         against BHP.AX elsewhere), two unauditable adjustment methodologies for
         splits and dividends, and two universes that need not agree on any given
         date — an error term on every result that no amount of care on the caller's
         side removes. Every question the product is actually asked ("do heavily
         shorted names underperform", "what happened after the squeeze") needs both
         series, and the harder half was already here.
    shorts.v1alpha1.GetStockPricesResponse:
      type: object
      properties:
        productCode:
          type: string
          title: product_code
          description: (proto string)
        name:
          type: string
          title: name
          description: (proto string)
        points:
          type: array
          items:
            $ref: '#/components/schemas/shorts.v1alpha1.StockPricePoint'
          title: points
          description: Oldest first. (proto shorts.v1alpha1.StockPricePoint)
        totalObservations:
          type: integer
          title: total_observations
          format: int32
          description: Observations in the window before thinning. (proto int32)
        downsampled:
          type: boolean
          title: downsampled
          description: (proto bool)
        currency:
          type: string
          title: currency
          description: Always "AUD" today; stated rather than assumed. (proto string)
