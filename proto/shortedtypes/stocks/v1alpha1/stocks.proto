syntax = "proto3";

package stocks.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/stocks/v1alpha1;stocksv1alpha1";

import "google/protobuf/timestamp.proto";

// A Stock represents a single stock's metadata.
message Stock {
  string product_code = 1; // The stock code, e.g., "CBA", "ZIP", "PLS".
  string name = 2;         // The full name of the stock.
  float total_product_in_issue = 3;
  float reported_short_positions = 4;
  float percentage_shorted = 5;
  string industry = 6;
  repeated string tags = 7;
  string logo_url = 8;

  // Size and liquidity.
  //
  // Without these a short-interest universe cannot be filtered or a position
  // sized: a sweep across ~740 names is dominated by micro-caps where short
  // interest is both noisy and untradeable, and the standard remedy — a floor
  // on traded value — was not expressible. They also change what the headline
  // percentage MEANS: 5% short on a mega-cap and 5% on a micro-cap are not the
  // same signal, and with no size attached they are the same number.
  //
  // double, not the float used above, because a market capitalisation in
  // dollars exceeds float32's exact-integer range by five orders of magnitude.
  double market_cap = 9;                  // Market capitalisation in AUD. 0 when unknown.
  double average_daily_value_20d = 10;    // 20-session mean of close x volume, in AUD. 0 when unknown.

  // Coarse liquidity bucket derived from average_daily_value_20d: "mega",
  // "large", "mid", "small" or "micro"; empty when unknown. Present because a
  // band is usable for filtering even where the underlying value is missing or
  // stale, and it is what most callers actually want.
  string liquidity_band = 11;

  // Average daily VOLUME in shares over the same 20 sessions, and the
  // short position expressed in days of that volume.
  //
  // Percent-of-issue and days-to-cover are the two standard measures of short
  // interest, and they answer different questions. 5% short in a name that
  // turns over 2% of its register a day is a 2.5-day unwind; 5% short in a
  // name that turns over 0.1% a day is a 50-day unwind, and that is where
  // squeezes come from. Percent-of-issue treats those as identical.
  //
  // days_to_cover = reported_short_positions / average_daily_volume_20d, and
  // is 0 when the volume is unknown or zero — never a division artefact. Note
  // this is share VOLUME, not the traded VALUE in average_daily_value_20d:
  // dividing a share count by dollars would produce a number with no meaning.
  double average_daily_volume_20d = 12;   // Shares per session. 0 when unknown.
  double days_to_cover = 13;              // Sessions of average volume. 0 when not computable.

  // Coarse instrument class: "ordinary", "etf", "debt" or "other".
  //
  // Short interest is reported as a percent of shares on issue, and that
  // quantity does not mean the same thing across instrument types. A warrant,
  // an ETF unit and a bond line each have a denominator, and dividing by it
  // yields a number that looks exactly like an ordinary share's short
  // percentage while not being comparable to one. The visible symptom is a
  // position over 100% — GSBW34 at 132.54%, UYLD at 102.61% — but those are
  // only the tip; the real problem is the ETF sitting at a plausible single
  // digit, indistinguishable from an ordinary share in the response.
  //
  // Derived from the product name, code shape and shares on issue — the same
  // rules mv_top_shorts and mv_screener_data already filter on — not from an
  // authoritative instrument register, which we do not hold. Deliberately
  // coarse for that reason: it does not attempt warrant-versus-stapled, which
  // the data cannot support.
  string security_type = 14;

  // Where the `industry` label above came from, relative to the date being
  // asked about.
  //
  //   "observed" — a classification change we recorded on or before that date
  //   "seed"     — the label as it stood when capture began
  //   "current"  — no history covers that date, so this is TODAY'S label
  //
  // "current" is the one that matters, and it is the common case for any
  // historical cross-section: sector history did not exist before capture
  // started and cannot be reconstructed, so ranking a 2014 cross-section by
  // these labels is lookahead. Mild, but real, and previously invisible — the
  // field was returned with nothing to say which date it described.
  //
  // industry_as_of is the date the label was observed from, empty when the
  // source is "current".
  string industry_source = 15;
  string industry_as_of = 16;

  // The GICS SECTOR the `industry` label above rolls up to (#557).
  //
  // Cross-sectional short-interest signals are normally sector-neutralised —
  // raw short interest is heavily sector-clustered, so a naive "long the
  // least-shorted" book is a large implicit sector bet — and the caller asked
  // for a GICS level so they could choose the neutralisation granularity.
  //
  // `industry` is already one: the values are the 25 real GICS INDUSTRY GROUP
  // names, level 2 of the hierarchy, pinned against the database by the
  // 2026-07-22 probe the economy pipeline depends on. Industry group → sector
  // is fixed published structure, not licensed data, so this field costs a
  // lookup and gives a second, coarser granularity. Level 3 (industry) and
  // level 4 (sub-industry) are genuinely below what we hold and no mapping can
  // invent them.
  //
  // Empty when the label is not one of the 25 — an upstream vocabulary change,
  // or a stock we have no classification for. Deliberately empty rather than
  // bucketed into a plausible sector: silently placing unclassified names in a
  // sector is the implicit bet this field exists to let a caller avoid.
  //
  // Derived from `industry`, so it inherits that field's as-of caveats exactly:
  // read industry_source before trusting it for a historical cross-section.
  string gics_sector = 21;

  // Whether this security can be PRICED as of the date being asked about.
  //
  // A point-in-time universe that is survivorship-free while the price data
  // behind it is survivor-only is more dangerous than one biased in both,
  // because the bias becomes invisible: the caller does the right thing,
  // selects the delisted names, and then silently drops exactly the
  // acquisitions and failures when returns are computed. A company taken over
  // at a 30% premium and one that went to zero are then treated identically —
  // as though the position never existed.
  //
  // Measured on the 2020-04-06 universe, 255 of 547 constituents (47%) are gone
  // by 2026, and only about half of a sample of those could be priced —
  // Adelaide Brighton, Australian Pharmaceutical, Cabcharge and Asaleo Care
  // among the missing. This does not fix that hole. It makes it measurable
  // before a backtest is run rather than discovered afterwards.
  //
  // False means we hold no usable price on or before this date, so any return
  // computed for this row would be fabricated. It is deliberately as-of rather
  // than lifetime: a name priced only in 2010-2012 is not priceable in a 2020
  // cross-section, and a lifetime flag would say it was.
  bool has_price_history = 17;

  // ── The delisting record (#576) ────────────────────────────────────────
  //
  // has_price_history above says a position can be OPENED. These three say
  // when and at what value it can be CLOSED, which is the half that was
  // missing: a constituent that leaves the universe currently just stops
  // appearing, so a company acquired at a 30% premium and one wound up at zero
  // are both simply absent, and the position silently never existed.
  //
  // UNLIKE every other field on this message, these are LIFETIME values, not
  // as-of the requested date. That is deliberate and it is the only thing they
  // are for: "when does this position close" is inherently a question about
  // the future relative to the cross-section being built. The direct
  // consequence is that feeding any of them into a signal is LOOKAHEAD. They
  // belong on the exit leg and nowhere else.
  //
  // last_reported_date is the last ASIC report date this code appears on, ever.
  // It is NOT a delisting date and is not named one: the ASIC short-position
  // report covers securities with reportable positions, roughly 700 of ~2,000
  // listed entities on any day, so a code can leave it by being delisted OR by
  // simply ceasing to be shorted. What it does say exactly is the last date
  // this name is in THIS universe — which is the date a book built from this
  // endpoint has to close it, either way.
  string last_reported_date = 18;

  // The last close held for this code and the session it belongs to — the
  // terminal value, where one exists. Zero and empty for the ~48% of codes
  // (936 of 1,941 over 2013-2026) carrying no price history at all; for those
  // the position remains uncloseable and no terminal value is recoverable from
  // data we hold. Saying so explicitly is the point: a caller can now separate
  // "closed at $X" from "cannot be closed" instead of having both arrive as
  // absence.
  double final_close = 19;
  string final_close_date = 20;

  // Whether the price gap on this row is FINAL or merely not filled yet (#576).
  //
  // has_price_history is a boolean and answers "can I price this". It cannot
  // answer the question a caller actually has to act on, which is whether
  // waiting would help:
  //
  //   "priced"       — a usable close exists on or before this date.
  //   "unattempted"  — no price, and no provider has ever been asked for this
  //                    code. Might still be recoverable; do not treat the gap
  //                    as permanent.
  //   "unavailable"  — no price, and a provider WAS asked and had nothing. The
  //                    gap is as final as our current sources make it, and a
  //                    backtest should code around it rather than wait.
  //
  // The distinction is not hypothetical. Until the backfill's universe was
  // widened, every stock list it used was derived from stock_prices itself, so
  // a code with no prices was never requested — and 936 of 1,941 codes sat in
  // "unattempted" while looking exactly like "unavailable". The standing
  // explanation for the gap went unexamined for as long as it did precisely
  // because the response could not tell those apart.
  //
  // Measured 2026-09-06 against the 13 codes #576 names, Yahoo returned
  // `{"code":"Not Found","description":"No data found, symbol may be delisted"}`
  // for all 13 while three live controls returned 3,040 records each. So for
  // those, "unavailable" is the true state and no amount of re-running helps.
  string price_status = 22;
  }
  
// TimeSeriesData represents time series data for a stock.
message TimeSeriesData {
  string product_code = 1;                        // The stock code.
  reserved 2;                                     // Previously used field, kept for compatibility.
  string name = 3;
  double latest_short_position = 4;                // The latest short position.
  repeated TimeSeriesPoint points = 10;            // The time series points.
  TimeSeriesPoint max = 11;                        // The maximum short position in the range
  TimeSeriesPoint min = 12;                        // The minimum short position in the range
  string industry = 13;                            // Industry classification (populated in summary mode from company metadata).

  // How many observations exist in the requested window before any thinning,
  // and whether `points` is thinner than that. A caller doing quantitative
  // work must be able to tell a complete daily record from a series shaped for
  // a chart; without these two fields the only way to find out was to notice
  // that the point count was suspiciously round.
  int32 total_observations = 14;
  bool downsampled = 15;
}
  
// TimeSeriesPoint represents a single point in time for the time series data.
message TimeSeriesPoint {
  google.protobuf.Timestamp timestamp = 1;        // The point in time.
  double short_position = 2;                      // The short position at this point in time, as a PERCENT of shares on issue.

  // The two raw quantities the percent is computed from. ASIC reports a share
  // COUNT; the percent is that count over shares on issue, and shares on issue
  // moves with placements, entitlement offers and buybacks. A capital raising
  // therefore drops the percent overnight with no change in short positioning
  // at all, and a signal built on change-in-percent reads that as covering.
  // Both quantities are stored per observation, so exposing them lets a caller
  // work in share counts and see the denominator move.
  double reported_short_positions = 3;            // Shares held short on this date (a COUNT, not a percent).
  double total_product_in_issue = 4;              // Shares on issue on this date — the percent's denominator.

  // The date this observation became PUBLIC: four trading days after
  // `timestamp`, because ASIC publishes T+4.
  //
  // Without it, a backtest that uses the value dated D on day D has four days
  // of lookahead and nothing in the response says so. That is the difference
  // between a result that is merely biased and one that cannot be checked from
  // the outside. Pass `as_of` on the request to have the server withhold
  // observations that were not yet published.
  //
  // This is DERIVED from the report date, not recorded per row: it is the
  // known, fixed publication rule made machine-readable. It does not capture
  // an unusually delayed publication, and it says nothing about REVISIONS —
  // ASIC can restate a position, the store updates in place, and the original
  // value is not retained. A historical query therefore returns the
  // as-revised figure, and no field here can tell you it was revised.
  string available_from = 5;                      // YYYY-MM-DD.
}

/**
Table "public.metadata"
      Column       | Type | Collation | Nullable | Default 
-------------------+------+-----------+----------+---------
 company_name      | text |           |          | 
 address           | text |           |          | 
 summary           | text |           |          | 
 details           | text |           |          | 
 website           | text |           |          | 
 stock_code        | text |           |          | 
 links             | text |           |          | 
 images            | text |           |          | 
 company_logo_link | text |           |          | 
 gcsUrl            | text |           |          | 
*/
message StockDetails {
  string product_code = 1;
  string company_name = 2;
  string industry = 3;
  string address = 4;
  string summary = 5;
  string details = 6;
  string website = 7;
  string gcs_url = 8;
  repeated string tags = 9;
  string enhanced_summary = 10;
  string company_history = 11;
  repeated CompanyPerson key_people = 12;
  repeated FinancialReport financial_reports = 13;
  string competitive_advantages = 14;
  repeated string risk_factors = 15;
  string recent_developments = 16;
  SocialMediaLinks social_media_links = 17;
  string enrichment_status = 18;
  google.protobuf.Timestamp enrichment_date = 19;
  string enrichment_error = 20;
  FinancialStatements financial_statements = 21;
  // Logo URLs (populated by logo discovery pipeline)
  string logo_gcs_url = 22;           // Full logo PNG URL (background removed)
  string logo_icon_gcs_url = 23;      // Icon-only logo PNG URL
  string logo_svg_gcs_url = 24;       // Original SVG logo URL (if discovered as SVG)
  string logo_source_url = 25;        // Original URL where the logo was found
  string logo_format = 26;            // Original format of discovered logo (svg, png, etc)

  // Every industry classification recorded for this stock, oldest first (#557).
  //
  // `industry` above is the CURRENT label. Cross-sectional short-interest
  // signals are normally sector-neutralised — raw short interest is heavily
  // sector-clustered, so a naive "long the least-shorted" book is a large
  // implicit sector bet — and doing that correctly needs the label as it stood
  // on the observation date, not today's.
  //
  // Capture began 2026-09 and is FORWARD ONLY. Historical sectors are not
  // recoverable: `company-metadata` holds one current row per stock, enrichment
  // overwrites the label in place, and `updated_at` is a bulk-sweep timestamp
  // with a single distinct value across all 2,258 rows. So this timeline
  // usually holds exactly one entry — the seeded baseline — and that is the
  // honest answer rather than an absence a caller has to interpret.
  //
  // Returned as a timeline rather than another as-of scalar so a caller can see
  // HOW MUCH history exists before deciding whether neutralising on it is
  // sound. One `seed` row means none of it is observed, and a study over any
  // earlier period is using today's labels — mild lookahead, but real.
  repeated IndustryObservation industry_history = 27;
}

// One recorded industry classification and the window it opened.
message IndustryObservation {
  string industry = 1;

  // The date this label started applying as far as we can observe. For a `seed`
  // row it is the date capture began, NOT the date the label was assigned,
  // which is unknown and unknowable.
  string observed_from = 2;

  //   "observed" — a classification change recorded when it happened
  //   "seed"     — the label as it stood when capture began
  //
  // The distinction matters and is the reason this is not one string: a seed
  // row dates a deploy, an observed row dates a reclassification, and treating
  // the first as the second invents a sector change that never happened.
  string source = 3;
}

message CompanyPerson {
  string name = 1;
  string role = 2;
  string bio = 3;
  string image_url = 4;       // Original source image URL (e.g. LinkedIn, Wikipedia)
  string image_gcs_url = 5;   // GCS-hosted image URL
  string linkedin_url = 6;    // LinkedIn profile URL
  string source_url = 7;      // Where the person data was found
  string source_type = 8;     // "company_website" | "exa" | "wikipedia"
}

message FinancialReport {
  string url = 1;
  string title = 2;
  string type = 3;
  string date = 4;
  string source = 5;
  string gcs_url = 6;
}

message SocialMediaLinks {
  string twitter = 1;
  string linkedin = 2;
  string facebook = 3;
  string youtube = 4;
  string website = 5;
}

message FinancialStatements {
  bool success = 1;
  FinancialStatementSet annual = 2;
  FinancialStatementSet quarterly = 3;
  FinancialStatementsInfo info = 4;
  string error = 5;
}

message FinancialStatementSet {
  map<string, StatementValues> income_statement = 1;
  map<string, StatementValues> balance_sheet = 2;
  map<string, StatementValues> cash_flow = 3;
}

message StatementValues {
  map<string, double> metrics = 1;
}

message FinancialStatementsInfo {
  double market_cap = 1;
  double current_price = 2;
  double pe_ratio = 3;
  double eps = 4;
  double dividend_yield = 5;
  double beta = 6;
  double week_52_high = 7;
  double week_52_low = 8;
  double volume = 9;
  int64 employee_count = 10;
  string sector = 11;
  string industry = 12;
}


message IndustryTreeMap {
  // indstries that a stock will belond to
  repeated string industries = 1;
  repeated TreemapShortPosition stocks = 2;
}

message TreemapShortPosition {
  string industry = 1;
  string product_code = 2;
  double short_position = 3;
}
