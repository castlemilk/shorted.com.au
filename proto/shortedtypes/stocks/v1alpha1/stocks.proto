syntax = "proto3";

package stocks.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/stocks/v1alpha1;stocksv1alpha1";

import "google/protobuf/timestamp.proto";

// A Stock represents a single stock's metadata.
message Stock {
  string product_code = 1; // The stock code, e.g., "CBA", "ZIP", "PLS".
  string name = 2;         // The full name of the stock.
  float total_product_in_issue = 3;
  float reported_short_positions = 4;
  float percentage_shorted = 5;
  string industry = 6;
  repeated string tags = 7;
  string logo_url = 8;

  // Size and liquidity.
  //
  // Without these a short-interest universe cannot be filtered or a position
  // sized: a sweep across ~740 names is dominated by micro-caps where short
  // interest is both noisy and untradeable, and the standard remedy — a floor
  // on traded value — was not expressible. They also change what the headline
  // percentage MEANS: 5% short on a mega-cap and 5% on a micro-cap are not the
  // same signal, and with no size attached they are the same number.
  //
  // double, not the float used above, because a market capitalisation in
  // dollars exceeds float32's exact-integer range by five orders of magnitude.
  double market_cap = 9;                  // Market capitalisation in AUD. 0 when unknown.
  double average_daily_value_20d = 10;    // 20-session mean of close x volume, in AUD. 0 when unknown.

  // Coarse liquidity bucket derived from average_daily_value_20d: "mega",
  // "large", "mid", "small" or "micro"; empty when unknown. Present because a
  // band is usable for filtering even where the underlying value is missing or
  // stale, and it is what most callers actually want.
  string liquidity_band = 11;
  }
  
// TimeSeriesData represents time series data for a stock.
message TimeSeriesData {
  string product_code = 1;                        // The stock code.
  reserved 2;                                     // Previously used field, kept for compatibility.
  string name = 3;
  double latest_short_position = 4;                // The latest short position.
  repeated TimeSeriesPoint points = 10;            // The time series points.
  TimeSeriesPoint max = 11;                        // The maximum short position in the range
  TimeSeriesPoint min = 12;                        // The minimum short position in the range
  string industry = 13;                            // Industry classification (populated in summary mode from company metadata).

  // How many observations exist in the requested window before any thinning,
  // and whether `points` is thinner than that. A caller doing quantitative
  // work must be able to tell a complete daily record from a series shaped for
  // a chart; without these two fields the only way to find out was to notice
  // that the point count was suspiciously round.
  int32 total_observations = 14;
  bool downsampled = 15;
}
  
// TimeSeriesPoint represents a single point in time for the time series data.
message TimeSeriesPoint {
  google.protobuf.Timestamp timestamp = 1;        // The point in time.
  double short_position = 2;                      // The short position at this point in time, as a PERCENT of shares on issue.

  // The two raw quantities the percent is computed from. ASIC reports a share
  // COUNT; the percent is that count over shares on issue, and shares on issue
  // moves with placements, entitlement offers and buybacks. A capital raising
  // therefore drops the percent overnight with no change in short positioning
  // at all, and a signal built on change-in-percent reads that as covering.
  // Both quantities are stored per observation, so exposing them lets a caller
  // work in share counts and see the denominator move.
  double reported_short_positions = 3;            // Shares held short on this date (a COUNT, not a percent).
  double total_product_in_issue = 4;              // Shares on issue on this date — the percent's denominator.
}

/**
Table "public.metadata"
      Column       | Type | Collation | Nullable | Default 
-------------------+------+-----------+----------+---------
 company_name      | text |           |          | 
 address           | text |           |          | 
 summary           | text |           |          | 
 details           | text |           |          | 
 website           | text |           |          | 
 stock_code        | text |           |          | 
 links             | text |           |          | 
 images            | text |           |          | 
 company_logo_link | text |           |          | 
 gcsUrl            | text |           |          | 
*/
message StockDetails {
  string product_code = 1;
  string company_name = 2;
  string industry = 3;
  string address = 4;
  string summary = 5;
  string details = 6;
  string website = 7;
  string gcs_url = 8;
  repeated string tags = 9;
  string enhanced_summary = 10;
  string company_history = 11;
  repeated CompanyPerson key_people = 12;
  repeated FinancialReport financial_reports = 13;
  string competitive_advantages = 14;
  repeated string risk_factors = 15;
  string recent_developments = 16;
  SocialMediaLinks social_media_links = 17;
  string enrichment_status = 18;
  google.protobuf.Timestamp enrichment_date = 19;
  string enrichment_error = 20;
  FinancialStatements financial_statements = 21;
  // Logo URLs (populated by logo discovery pipeline)
  string logo_gcs_url = 22;           // Full logo PNG URL (background removed)
  string logo_icon_gcs_url = 23;      // Icon-only logo PNG URL
  string logo_svg_gcs_url = 24;       // Original SVG logo URL (if discovered as SVG)
  string logo_source_url = 25;        // Original URL where the logo was found
  string logo_format = 26;            // Original format of discovered logo (svg, png, etc)
}

message CompanyPerson {
  string name = 1;
  string role = 2;
  string bio = 3;
  string image_url = 4;       // Original source image URL (e.g. LinkedIn, Wikipedia)
  string image_gcs_url = 5;   // GCS-hosted image URL
  string linkedin_url = 6;    // LinkedIn profile URL
  string source_url = 7;      // Where the person data was found
  string source_type = 8;     // "company_website" | "exa" | "wikipedia"
}

message FinancialReport {
  string url = 1;
  string title = 2;
  string type = 3;
  string date = 4;
  string source = 5;
  string gcs_url = 6;
}

message SocialMediaLinks {
  string twitter = 1;
  string linkedin = 2;
  string facebook = 3;
  string youtube = 4;
  string website = 5;
}

message FinancialStatements {
  bool success = 1;
  FinancialStatementSet annual = 2;
  FinancialStatementSet quarterly = 3;
  FinancialStatementsInfo info = 4;
  string error = 5;
}

message FinancialStatementSet {
  map<string, StatementValues> income_statement = 1;
  map<string, StatementValues> balance_sheet = 2;
  map<string, StatementValues> cash_flow = 3;
}

message StatementValues {
  map<string, double> metrics = 1;
}

message FinancialStatementsInfo {
  double market_cap = 1;
  double current_price = 2;
  double pe_ratio = 3;
  double eps = 4;
  double dividend_yield = 5;
  double beta = 6;
  double week_52_high = 7;
  double week_52_low = 8;
  double volume = 9;
  int64 employee_count = 10;
  string sector = 11;
  string industry = 12;
}


message IndustryTreeMap {
  // indstries that a stock will belond to
  repeated string industries = 1;
  repeated TreemapShortPosition stocks = 2;
}

message TreemapShortPosition {
  string industry = 1;
  string product_code = 2;
  double short_position = 3;
}
