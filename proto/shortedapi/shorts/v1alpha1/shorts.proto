// ==================== Stock Screener Messages ====================

// Sort field for screener results
enum ScreenerSortField {
  SCREENER_SORT_FIELD_SHORT_PCT = 0;
  SCREENER_SORT_FIELD_SHORT_PCT_CHANGE = 1;
  SCREENER_SORT_FIELD_MARKET_CAP = 2;
  SCREENER_SORT_FIELD_PRICE_CHANGE_1M = 3;
  SCREENER_SORT_FIELD_PE_RATIO = 4;
  SCREENER_SORT_FIELD_DIVIDEND_YIELD = 5;
  SCREENER_SORT_FIELD_NET_DIRECTOR_BUY = 6;
  SCREENER_SORT_FIELD_NEWS_SENTIMENT = 7;
  SCREENER_SORT_FIELD_DAYS_TO_COVER = 8;
}

// Sort direction
enum SortDirection {
  SORT_DIRECTION_DESC = 0;
  SORT_DIRECTION_ASC = 1;
}

// A numeric range filter with optional min/max bounds
message RangeFilter {
  double min = 1;
  double max = 2;
  bool has_min = 3;
  bool has_max = 4;
}

// Compound filters for the stock screener
message ScreenerFilters {
  RangeFilter short_pct = 1;              // Current short position %
  RangeFilter short_pct_change = 2;       // 4-week short position change
  RangeFilter market_cap = 3;             // Market capitalization
  RangeFilter price_change_1m = 4;        // 1-month price change %
  RangeFilter pe_ratio = 5;               // P/E ratio
  RangeFilter dividend_yield = 6;         // Dividend yield %
  RangeFilter net_director_buy = 7;       // Net director buy value ($)
  RangeFilter avg_sentiment = 8;          // Average news sentiment (-1 to 1)
  repeated string industries = 9;         // Filter to specific industries
  bool has_director_buys = 10;            // Only stocks with recent director buys
  RangeFilter days_to_cover = 11;         // Days to cover (short positions / avg daily volume)
}

// Request for ScreenStocks RPC
message ScreenStocksRequest {
  ScreenerFilters filters = 1;
  ScreenerSortField sort_field = 2;
  SortDirection sort_direction = 3;
  int32 limit = 4;                        // Max results (default 50)
  int32 offset = 5;                       // Pagination offset
}

// A single stock result from the screener
message ScreenerStock {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  double short_pct = 4;
  double short_pct_change_4w = 5;
  double latest_price = 6;
  double price_change_1m = 7;
  int64 latest_volume = 8;
  double market_cap = 9;
  double pe_ratio = 10;
  double dividend_yield = 11;
  double net_director_buy_value = 12;
  int32 director_buy_count = 13;
  int32 director_sell_count = 14;
  int32 news_count_30d = 15;
  double avg_sentiment = 16;
  int32 price_sensitive_count = 17;
  double trailing_12m_dividend = 18;
  double avg_franking_pct = 19;
  string logo_url = 20;
  double days_to_cover = 21;              // Short positions / avg 20-day volume
  int64 avg_volume_20d = 22;              // 20-day average daily trading volume
}

// Response for ScreenStocks RPC
message ScreenStocksResponse {
  repeated ScreenerStock stocks = 1;
  int32 total_count = 2;
}

// ==================== Stock Graph Messages ====================

// Request for GetStockGraph RPC
message GetStockGraphRequest {
  string stock_code = 1;
  int32 limit = 2; // max people / similar companies to return (default 12)
}

// Response for GetStockGraph RPC
message GetStockGraphResponse {
  repeated GraphPerson people = 1;
  repeated GraphPeer similar_companies = 2;
}

// A person connected to the stock (director/officer) with their other ASX roles
message GraphPerson {
  string name = 1;
  string role = 2;
  string image_url = 3;
  string linkedin_url = 4;
  repeated string also_at = 5; // OTHER stock codes this person is connected to
}

// A narratively/semantically similar company
message GraphPeer {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  double similarity = 4;
}

// ==================== Event Timeline Messages ====================

// Request for GetEventTimeline RPC
message GetEventTimelineRequest {
  string stock_code = 1;
  int32 days_back = 2; // number of days to look back (default 90)
  int32 limit = 3;     // max events to return (default 50)
}

// Response for GetEventTimeline RPC
message GetEventTimelineResponse {
  repeated TimelineEvent events = 1;
}

// A single event in the stock's timeline
message TimelineEvent {
  string date = 1;              // YYYY-MM-DD
  string type = 2;              // 'announcement' | 'director_trade' | 'news' | 'short_spike'
  string title = 3;
  string detail = 4;
  string url = 5;
  string sentiment = 6;         // for news events; '' otherwise
  bool   is_price_sensitive = 7;
}

message GetStockSignalsRequest {
  string stock_code = 1;
  int32  limit = 2;             // max signals per polarity (default 10)
}

message GetStockSignalsResponse {
  repeated StockSignal adverse = 1;
  repeated StockSignal positive = 2;
}

// A single reputation/risk signal for a stock
message StockSignal {
  string polarity = 1;          // 'adverse' | 'positive'
  string kind = 2;              // 'court' | 'sanction' | 'complaint' | 'award' | 'press' | ...
  string headline = 3;
  string detail = 4;
  string event_date = 5;        // 'YYYY-MM-DD' or 'YYYY'
  string severity = 6;          // 'high' | 'medium' | 'low' (adverse only)
  double confidence = 7;
  repeated string citations = 8;
}

// ── Housing (house-price tracker) ────────────────────────────────────────────

message GetHousingOverviewRequest {
  // Filter to one region_type ('national'|'state'|'gccsa'); empty = all key regions.
  string region_type = 1;
}

// Latest observation for a region × measure with QoQ/YoY change (from mv_housing_headline).
message HousingMetric {
  string region_code = 1;       // 'AUS' | 'NSW' | '1GSYD'
  string region_name = 2;
  string region_type = 3;       // 'national' | 'state' | 'gccsa'
  string state_code = 4;
  string measure = 5;           // 'mean_price' | 'median_price' | 'price_index' | 'debt_to_income'
  string dwelling_type = 6;     // 'all' | 'established_house' | 'attached'
  double value = 7;
  string unit = 8;              // 'AUD' | 'index' | 'ratio'
  google.protobuf.Timestamp period = 9;
  bool is_preliminary = 10;
  double qoq_pct = 11;
  double yoy_pct = 12;
}

message GetHousingOverviewResponse {
  repeated HousingMetric metrics = 1;
  google.protobuf.Timestamp as_of = 2;
}

message GetHousePriceSeriesRequest {
  string region_code = 1;       // 'AUS' | 'NSW' | '1GSYD'
  string measure = 2;           // 'mean_price' | 'median_price' | 'price_index' | 'debt_to_income'
  string dwelling_type = 3;     // optional; default 'all'
}

message HousePricePoint {
  google.protobuf.Timestamp period = 1;
  double value = 2;
  bool is_preliminary = 3;
}

message GetHousePriceSeriesResponse {
  string region_code = 1;
  string region_name = 2;
  string measure = 3;
  string dwelling_type = 4;
  string unit = 5;
  string source = 6;
  string source_licence = 7;
  repeated HousePricePoint points = 8;
}

message ListStateSuburbsRequest {
  string state_code = 1; // 'NSW' | 'VIC' | ... (required)
  string query = 2;      // optional case-insensitive name substring
  int32 limit = 3;       // optional; default 5000
}

// One suburb summary for the map + list (keyed by ABS SAL code).
message SuburbSummary {
  string sal_code = 1;
  string sal_name = 2;
  string state_code = 3;
  string postcode = 4;
  double latest_median_price = 5;            // 0 if no price data
  google.protobuf.Timestamp latest_period = 6;
  double yoy_pct = 7;
  int32  population = 8;
  double median_age = 9;
  double median_weekly_hhd_income = 10;
}

message ListStateSuburbsResponse {
  repeated SuburbSummary suburbs = 1;
}

message GetSuburbProfileRequest {
  string sal_code = 1; // required
}

message SuburbDemographics {
  int32  population = 1;
  double median_age = 2;
  double median_weekly_hhd_income = 3;
  double median_weekly_per_income = 4;
  double median_weekly_rent = 5;
  double median_monthly_mortgage = 6;
  double pct_owned_outright = 7;
  double pct_owned_mortgage = 8;
  double pct_rented = 9;
  int32  dwelling_count = 10;
  int32  census_year = 11;
}

// State + national reference medians for the profile's comparison bars.
message ComparisonBaselines {
  double state_median_price = 1;
  double national_median_price = 2;
  double state_median_weekly_hhd_income = 3;
  double national_median_weekly_hhd_income = 4;
}

message GetSuburbProfileResponse {
  SuburbSummary summary = 1;
  SuburbDemographics demographics = 2;
  ComparisonBaselines baselines = 3;
}
