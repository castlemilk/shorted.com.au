}

// ==================== Weekly Report Messages ====================

// Request for GetWeeklyReport RPC
message GetWeeklyReportRequest {
  string week_slug = 1; // ISO week format: "2026-W06"
}

// Response for GetWeeklyReport RPC
message GetWeeklyReportResponse {
  string week_slug = 1;
  string headline = 2;
  string summary = 3;
  string report_date = 4;     // YYYY-MM-DD of latest trading day in the week
  string previous_date = 5;   // YYYY-MM-DD of previous week's latest trading day
  WeeklyNarrative narrative = 6;
  repeated WeeklyReportStock top_shorted = 7;
  repeated WeeklyReportMover risers = 8;
  repeated WeeklyReportMover fallers = 9;
  repeated WeeklyReportFAQ faqs = 10;
  double quality_score = 11;
  WeeklyMarketStats market_stats = 12;
  repeated WeeklyReportCitation citations = 13;
  repeated WeeklyReportTrendInsight trend_insights = 14;
  repeated WeeklyIndustryStat industry_breakdown = 15;
}

// Narrative sections of the weekly report
message WeeklyNarrative {
  string opening_hook = 1;
  string top_analysis = 2;
  string movers_analysis = 3;
  string industry_analysis = 4;
  string outlook = 5;
}

// A stock entry in the weekly top shorted list
message WeeklyReportStock {
  int32 rank = 1;
  string code = 2;
  string name = 3;
  double short_pct = 4;
  double wow_change = 5; // Week-on-week change in short percentage
  double days_to_cover = 6;    // Reported short shares / 20-day average volume (0 = unknown)
  bool is_new_entrant = 7;     // New to the top 10 this period
  string industry = 8;         // Company industry (hydrated at read time if absent in snapshot)
  repeated double history = 9; // Weekly short % history, oldest first (~13 points)
  string logo_url = 10;        // Company logo icon URL (hydrated at read time)
}

// A mover (riser or faller) in the weekly report
message WeeklyReportMover {
  string code = 1;
  string name = 2;
  double current_pct = 3;
  double previous_pct = 4;
  double change = 5; // Absolute change in short percentage
  double days_to_cover = 6;    // Reported short shares / 20-day average volume (0 = unknown)
  double z_score = 7;          // How unusual this move is vs the stock's own weekly-change history
  int32 streak_weeks = 8;      // Consecutive weeks moving in the same direction
  string industry = 9;         // Company industry (hydrated at read time if absent in snapshot)
  repeated double history = 10; // Weekly short % history, oldest first (~13 points)
  string logo_url = 11;        // Company logo icon URL (hydrated at read time)
  double significance = 12;    // Composite significance score used for ranking movers
}

// FAQ entry in the weekly report
message WeeklyReportFAQ {
  string question = 1;
  string answer = 2;
}

// Aggregate market statistics for the week
message WeeklyMarketStats {
  int32 total_stocks_shorted = 1;
  double avg_short_pct = 2;
  double max_short_pct = 3;
  string max_short_code = 4;
  double wow_avg_change = 5; // Week-on-week change in average short %
  double median_short_pct = 6;
  int32 stocks_above_10pct = 7; // Count of stocks with short interest >= 10%
  int32 stocks_above_5pct = 8;  // Count of stocks with short interest >= 5%
  int32 riser_count = 9;        // Market-wide count of stocks whose short % rose
  int32 faller_count = 10;      // Market-wide count of stocks whose short % fell
}

// Aggregate short interest by industry for the report period
message WeeklyIndustryStat {
  string industry = 1;
  double avg_short_pct = 2;   // Average short % across stocks in the industry
  double wow_change = 3;      // Change in the industry average vs the prior period
  int32 stock_count = 4;      // Number of shorted stocks in the industry
  string top_stock_code = 5;  // Most shorted stock in the industry
  double top_stock_pct = 6;   // Its short %
}

// A citation referencing a data source in the weekly report narrative
message WeeklyReportCitation {
  string id = 1;      // e.g., "ref-1"
  string source = 2;  // e.g., "BHP H1 FY2025 Results"
  string date = 3;
  string url = 4;
  string type = 5;    // "financial_report", "announcement", "asic_data", "price_data"
}

// Structured trend insight for a riser or faller
message WeeklyReportTrendInsight {
  string code = 1;
  string direction = 2;          // "riser" or "faller"
  double short_change = 3;
  string price_pattern = 4;      // "contrarian", "momentum", "covering", "unwinding"
  double weekly_price_change = 5;
  string composite_signal = 6;
  repeated string key_announcements = 7;
  repeated string financial_signals = 8;
}

// Request for ListReports RPC
message ListReportsRequest {
  string report_type = 1; // "weekly", "monthly", "yearly", or "" / "all" for all types
  int32 limit = 2;        // Max reports to return (default 24, max 100)
}

// Response for ListReports RPC
message ListReportsResponse {
  repeated ReportListItem reports = 1;
}

// Summary of a published report for archive/index pages
message ReportListItem {
  string slug = 1;              // "2026-W06", "2026-01", or "2025"
  string report_type = 2;       // "weekly", "monthly", "yearly"
  string headline = 3;
  string summary = 4;
  string report_date = 5;       // YYYY-MM-DD of latest trading day in the period
  double max_short_pct = 6;
  string max_short_code = 7;
  int32 total_stocks_shorted = 8;
  double quality_score = 9;
  repeated string top_codes = 10;     // Top shorted stock codes (up to 5)
  repeated string top_logo_urls = 11; // Matching logo icon URLs (parallel to top_codes, "" when unknown)
}

// ==================== Financial Highlights Messages ====================

// Request for GetStockFinancialHighlights RPC
message GetStockFinancialHighlightsRequest {
  repeated string stock_codes = 1; // ASX stock codes (e.g., ["DMP", "BHP"])
  int32 max_reports_per_stock = 2; // Max reports to return per stock (default 2)
}

// Response for GetStockFinancialHighlights RPC
message GetStockFinancialHighlightsResponse {
  map<string, StockFinancialHighlights> highlights = 1; // stock_code → highlights
}

// Financial highlights for a single stock
message StockFinancialHighlights {
  repeated FinancialReportHighlight reports = 1;
}

// Extracted financial data from a single report
message FinancialReportHighlight {
  string report_title = 1;
  string report_type = 2;  // e.g., "annual_results", "half_year_results"
  string report_date = 3;  // YYYY-MM-DD
  repeated FinancialMetric metrics = 4;
  string digest = 5;      // compressed Flash-distilled summary of the report
  double confidence = 6;  // digest confidence 0.0-1.0
}

// A single extracted financial metric
message FinancialMetric {
  string metric_type = 1;   // e.g., "revenue", "net_profit", "eps", "dividend"
  string source_text = 2;   // Original text from the report
  map<string, string> attributes = 3; // e.g., {"value_millions": "5142", "period": "H1 FY2025"}
}

// ==================== News Messages ====================

// A single news article
message NewsArticle {
  string id = 1;
  string stock_code = 2;
  string source = 3;              // 'asx', 'stockhead', 'livewire', 'afr'
  string headline = 4;
  string url = 5;
  google.protobuf.Timestamp published_at = 6;
  string sentiment = 7;           // 'positive', 'negative', 'neutral'
  double relevance_score = 8;
  bool is_price_sensitive = 9;
  string summary = 10;
  repeated string tags = 11;
  string image_url = 12;          // Hero image from RSS or scraped og:image
  int32 syndication_count = 13;          // total cluster size INCLUDING this article (1 = unsyndicated); syndicated_sources excludes self, so len(sources) == count-1
  repeated string syndicated_sources = 14; // OTHER mastheads carrying this story (self excluded)
}

// Request for GetStockNews RPC
message GetStockNewsRequest {
  string stock_code = 1;          // ASX stock code (e.g., "BHP")
  int32 limit = 2;                // Max articles to return (default 20)
  string source = 3;              // Optional filter by source
  string sentiment = 4;           // Optional filter by sentiment
}

// Response for GetStockNews RPC
message GetStockNewsResponse {
  repeated NewsArticle articles = 1;
  int32 total_count = 2;
}

// Request for GetRelatedNews RPC
message GetRelatedNewsRequest {
  string stock_code = 1;          // ASX stock code (e.g., "BHP")
  string article_id = 2;          // Optional anchor article id; if empty, uses the stock's latest article
  int32 limit = 3;                // Max related articles to return (default 6)
}

// Response for GetRelatedNews RPC
message GetRelatedNewsResponse {
  repeated NewsArticle articles = 1;   // ordered nearest-first by semantic similarity
}

// Request for GetMarketNews RPC
message GetMarketNewsRequest {
  int32 limit = 1;                // Max articles to return (default 50)
  string source = 2;              // Optional filter by source
  bool price_sensitive_only = 3;  // Only return price-sensitive news
}

// Response for GetMarketNews RPC
message GetMarketNewsResponse {
  repeated NewsArticle articles = 1;
  int32 total_count = 2;
}

// ==================== Editorial Take Messages ====================

// A single Shorted Take editorial article (Gemini-generated commentary
// on a price-sensitive news headline).
message EditorialTake {
  string id = 1;
  string slug = 2;
  string headline = 3;
  string stock_code = 4;
  string body_md = 5;             // Markdown body
  string sentiment = 6;
  string source_article_id = 7;   // UUID of source news_article, or empty
  string source_url = 8;          // External publisher URL (attribution)
  string source_name = 9;         // 'Stockhead', 'Motley Fool', etc.
  string og_image_url = 10;
  int32 word_count = 11;
  string model = 12;              // 'gemini-2.0-flash', etc.
  google.protobuf.Timestamp published_at = 13;
  google.protobuf.Timestamp created_at = 14;
  string hero_image_url = 15;
  repeated InlineImage inline_images = 16;
  google.protobuf.Timestamp tweet_published_at = 17;
  repeated TakeCitation citations = 18;
  repeated LayoutImage layout_images = 19;
  string body_format = 20;    // 'markdown' | 'mdx'
  string standfirst = 21;     // one-sentence dek under the headline
  string byline = 22;         // e.g. "The Shorted Desk — Mining & Resources"
  string hero_caption = 23;
  string hero_credit = 24;    // e.g. "AI-generated illustration"
}

// A single cited source referenced by a [ref-N] marker in body_md.
message TakeCitation {
  string ref_id = 1;          // "ref-1", "ref-2", …
  string url = 2;
  string source = 3;          // 'stockhead', 'motleyfool', etc.
  string headline = 4;
  string date = 5;            // YYYY-MM-DD
  string type = 6;            // 'news' | 'trade' | 'data'
}

// Inline image embedded in a Take body.
message InlineImage {
  string url = 1;
  string topic = 2;   // editorial brief the image was generated from
  string alt = 3;     // accessible alt text
}

// An art-directed layout image with style/ratio/placement for bespoke
// editorial rendering. Stored in editorial_takes.layout_images.
message LayoutImage {
  string url = 1;
  string style = 2;              // documentary | aerial | still_life | isometric | archival | abstract | environmental
  string ratio = 3;              // landscape | portrait | square
  string brief = 4;              // subject the image was generated from
  string caption = 5;            // editorial caption
  string placement = 6;          // full | left | right | inset
  int32 anchor_after_block = 7;  // render after this 0-based body block
}

message GetEditorialTakeRequest {
  string slug = 1;
}

message GetEditorialTakeResponse {
  EditorialTake take = 1;
}

message ListEditorialTakesRequest {
  int32 limit = 1;         // default 20
  int32 offset = 2;
  string stock_code = 3;   // optional filter
}

message ListEditorialTakesResponse {
  repeated EditorialTake takes = 1;
  int32 total_count = 2;
}

// ===== Admin =====

enum TakeStatus {
  TAKE_STATUS_UNSPECIFIED = 0;
  TAKE_STATUS_DRAFT = 1;        // published_at IS NULL
  TAKE_STATUS_PUBLISHED = 2;    // published_at IS NOT NULL, tweet_published_at IS NULL
  TAKE_STATUS_TWEETED = 3;      // both timestamps set
}

message ListEditorialTakesAdminRequest {
  int32 limit = 1;
  int32 offset = 2;
  TakeStatus status_filter = 3; // optional
}

message ListEditorialTakesAdminResponse {
  repeated EditorialTake takes = 1;
  int32 total_count = 2;
}

message PublishEditorialTakeRequest { string slug = 1; }
message PublishEditorialTakeResponse { EditorialTake take = 1; }

message UpdateEditorialTakeRequest {
  string slug = 1;
  // Each optional field is applied only if non-empty.
  string body_md = 2;
  string headline = 3;
  string hero_image_url = 4;
  string sentiment = 5;
}
message UpdateEditorialTakeResponse { EditorialTake take = 1; }

message DeleteEditorialTakeRequest { string slug = 1; }
message DeleteEditorialTakeResponse { bool deleted = 1; }

message MarkTakeTweetPublishedRequest { string slug = 1; }
message MarkTakeTweetPublishedResponse { EditorialTake take = 1; }

message ListTweetPublishQueueRequest { int32 limit = 1; }
message ListTweetPublishQueueResponse { repeated EditorialTake takes = 1; }

