message GetIndustryIntelligenceRequest {
  string industry = 1;    // optional exact industry filter
  int32 record_limit = 2; // default 50, maximum 200
  string stock_code = 3;  // optional exact stock filter (per-stock evidence dossier)
}

message IndustryIntelligenceSource {
  string source_key = 1;
  string display_name = 2;
  string signal_kind = 3;
  string publisher = 4;
  string source_url = 5;
  string licence = 6;
  string cadence = 7;
}

message IndustryIntelligenceRecord {
  string source_key = 1;
  string source_record_id = 2;
  string signal_kind = 3;
  string industry = 4;
  string stock_code = 5;
  string entity_abn = 6;
  string metric_key = 7;
  string metric_label = 8;
  bool has_metric_value = 9;
  double metric_value = 10;
  string unit = 11;
  string period_start = 12; // YYYY-MM-DD when present
  string period_end = 13;   // YYYY-MM-DD when present
  string as_of = 14;        // YYYY-MM-DD
  string title = 15;
  string summary = 16;
  string source_url = 17;
  double confidence = 18;
}

// Aggregated evidence per Australian financial year for one metric of one
// public-enabled source. Powers the industry intelligence dashboard charts
// without shipping every underlying record.
message IndustryIntelligenceTimeBucket {
  string signal_kind = 1;
  string source_key = 2;
  string metric_key = 3;
  string metric_label = 4;
  string unit = 5;
  string bucket_label = 6;      // e.g. "2023-24" (Australian financial year)
  string bucket_start = 7;      // YYYY-MM-DD (1 July opening the financial year)
  double total_value = 8;
  int32 record_count = 9;
  int32 entity_count = 10;      // distinct matched stock codes in the bucket
  int32 zero_value_count = 11;  // records reporting a genuine zero value
}

// Total per matched entity for one metric of one public-enabled source,
// ranked by total value (top entities only).
message IndustryIntelligenceEntityTotal {
  string signal_kind = 1;
  string source_key = 2;
  string metric_key = 3;
  string stock_code = 4;
  string entity_label = 5;
  string unit = 6;
  double total_value = 7;
  int32 record_count = 8;
  string latest_as_of = 9; // YYYY-MM-DD
}

message GetIndustryIntelligenceResponse {
  string industry = 1;
  repeated IndustryIntelligenceSource sources = 2;
  repeated IndustryIntelligenceRecord records = 3;
  string source_attribution = 4;
  google.protobuf.Timestamp generated_at = 5;
  repeated IndustryIntelligenceTimeBucket time_buckets = 6;
  repeated IndustryIntelligenceEntityTotal entity_totals = 7;
}

// ==================== Short Campaign Scoreboard Messages ====================

// Request for GetShortCampaignScoreboard RPC
message GetShortCampaignScoreboardRequest {
  int32 limit = 1;
  int32 offset = 2;
  string industry = 3; // optional exact industry filter
}

// A historic short campaign: the peak short position and what the price did after
message ShortCampaign {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  string logo_url = 4;
  string peak_date = 5;      // YYYY-MM-DD
  double peak_short_pct = 6;
  double price_at_peak = 7;  // 0 when unknown
  double price_3m_after = 8; // meaningful only when has_3m
  double price_6m_after = 9; // meaningful only when has_6m
  double return_3m = 10;     // percent price change 3 months after the peak
  double return_6m = 11;     // percent price change 6 months after the peak
  bool has_3m = 12;          // enough price history to score the 3-month outcome
  bool has_6m = 13;          // enough price history to score the 6-month outcome
  bool shorts_won_3m = 14;   // price fell 3 months after the peak
  bool shorts_won_6m = 15;   // price fell 6 months after the peak
  double current_short_pct = 16;
  double latest_price = 17;
}

// Response for GetShortCampaignScoreboard RPC
message GetShortCampaignScoreboardResponse {
  repeated ShortCampaign campaigns = 1;
  int32 total_count = 2;          // campaigns matching the filter
  int32 campaigns_total = 3;      // campaigns considered for the win-rate stats
  double shorts_win_rate_3m = 4;  // percent (0-100) of scored campaigns where the price fell after 3 months
  double shorts_win_rate_6m = 5;  // percent (0-100) of scored campaigns where the price fell after 6 months
}

