syntax = "proto3";

package shorts.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/shorts/v1alpha1;shortsv1alpha1";

import "google/api/annotations.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/timestamp.proto";
import "stocks/v1alpha1/stocks.proto";
import "options/v1/options.proto";

option (gnostic.openapi.v3.document) = {
  info: {
    title: "Shorted API"
    version: "v1"
    description: "Shorted API's"
    contact: {
      url: "shorted.com.au"
      email: "support@shorted.com.au"
    }
    license: {
      name: "Proprietary license"
      url: "https://shorted.com.au/terms"
    }
  }
  servers: [{
    url: "https://api.shorted.com.au"
  }]
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "AuthToken"
          value: {
            security_scheme: {
              type: "http"
              scheme: "bearer"
            }
          }
        }
      ]
    }
  }
};
service ShortedStocksService {
  option (google.api.default_host) = "api.shorted.com.au";
  
  // Shows top 10 short positions on the ASX over different periods of time.
  rpc GetTopShorts (GetTopShortsRequest) returns (GetTopShortsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (google.api.method_signature) = "period,limit,offset";
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Get Top Shorts",
      description: "Retrieve the top shorted stocks on the ASX for a given time period. Supports pagination and custom limits.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "A successful response containing time series data for the top shorted stocks."
            }
          }
        },
        response_or_reference: {
          name: "400"
          value: {
            response: {
              description: "Invalid request parameters provided."
            }
          }
        }
      }
    };
  }

  // Get Industry TreeMap for short positions.
  rpc GetIndustryTreeMap(GetIndustryTreeMapRequest) returns (stocks.v1alpha1.IndustryTreeMap) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Get Industry TreeMap",
      description: "Retrieve a hierarchical treemap of short positions grouped by industry. Useful for visualizing market-wide shorting trends.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "A successful response containing industry-grouped short position data."
            }
          }
        },
        response_or_reference: {
          name: "400"
          value: {
            response: {
              description: "Invalid request parameters."
            }
          }
        }
      }
    };
  }

  // Provides an overview of a specific stock based on PRODUCT_CODE.
  rpc GetStock (GetStockRequest) returns (stocks.v1alpha1.Stock) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Get Stock Summary",
      description: "Retrieve a summary of current short positions and basic metadata for a specific stock by its ASX code.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "A successful response containing the stock summary."
            }
          }
        },
        response_or_reference: {
          name: "404"
          value: {
            response: {
              description: "The specified stock code was not found."
            }
          }
        }
      }
    };
  }

  // Provides a more in-depth breakdown of a particular stock's metadata.
  rpc GetStockDetails (GetStockDetailsRequest) returns (stocks.v1alpha1.StockDetails) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Get Stock Details",
      description: "Retrieve comprehensive metadata for a specific stock, including company history, key people, and financial reports.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "A successful response containing detailed stock information."
            }
          }
        },
        response_or_reference: {
          name: "404"
          value: {
            response: {
              description: "The specified stock details were not found."
            }
          }
        }
      }
    };
  }

  // fetch time series data for a specific stock
  rpc GetStockData (GetStockDataRequest) returns (stocks.v1alpha1.TimeSeriesData) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Get Stock Time Series Data",
      description: "Retrieve historical short position data for a specific stock over a defined time period.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "A successful response containing historical time series points."
            }
          }
        },
        response_or_reference: {
          name: "401"
          value: {
            response: {
              description: "Authentication is required to access private time series data."
            }
          }
        }
      }
    };
  }
  
  // Get all short positions for a specific trading date
  rpc GetMarketByDate (GetMarketByDateRequest) returns (GetMarketByDateResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Market By Date",
      description: "Retrieve all short positions for a specific trading date from ASIC data."
    };
  }

  // Get available trading dates for market snapshots
  rpc GetAvailableDates (GetAvailableDatesRequest) returns (GetAvailableDatesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Available Dates",
      description: "Retrieve available trading dates with short position data."
    };
  }

  // Search stocks by symbol or company name
  rpc SearchStocks (SearchStocksRequest) returns (SearchStocksResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Search Stocks",
      description: "Search for ASX stocks using full-text search against their ticker symbol or company name.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "A list of matching stocks."
            }
          }
        }
      }
    };
  }

  // Get sync status for admin dashboard
  rpc GetSyncStatus (GetSyncStatusRequest) returns (GetSyncStatusResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Get Sync Status",
      description: "Administrative endpoint to retrieve the status and history of data synchronization tasks. Requires admin role.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "Recent sync run history."
            }
          }
        },
        response_or_reference: {
          name: "403"
          value: {
            response: {
              description: "Forbidden: Admin role is required."
            }
          }
        }
      }
    };
  }

  // Mint an API token for the user. Requires valid authentication.
  rpc MintToken (MintTokenRequest) returns (MintTokenResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Mint API Token",
      description: "Generate a bespoke API token for programmatic access to Shorted APIs. Requires valid session authentication.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "A new API token."
            }
          }
        },
        response_or_reference: {
          name: "401"
          value: {
            response: {
              description: "Unauthorized: User must be signed in."
            }
          }
        }
      }
    };
  }

  // Trigger key metrics sync for specific stocks. Admin only.
  rpc SyncKeyMetrics (SyncKeyMetricsRequest) returns (SyncKeyMetricsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
    option (gnostic.openapi.v3.operation) = {
      deprecated: false,
      summary: "Sync Key Metrics",
      description: "Trigger on-demand sync of key metrics (market cap, P/E ratio, etc.) for specific stocks. Fetches fresh data from Yahoo Finance. Admin only.",
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "Sync completed successfully."
            }
          }
        },
        response_or_reference: {
          name: "403"
          value: {
            response: {
              description: "Forbidden: Admin role required."
            }
          }
        }
      }
    };
  }

  // Trigger enrichment for a specific stock. Admin only.
  // Returns enrichment data for review before applying to company-metadata.
  rpc EnrichStock (EnrichStockRequest) returns (EnrichStockResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
  }

  // Get top stocks for enrichment batching/prioritization. Admin only.
  rpc GetTopStocksForEnrichment (GetTopStocksForEnrichmentRequest) returns (GetTopStocksForEnrichmentResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
  }

  // List pending enrichments awaiting review. Admin only.
  rpc ListPendingEnrichments (ListPendingEnrichmentsRequest) returns (ListPendingEnrichmentsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
  }

  // Get a specific pending enrichment by ID. Admin only.
  rpc GetPendingEnrichment (GetPendingEnrichmentRequest) returns (GetPendingEnrichmentResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
  }

  // Approve or reject a pending enrichment. Admin only.
  rpc ReviewEnrichment (ReviewEnrichmentRequest) returns (ReviewEnrichmentResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
  }

  // Get enrichment job status by job ID. Admin only.
  rpc GetEnrichmentJobStatus (GetEnrichmentJobStatusRequest) returns (GetEnrichmentJobStatusResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
  }

  // List enrichment jobs with optional status filter. Admin only.
  rpc ListEnrichmentJobs (ListEnrichmentJobsRequest) returns (ListEnrichmentJobsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
    option (shortedapi.options.v1.required_role) = "admin";
  }

  // ==================== Subscription Management ====================

  // Internal API for Stripe webhook: handle checkout completion (server-to-server only)
  rpc HandleStripeCheckoutCompleted (HandleStripeCheckoutCompletedRequest) returns (HandleStripeCheckoutCompletedResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Internal API for Stripe webhook: handle subscription updates (server-to-server only)
  rpc HandleStripeSubscriptionUpdated (HandleStripeSubscriptionUpdatedRequest) returns (HandleStripeSubscriptionUpdatedResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Get the current user's subscription status. Requires authentication.
  rpc GetMySubscription (GetMySubscriptionRequest) returns (GetMySubscriptionResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Create a premium short-interest alert monitor for the current user.
  rpc CreateAlertMonitor (CreateAlertMonitorRequest) returns (CreateAlertMonitorResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // List short-interest alert monitors for the current user.
  rpc ListAlertMonitors (ListAlertMonitorsRequest) returns (ListAlertMonitorsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Get a weekly short report with narrative analysis
  rpc GetWeeklyReport (GetWeeklyReportRequest) returns (GetWeeklyReportResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Weekly Report",
      description: "Retrieve a weekly short selling report with narrative analysis, top shorted stocks, and biggest movers."
    };
  }

  // List published short selling reports (weekly, monthly, yearly)
  rpc ListReports (ListReportsRequest) returns (ListReportsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "List Reports",
      description: "List published short selling reports with headlines and summary stats, most recent first."
    };
  }

  // Get extracted financial highlights for specific stocks
  rpc GetStockFinancialHighlights (GetStockFinancialHighlightsRequest) returns (GetStockFinancialHighlightsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Stock Financial Highlights",
      description: "Retrieve extracted financial metrics (revenue, NPAT, EPS, dividends, etc.) from company financial reports."
    };
  }

  // ==================== News ====================

  // Get recent news articles for a specific stock
  rpc GetStockNews (GetStockNewsRequest) returns (GetStockNewsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Stock News",
      description: "Retrieve recent news articles, announcements, and analysis for a specific ASX stock."
    };
  }

  // Get news semantically related to a stock (or to a specific article)
  rpc GetRelatedNews (GetRelatedNewsRequest) returns (GetRelatedNewsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Related News",
      description: "Retrieve news articles semantically related to a stock or a given article, via vector similarity."
    };
  }

  // Get market-wide news across all stocks
  rpc GetMarketNews (GetMarketNewsRequest) returns (GetMarketNewsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Market News",
      description: "Retrieve recent market-wide news articles and announcements across all ASX stocks."
    };
  }

  // ==================== Editorial Takes (Shorted Take) ====================

  // Get a single published editorial take by slug.
  rpc GetEditorialTake (GetEditorialTakeRequest) returns (GetEditorialTakeResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Editorial Take",
      description: "Retrieve a published Shorted Take by URL slug."
    };
  }

  // List recent published editorial takes (paginated).
  rpc ListEditorialTakes (ListEditorialTakesRequest) returns (ListEditorialTakesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "List Editorial Takes",
      description: "List recent published Shorted Takes, newest first. Optional filter by stock code."
    };
  }

  // Admin: list all takes including drafts (admin-gated).
  rpc ListEditorialTakesAdmin (ListEditorialTakesAdminRequest) returns (ListEditorialTakesAdminResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Admin: publish a draft take (sets published_at = NOW()).
  rpc PublishEditorialTake (PublishEditorialTakeRequest) returns (PublishEditorialTakeResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Admin: partial update of a take's editable fields.
  rpc UpdateEditorialTake (UpdateEditorialTakeRequest) returns (UpdateEditorialTakeResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Admin: hard delete a take.
  rpc DeleteEditorialTake (DeleteEditorialTakeRequest) returns (DeleteEditorialTakeResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Admin: mark a take as tweet-published (called by the bot worker).
  rpc MarkTakeTweetPublished (MarkTakeTweetPublishedRequest) returns (MarkTakeTweetPublishedResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Admin: list takes in the tweet publish queue (published_at IS NOT NULL,
  // tweet_published_at IS NULL). Used by the bot worker.
  rpc ListTweetPublishQueue (ListTweetPublishQueueRequest) returns (ListTweetPublishQueueResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // ==================== Director Trades ====================

  // Get director (insider) trades for a specific stock
  rpc GetDirectorTrades (GetDirectorTradesRequest) returns (GetDirectorTradesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Director Trades",
      description: "Retrieve director (insider) trading activity from ASX Appendix 3Y filings for a specific stock."
    };
  }

  // ==================== Dividend History ====================

  // Get dividend history for a specific stock
  rpc GetDividendHistory (GetDividendHistoryRequest) returns (GetDividendHistoryResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Dividend History",
      description: "Retrieve dividend payment history including franking credits for a specific ASX stock."
    };
  }

  // ==================== Peer Comparison ====================

  // Get peer comparison for a stock within its industry
  rpc GetPeerComparison (GetPeerComparisonRequest) returns (GetPeerComparisonResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Peer Comparison",
      description: "Compare a stock's short position, price, and fundamentals against its industry peers."
    };
  }

  // ==================== Stock Screener ====================

  // Screen stocks using compound filters across shorts, price, fundamentals, director trades, and news
  rpc ScreenStocks (ScreenStocksRequest) returns (ScreenStocksResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Screen Stocks",
      description: "Filter and sort stocks using compound criteria across short positions, price changes, fundamentals, director trades, and news sentiment."
    };
  }

  // ==================== Battleground Stocks ====================

  // Get squeeze-radar and battleground (price up + shorts building) ranked stocks
  rpc GetBattlegroundStocks (GetBattlegroundStocksRequest) returns (GetBattlegroundStocksResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (google.api.http) = {
      post: "/v1/battlegrounds"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Battleground Stocks",
      description: "Rank stocks by squeeze risk (days-to-cover, short interest, crowding, momentum) or by bull-vs-bear divergence (price rising while shorts build)."
    };
  }

  // ==================== Bear/Bull Verdict ====================

  // Get a composite bear-vs-bull verdict for a single stock
  rpc GetStockVerdict (GetStockVerdictRequest) returns (GetStockVerdictResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (google.api.http) = {
      post: "/v1/stockVerdict"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Stock Verdict",
      description: "Composite bear-vs-bull verdict (-100..100) for a single stock, combining short-position trend and level, director trading, news sentiment, and squeeze pressure — with a per-component breakdown."
    };
  }

  // ==================== Short Seller Scoreboard ====================

  // Get the short-seller scoreboard: historic short campaigns and whether shorts won
  rpc GetShortCampaignScoreboard (GetShortCampaignScoreboardRequest) returns (GetShortCampaignScoreboardResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (google.api.http) = {
      post: "/v1/shortCampaignScoreboard"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Short Campaign Scoreboard",
      description: "Historic short campaigns (peak short interest >= 5% over the last 3 years) with price outcomes 3 and 6 months after the peak, and overall short-seller win rates."
    };
  }

  // ==================== Stock Graph ====================

  // Get a stock's people (with their other companies) and narrative-similar companies
  rpc GetStockGraph (GetStockGraphRequest) returns (GetStockGraphResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Stock Graph",
      description: "Retrieve a stock's connected people (directors/officers and their other ASX roles) and semantically similar companies via vector similarity."
    };
  }

  // ==================== Event Timeline ====================

  // Get a chronological feed of events for a stock (announcements, director trades, news, short spikes)
  rpc GetEventTimeline (GetEventTimelineRequest) returns (GetEventTimelineResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Event Timeline",
      description: "Retrieve a chronological feed of events for a stock, merging ASX announcements, director trades, price-sensitive news, and short position spikes."
    };
  }

  // ==================== Risk / Reputation Signals ====================

  // Get a stock's reputation/risk signals (adverse: court/sanctions/complaints; positive: awards/press)
  rpc GetStockSignals (GetStockSignalsRequest) returns (GetStockSignalsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Stock Signals",
      description: "Retrieve a stock's reputation/risk signals — adverse (court matters, regulator sanctions, complaints) and positive (awards, press), each with citations, severity and confidence. Sourced from grounded web research."
    };
  }

  // Latest house-price headline metrics by region (national/state/capital city).
  rpc GetHousingOverview (GetHousingOverviewRequest) returns (GetHousingOverviewResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Housing Overview",
      description: "Latest Australian house-price headline metrics by region (national, state, capital city) — mean/median price and price index with QoQ and YoY change. Sourced from the ABS Data API and RBA."
    };
  }

  // A single house-price time series for a region and measure.
  rpc GetHousePriceSeries (GetHousePriceSeriesRequest) returns (GetHousePriceSeriesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get House Price Series",
      description: "A single house-price time series for a region and measure (national mean price, capital-city median, household debt-to-income, price index), quarterly."
    };
  }

  // List all suburbs in a state with latest median price + key demographics.
  rpc ListStateSuburbs (ListStateSuburbsRequest) returns (ListStateSuburbsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "List State Suburbs",
      description: "Every suburb (ABS SAL) in a state with its latest median house price and key ABS Census demographics — powers the state choropleth + suburb list."
    };
  }

  // Full per-suburb profile: identity, demographics, headline price, comparison baselines.
  rpc GetSuburbProfile (GetSuburbProfileRequest) returns (GetSuburbProfileResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Suburb Profile",
      description: "A single suburb's rich profile — ABS Census demographics, latest median house price with QoQ/YoY, and state/national comparison baselines."
    };
  }

  // List house-price regions (suburbs/LGAs/etc) for the suburb explorer.
  rpc ListHousingRegions (ListHousingRegionsRequest) returns (ListHousingRegionsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "List Housing Regions",
      description: "List house-price regions, optionally filtered by region_type, state, or a name query — powers the suburb explorer. Suburb medians are sourced from state Valuer-General offices (CC BY)."
    };
  }

  // Suburbs ranked by recent for-sale asking-price drops.
  rpc ListSuburbPriceDrops (ListSuburbPriceDropsRequest) returns (ListSuburbPriceDropsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "List Suburb Price Drops",
      description: "Suburbs ranked by recent for-sale asking-price reductions over a rolling window — count of reduced listings plus the average, median and largest reduction. A derived aggregate over realestate.com.au / domain.com.au listing data; individual listings are not republished."
    };
  }

  // Individual recently-reduced listings for a suburb, deep-linking to the portal.
  rpc ListSuburbDropListings (ListSuburbDropListingsRequest) returns (ListSuburbDropListingsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (gnostic.openapi.v3.operation) = {
      summary: "List Suburb Drop Listings",
      description: "Recently price-reduced for-sale listings in a suburb, each deep-linking OUT to the live realestate.com.au / domain.com.au page. Factual price-change data only; the listing itself is not reproduced."
    };
  }

  // ==================== Corporate Tax (Influence layer) ====================

  // Get an ASX-listed entity's annual corporate-tax profile (ATO transparency data).
  rpc GetCompanyTaxProfile (GetCompanyTaxProfileRequest) returns (GetCompanyTaxProfileResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (google.api.http) = {
      post: "/v1/companyTaxProfile"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Company Tax Profile",
      description: "An ASX-listed entity's annual corporate-tax profile from the ATO Corporate Tax Transparency dataset (total income, taxable income, tax payable per income year). Entities are matched to ASX codes only on exact ABN or exact normalized-name mapping. Nil/absent taxable income or tax payable is meaningful and often legitimate (losses/offsets) — total income is always reported."
    };
  }

  // Get imported, cited industry intelligence facts for an industry.
  rpc GetIndustryIntelligence (GetIndustryIntelligenceRequest) returns (GetIndustryIntelligenceResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
    option (google.api.http) = {
      post: "/v1/industryIntelligence"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Industry Intelligence",
      description: "Imported, cited industry intelligence records for a Shorted industry. Only public-enabled sources and exact-reviewed records are returned."
    };
  }
}

message MintTokenRequest {
}

message MintTokenResponse {
  string token = 1;
}

// Request for Top10 RPC, specifying the period of time.
message GetTopShortsRequest {
  string period = 1;
  int32 limit = 2;
  int32 offset = 3;
  // When true, returns only product code, name, and latest short position
  // without time series points. Much faster and smaller response.
  bool summary_only = 4;
  // Optional explicit set of product codes to return time series for, INSTEAD
  // of the top-`limit` ranking. Lets callers that already know which stocks
  // they need (e.g. industry-crowding constituents) fetch just those series
  // rather than every top-N stock's points. Ignored when empty. When set with
  // summary_only=false, `limit`/`offset` are not applied to the code set.
  repeated string product_codes = 5;
}

// Request for Top10 RPC, specifying the period of time.
message GetIndustryTreeMapRequest {
  // time over which to look at the max value
  string period = 1;
  // number of stocks to return for each parent
  int32 limit = 2;
  
  ViewMode view_mode = 3;
}

enum ViewMode {
   // return the current/latest short positions
   CURRENT_CHANGE = 0;
   // return the percentage change in short positions
   PERCENTAGE_CHANGE = 1;
}

// Response for Top10 RPC, including time series data for each of the top 10 short positions.
message GetTopShortsResponse {
  repeated stocks.v1alpha1.TimeSeriesData time_series = 1;
  int32 offset = 2;
}

// Request for GetStockSummary RPC, specifying the product code.
message GetStockRequest {
  string product_code = 1;
}

// Request for GetStockDetails RPC, specifying the product code.
message GetStockDetailsRequest {
  string product_code = 1;
}

// Request for GetStockDataRequest RPC, specifying the product code.
message GetStockDataRequest {
  string product_code = 1;
  string period = 2;
}

// Request for SearchStocks RPC, specifying the search query.
message SearchStocksRequest {
  string query = 1;           // Search query (symbol or company name)
  int32 limit = 2;           // Maximum number of results to return (default: 50)
  bool include_details = 3;  // Whether to include detailed stock information
}

// Response for SearchStocks RPC, containing matching stocks.
message SearchStocksResponse {
  string query = 1;                    // The search query used
  repeated stocks.v1alpha1.Stock stocks = 2;  // Matching stocks
  int32 count = 3;                     // Number of results returned
}

// Request for GetSyncStatus RPC
message GetSyncStatusRequest {
  int32 limit = 1; // Number of past runs to return (default: 10)
}

// Response for GetSyncStatus RPC
message GetSyncStatusResponse {
  repeated SyncRun runs = 1;
}

// Represents a single sync run execution
message SyncRun {
  string run_id = 1;
  string started_at = 2;
  string completed_at = 3;
  string status = 4;
  string error_message = 5;
  int32 shorts_records_updated = 6;
  int32 prices_records_updated = 7;
  int32 metrics_records_updated = 8;
  int32 algolia_records_synced = 9;
  double total_duration_seconds = 10;
  string environment = 11;
  string hostname = 12;
  
  // Checkpoint tracking
  int32 checkpoint_stocks_total = 13;
  int32 checkpoint_stocks_processed = 14;
  int32 checkpoint_stocks_successful = 15;
  int32 checkpoint_stocks_failed = 16;
}

// Request for SyncKeyMetrics RPC
message SyncKeyMetricsRequest {
  repeated string stock_codes = 1; // Stock codes to sync (e.g., ["CVN", "CBA"]). Empty = sync all.
  bool force = 2; // Force sync even if recently updated (default: false)
}

// Response for SyncKeyMetrics RPC
message SyncKeyMetricsResponse {
  int32 total_requested = 1;
  int32 successfully_synced = 2;
  int32 failed = 3;
  repeated StockSyncResult results = 4;
  double duration_seconds = 5;
}

// Result for a single stock sync
message StockSyncResult {
  string stock_code = 1;
  bool success = 2;
  string error_message = 3;
  KeyMetricsData metrics = 4; // The synced metrics if successful
}

// Key metrics data structure
message KeyMetricsData {
  double market_cap = 1;
  double pe_ratio = 2;
  double eps = 3;
  double dividend_yield = 4;
  double beta = 5;
  double fifty_two_week_high = 6;
  double fifty_two_week_low = 7;
  double avg_volume = 8;
}

// Enrichment request
message EnrichStockRequest {
  string stock_code = 1; // Stock code to enrich (e.g., "CBA")
  bool force = 2; // If true, re-enrich even if already enriched
}

// Enrichment response with job ID (async processing)
message EnrichStockResponse {
  string stock_code = 1;
  string job_id = 2; // Job ID for tracking async enrichment
  string message = 3; // Status message
}

// Enrichment status
enum EnrichmentStatus {
  ENRICHMENT_STATUS_UNSPECIFIED = 0;
  ENRICHMENT_STATUS_PENDING_REVIEW = 1; // Enrichment completed, awaiting review
  ENRICHMENT_STATUS_COMPLETED = 2; // Approved and saved
  ENRICHMENT_STATUS_FAILED = 3; // Enrichment failed
  ENRICHMENT_STATUS_REJECTED = 4; // Rejected during review
}

// Enrichment data structure
message EnrichmentData {
  string enhanced_summary = 1;
  string company_history = 2;
  repeated stocks.v1alpha1.CompanyPerson key_people = 3;
  repeated stocks.v1alpha1.FinancialReport financial_reports = 4;
  string competitive_advantages = 5;
  repeated string risk_factors = 6;
  string recent_developments = 7;
  stocks.v1alpha1.SocialMediaLinks social_media_links = 8;
  repeated string tags = 9;
  // Logo URLs (staged for review, applied on approval)
  string logo_gcs_url = 10;           // Full logo PNG URL (background removed)
  string logo_icon_gcs_url = 11;      // Icon-only logo PNG URL  
  string logo_svg_gcs_url = 12;       // Original SVG logo URL (if discovered as SVG)
  string logo_source_url = 13;        // Original URL where the logo was found
  string logo_format = 14;            // Original format of discovered logo (svg, png, etc)
  // Website discovery (when original metadata lacks website)
  string discovered_website = 15;     // Website URL discovered during enrichment
}

// Quality score for enrichment data
message QualityScore {
  double overall_score = 1; // 0.0 to 1.0
  double completeness_score = 2; // How complete is the data
  double accuracy_score = 3; // Estimated accuracy
  repeated string warnings = 4; // Quality warnings
  repeated string strengths = 5; // Quality strengths
}

// Get top stocks for enrichment request
message GetTopStocksForEnrichmentRequest {
  int32 limit = 1; // Number of stocks to return (default: 100)
  EnrichmentPriority priority = 2; // How to prioritize stocks
}

// Enrichment priority
enum EnrichmentPriority {
  ENRICHMENT_PRIORITY_UNSPECIFIED = 0;
  ENRICHMENT_PRIORITY_MARKET_CAP = 1; // Top by market cap
  ENRICHMENT_PRIORITY_SHORT_POSITION = 2; // Top by short position
  ENRICHMENT_PRIORITY_UNENRICHED = 3; // Stocks that haven't been enriched
  ENRICHMENT_PRIORITY_STALE = 4; // Stocks with old enrichment data
}

// Get top stocks response
message GetTopStocksForEnrichmentResponse {
  repeated StockEnrichmentCandidate stocks = 1;
}

// Stock candidate for enrichment
message StockEnrichmentCandidate {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  double market_cap = 4;
  double short_position_percent = 5;
  string enrichment_status = 6;
  google.protobuf.Timestamp last_enriched = 7;
  int32 priority_score = 8; // Higher = more important to enrich
}

// Review enrichment request
message ReviewEnrichmentRequest {
  string stock_code = 1;
  string enrichment_id = 2; // ID from EnrichStockResponse
  bool approve = 3; // true to approve, false to reject
  string review_notes = 4; // Optional notes about the review
}

// Review enrichment response
message ReviewEnrichmentResponse {
  string stock_code = 1;
  bool approved = 2;
  string message = 3;
}

// List pending enrichments request
message ListPendingEnrichmentsRequest {
  int32 limit = 1;  // Default: 100
  int32 offset = 2; // Default: 0
}

// List pending enrichments response
message ListPendingEnrichmentsResponse {
  repeated PendingEnrichmentSummary enrichments = 1;
}

// A summary view of a pending enrichment (for listing)
message PendingEnrichmentSummary {
  string enrichment_id = 1;
  string stock_code = 2;
  EnrichmentStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
  QualityScore quality_score = 5;
}

// Get a pending enrichment request
message GetPendingEnrichmentRequest {
  string enrichment_id = 1;
}

// Get a pending enrichment response
message GetPendingEnrichmentResponse {
  PendingEnrichment pending = 1;
}

// Full pending enrichment record (for review UI)
message PendingEnrichment {
  string enrichment_id = 1;
  string stock_code = 2;
  EnrichmentStatus status = 3;
  EnrichmentData data = 4;
  QualityScore quality_score = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp reviewed_at = 7;
  string reviewed_by = 8;
  string review_notes = 9;
}

// Enrichment job status enum
enum EnrichmentJobStatus {
  ENRICHMENT_JOB_STATUS_UNSPECIFIED = 0;
  ENRICHMENT_JOB_STATUS_QUEUED = 1; // Job created, waiting to be processed
  ENRICHMENT_JOB_STATUS_PROCESSING = 2; // Currently being processed
  ENRICHMENT_JOB_STATUS_COMPLETED = 3; // Completed successfully
  ENRICHMENT_JOB_STATUS_FAILED = 4; // Failed with error
  ENRICHMENT_JOB_STATUS_CANCELLED = 5; // Cancelled before completion
}

// Enrichment job record
message EnrichmentJob {
  string job_id = 1;
  string stock_code = 2;
  EnrichmentJobStatus status = 3;
  int32 priority = 4;
  bool force = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  string error_message = 9;
  string enrichment_id = 10; // Set when job completes and enrichment is saved
}

// Get enrichment job status request
message GetEnrichmentJobStatusRequest {
  string job_id = 1;
}

// Get enrichment job status response
message GetEnrichmentJobStatusResponse {
  EnrichmentJob job = 1;
}

// List enrichment jobs request
message ListEnrichmentJobsRequest {
  int32 limit = 1; // Default: 100
  int32 offset = 2; // Default: 0
  EnrichmentJobStatus status = 3; // Optional filter by status
}

// List enrichment jobs response
message ListEnrichmentJobsResponse {
  repeated EnrichmentJob jobs = 1;
  int32 total_count = 2;
}

