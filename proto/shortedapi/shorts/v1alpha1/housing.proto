syntax = "proto3";

package shorts.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/shorts/v1alpha1;shortsv1alpha1";

import "google/protobuf/timestamp.proto";
import "options/v1/options.proto";

service HousingService {
  // Latest house-price headline metrics by region (national/state/capital city).
  rpc GetHousingOverview (GetHousingOverviewRequest) returns (GetHousingOverviewResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // A single house-price time series for a region and measure.
  rpc GetHousePriceSeries (GetHousePriceSeriesRequest) returns (GetHousePriceSeriesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // List all suburbs in a state with latest median price + key demographics.
  rpc ListStateSuburbs (ListStateSuburbsRequest) returns (ListStateSuburbsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Stable sal_code-ordered index used by all columnar suburb responses.
  rpc GetSuburbIndex (GetSuburbIndexRequest) returns (GetSuburbIndexResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Fetch only the map metric columns currently needed by the client.
  rpc GetSuburbMetricColumns (GetSuburbMetricColumnsRequest) returns (GetSuburbMetricColumnsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Return a compact index-aligned mask for ANDed metric predicates.
  rpc FilterSuburbs (FilterSuburbsRequest) returns (FilterSuburbsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Full per-suburb profile: identity, demographics, headline price, comparison baselines.
  rpc GetSuburbProfile (GetSuburbProfileRequest) returns (GetSuburbProfileResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // List house-price regions (suburbs/LGAs/etc) for the suburb explorer.
  rpc ListHousingRegions (ListHousingRegionsRequest) returns (ListHousingRegionsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Suburbs ranked by recent for-sale asking-price drops.
  rpc ListSuburbPriceDrops (ListSuburbPriceDropsRequest) returns (ListSuburbPriceDropsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Individual recently-reduced listings for a suburb, deep-linking to the portal.
  rpc ListSuburbDropListings (ListSuburbDropListingsRequest) returns (ListSuburbDropListingsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Full price timeline for a single physical address, across all its listings.
  rpc GetPropertyHistory (GetPropertyHistoryRequest) returns (GetPropertyHistoryResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Individual physical addresses ranked by their asking-price drop over a window.
  rpc ListAddressPriceDrops (ListAddressPriceDropsRequest) returns (ListAddressPriceDropsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // State-level price-drop + listing-price rollup, plus a national summary row.
  rpc GetPriceDropsOverview (GetPriceDropsOverviewRequest) returns (GetPriceDropsOverviewResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Agencies ranked by recent asking-price cuts across their listings.
  rpc ListAgencyPriceStats (ListAgencyPriceStatsRequest) returns (ListAgencyPriceStatsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Daily discounting index series (national/state/suburb) for the price-drops chart.
  rpc GetDropIndexSeries (GetDropIndexSeriesRequest) returns (GetDropIndexSeriesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Every council with a page in one state (kind council | unincorporated),
  // with the rollup metrics the council index and choropleth colour by.
  rpc ListCouncils (ListCouncilsRequest) returns (ListCouncilsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // One council's hub: identity, current facts, time series, member suburbs,
  // hazard/price/crime rollups, representation, price drops and neighbours.
  rpc GetCouncilProfile (GetCouncilProfileRequest) returns (GetCouncilProfileResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

// ── Housing (house-price tracker) ────────────────────────────────────────────

message GetHousingOverviewRequest {
  // Filter to one region_type ('national'|'state'|'gccsa'); empty = all key regions.
  string region_type = 1;
}

// Latest observation for a region × measure with QoQ/YoY change (from mv_housing_headline).
message HousingMetric {
  string region_code = 1;       // 'AUS' | 'NSW' | '1GSYD'
  string region_name = 2;
  string region_type = 3;       // 'national' | 'state' | 'gccsa'
  string state_code = 4;
  string measure = 5;           // 'mean_price' | 'median_price' | 'price_index' | 'debt_to_income'
  string dwelling_type = 6;     // 'all' | 'established_house' | 'attached'
  double value = 7;
  string unit = 8;              // 'AUD' | 'index' | 'ratio'
  google.protobuf.Timestamp period = 9;
  bool is_preliminary = 10;
  double qoq_pct = 11;
  double yoy_pct = 12;
}

message GetHousingOverviewResponse {
  repeated HousingMetric metrics = 1;
  google.protobuf.Timestamp as_of = 2;
}

message GetHousePriceSeriesRequest {
  string region_code = 1;       // 'AUS' | 'NSW' | '1GSYD'
  string measure = 2;           // 'mean_price' | 'median_price' | 'price_index' | 'debt_to_income'
  string dwelling_type = 3;     // optional; default 'all'
}

message HousePricePoint {
  google.protobuf.Timestamp period = 1;
  double value = 2;
  bool is_preliminary = 3;
}

message GetHousePriceSeriesResponse {
  string region_code = 1;
  string region_name = 2;
  string measure = 3;
  string dwelling_type = 4;
  string unit = 5;
  string source = 6;
  string source_licence = 7;
  repeated HousePricePoint points = 8;
}

message ListStateSuburbsRequest {
  string state_code = 1; // 'NSW' | 'VIC' | ... (required)
  string query = 2;      // optional case-insensitive name substring
  int32 limit = 3;       // optional; default 5000
}

// One suburb summary for the map + list (keyed by ABS SAL code).
// Per-suburb amenity counts + derived lifestyle indices (Local Insights).
// OSM-derived counts (ODbL Produced Work) + state/GA sources; see the
// Local Insights design doc.
message SuburbAmenities {
  int32  schools_total = 1;
  int32  supermarkets_total = 2;
  int32  coles_count = 3;
  int32  woolworths_count = 4;
  int32  aldi_count = 5;
  int32  iga_count = 6;
  int32  pubs_bars = 7;
  int32  parks_count = 8;
  int32  libraries_count = 9;
  double nearest_supermarket_km = 10;
  double amenity_density_score = 11;        // 0..100
  int32  hospitals_count = 12;
  int32  gp_count = 13;                      // general practices
  int32  pharmacy_count = 14;
  double nearest_train_km = 15;             // nearest railway station
  double nearest_hospital_km = 16;
  double dist_to_coast_km = 17;             // straight-line km to the national coastline
  // School sector/type split (per-state CC-BY open data; 0 until ingested).
  int32  schools_gov = 18;                   // government schools
  int32  schools_catholic = 19;              // Catholic-sector schools
  int32  schools_independent = 20;           // Independent-sector schools
  int32  schools_primary = 21;               // primary (incl. combined)
  int32  schools_secondary = 22;             // secondary (incl. combined)
  double nearest_secondary_km = 23;          // nearest secondary school
}

// One ABS 2021 SEIFA index for a Suburb and Locality (SAL). Deciles are 1..10;
// zero means that measure is absent rather than a valid decile.
message SuburbSeifaIndex {
  int32 score = 1;
  int32 decile_aus = 2;                      // rank decile within Australia
  int32 decile_state = 3;                    // rank decile within state
}

// ABS Socio-Economic Indexes for Areas (SEIFA), licensed CC-BY-4.0.
// Null/absent when every index was suppressed, missing, or quality-gated.
message SuburbSeifa {
  SuburbSeifaIndex irsd = 1;                 // Relative Socio-economic Disadvantage
  SuburbSeifaIndex irsad = 2;                // Relative Socio-economic Advantage and Disadvantage
  SuburbSeifaIndex ier = 3;                  // Economic Resources
  SuburbSeifaIndex ieo = 4;                  // Education and Occupation
}

// Measured terrain statistics from Geoscience Australia's national
// SRTM-derived 1 Second DEM-S (CC-BY-4.0). Elevations are orthometric metres
// relative to the EGM96 geoid, not AHD or ellipsoidal heights. Low-lying land
// shares are measured proportions of valid DEM-covered land cells. No
// hydrology, drainage, surge, or catchment modelling is represented.
message SuburbElevation {
  optional double elevation_min_m = 1;
  optional double elevation_median_m = 2;
  optional double elevation_max_m = 3;
  optional double land_share_below_1m = 4;  // percent of valid sampled land area, 0..100
  optional double land_share_below_2m = 5;  // percent of valid sampled land area, 0..100
  optional double land_share_below_5m = 6;  // percent of valid sampled land area, 0..100
}

// Measured hazard exposure per suburb — area shares, 0..100, absent when no
// source covers the suburb. Every source is CC-BY-4.0.
//
// water_observed_share_pct: share of the suburb's validly observed land where
// DEA Water Observations (Landsat, 1987 onward, 30 m) detected surface water in
// at least 1% of clear observations but under 90% — land seen under water at
// least occasionally. permanent_water_share_pct: the 90%-and-over remainder
// (lakes, rivers, the sea). Landsat under-observes flood peaks, so the observed
// share is a FLOOR on inundation, never a flood-risk estimate.
//
// flood_planning_share_pct: share inside a statutory flood planning overlay
// (NSW EPI Flood; VIC LSIO/FO/SBO). A planning-control boundary, not a flood
// extent; NSW councils own its currency. bushfire_prone_share_pct: share
// designated bushfire prone for development control (NSW BFPL; VIC BMO).
// Statutory shares exist for NSW and VIC only.
message SuburbHazardExposure {
  optional double water_observed_share_pct = 1;
  optional double permanent_water_share_pct = 2;
  optional double flood_planning_share_pct = 3;
  optional double bushfire_prone_share_pct = 4;
  string water_source = 5;     // dataset id, '' when absent
  string flood_source = 6;
  string bushfire_source = 7;
}

// One harmonised zoning family's share of a suburb (program decision 8).
// family: res_low | res_medium_high | centre_mixed | industrial | rural |
// conservation | open_space | infrastructure | water | other.
message ZoneFamilyShare {
  string family = 1;
  double share_pct = 2; // % of the whole suburb's area, 0..100
}

// Statutory planning layer for one suburb, computed offline from the state
// planning schemes (web/scripts/geo/planning/). Every scalar is optional: an
// absent value means no open source covers it (QLD/WA/NT zoning, NSW-only
// development standards), never zero. zone_shares lists only families with a
// non-zero share, largest first, and sums to zoning_coverage_pct.
message SuburbPlanning {
  repeated ZoneFamilyShare zone_shares = 1;
  // % of the suburb inside any zone polygon. Under 50 it is the only value
  // set: the rest of the suburb is planned by an instrument these layers do
  // not carry, so no shares, dominant family or heritage are measured.
  optional double zoning_coverage_pct = 2;
  string dominant_zone_family = 3;           // '' when unzoned / no source
  // % of the suburb in a heritage conservation area / Heritage Overlay /
  // historic or character area (area classes only).
  optional double heritage_share_pct = 4;
  optional int32 heritage_item_count = 5;    // listed heritage places, counted once
  // NSW development standards over the residential-zoned part of the suburb
  // (area-weighted): maximum building height (m), floor space ratio (n:1),
  // minimum subdivision lot size (m²).
  optional double nsw_height_median_m = 6;
  optional double nsw_height_max_m = 7;
  optional double nsw_fsr_median = 8;
  optional double nsw_min_lot_median_m2 = 9;
  repeated string instruments = 10;          // planning instrument names, largest coverage first
  string zoning_source = 11;                 // dataset id, '' when absent
  string heritage_source = 12;
  string source_licence = 13;                // e.g. 'CC-BY-4.0'
  // % of the suburb's residential-zoned land each NSW standard is actually
  // mapped on (0 = nowhere). Many LEPs map FSR, and some height, only in their
  // centres; a standard mapped on under half the residential land has no
  // median/max above, because it would be the centre's number.
  optional double nsw_height_mapped_pct = 14;
  optional double nsw_fsr_mapped_pct = 15;
  optional double nsw_min_lot_mapped_pct = 16;
}

message SuburbSummary {
  string sal_code = 1;
  string sal_name = 2;
  string state_code = 3;
  string postcode = 4;
  double latest_median_price = 5;            // 0 if no price data
  google.protobuf.Timestamp latest_period = 6;
  double yoy_pct = 7;
  int32  population = 8;
  double median_age = 9;
  double median_weekly_hhd_income = 10;
  string region_code = 11;                   // priced-region code (for the price series), '' if unpriced
  // Cultural demographics for the map's "highlight" toggle (ABS Census 2021).
  double pct_born_overseas = 12;             // 0..100
  string top_religion = 13;                  // dominant religious affiliation, '' if none
  string top_language = 14;                  // top language other than English at home, '' if none
  double pct_top_language = 15;              // 0..100 share speaking top_language
  // Federal electoral representation (AEC 2025 election), spatially joined.
  string federal_division = 16;              // Commonwealth Electoral Division
  string federal_member = 17;                // sitting House of Reps member
  string federal_party = 18;                 // member's party (full name)
  string federal_party_ab = 19;              // party abbreviation (palette key)
  double federal_tpp_alp = 20;               // 0..100 Labor two-party-preferred %
  string state_district = 21;                // ABS State Electoral Division
  string state_member = 22;                  // state lower-house member ('' for Hare-Clark TAS/ACT)
  string state_party = 23;                   // state member's party (full name)
  string state_party_ab = 24;                // state party abbreviation (palette key)
  // Amenity/lifestyle metrics (Local Insights); null/absent until ingested.
  SuburbAmenities amenities = 25;
  // NBN connectivity (Local Insights); '' until ingested.
  string dominant_nbn_tech = 26;             // Fixed Line | Fixed Wireless | Satellite
  double connectivity_quality_score = 27;    // 0..100 (tech-tier proxy)
  // Crime percentile ranks (0..100, higher = more reported crime; latest
  // 2-yr-pooled FY, CVS-adjusted). 0 = no data — pct_rank is strictly > 0
  // whenever a reliable observation exists. Small-population and
  // statistically-unreliable suburbs are gated server-side
  // (mv_suburb_crime_latest) and read as no-data. NSW (BOCSAR) only in
  // Phase 1; uncovered states/TAS/NT stay 0. CC-BY sources.
  //
  // The rank is population-weighted WITHIN THE SUBURB'S OWN STATE, never across
  // states: each police force counts offences under its own rules, so a
  // cross-jurisdiction pool would compare incomparable counts. Read "82nd
  // percentile" as "82nd of that state", and label it that way in any client.
  double crime_break_ins_rank = 28;
  double crime_violent_rank = 29;
  double crime_motor_vehicle_rank = 30;
  // Field 31 is reserved by convention for crime_property_damage_rank once a
  // CVS anchor exists; do not use 31 for anything else.

  // Properties declared in the federal Registers of Members'/Senators'
  // Interests that resolve to this suburb. A COUNT of declarations — the
  // registers record what is held, never quantity or value.
  //
  // A scalar rather than a nested message on purpose: the map needs a value for
  // every suburb in a state (~5,000 rows per request), and a message would drag
  // the politicians descriptor into the hot /housing/[state] route bundle.
  int32 politician_property_count = 31;

  // Profile-only in the current backend query; list responses leave it absent.
  SuburbSeifa seifa = 32;
}

message ListStateSuburbsResponse {
  repeated SuburbSummary suburbs = 1;
}

// The stable identity/label spine for one state's columnar suburb data. Entries
// are always ordered lexically by sal_code, never by display name.
message GetSuburbIndexRequest {
  string state_code = 1; // 'NSW' | 'VIC' | ... (required)
}

message SuburbIndexEntry {
  string sal_code = 1;
  string sal_name = 2;
  string postcode = 3;
}

message GetSuburbIndexResponse {
  repeated SuburbIndexEntry suburbs = 1;
  // Short v1 SHA-256 prefix derived only from the sorted sal_code set.
  string index_version = 2;
}

message GetSuburbMetricColumnsRequest {
  string state_code = 1;       // required
  repeated string metric_keys = 2; // exact keys from the closed server registry
}

// One numeric metric aligned position-for-position with GetSuburbIndex.
message SuburbMetricColumn {
  string metric_key = 1;
  // Numeric values are float32 and repeated float values are packed by default in proto3.
  // When null_mask marks a position, the corresponding zero is only a placeholder.
  repeated float values = 2;
  // Explicit NULL bitset. Least-significant-bit first: position i is byte i/8,
  // bit i%8; 1 means NULL and 0 means present. This keeps a genuine zero present.
  bytes null_mask = 3;
  // Non-empty for categorical metrics. Each present value is a zero-based
  // integer index into this stable label dictionary.
  repeated string category_labels = 4;
}

message GetSuburbMetricColumnsResponse {
  repeated SuburbMetricColumn columns = 1;
  // Must equal the current GetSuburbIndex version before values are aligned.
  string index_version = 2;
}

message SuburbMetricPredicate {
  string metric_key = 1;
  optional float min = 2; // inclusive; at least one bound is required
  optional float max = 3; // inclusive; at least one bound is required
}

message FilterSuburbsRequest {
  string state_code = 1; // required
  repeated SuburbMetricPredicate predicates = 2; // ANDed; at least one required
}

message FilterSuburbsResponse {
  // Packed match bitset aligned to GetSuburbIndex. Least-significant-bit first:
  // position i is byte i/8, bit i%8; 1 means the suburb matches every predicate.
  bytes match_mask = 1;
  uint32 match_count = 2;
  string index_version = 3;
}

message GetSuburbProfileRequest {
  string sal_code = 1; // required
}

message SuburbDemographics {
  int32  population = 1;
  double median_age = 2;
  double median_weekly_hhd_income = 3;
  double median_weekly_per_income = 4;
  double median_weekly_rent = 5;
  double median_monthly_mortgage = 6;
  double pct_owned_outright = 7;
  double pct_owned_mortgage = 8;
  double pct_rented = 9;
  int32  dwelling_count = 10;
  int32  census_year = 11;
  // Cultural demographics (ABS Census 2021: G01 birthplace/language, G13, G14).
  double pct_born_overseas = 12;             // 0..100
  double pct_english_only = 13;              // 0..100 (speaks English only at home)
  string top_religion = 14;                  // dominant religious affiliation
  double pct_top_religion = 15;              // 0..100 share of the dominant religion
  double pct_no_religion = 16;               // 0..100 ("No religion")
  string top_language = 17;                  // top language other than English at home
  double pct_top_language = 18;              // 0..100 share speaking top_language
  // Curated ABS Census 2021 GCP rates. Zero means absent in this proto3 API;
  // the database retains NULL for missing/suppressed/quality-gated values.
  double pct_low_personal_income = 19;        // 0..100, $1-$499 weekly (G17)
  double pct_high_personal_income = 20;       // 0..100, $2,000+ weekly (G17)
  double unemployment_rate = 21;             // 0..100 of labour force (G43)
  double labour_force_participation_rate = 22; // 0..100 of persons aged 15+ (G43)
  double pct_bachelor_or_higher = 23;         // 0..100 (G46)
  double pct_separate_house = 24;             // 0..100 occupied private dwellings (G32/G36)
  double pct_flat_apartment = 25;             // 0..100 occupied private dwellings (G32/G36)
  double pct_couple_with_children = 26;       // 0..100 families (G25)
  double pct_lone_person_household = 27;      // 0..100 households (G25)
}

// State + national reference medians for the profile's comparison bars.
message ComparisonBaselines {
  double state_median_price = 1;
  double national_median_price = 2;
  double state_median_weekly_hhd_income = 3;
  double national_median_weekly_hhd_income = 4;
}

// Local Government Area (council) a suburb belongs to (Local Insights, W2).
message LgaInfo {
  string lga_code = 1;
  string lga_name = 2;
  string state_code = 3;
  double area_sqkm = 4;
  int32  population = 5;            // ABS Estimated Resident Population at 30 June erp_year; 0 if not loaded
  double fed_fag_aud = 6;          // federal Financial Assistance Grant (latest yr), AUD; 0 if unmatched
  string fed_fag_year = 7;         // e.g. '2025-26'
  // Per-council financials (VIC LGPRF, CC-BY; 0/'' for states not yet sourced).
  double avg_rates = 8;            // average rate per property assessment, AUD
  double op_surplus_ratio = 9;     // adjusted underlying (operating) result, % (negative = deficit)
  double asset_renewal_ratio = 10; // asset renewal + upgrade vs depreciation, %
  string fin_source = 11;          // financials provenance ('vic_lgprf'), '' if none
  string fin_year = 12;            // financials reporting year, e.g. '2024-25'
  // Council identity (ABS LGA_2024 + Wikidata, CC0). Pages exist for kind
  // 'council' and 'unincorporated'; 'pseudo' areas never reach a suburb.
  string slug = 13;                // URL segment, unique within state, never reassigned
  string display_name = 14;        // ABS name without the state suffix: 'Campbelltown'
  string kind = 15;                // council | unincorporated | pseudo
  // Council facts (ABS, CC-BY-4.0). Absent = no source covers this council,
  // never a measured zero.
  int32 erp_year = 16;                        // reference year of population; 0 if none
  optional double pop_growth_pct = 17;        // ERP year-on-year change, %
  optional double median_age = 18;            // Census 2021
  optional int32 median_hhd_income = 19;      // Census 2021, $/week
  optional double pct_rented = 20;            // Census 2021, % of households renting
  optional int32 median_weekly_rent = 21;     // Census 2021, $/week
  optional int32 median_mortgage_monthly = 22; // Census 2021, $/month
  optional double avg_household_size = 23;    // Census 2021, persons
  optional int32 seifa_irsad_decile = 24;     // SEIFA 2021 IRSAD, national decile 1..10
  optional int32 seifa_irsd_decile = 25;      // SEIFA 2021 IRSD, national decile 1..10
  string website = 26;                        // official website (Wikidata P856, CC0); '' if none
  string wikidata_qid = 27;                   // e.g. 'Q1719401'; '' if none
  optional double centroid_lat = 28;          // area-weighted centroid of the ABS boundary
  optional double centroid_lon = 29;
  // Share (0..1] of THIS suburb's residents who live in this council (ABS
  // mesh-block allocation, Census 2021 persons). Absent outside a suburb profile.
  optional double dominant_share = 30;
  // Latest ABS 'Data by Region' median established-house transfer price for
  // the WHOLE COUNCIL (year ended 30 June). A council-level figure: never
  // present it as this suburb's median.
  optional double council_house_median = 31;
  string council_house_median_period = 32;    // e.g. '2023-24'; '' if none
}

// Another council a suburb spans, beyond the dominant one.
message LgaOverlap {
  string lga_code = 1;
  string display_name = 2;
  string state_code = 3;
  string slug = 4;          // '' when the council has no page
  double share = 5;         // 0..1 of the suburb's residents (Census 2021 mesh blocks)
}

// A suburb with a similar demographic + amenity profile (feature-vector kNN).
message SimilarSuburb {
  string sal_code = 1;
  string sal_name = 2;
  string state_code = 3;
  double latest_median_price = 4;   // 0 if unpriced
  double similarity = 5;            // 0..1 (1 = near-identical profile)
  string region_code = 6;
}

// A notable landmark shown in the suburb banner.
message SuburbLandmark {
  string name = 1;
  string kind = 2;
}

// Editorial banner header for the suburb profile page.
message SuburbBanner {
  string archetype = 1;                    // classified/refined archetype id
  string blurb = 2;                        // editorial one-liner (also page copy)
  repeated SuburbLandmark landmarks = 3;
  string bg_key = 4;                       // library asset key (defaults to archetype)
  string bg_url = 5;                       // bespoke background override (optional)
}

// Latest reliable crime observation for one crime type (2-yr pooled,
// CVS-adjusted; small_pop/unreliable rows are gated out server-side).
message SuburbCrimeStat {
  string crime_type = 1;       // 'break_ins' | 'violent' | 'motor_vehicle' (+ future types)
  double rate_per_100k = 2;    // adjusted offences per 100k residents (can be 0)
  double pct_rank = 3;         // 0..100 national pop-weighted percentile; > 0 always
  int32 fy_ending = 4;         // 2025 = FY2024-25 (end year of the pooled window)
}

// Per-suburb crime block. Message absent (null) = no reliable data for this
// suburb (uncovered state, TAS/NT, or gated small_pop/unreliable).
message SuburbCrime {
  repeated SuburbCrimeStat stats = 1;
  string source_jurisdiction = 2;  // 'NSW'
  string source = 3;               // 'bocsar'
  string source_licence = 4;       // 'CC-BY-4.0'
}

// Crawl-derived listing aggregates for one suburb (mv_suburb_listing_stats).
//
// This is the ONLY price signal available for the ~11,700 suburbs with no
// Valuer-General feed — QLD, WA, TAS, NT and ACT publish no open suburb-level
// median, and every commercial alternative is licensed.
//
// It is NOT a substitute for `SuburbSummary.latest_median_price` and must never
// be rendered as one:
//   - it is derived from CURRENT portal listings, not settled transfers;
//   - `median_sold` is the price listings were marked sold at, which is a
//     different measure from a Valuer-General median and is not comparable with
//     the NSW/VIC/SA figures;
//   - it covers whatever the crawl catalog reaches (500 suburbs nationally), so
//     it is not a population any rank can be computed against.
//
// LICENCE: these are DERIVED AGGREGATES. The underlying rows carry
// source_licence='proprietary-tos-restricted' and are never republished — see
// docs/feature/housing/data-sources.md. Counts and medians only.
message SuburbListingStats {
  int32  for_sale_count = 1;    // active for-sale listings captured
  double avg_asking = 2;        // mean asking price of priced for-sale listings, AUD; 0 if none
  double median_asking = 3;     // median asking price, AUD; 0 if none
  int32  sold_count = 4;        // recent sold listings captured
  double avg_sold = 5;          // mean sold price, AUD; 0 if none
  double median_sold = 6;       // median sold price, AUD; 0 if none
  // When mv_suburb_listing_stats was last refreshed (every now()-relative
  // window in it is anchored here), and the newest crawl observation it could
  // contain. Unset when the refresh has never been recorded.
  google.protobuf.Timestamp as_of = 7;
  google.protobuf.Timestamp data_through = 8;
}

message GetSuburbProfileResponse {
  SuburbSummary summary = 1;
  SuburbDemographics demographics = 2;
  ComparisonBaselines baselines = 3;
  LgaInfo council = 4;              // council this suburb sits in ('' if unmatched)
  repeated SimilarSuburb similar = 5; // most-similar suburbs nationally (knowledge graph)
  SuburbBanner banner = 6;          // editorial banner header (archetype, blurb, landmarks)
  SuburbCrime crime = 7;             // null when the suburb has no gated crime data
  // Crawl-derived listing aggregates; null when the suburb is outside the crawl
  // catalog or the HOUSING_DROP_LISTINGS_ENABLED kill switch is off.
  SuburbListingStats listing_stats = 8;
  // Profile-only measured terrain block; absent when the DEM sample is missing
  // or below the collector's published cell-count quality floor.
  SuburbElevation elevation = 9;
  // Profile-only hazard block; absent when no hazard source covers the suburb.
  SuburbHazardExposure hazards = 10;
  // Other councils holding >= 5% of this suburb's residents, largest first.
  // Empty for a suburb wholly (or >= 95%) inside `council`.
  repeated LgaOverlap council_overlaps = 11;
  // Profile-only planning block; absent when no planning source covers the
  // suburb (WA, NT, and QLD beyond its heritage register).
  SuburbPlanning planning = 12;
}

message ListHousingRegionsRequest {
  string region_type = 1; // optional filter, e.g. 'suburb' | 'gccsa' | 'state'
  string state_code = 2;  // optional filter, e.g. 'SA' | 'VIC'
  string query = 3;       // optional case-insensitive name substring
  int32 limit = 4;        // optional; default 2000
}

// A selectable house-price region (for the suburb explorer).
message HousingRegion {
  string region_code = 1; // 'SUBURB:VIC-RICHMOND' | 'AUS' | '1GSYD'
  string region_name = 2;
  string region_type = 3; // 'national' | 'state' | 'gccsa' | 'suburb' | 'lga'
  string state_code = 4;
  string postcode = 5;
  double latest_value = 6;                  // latest median_price (0 if none)
  google.protobuf.Timestamp latest_period = 7;
}

message ListHousingRegionsResponse {
  repeated HousingRegion regions = 1;
}

message ListSuburbPriceDropsRequest {
  string state_code = 1;   // optional filter, e.g. 'NSW'; '' = national
  int32  window_days = 2;  // reserved; the aggregate uses a fixed rolling window
  // optional: 'count' (default) | 'avg' | 'max' | 'asking' | 'sold' | 'share'.
  // 'share' ranks by dropped_share among suburbs with at least 20 recently
  // swept active addresses (the drop index's panel floor); thinner suburbs
  // sort after every ranked one rather than topping the board on 1 of 3.
  string sort = 3;
  int32  limit = 4;        // optional; default 50
}

// A suburb's aggregate price-drop signal over the rolling window (derived; the
// underlying listings are ToS-restricted and never republished here).
message SuburbPriceDrop {
  string region_code = 1;
  string sal_code = 2;                 // ABS SAL code (for the suburb page link), '' if unlinked
  string sal_name = 3;
  string state_code = 4;
  int32  dropped_listing_count = 5;    // listings that cut their asking price
  double avg_drop_pct = 6;             // 0..1 fraction (0.06 == a 6% average reduction)
  double median_drop_pct = 7;
  double max_drop_pct = 8;
  double max_drop_abs = 9;             // largest single reduction, AUD
  int32  total_active_listings = 10;
  double dropped_share = 11;           // dropped_listing_count / total_active_listings
  string postcode = 12;                // for the canonical suburb-page URL
  // Per-suburb listing-price aggregates (mv_suburb_listing_stats).
  int32  for_sale_count = 13;          // active for-sale listings
  double avg_asking = 14;              // mean asking price of priced for-sale listings, AUD (0 if none)
  double median_asking = 15;           // median asking price, AUD
  int32  sold_count = 16;              // recent sold listings captured
  double avg_sold = 17;                // mean sold price, AUD (0 if none)
  double median_sold = 18;             // median sold price, AUD
  double dropped_value = 19;           // summed AUD reductions across dropped addresses
}

message ListSuburbPriceDropsResponse {
  repeated SuburbPriceDrop suburbs = 1;
  // The OLDER refresh of the two views this board joins
  // (mv_suburb_listing_stats, mv_suburb_price_drops), so the stamp never
  // claims more freshness than the staler half. data_through: the newest crawl
  // observation (price event or listing sighting) those refreshes could see.
  // Both unset when no refresh has been recorded.
  google.protobuf.Timestamp as_of = 2;
  google.protobuf.Timestamp data_through = 3;
}

message ListSuburbDropListingsRequest {
  string sal_code = 1;     // one of sal_code or region_code is required
  string region_code = 2;
  int32  window_days = 3;  // optional; default 30
  int32  limit = 4;        // optional; default 30
}

// One recently-reduced listing, deep-linking OUT to the live portal page.
message SuburbDropListing {
  string source = 1;               // 'rea' | 'domain'
  string listing_url = 2;          // deep link to the live portal listing
  string display_address = 3;
  string property_type = 4;
  int32  bedrooms = 5;
  int32  bathrooms = 6;
  int32  car_spaces = 7;
  double prev_price = 8;           // AUD before the reduction
  double price = 9;                // AUD current asking
  double drop_pct = 10;            // 0..1 fraction
  double drop_abs = 11;            // AUD reduction
  google.protobuf.Timestamp observed_at = 12;  // when the reduction was detected
  string address_key = 13;         // stable per-address key → /housing/property/[addressKey] (empty until backfilled)
  string agency_name = 14;         // marketing agency ('' when not captured)
  repeated string agent_names = 15; // listing agents ('' when not captured)
}

message ListSuburbDropListingsResponse {
  repeated SuburbDropListing listings = 1;
}

message GetPropertyHistoryRequest {
  string address_key = 1;
}

// The current listing at an address — the most-recent active one, or the
// most-recent overall if none are active.
message PropertyListingSnapshot {
  string source = 1;               // 'rea' | 'domain'
  string listing_id = 2;           // portal advert id
  string listing_url = 3;          // deep link to the live portal listing
  double price = 4;                // canonical numeric ask (0 if unknown)
  string price_display = 5;        // raw string as shown on the portal
  string price_kind = 6;           // fixed|range_low|range_high|offers_over|auction|poa|unknown
  string listing_status = 7;       // for_sale|under_offer|sold|withdrawn|unknown
  bool is_active = 8;
  int32 bedrooms = 9;
  int32 bathrooms = 10;
  int32 car_spaces = 11;
  double land_size_sqm = 12;
  string property_type = 13;
  string first_seen_at = 14;       // RFC3339
  string last_seen_at = 15;        // RFC3339
  string agency_name = 16;         // marketing agency ('' when not captured)
  repeated string agent_names = 17; // listing agents ('' when not captured)
}

// One event in an address's price timeline (spans every listing/relist at
// that address).
message PropertyPriceEvent {
  string observed_at = 1;          // RFC3339, the run timestamp
  string event_type = 2;           // first_seen|price_drop|price_rise|relisted|status_change|delisted
  string source = 3;               // 'rea' | 'domain'
  string listing_id = 4;
  double price = 5;
  double prev_price = 6;
  double drop_abs = 7;             // prev_price - price (positive == a drop)
  double drop_pct = 8;             // fraction (0.062 == a 6.2% drop)
  string listing_status = 9;
  string prev_status = 10;
}

// Full price timeline for a single physical address (stable address_key),
// across all its listings and relists. Derived from ToS-restricted listing
// rows — deep-links OUT to the live portal page rather than reproducing the
// listing; flag-gated the same way as ListSuburbDropListings.
message GetPropertyHistoryResponse {
  string address_key = 1;
  string display_address = 2;
  string suburb = 3;
  string state_code = 4;
  string postcode = 5;
  PropertyListingSnapshot current = 6;   // most-recent active listing (or most-recent if none active)
  repeated PropertyPriceEvent events = 7; // full timeline across ALL its listings, ordered observed_at asc
  int32 num_listings = 8;                 // distinct source+listing_id at this address
  double first_price = 9;
  double current_price = 10;
  // Distinct KNOWN bedroom counts seen under this address_key (NULL/0 excluded).
  // >1 means the portal likely listed multiple differently-sized units of one
  // building WITHOUT a unit number, so this timeline may blend more than one
  // physical dwelling. Counting bedrooms (not raw bed/bath/type tuples) keeps
  // cross-portal label noise from falsely flagging a single dwelling. A search-
  // results crawl cannot recover the missing unit number, so the view warns
  // instead of silently merging. See docs/feature/housing/architecture.md.
  int32 distinct_dwellings = 11;
  // AVM valuation for this address (property.com.au). Unset when none exists,
  // fetch_status != 'ok', or HOUSING_VALUATIONS_ENABLED is off.
  PropertyValuation valuation = 12;
}

// One historical sales/timeline event from the valuation source's property
// profile (property.com.au timeline). Distinct from PropertyPriceEvent: these
// are the portal's own transaction history (sold/listed/rented, potentially
// decades back), not our crawl-observed asking-price events.
message PropertyValuationSale {
  string date = 1;        // ISO date 'YYYY-MM-DD' ('' when unparsed)
  double price = 2;       // AUD; 0 = undisclosed (source omitted the figure)
  string agency = 3;      // '' when not captured
  string event_type = 4;  // source badge text, e.g. 'Sold' | 'Listed for sale' | 'Rented'
}

// AVM valuation snapshot for a physical address (property.com.au / PropTrack
// AVM). DERIVED figures from a proprietary-tos-restricted source: the raw
// harvested profile is never exposed; this surface deep-links OUT to the
// source profile. Absent entirely when the address has no successful
// valuation, or when the valuations kill switch is off.
message PropertyValuation {
  string source = 1;                 // 'property.com.au'
  string profile_url = 2;            // deep link OUT to the source profile page
  string fetched_at = 3;             // RFC3339 — AVMs are point-in-time; UI must show this
  double estimate_low = 4;           // AVM range low, AUD (0 = not provided)
  double estimate_mid = 5;           // AVM point estimate, AUD (0 = not provided)
  double estimate_high = 6;          // AVM range high, AUD (0 = not provided)
  string estimate_confidence = 7;    // source confidence string ('' when not exposed); free-form
  // 'exact'    — the profile is the exact dwelling this address names
  // 'building' — a unit whose own profile isn't indexed; this is the whole
  //              BUILDING's AVM used as a fallback. Consumers MUST label it
  //              "building estimate" and MUST NOT present it as unit-precise.
  string valuation_granularity = 8;
  double rent_estimate_mid = 9;      // weekly rent estimate, AUD (0 when not exposed)
  int32  bedrooms = 10;              // 0 = unknown
  int32  bathrooms = 11;
  int32  car_spaces = 12;
  double land_size_sqm = 13;         // 0 = unknown
  double building_size_sqm = 14;     // floor area; 0 = unknown
  int32  year_built = 15;            // 0 = unknown
  string property_type = 16;         // '' = unknown
  repeated PropertyValuationSale sales_history = 17;  // newest first
}

message ListAddressPriceDropsRequest {
  string state_code = 1;   // optional filter, e.g. 'VIC' (empty = all states)
  int32  window_days = 2;  // optional; default 90
  int32  limit = 3;        // optional; default 50
  string sort = 4;         // 'pct' (default) | 'abs' (biggest $ cut) | 'recent'
}

// One physical address (deduped by stable address_key) whose for-sale asking
// price fell over the window, deep-linking to its per-address history page.
// When the address is live on both portals (or relisted), every live advert
// is judged on its own chain and the row carries the deepest qualifying cut;
// the latest_* / current_* fields describe THAT advert.
message AddressPriceDrop {
  string address_key = 1;
  string display_address = 2;
  string suburb = 3;
  string state_code = 4;
  string postcode = 5;
  double first_price = 6;         // earliest observed price in the window, AUD
  double current_price = 7;       // current active asking, AUD
  double drop_abs = 8;            // first_price - current_price, AUD
  double drop_pct = 9;            // fraction (0.062 == a 6.2% drop)
  int32  num_listings = 10;       // distinct source+listing_id at this address
  string latest_source = 11;      // 'rea' | 'domain'
  string latest_listing_url = 12; // deep link to the live portal listing
  string last_observed_at = 13;   // RFC3339, when the current listing was last seen
  string property_type = 14;
  int32  bedrooms = 15;
  int32  bathrooms = 16;
  string agency_name = 17;          // marketing agency of the current listing ('' when not captured)
  repeated string agent_names = 18; // listing agents ('' when not captured)
}

message ListAddressPriceDropsResponse {
  repeated AddressPriceDrop addresses = 1;
}

message GetPriceDropsOverviewRequest {}

// State-grain rollup of the tracked listing corpus: recent asking-price
// reductions plus asking/sold price aggregates. Derived aggregates only —
// the underlying listings are ToS-restricted and never republished.
message StatePriceDropSummary {
  string state_code = 1;           // 'NSW'|'VIC'|... or 'AU' for the national row
  int32  dropped_count = 2;        // physical addresses that cut asking price (30-day window, deduped)
  double avg_drop_pct = 3;         // 0..1 fraction
  double median_drop_pct = 4;
  double max_drop_pct = 5;
  double dropped_value = 6;        // summed AUD reductions across dropped addresses
  int32  total_active_listings = 7;
  double dropped_share = 8;        // dropped_count / total_active_listings
  int32  for_sale_count = 9;       // active for-sale listings
  int32  for_sale_priced = 10;     // subset with a numeric asking price (auction/POA excluded)
  double avg_asking = 11;          // AUD (0 if none)
  double median_asking = 12;       // AUD
  int32  sold_count = 13;          // incidental sold captures — indicative only
  double avg_sold = 14;            // AUD (0 if none)
  double median_sold = 15;         // AUD
  int32  suburbs_tracked = 16;     // tracked suburbs contributing listings
  // Crawl coverage behind this row. catalog_suburbs is every suburb the crawl
  // has ever produced a listing for (the drop index's coverage denominator);
  // suburbs_swept_14d is the subset with a listing seen in the last 14 days.
  // Below 0.6 swept/catalog (the index's gap threshold) the row measures crawl
  // coverage more than discounting, and the UI annotates it instead of ranking
  // it. Both 0 before migration 000124.
  int32  suburbs_swept_14d = 17;
  int32  catalog_suburbs = 18;
}

message GetPriceDropsOverviewResponse {
  StatePriceDropSummary national = 1;          // the 'AU' row
  repeated StatePriceDropSummary states = 2;   // ordered by dropped_count desc
  // When mv_state_price_drops was last refreshed, and the newest crawl
  // observation that refresh could see. Unset when never recorded.
  google.protobuf.Timestamp as_of = 3;
  google.protobuf.Timestamp data_through = 4;
  // True when crawl-derived price-drop figures are switched off
  // (HOUSING_DROP_LISTINGS_ENABLED=false, a takedown): every other field is
  // empty ON PURPOSE and will stay so until the switch is flipped back. Lets a
  // client tell that apart from a cold or failed fetch, which is worth retrying.
  bool withheld = 5;
}

message ListAgencyPriceStatsRequest {
  string state_code = 1;   // optional filter, e.g. 'NSW'; '' = national
  string sort = 2;         // 'drops' (default) | 'listings' | 'avg_cut' | 'value'
  int32  limit = 3;        // optional; default 20, cap 100
}

// One agency's aggregate footprint across its tracked listings. agency
// identity is per-portal (REA company id / Domain advertiser id) — the same
// real-world agency may appear once per portal.
message AgencyPriceStats {
  string source = 1;               // 'rea' | 'domain'
  string agency_id = 2;            // portal-scoped id
  string agency_name = 3;
  string state_code = 4;
  int32  active_listings = 5;
  int32  priced_listings = 6;      // active listings with a numeric asking price
  double avg_asking = 7;           // AUD (0 if none)
  double median_asking = 8;        // AUD
  int32  suburbs_covered = 9;
  int32  dropped_count = 10;       // deduped addresses cut in the 30-day window
  double avg_drop_pct = 11;        // 0..1 fraction (0 if no drops)
  double total_drop_value = 12;    // summed AUD reductions
  repeated string agent_names = 13; // small display sample of listing agents (<=6)
}

message ListAgencyPriceStatsResponse {
  repeated AgencyPriceStats agencies = 1;
}

// DropIndexPoint is one day of the discounting index.
//
// panel_suburbs, coverage_ratio and is_gap cross the wire deliberately: the
// client needs them to caption the chart and to draw a crawl outage as a break
// rather than a collapse in discounting. Computing that twice would let the two
// sides disagree.
message DropIndexPoint {
  string snapshot_date   = 1;  // 'YYYY-MM-DD'
  double drop_rate       = 2;  // 0..1 fraction, equal-weighted mean of per-suburb rates
  // 0..1 fraction, depth of the typical cut. 0 when withheld — read
  // median_withheld, never the 0, to tell withheld from a measurement.
  double median_drop_pct = 3;
  int32  panel_suburbs   = 4;  // suburbs contributing to this point
  double coverage_ratio  = 5;  // panel suburbs / full suburb catalog for this snapshot date
  bool   is_gap          = 6;  // coverage too low to be a fair reading
  int32  active_addresses  = 7;
  int32  dropped_addresses = 8;
  // Distinct listings withdrawn then relisted with a >7 day gap, in the
  // trailing window (national grain only). The gap floor excludes crawl
  // sweep noise: measured 2026-08-17, 188 of 450 REA delist->relist pairs
  // land <=2 days apart (a known page-truncation artefact, not a vendor
  // withdrawing), while Domain shows 57 of 94 pairs genuinely >7 days apart.
  int32  withdrawn_then_relisted = 9;
  int32  delisted_count    = 10;  // withdrawn events in the trailing window (national grain only)
  // True when median_drop_pct is withheld: fewer than 3 dropped addresses
  // stand behind this point, so a "median" would be one or two listings'
  // exact cuts (the stored median is NULL). median_drop_pct is then 0 and is
  // not a measurement. A separate flag rather than `optional` presence on
  // median_drop_pct, which would change that field's cardinality.
  bool   median_withheld   = 11;
}

message GetDropIndexSeriesRequest {
  // Anything outside these shapes is InvalidArgument.
  string grain     = 1;  // 'national' (default) | 'state' | 'suburb'
  string grain_key = 2;  // 'AU' | state code ('NSW', ...) | 5-digit sal_code
  string from      = 3;  // 'YYYY-MM-DD', inclusive; clamped to 2026-08-13
  string to        = 4;  // 'YYYY-MM-DD', inclusive; defaults to (and is capped at) today
}

message GetDropIndexSeriesResponse {
  repeated DropIndexPoint points = 1;
  string tracking_since = 2;  // 'YYYY-MM-DD' — earliest date the index exists for
  // as_of: the latest computed_at among the returned points (when the
  // collector last wrote this series). data_through: the end of the latest
  // returned snapshot day, or the crawl horizon the last housing MV refresh
  // recorded if that is earlier — a snapshot is computed daily whether or not
  // the crawl ran, so the date alone can outrun the data. Both unset when no
  // point is returned.
  google.protobuf.Timestamp as_of = 3;
  google.protobuf.Timestamp data_through = 4;
}

// ── Councils (LGA hub) ───────────────────────────────────────────────────────
//
// Every council fact is COUNCIL-level. A council median is the whole council's
// (ABS Data by Region) and is never presented as a suburb's price; suburb
// medians appear only on the suburbs that have their own Valuer-General feed.
// Optional fields are absent when no source covers the council — never a
// measured zero.

message ListCouncilsRequest {
  string state_code = 1;  // required: NSW | VIC | QLD | SA | WA | TAS | NT | ACT
}

message ListCouncilsResponse {
  repeated CouncilSummary councils = 1;  // population desc, then name
  string lga_vintage = 2;                // boundary vintage, e.g. 'ABS ASGS LGA 2024'
  // Freshness of every council's price_drop_share (program decision 9): when
  // the shares were computed, and the newest crawl observation behind any of
  // them. Both absent when no council publishes a share.
  google.protobuf.Timestamp price_drops_as_of = 3;
  google.protobuf.Timestamp price_drops_data_through = 4;
}

// One council's headline row: the council index table and the council
// choropleth read exactly these fields.
message CouncilSummary {
  string lga_code = 1;
  string slug = 2;
  string display_name = 3;
  string kind = 4;                              // council | unincorporated
  string state_code = 5;
  int32  population = 6;                        // ABS estimated resident population at 30 June erp_year; 0 if none
  int32  erp_year = 7;
  optional double pop_growth_pct = 8;           // ERP year-on-year change, %
  optional double area_sqkm = 9;
  optional double density_per_sqkm = 10;        // ERP / area
  int32  member_suburb_count = 11;              // suburbs whose DOMINANT council this is
  optional double council_house_median = 12;    // council-wide ABS established-house median
  string council_house_median_period = 13;      // e.g. '2023-24'
  optional double fag_per_resident = 14;        // latest Financial Assistance Grant / ERP, AUD
  string fag_year = 15;                         // e.g. '2025-26'
  optional double approvals_per_1000 = 16;      // dwelling approvals, last 12 months, per 1,000 residents
  string approvals_through = 17;                // last month of that window, 'YYYY-MM'
  optional int32 seifa_irsad_decile = 18;       // SEIFA 2021 IRSAD, national decile
  optional double flood_share_pct = 19;         // population-weighted over member suburbs
  optional double bushfire_share_pct = 20;      // population-weighted over member suburbs
  optional double price_drop_share = 21;        // 0..1, crawl-derived, only when >= 3 drops council-wide
  string data_through = 22;                     // newest period in any council series (never a future-dated allocation), 'YYYY-MM-DD'; '' if none
}

message GetCouncilProfileRequest {
  string state_code = 1;  // NSW | VIC | QLD | SA | WA | TAS | NT | ACT
  string slug = 2;        // lga.slug — minted once, never reassigned
}

message GetCouncilProfileResponse {
  CouncilProfile profile = 1;
}

message CouncilProfile {
  // Identity + current facts. dominant_share is absent (it is a suburb fact).
  LgaInfo council = 1;
  // The same row ListCouncils serves, so the hub and the index never disagree.
  CouncilSummary summary = 2;
  string lga_vintage = 3;
  repeated CouncilSeries series = 4;
  // Every suburb whose dominant council this is, plus straddling suburbs where
  // this council holds at least 5% of the residents. Population desc.
  repeated CouncilSuburb suburbs = 5;
  CouncilRollup rollup = 6;
  // Federal electorates / state districts over the member suburbs, weighted by
  // the residents each suburb contributes to this council. Largest first.
  repeated CouncilRepresentative federal_electorates = 7;
  repeated CouncilRepresentative state_districts = 8;
  // Crawl-derived aggregate. Absent below 3 drops council-wide or with no
  // crawl coverage.
  CouncilPriceDrops price_drops = 9;
  repeated CouncilNeighbour neighbours = 10;
  string facts_as_of = 11;  // when the council facts were loaded, 'YYYY-MM-DD'
}

// One lga_series measure for the council, ascending by period.
message CouncilSeries {
  string measure = 1;         // e.g. 'erp', 'house_median_price', 'dwelling_approvals_total'
  string unit = 2;            // persons | AUD | count
  string frequency = 3;       // annual (30 June) | fy | monthly
  string source = 4;
  string source_licence = 5;
  repeated CouncilSeriesPoint points = 6;
}

message CouncilSeriesPoint {
  string period = 1;          // period end, 'YYYY-MM-DD'
  string period_label = 2;    // '2025' | '2024-25' | '2026-07'
  double value = 3;
}

message CouncilSuburb {
  string sal_code = 1;
  string sal_name = 2;
  string postcode = 3;
  int32  population = 4;                  // Census 2021 persons, whole suburb
  double share = 5;                       // 0..1 of the suburb's residents in this council
  bool   dominant = 6;                    // this is the suburb's dominant council
  optional double vg_median = 7;          // the suburb's OWN Valuer-General median house price
  string vg_median_period = 8;            // 'YYYY-MM-DD'; '' without a median
  optional double flood_share_pct = 9;    // absent = no source covers the suburb
  optional double bushfire_share_pct = 10;
  optional double water_share_pct = 11;
  optional int32  seifa_irsad_decile = 12; // national decile
}

// Rollups over the member suburbs, weighted by the residents each contributes
// (population x share). Absent = no member suburb is covered.
message CouncilRollup {
  int32 member_suburbs = 1;
  int32 dominant_suburbs = 2;
  optional double flood_share_pct = 3;
  int32 flood_covered_suburbs = 4;
  optional double bushfire_share_pct = 5;
  int32 bushfire_covered_suburbs = 6;
  optional double water_share_pct = 7;
  int32 water_covered_suburbs = 8;
  // Member suburbs with their own Valuer-General median (unweighted).
  int32 priced_suburbs = 9;
  optional double median_min = 10;
  optional double median_max = 11;
  optional double median_of_medians = 12;
  // Latest crime rates where the source covers member suburbs (NSW today).
  repeated CouncilCrimeStat crime = 13;
}

message CouncilCrimeStat {
  string crime_type = 1;
  double rate_per_100k = 2;   // weighted by residents over covered suburbs
  int32  fy_ending = 3;
  int32  covered_suburbs = 4;
  string source_jurisdiction = 5;
  string source = 6;
  string source_licence = 7;
}

message CouncilRepresentative {
  string name = 1;              // electorate or district
  string member = 2;
  string party = 3;
  string party_ab = 4;
  double population_share = 5;  // 0..1 of the council's member-suburb residents
  int32  suburb_count = 6;
}

// Asking-price cuts in the last 30 days over the suburbs whose dominant
// council this is, among listings active and seen by the crawl in the last 14
// days (each address counted once). Counted from every crawled member suburb,
// so cuts in suburbs below the floor still count; floored at 3 cuts
// council-wide.
message CouncilPriceDrops {
  int32  dropped_listing_count = 1;
  int32  tracked_listing_count = 2;
  double dropped_share = 3;              // dropped / tracked
  optional double median_drop_pct = 4;   // median cut over every cut listing in the council
  int32  suburbs_tracked = 5;
  // Only suburbs that clear 3 drops themselves are named.
  repeated CouncilDropSuburb suburbs = 6;
  google.protobuf.Timestamp as_of = 7;          // when these figures were computed
  google.protobuf.Timestamp data_through = 8;   // newest crawl observation behind them
}

message CouncilDropSuburb {
  string sal_code = 1;
  string sal_name = 2;
  string postcode = 3;
  int32  dropped_listing_count = 4;
  int32  tracked_listing_count = 5;
  double dropped_share = 6;
  optional double median_drop_pct = 7;
}

message CouncilNeighbour {
  string lga_code = 1;
  string slug = 2;            // '' when the council has no page
  string display_name = 3;
  string kind = 4;
  string state_code = 5;
  // A dominant-member suburb shares a boundary with one of the neighbour's
  // (ABS suburb topology, within the state).
  bool   shares_border = 6;
  // Suburbs split between the two councils (each >= 1% of residents).
  int32  shared_suburbs = 7;
}
