syntax = "proto3";

package shorts.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/shorts/v1alpha1;shortsv1alpha1";

import "stocks/v1alpha1/stocks.proto";
import "options/v1/options.proto";

service StockService {
  // Provides an overview of a specific stock based on PRODUCT_CODE.
  rpc GetStock (GetStockRequest) returns (stocks.v1alpha1.Stock) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Provides a more in-depth breakdown of a particular stock's metadata.
  rpc GetStockDetails (GetStockDetailsRequest) returns (stocks.v1alpha1.StockDetails) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // fetch time series data for a specific stock
  rpc GetStockData (GetStockDataRequest) returns (stocks.v1alpha1.TimeSeriesData) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Adjusted daily OHLCV for a stock, on the same codes and the same dates as
  // the short-position series.
  rpc GetStockPrices (GetStockPricesRequest) returns (GetStockPricesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get extracted financial highlights for specific stocks
  rpc GetStockFinancialHighlights (GetStockFinancialHighlightsRequest) returns (GetStockFinancialHighlightsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get director (insider) trades for a specific stock
  rpc GetDirectorTrades (GetDirectorTradesRequest) returns (GetDirectorTradesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get dividend history for a specific stock
  rpc GetDividendHistory (GetDividendHistoryRequest) returns (GetDividendHistoryResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get peer comparison for a stock within its industry
  rpc GetPeerComparison (GetPeerComparisonRequest) returns (GetPeerComparisonResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get a composite bear-vs-bull verdict for a single stock
  rpc GetStockVerdict (GetStockVerdictRequest) returns (GetStockVerdictResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get a stock's people (with their other companies) and narrative-similar companies
  rpc GetStockGraph (GetStockGraphRequest) returns (GetStockGraphResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get a chronological feed of events for a stock (announcements, director trades, news, short spikes)
  rpc GetEventTimeline (GetEventTimelineRequest) returns (GetEventTimelineResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get a stock's reputation/risk signals (adverse: court/sanctions/complaints; positive: awards/press)
  rpc GetStockSignals (GetStockSignalsRequest) returns (GetStockSignalsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Get an ASX-listed entity's annual corporate-tax profile (ATO transparency data).
  rpc GetCompanyTaxProfile (GetCompanyTaxProfileRequest) returns (GetCompanyTaxProfileResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Per-period reported fundamentals (revenue, net income, EPS, cash flow,
  // shares) and year-on-year growth for a stock. Every value carries a has_*
  // flag: a missing figure is absent, never zero.
  rpc GetStockFundamentals (GetStockFundamentalsRequest) returns (GetStockFundamentalsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

// Request for GetStockSummary RPC, specifying the product code.
message GetStockRequest {
  string product_code = 1;
}

// Request for GetStockDetails RPC, specifying the product code.
message GetStockDetailsRequest {
  string product_code = 1;
}

// Request for GetStockDataRequest RPC, specifying the product code.
message GetStockDataRequest {
  string product_code = 1;

  // Lookback window: 1D, 1W, 1M, 3M, 6M, 1Y, 2Y, 5Y, 10Y or MAX. Ignored when
  // `from` is set.
  string period = 2;

  // Return every observation, unbucketed.
  //
  // By default the long periods (5Y, 10Y, MAX) are bucketed into weekly
  // averages. That is the right shape for a chart and unusable for anything
  // else: you cannot compute a per-observation change, align to a trading
  // calendar, or measure an event window on a resampled series, and until now
  // there was no way to ask for the raw record. The default is unchanged, so
  // existing callers keep the series they already render.
  bool full_resolution = 3;

  // Cap on returned points, applied after `full_resolution`. 0 means no cap.
  // Thinning keeps the first and last observation and spaces the rest evenly;
  // `downsampled` reports whether it happened, so a caller never has to infer
  // it from a suspiciously round point count.
  int32 max_points = 6;

  // Explicit date range, YYYY-MM-DD, as an alternative to `period`. `from`
  // alone runs to the end of the data. A caller wanting one specific window
  // had to request MAX and discard most of what came back.
  string from = 4;
  string to = 5;

  // Point-in-time filter, YYYY-MM-DD: return only observations that had been
  // PUBLISHED by this date, i.e. whose available_from is on or before it.
  //
  // ASIC publishes T+4, so a series requested for a historical date otherwise
  // includes up to four days of data nobody could have had. Setting as_of is
  // what makes a walk-forward study honest without the caller applying a blunt
  // lag by hand.
  //
  // Setting this IMPLIES full_resolution. The two are contradictory otherwise: a
  // weekly bucket labelled D contains observations from after D, so a mean cannot
  // answer a point-in-time question, and serving one silently defeats the other.
  // A caller passing as_of has declared what they are doing, so the resolution
  // follows from the request rather than from a second flag they must know to set.
  string as_of = 7;
}

// Request for GetStockPrices RPC.
//
// This exists so that short interest can be joined to returns without leaving
// the API. Doing it outside meant reconciling two ticker conventions (BHP here
// against BHP.AX elsewhere), two unauditable adjustment methodologies for
// splits and dividends, and two universes that need not agree on any given
// date — an error term on every result that no amount of care on the caller's
// side removes. Every question the product is actually asked ("do heavily
// shorted names underperform", "what happened after the squeeze") needs both
// series, and the harder half was already here.
message GetStockPricesRequest {
  // NOTE when joining to short interest: this endpoint returns EVERY session by
  // default, while GetStockData buckets the long periods (5Y, 10Y, MAX) into
  // weekly averages. Pass full_resolution there to align the two, or the joined
  // panel is a weekly-averaged short series against daily prices with nothing at
  // the join site saying so.
  string product_code = 1;

  // Lookback window: 1D, 1W, 1M, 3M, 6M, 1Y, 2Y, 5Y, 10Y or MAX. Ignored when
  // `from` is set. Defaults to 1Y.
  string period = 2;

  // Explicit date range, YYYY-MM-DD. `from` alone runs to the end of the data.
  string from = 3;
  string to = 4;

  // Cap on returned points, 0 for no cap. Thinning keeps the first and last
  // observation; `downsampled` reports whether it happened.
  int32 max_points = 5;
}

message GetStockPricesResponse {
  string product_code = 1;
  string name = 2;
  repeated StockPricePoint points = 3;      // Oldest first.
  int32 total_observations = 4;             // Observations in the window before thinning.
  bool downsampled = 5;
  string currency = 6;                      // Always "AUD" today; stated rather than assumed.
}

// One trading session.
message StockPricePoint {
  string date = 1;             // YYYY-MM-DD. A trading date, not a timestamp.
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;

  // Close adjusted for splits and dividends. This is the series to compute
  // returns from; `close` is the raw print. Both are returned because a caller
  // reconciling against another source needs the unadjusted number to do it.
  double adjusted_close = 6;
  int64 volume = 7;
}

// Request for GetStockFinancialHighlights RPC
message GetStockFinancialHighlightsRequest {
  repeated string stock_codes = 1; // ASX stock codes (e.g., ["DMP", "BHP"])
  int32 max_reports_per_stock = 2; // Max reports to return per stock (default 2)
}

// Response for GetStockFinancialHighlights RPC
message GetStockFinancialHighlightsResponse {
  map<string, StockFinancialHighlights> highlights = 1; // stock_code → highlights
}

// Financial highlights for a single stock
message StockFinancialHighlights {
  repeated FinancialReportHighlight reports = 1;
}

// Extracted financial data from a single report
message FinancialReportHighlight {
  string report_title = 1;
  string report_type = 2;  // e.g., "annual_results", "half_year_results"
  string report_date = 3;  // YYYY-MM-DD
  repeated FinancialMetric metrics = 4;
  string digest = 5;      // compressed Flash-distilled summary of the report
  double confidence = 6;  // digest confidence 0.0-1.0
}

// A single extracted financial metric
message FinancialMetric {
  string metric_type = 1;   // e.g., "revenue", "net_profit", "eps", "dividend"
  string source_text = 2;   // Original text from the report
  map<string, string> attributes = 3; // e.g., {"value_millions": "5142", "period": "H1 FY2025"}
}

// A single director trade record
message DirectorTrade {
  string id = 1;
  string stock_code = 2;
  string director_name = 3;
  string trade_type = 4;          // 'buy', 'sell', 'exercise_options'
  int64 shares_traded = 5;
  double price_per_share = 6;
  double total_value = 7;
  string trade_date = 8;          // YYYY-MM-DD
  string announcement_url = 9;
}

// Request for GetDirectorTrades RPC
message GetDirectorTradesRequest {
  string stock_code = 1;          // ASX stock code
  int32 limit = 2;                // Max trades to return (default 20)
}

// Response for GetDirectorTrades RPC
message GetDirectorTradesResponse {
  repeated DirectorTrade trades = 1;
  int32 total_count = 2;
}

// A single dividend record
message DividendRecord {
  string id = 1;
  string stock_code = 2;
  string ex_date = 3;             // YYYY-MM-DD
  string payment_date = 4;        // YYYY-MM-DD
  double amount_per_share = 5;
  double franking_percentage = 6;
  string dividend_type = 7;       // 'ordinary', 'special', 'interim', 'final'
}

// Request for GetDividendHistory RPC
message GetDividendHistoryRequest {
  string stock_code = 1;          // ASX stock code
  int32 years = 2;                // How many years of history (default 5)
}

// Response for GetDividendHistory RPC
message GetDividendHistoryResponse {
  repeated DividendRecord dividends = 1;
  int32 total_count = 2;
  double trailing_yield = 3;      // Calculated trailing 12-month dividend yield
}

// A peer stock for comparison
message PeerStock {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  double short_position_percent = 4;
  double market_cap = 5;
  double pe_ratio = 6;
  double dividend_yield = 7;
  double price_change_1m = 8;     // 1-month price change %
  string logo_url = 9;            // Company logo URL (GCS-hosted, may be empty)
}

// Request for GetPeerComparison RPC
message GetPeerComparisonRequest {
  string stock_code = 1;          // ASX stock code to compare
  int32 limit = 2;                // Number of peers (default 5)
}

// Response for GetPeerComparison RPC
message GetPeerComparisonResponse {
  PeerStock subject = 1;          // The stock being compared
  repeated PeerStock peers = 2;   // Industry peers
  string industry = 3;            // Common industry
}

// Verdict band derived from the composite score
enum VerdictLabel {
  VERDICT_LABEL_UNSPECIFIED = 0;
  VERDICT_LABEL_STRONG_BEARISH = 1; // composite <= -40
  VERDICT_LABEL_BEARISH = 2;        // -40 < composite <= -10
  VERDICT_LABEL_NEUTRAL = 3;        // -10 < composite < 10
  VERDICT_LABEL_BULLISH = 4;        // 10 <= composite < 40
  VERDICT_LABEL_STRONG_BULLISH = 5; // composite >= 40
}

// Request for GetStockVerdict RPC
message GetStockVerdictRequest {
  string product_code = 1;
}

// A single component of the composite verdict
message VerdictComponent {
  string name = 1;         // e.g. "short_trend"
  double score = 2;        // normalized -1..1, bullish positive
  double weight = 3;       // 0..1
  double contribution = 4; // weight * score * 100 (points of the composite)
}

// Response for GetStockVerdict RPC
message GetStockVerdictResponse {
  string product_code = 1;
  double composite = 2; // -100..100, bullish positive
  VerdictLabel label = 3;
  repeated VerdictComponent components = 4;
}

// Request for GetCompanyTaxProfile RPC
message GetCompanyTaxProfileRequest {
  string product_code = 1;
}

// One income year of ATO corporate-tax transparency data for an entity.
// has_taxable_income / has_tax_payable distinguish a genuine zero from
// "not reported" (the ATO leaves these blank; blank is meaningful, not zero).
message CompanyTaxYear {
  int32 income_year = 1;         // e.g. 2024 for the 2023-24 report
  double total_income = 2;       // always reported (A$)
  bool has_taxable_income = 3;
  double taxable_income = 4;     // valid only when has_taxable_income
  bool has_tax_payable = 5;
  double tax_payable = 6;        // valid only when has_tax_payable
}

// Response for GetCompanyTaxProfile RPC
message GetCompanyTaxProfileResponse {
  string entity_name = 1;
  string abn = 2;
  repeated CompanyTaxYear years = 3;
  string source_attribution = 4;
}

// Request for GetStockGraph RPC
message GetStockGraphRequest {
  string stock_code = 1;
  int32 limit = 2; // max people / similar companies to return (default 12)
}

// Response for GetStockGraph RPC
message GetStockGraphResponse {
  repeated GraphPerson people = 1;
  repeated GraphPeer similar_companies = 2;
}

// A person connected to the stock (director/officer) with their other ASX roles
message GraphPerson {
  string name = 1;
  string role = 2;
  string image_url = 3;
  string linkedin_url = 4;
  repeated string also_at = 5; // OTHER stock codes this person is connected to
}

// A narratively/semantically similar company
message GraphPeer {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  double similarity = 4;
}

// Request for GetEventTimeline RPC
message GetEventTimelineRequest {
  string stock_code = 1;
  int32 days_back = 2; // number of days to look back (default 90)
  int32 limit = 3;     // max events to return (default 50)
}

// Response for GetEventTimeline RPC
message GetEventTimelineResponse {
  repeated TimelineEvent events = 1;
}

// A single event in the stock's timeline
message TimelineEvent {
  string date = 1;              // YYYY-MM-DD
  string type = 2;              // 'announcement' | 'director_trade' | 'news' | 'short_spike'
  string title = 3;
  string detail = 4;
  string url = 5;
  string sentiment = 6;         // for news events; '' otherwise
  bool   is_price_sensitive = 7;
}

message GetStockSignalsRequest {
  string stock_code = 1;
  int32  limit = 2;             // max signals per polarity (default 10)
}

message GetStockSignalsResponse {
  repeated StockSignal adverse = 1;
  repeated StockSignal positive = 2;
}

// A single reputation/risk signal for a stock
message StockSignal {
  string polarity = 1;          // 'adverse' | 'positive'
  string kind = 2;              // 'court' | 'sanction' | 'complaint' | 'award' | 'press' | ...
  string headline = 3;
  string detail = 4;
  string event_date = 5;        // 'YYYY-MM-DD' or 'YYYY'
  string severity = 6;          // 'high' | 'medium' | 'low' (adverse only)
  double confidence = 7;
  repeated string citations = 8;
}

// Request for GetStockFundamentals.
message GetStockFundamentalsRequest {
  string stock_code = 1;    // ASX code, e.g. "BHP".
  string period_type = 2;   // Optional: "annual" | "half" | "quarter" (balance-sheet snapshots) | "ttm". Empty returns every type.
  int32 limit = 3;          // Max periods, newest first (default 12, max 40).
}

// One reported period. Values are in `currency` exactly as the source reports
// them (BHP reports in USD). has_* is false when the source omitted a figure.
message FundamentalsPeriod {
  string period_type = 1;          // "annual" | "half" | "quarter" | "ttm" (trailing twelve months).
  string period_end = 2;           // YYYY-MM-DD.
  int32 fiscal_year = 3;           // 0 when unknown.
  string currency = 4;
  double revenue = 5;
  bool has_revenue = 6;
  double net_income = 7;
  bool has_net_income = 8;
  double eps_basic = 9;
  bool has_eps_basic = 10;
  double eps_diluted = 11;
  bool has_eps_diluted = 12;
  double operating_cash_flow = 13;
  bool has_operating_cash_flow = 14;
  double shares_outstanding = 15;
  bool has_shares_outstanding = 16;
  string source = 17;              // e.g. "yahoo-timeseries".
  string fetched_at = 18;          // RFC 3339.
  double free_cash_flow = 19;
  bool has_free_cash_flow = 20;

  // Full statement lines (period_type "quarter" rows are balance-sheet
  // snapshots and carry only balance lines and shares).
  double gross_profit = 21;
  bool has_gross_profit = 22;
  // Absent for banks and insurers.
  double operating_income = 23;
  bool has_operating_income = 24;
  // Statutory: includes impairments and revaluations.
  double ebitda = 25;
  bool has_ebitda = 26;
  // EBITDA before unusual items, when the source publishes it.
  double normalized_ebitda = 27;
  bool has_normalized_ebitda = 28;
  double ebit = 29;
  bool has_ebit = 30;
  // A positive expense.
  double interest_expense = 31;
  bool has_interest_expense = 32;
  double pretax_income = 33;
  bool has_pretax_income = 34;
  double tax_provision = 35;
  bool has_tax_provision = 36;
  // Banks; other companies report it as minus interest expense.
  double net_interest_income = 37;
  bool has_net_interest_income = 38;
  // An outflow: negative.
  double capital_expenditure = 39;
  bool has_capital_expenditure = 40;
  // Cash dividends paid in the period: negative.
  double dividends_paid = 41;
  bool has_dividends_paid = 42;
  // An outflow: negative.
  double share_buybacks = 43;
  bool has_share_buybacks = 44;
  // Balance sheet at period_end.
  double total_assets = 45;
  bool has_total_assets = 46;
  double total_liabilities = 47;
  bool has_total_liabilities = 48;
  // Shareholders' equity.
  double total_equity = 49;
  bool has_total_equity = 50;
  double cash_and_equivalents = 51;
  bool has_cash_and_equivalents = 52;
  // Includes lease liabilities.
  double total_debt = 53;
  bool has_total_debt = 54;
  // Lease liabilities.
  double capital_lease_obligations = 55;
  bool has_capital_lease_obligations = 56;
  // Excludes leases: total debt minus leases minus cash. Negative is net cash.
  double net_debt = 57;
  bool has_net_debt = 58;
  double current_assets = 59;
  bool has_current_assets = 60;
  double current_liabilities = 61;
  bool has_current_liabilities = 62;

  // Per-field provenance: the fields whose value did not come from `source`,
  // mapped to where it came from, e.g. {"operating_cash_flow":
  // "derived:fcf-minus-capex", "revenue": "markit-key-statistics"}.
  map<string, string> field_sources = 63;
  // The company filing a filing-sourced row or field came from; empty otherwise.
  string source_document_url = 64;
  string source_document_date = 65;   // YYYY-MM-DD.
}

// Year-on-year growth, always against the same series one year earlier
// (annual vs prior annual, TTM vs the TTM point a year earlier), never across
// series. A *_pct is absent (has_* false) when either side is missing or the
// prior value is zero or negative.
message FundamentalsGrowth {
  string basis_period_type = 1;       // Series the EPS growth was computed on: "half", "ttm" or "annual".
  string latest_period_end = 2;       // YYYY-MM-DD of the latest period in that series.
  double revenue_yoy_pct = 3;         // Revenue growth on revenue_basis_period_type vs the same series a year earlier.
  bool has_revenue_yoy = 4;
  double revenue_yoy_prior_pct = 5;   // The same growth one period earlier, for acceleration.
  bool has_revenue_yoy_prior = 6;
  double eps_yoy_pct = 7;
  bool has_eps_yoy = 8;
  double eps_yoy_prior_pct = 9;
  bool has_eps_yoy_prior = 10;
  bool net_income_positive = 11;      // Latest annual net income above zero.
  int32 periods_available = 12;
  double revenue_ttm = 13;            // Latest trailing-twelve-month points.
  bool has_revenue_ttm = 14;
  double net_income_ttm = 15;
  bool has_net_income_ttm = 16;
  double eps_ttm = 17;
  bool has_eps_ttm = 18;
  // Series the revenue growth was computed on: "half" (latest half-year from a
  // company filing vs the same half a year earlier, used when it is newer than
  // the latest annual), "ttm" (the latest trailing twelve months vs twelve
  // months earlier, used when it is newer than the latest annual) or "annual".
  // Empty when unknown.
  string revenue_basis_period_type = 19;
  // Latest half-year vs the same half a year earlier, from company filings,
  // whether or not the half is the chosen basis.
  double revenue_half_yoy_pct = 20;
  bool has_revenue_half_yoy = 21;
  double eps_half_yoy_pct = 22;
  bool has_eps_half_yoy = 23;
  string half_latest_period_end = 24;  // YYYY-MM-DD of the latest half-year row; empty when none.
  // "vendor" or "filing": where the rows behind each growth figure came from.
  // "filing" when either side of the pair is a figure extracted from a company
  // filing. Empty when unknown.
  string revenue_basis_source = 25;
  string eps_basis_source = 26;
  string fetched_at = 27;                  // RFC 3339, newest fetch of the growth inputs.
  string revenue_latest_period_end = 28;   // YYYY-MM-DD, the pair revenue_yoy_pct compares.
  string revenue_prior_period_end = 29;
}

// Profitability, cash conversion, balance-sheet and valuation ratios. Flow
// ratios use one period (basis_period_type/basis_period_end); balance ratios use
// the balance sheet at or up to 6 months before it, in the same currency.
// has_* is false when an input is missing, a denominator is zero or negative,
// or the ratio is not meaningful for the company (listed in not_meaningful).
message FundamentalsQuality {
  string basis_period_type = 1;    // "annual" | "ttm".
  string basis_period_end = 2;     // YYYY-MM-DD.
  string currency = 3;             // Reporting currency of the flow period.
  string balance_period_end = 4;   // YYYY-MM-DD; empty when no aligned balance sheet.
  double gross_margin_pct = 5;
  bool has_gross_margin_pct = 6;
  double operating_margin_pct = 7;
  bool has_operating_margin_pct = 8;
  double net_margin_pct = 9;
  bool has_net_margin_pct = 10;
  double fcf_margin_pct = 11;
  bool has_fcf_margin_pct = 12;
  double fcf_conversion = 13;      // Free cash flow / net profit (a ratio, not a percentage).
  bool has_fcf_conversion = 14;
  double roe_pct = 15;             // Net profit / average equity.
  bool has_roe_pct = 16;
  double roa_pct = 17;             // Net profit / average total assets.
  bool has_roa_pct = 18;
  double net_debt = 19;            // Excludes leases; negative is net cash. In balance_currency.
  bool has_net_debt = 20;
  double net_debt_to_ebitda = 21;  // Normalized EBITDA when published, else statutory.
  bool has_net_debt_to_ebitda = 22;
  double net_debt_to_equity = 23;
  bool has_net_debt_to_equity = 24;
  double current_ratio = 25;
  bool has_current_ratio = 26;
  double interest_cover = 27;      // Operating income / interest expense.
  bool has_interest_cover = 28;
  double payout_ratio_pct = 29;    // Cash dividends paid / net profit.
  bool has_payout_ratio_pct = 30;
  bool is_financial = 31;          // Bank, insurer or other financial.
  string source = 32;              // Source of the flow period, e.g. "yahoo-timeseries".
  bool operating_cash_flow_derived = 33;  // Operating cash flow = free cash flow minus capex.
  double market_cap = 34;          // AUD: latest close x shares on issue.
  bool has_market_cap = 35;
  double pe_ratio = 36;            // Latest close / 12-month EPS; AUD reporters only.
  bool has_pe_ratio = 37;
  double price_to_book = 38;       // Market cap / equity; AUD reporters only.
  bool has_price_to_book = 39;
  string price_as_of = 40;         // YYYY-MM-DD of the close used.
  string balance_currency = 41;
  repeated string not_meaningful = 42;   // Ratio names withheld because is_financial.
  bool is_property = 43;           // Property trust: profit and EBITDA include revaluations.
  int32 balance_lag_months = 44;   // Months between the balance sheet and the flow period.
  string shares_as_of = 45;        // YYYY-MM-DD of the share count used for market cap.
  string pe_eps_period_end = 46;   // YYYY-MM-DD of the EPS used for P/E.
  string pe_eps_basis = 47;        // "diluted" | "basic".
  // Why market cap, P/E or P/B are absent: "non-aud" (statements not in AUD),
  // "listed-unit" (the listed unit is not one ordinary share), "no-shares",
  // "no-price"; empty when present.
  string valuation_note = 48;
}

// Whether fundamentals have been collected for the stock.
message FundamentalsCoverage {
  // "covered" (rows held), "empty" (our providers returned nothing),
  // "pending" (not attempted yet) or "failed" (the last attempt errored).
  // Empty when unknown.
  string status = 1;
  string last_attempt_at = 2;      // RFC 3339.
  string last_success_at = 3;      // RFC 3339.
  repeated string sources = 4;     // Sources of the rows held.
}

// The company filing behind the latest reported period, with its summary.
message LatestFilingSummary {
  string report_url = 1;
  string report_title = 2;
  string report_date = 3;          // YYYY-MM-DD.
  string period_end = 4;           // YYYY-MM-DD, the period the filing reports.
  string period_type = 5;          // "annual" | "half".
  string digest = 6;               // Short summary of the filing.
  double digest_confidence = 7;    // 0-1.
}

// Response for GetStockFundamentals.
message GetStockFundamentalsResponse {
  string stock_code = 1;
  repeated FundamentalsPeriod periods = 2;   // Newest first.
  FundamentalsGrowth growth = 3;
  bool has_growth = 4;                       // False when no growth row exists yet.
  FundamentalsQuality quality = 5;
  bool has_quality = 6;                      // False when no ratio row exists yet.
  FundamentalsCoverage coverage = 7;
  LatestFilingSummary latest_filing = 8;
  bool has_latest_filing = 9;
}
