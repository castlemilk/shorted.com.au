syntax = "proto3";

package shorts.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/shorts/v1alpha1;shortsv1alpha1";

import "options/v1/options.proto";
import "shorts/v1alpha1/ownership.proto";

// OwnershipInsightsService: the ownership register as market intelligence, in
// one time window.
//
// Two measures, never blended into one number:
//   - Fund holdings: the AUD value and the shares the tracked index funds and
//     super fund options hold, as their own files state them. A fund's position
//     at a date is its newest file on or before that date. A change compares
//     each fund with itself: its file at the window's start against its newest
//     file at the window's end, so a fund whose first file falls inside the
//     window is not read as new money.
//   - Disclosed stakes: the voting power substantial holders state in their
//     ASX notices (each interest counted once), and the change in voting power
//     that the window's notices state themselves (present less previous, where a
//     notice states both). A fall in a notice's figure is a fall, never a
//     disposal. A disclosed value is the figure times the company's market cap:
//     an estimate, what the notices disclose and not a share of the company.
//
// Every nullable number travels with a has_* flag: a missing figure is absent,
// never zero. Every figure states the dates it reads.
service OwnershipInsightsService {
  // The register in one window: sectors and their stocks, the money flow from
  // institution kinds through institutions to sectors, the position changes by
  // sector and week or month, the window's largest stated moves, and the dates
  // a window can take.
  rpc GetOwnershipInsights (GetOwnershipInsightsRequest) returns (GetOwnershipInsightsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

message GetOwnershipInsightsRequest {
  // The window's first and last day, YYYY-MM-DD, inclusive. Empty: the default
  // window, the 90 days to the newest date read. A window is clamped to the
  // timeline, and a from after the to is refused.
  string window_from = 1;
  string window_to = 2;
  // Optional focus: one sector (as the response names it). The response then
  // lists every stock of the sector, the institutions whose funds moved in it,
  // and the sector's moves only.
  string sector = 3;
  // Optional focus: one ASX code. The response then carries the stock's detail.
  string stock_code = 4;
}

// The window served and the dates a window can take.
message InsightWindow {
  // The window served, after the default and the clamp.
  string from = 1;
  string to = 2;
  // The first and last day a window can reach: the oldest and newest date read
  // across fund files and notices.
  string timeline_from = 3;
  string timeline_to = 4;
  // Every distinct as-at date of a fund file (index funds and super options),
  // oldest first.
  repeated string snapshot_dates = 5;
  // The oldest and newest notice date read (event date, else release date).
  string notices_from = 6;
  string notices_to = 7;
  // The newest notice release date read.
  string notices_as_of = 8;
  // The heatmap's bucket: "week" (Monday to Sunday) or "month".
  string bucket = 9;
  // The as-at range of the files each end of the window reads.
  string start_files_from = 10;
  string start_files_to = 11;
  string end_files_from = 12;
  string end_files_to = 13;
  // Index funds with a file at both ends of the window, the later one newer:
  // the funds a change compares. Zero when the window holds one file per fund.
  int32 funds_compared = 14;
  // Funds (index funds and super options) with a file on or before the end.
  int32 funds_at_end = 15;
  // Notices dated inside the window.
  int32 notices_in_window = 16;
}

// One sector (the company's industry; "" for none or a placeholder).
message InsightSector {
  string sector = 1;
  // Stocks of the sector held by a tracked fund or with a current holder.
  int32 stocks = 2;
  // Index funds' holdings at the window's end, AUD.
  double fund_value_aud = 3;
  bool has_fund_value = 4;
  // The change in shares the compared index funds hold, valued at the end
  // file's price, AUD.
  double fund_flow_aud = 5;
  bool has_fund_flow = 6;
  // That change as a percentage of the same funds' starting shares, valued at
  // the same price.
  double fund_change_pct = 7;
  bool has_fund_change = 8;
  // Disclosed voting power times market cap, summed over the sector's stocks
  // with a market cap. An estimate, not a share of the company.
  double disclosed_value_aud = 9;
  bool has_disclosed_value = 10;
  // The net change in voting power the window's notices state, in percentage
  // points summed over notices, and the notices behind it.
  double notice_net_pp = 11;
  int32 notices = 12;
  int32 rises = 13;
  int32 falls = 14;
  int32 became = 15;
  int32 ceased = 16;
  // Interests counted once across the sector's current registers.
  int32 interests = 17;
  // Super fund options' holdings at the window's end, AUD.
  double super_value_aud = 18;
  bool has_super_value = 19;
  // Investors' interests (super funds, index and active managers, hedge funds,
  // sovereign funds and insurers) counted once: what crowded counts. Banks and
  // brokers, often securities lending, are not counted.
  int32 investor_interests = 20;
}

// One stock in the window.
message InsightStock {
  string stock_code = 1;
  string company_name = 2;
  string sector = 3;
  // Index funds' holdings at the window's end, AUD, and the funds holding it.
  double fund_value_aud = 4;
  bool has_fund_value = 5;
  int32 funds = 6;
  // The change in shares the compared index funds hold, in percent of their
  // starting shares, and valued at the end file's price, AUD.
  double fund_change_pct = 7;
  bool has_fund_change = 8;
  double fund_flow_aud = 9;
  bool has_fund_flow = 10;
  // Index funds' shares as a percentage of shares on issue (ASIC's latest
  // short position report states the issue), at the window's end.
  double index_pct = 11;
  bool has_index_pct = 12;
  // The current register: disclosed voting power (each interest counted once,
  // as the newest notices read state it) and the interests behind it.
  double disclosed_pct = 13;
  int32 interests = 14;
  double disclosed_value_aud = 15;
  bool has_disclosed_value = 16;
  // The net change in voting power the window's notices state, and the notices.
  double notice_net_pp = 17;
  int32 notices = 18;
  double market_cap = 19;
  bool has_market_cap = 20;
}

// The rest of a sector past the stock cap, so the sector's tiles still sum.
message InsightStockRemainder {
  string sector = 1;
  int32 stocks = 2;
  double fund_value_aud = 3;
  double disclosed_value_aud = 4;
}

// A Sankey node. Column 0 is an institution kind, 1 an institution (or "Other"),
// 2 a sector (or "Other sectors").
message InsightFlowNode {
  string id = 1;
  string label = 2;
  int32 column = 3;
  // The kind for column 0 and 1; "" for a sector.
  string kind = 4;
  // The institution's registry slug, when it has a page.
  string slug = 5;
  // The sector for column 2.
  string sector = 6;
  double value_aud = 7;
}

message InsightFlowLink {
  // Indexes into nodes.
  int32 source = 1;
  int32 target = 2;
  double value_aud = 3;
}

// The money flow: institution kind to institution to sector.
message InsightFlow {
  repeated InsightFlowNode nodes = 1;
  repeated InsightFlowLink links = 2;
  double total_aud = 3;
  // The as-at range of what it reads: fund files, or notices.
  string as_at_from = 4;
  string as_at_to = 5;
}

message InsightBucket {
  // First and last day, inclusive, clipped to the window.
  string start = 1;
  string end = 2;
}

message InsightHeatCell {
  // The change in shares the index funds hold over the bucket, valued at the
  // later file's price, AUD: each fund compared with its own earlier file.
  double fund_flow_aud = 1;
  bool has_fund_flow = 2;
  int32 funds_compared = 3;
  // The net change in voting power the bucket's notices state, in percentage
  // points, and the notices behind it.
  double notice_net_pp = 4;
  int32 notices = 5;
  int32 rises = 6;
  int32 falls = 7;
  int32 became = 8;
  int32 ceased = 9;
}

message InsightHeatRow {
  string sector = 1;
  // One cell per bucket, in bucket order.
  repeated InsightHeatCell cells = 2;
}

message InsightHeatmap {
  repeated InsightBucket buckets = 1;
  repeated InsightHeatRow rows = 2;
}

// An institution's index fund or super option movement in the focused sector.
message InsightInstitutionFlow {
  string institution_slug = 1;
  string institution_name = 2;
  string kind = 3;
  double value_aud = 4;
  bool has_value = 5;
  double flow_aud = 6;
  bool has_flow = 7;
}

// One fund file's position in the focused stock.
message InsightFundPosition {
  string institution_slug = 1;
  string institution_name = 2;
  string kind = 3;
  string fund_name = 4;
  string fund_code = 5;
  // etf (an index fund) or super_phd (a super fund option).
  string source_kind = 6;
  // The end file's date, and the start file's when the fund is compared.
  string as_at = 7;
  string start_as_at = 8;
  double units = 9;
  bool has_units = 10;
  double value_aud = 11;
  bool has_value = 12;
  double start_units = 13;
  bool has_start_units = 14;
}

// One month of the timeline: what a window there can read.
message InsightTimelineMonth {
  // YYYY-MM.
  string month = 1;
  int32 notices = 2;
  int32 files = 3;
}

// The focused stock.
message InsightStockDetail {
  string stock_code = 1;
  string company_name = 2;
  string sector = 3;
  // The current register by kind, each interest counted once.
  double disclosed_pct = 4;
  repeated KindShare by_kind = 5;
  int32 holders = 6;
  string latest_notice_date = 7;
  // Every fund file holding it at the window's end, by value.
  repeated InsightFundPosition funds = 8;
  // The window's notices for it, newest first, at most 20.
  repeated SubstantialNotice notices = 9;
}

message GetOwnershipInsightsResponse {
  InsightWindow window = 1;
  // Every sector, by index fund value, then disclosed value.
  repeated InsightSector sectors = 2;
  // The largest stocks by either measure (every stock of the sector when one is
  // focused), and the rest of each sector.
  repeated InsightStock stocks = 3;
  repeated InsightStockRemainder remainders = 4;
  // Stocks before the cap.
  int32 stocks_total = 5;
  // Fund holdings (index funds and super options) at the window's end.
  InsightFlow flow_funds = 6;
  // Disclosed stakes times market cap, as the newest notices read state them.
  InsightFlow flow_disclosed = 7;
  InsightHeatmap heatmap = 8;
  // The window's largest stated moves (notices stating both figures), by the
  // size of the move, at most 20.
  repeated SubstantialNotice moves = 9;
  // When a sector is focused: its institutions' index fund and super option
  // movement, by the size of the flow.
  repeated InsightInstitutionFlow sector_institutions = 10;
  // When a stock is focused and known.
  InsightStockDetail stock_detail = 11;
  repeated InsightTimelineMonth timeline = 12;
}
