syntax = "proto3";

package shorts.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/shorts/v1alpha1;shortsv1alpha1";

import "options/v1/options.proto";

// Named, rule-based stock-picking strategies evaluated daily against ASX
// price structure, reported fundamentals and ASIC short interest. Every rule
// resolves to pass, fail or unknown; unknown (missing data) never counts as a
// pass. Nothing here is financial advice.
service StrategyService {
  // ==================== Strategy Picks ====================

  // List every strategy with its rules, metadata, caveats and sources, plus
  // the current market regime (S&P/ASX 200).
  rpc ListStrategies (ListStrategiesRequest) returns (ListStrategiesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Ranked picks for one strategy: status (triggered, setup, unknown, watch), a 0-100
  // score and a per-rule pass / fail / unknown breakdown for each stock. The
  // answer is the same bytes to every HTTP caller. When the public depth
  // limit is set, the rows are the top of the default ranking only, for every
  // HTTP caller, API-token holders included: a bearer token does not lift it.
  // Full depth comes from GetViewerStrategyPicks, which accepts a bearer token.
  rpc GetStrategyPicks (GetStrategyPicksRequest) returns (GetStrategyPicksResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // The same ranked picks as GetStrategyPicks, at the caller's full depth. It
  // needs a signed-in caller (a bearer token, or the web's session) and is never
  // clamped: the viewer field reports access "free" or "premium" and clamped
  // false.
  rpc GetViewerStrategyPicks (GetStrategyPicksRequest) returns (GetStrategyPicksResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // How one stock reads against every strategy: status, score, rank and the
  // per-rule pass / fail / unknown breakdown. A stock that is not a candidate
  // for a strategy still gets its rule results, with status "none".
  rpc GetStockStrategyFit (GetStockStrategyFitRequest) returns (GetStockStrategyFitResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // One published version of a strategy's rules: its parameters, what changed
  // from the version before, and its known issues. An empty version_hash is
  // the live version. Canonical versions only; an unknown hash is NotFound.
  rpc GetStrategyVersion (GetStrategyVersionRequest) returns (GetStrategyVersionResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Every published canonical version of a strategy (all strategies when
  // strategy_id is empty), in publication order: the rules changelog.
  rpc ListStrategyVersions (ListStrategyVersionsRequest) returns (ListStrategyVersionsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Where the readings come from: the latest session, the newest completed
  // snapshot session, the newest ASIC short reports and the next update time.
  rpc GetStrategyDataStatus (GetStrategyDataStatusRequest) returns (GetStrategyDataStatusResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // The status changes of one strategy's canonical rules version, newest first:
  // a stock entering or leaving a status, with the rule results that day.
  rpc ListStrategySignalEvents (ListStrategySignalEventsRequest) returns (ListStrategySignalEventsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // ==================== Saved Strategies ====================

  // Save a strategy to the signed-in caller's list. Saving a strategy that is
  // already saved succeeds and keeps its first save time. The list holds at
  // most 20; a save past that is refused with PermissionDenied and the
  // X-Entitlement-Detail metadata (capability cap_reached, with the limit), and
  // a repeat save at the cap still succeeds.
  rpc SaveStrategy (SaveStrategyRequest) returns (SaveStrategyResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Remove a strategy from the caller's list. Removing one that is not saved
  // succeeds.
  rpc UnsaveStrategy (UnsaveStrategyRequest) returns (UnsaveStrategyResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // The caller's saved strategies, most recent first, each with today's
  // status counts.
  rpc ListSavedStrategies (ListSavedStrategiesRequest) returns (ListSavedStrategiesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // ==================== Backtests ====================

  // The backtest evidence of every strategy: each strategy's state, its chained windows (in-sample
  // to live_from, then the recorded paper track), its annual returns, a month-end curve and its
  // paper-track summary. Public: the same bytes to every caller, cached per instance.
  rpc ListStrategyEvidence (ListStrategyEvidenceRequest) returns (ListStrategyEvidenceResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // One canonical backtest run: the live version's published run (run_id 0), or a canonical run by
  // id. A variant run, a gate-refused run or an unknown id is NotFound. A not-computable outcome
  // fetched by id returns its stored state. The series is daily for windows of 500 sessions or
  // fewer, weekly otherwise (series_resolution says which). Public and cached per instance.
  rpc GetBacktestRun (GetBacktestRunRequest) returns (GetBacktestRunResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // The trades of one canonical run, keyset-paged and filterable by stock and exit reason. Signed-in
  // callers only. A variant, gate-refused or unknown run is NotFound.
  rpc ListBacktestTrades (ListBacktestTradesRequest) returns (ListBacktestTradesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // Two or three canonical strategies over their common window: windows, rebased weekly curves,
  // daily-return correlations and the rule differences. Signed-in callers only. Variant references
  // are refused until variant comparison ships.
  rpc CompareStrategies (CompareStrategiesRequest) returns (CompareStrategiesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }
}

// ==================== Strategy Messages ====================

// A named stock-picking strategy and how we evaluate it.
message Strategy {
  string id = 1;                                // Stable slug, e.g. "zanger-breakout".
  string name = 2;
  string author = 3;                            // e.g. "Dan Zanger".
  string tagline = 4;                           // One sentence.
  repeated string description_paragraphs = 5;   // 2-4 paragraphs, plain text.
  repeated StrategyRule rules = 6;
  StrategyMetadata metadata = 7;
  repeated string caveats = 8;                  // What our data cannot see.
  repeated string sources = 9;                  // Attribution lines.
  StrategyVersionRef version = 10;              // The live rules version this definition is evaluated under.
}

// One rule of a strategy: the author's version and exactly how we test it.
message StrategyRule {
  string id = 1;              // e.g. "growth", "base", "breakout", "regime", "rs", "liquidity", "short_interest".
  string title = 2;
  string rule_text = 3;       // The rule in the author's terms.
  string evaluation = 4;      // Exactly how we test it, with thresholds.
  bool core = 5;              // Must pass for status "triggered".
  string data_source = 6;     // "stock_fundamentals", "stock_prices", "index_prices" or "asic_shorts".
  bool trigger = 7;           // A trigger: a core rule a setup may still fail (e.g. breakout, near_high, rs_leader, above_sma200).
  double weight = 8;          // Share of the score this rule carries, 0-1; the weights of a strategy sum to 1.
  double threshold = 9;       // The number the rule tests, in unit. Meaningful only when has_threshold.
  bool has_threshold = 10;    // False for a rule with no single number to test (breakout, regime, trend_stack, rs_leader), or one that passes on more than one condition (base, growth, eps_growth).
  string unit = 11;           // "pct", "pp", "aud", "days", "x" or empty. Meaningful only when has_threshold.
  string comparator = 12;     // ">=", "<=" or ">". Meaningful only when has_threshold.
}

// Descriptive metadata for a strategy.
message StrategyMetadata {
  string style = 1;             // e.g. "momentum-breakout", "trend-following".
  string holding_period = 2;    // e.g. "weeks to months".
  string risk_posture = 3;      // e.g. "cut on a failed breakout (back inside the base)".
  string universe = 4;          // e.g. "ASX equities with at least A$250k daily turnover".
  string refresh_cadence = 5;   // e.g. "daily after the price sweep".
  int32 rule_count = 6;
}

// The broad market trend, read from an index (the S&P/ASX 200, "XJO").
message MarketRegime {
  string index_code = 1;
  string as_of = 2;               // YYYY-MM-DD of the last index close.
  string regime = 3;              // "uptrend" | "neutral" | "downtrend"; empty when unavailable.
  double close = 4;
  double sma50 = 5;
  double sma200 = 6;
  double pct_off_52w_high = 7;    // Negative or zero.
  string verdict = 8;             // Strategy-specific sentence, e.g. "Stand aside: XJO below its 200-day average."
}

// The outcome of one rule for one stock.
message RuleResult {
  string rule_id = 1;
  string status = 2;      // "pass" | "fail" | "unknown".
  string detail = 3;      // Human-readable evidence, e.g. "Revenue +41% YoY (FY to 2026-06-30)".
  double value = 4;       // The number the rule tested, when there is one.
  bool has_value = 5;     // False when value is absent (unknown), never read value then.
  // Why an unknown rule could not be tested: "no_price_history", "no_volume",
  // "no_index", "no_fundamentals", "not_meaningful", "asic_report_stale",
  // "asic_value_missing" or "basis_change". Empty for pass and fail.
  string reason = 6;
  // For a failing trigger rule: 0-1, 1 at the trigger line and 0 at the far
  // distance. Meaningful only when has_proximity.
  double proximity = 7;
  bool has_proximity = 8;
  // True when this is a failing trigger rule on a setup row: the stock is
  // waiting for the trigger, not yet triggered.
  bool waiting = 9;
}

// One ranked stock for a strategy.
message StrategyPick {
  int32 rank = 1;                // 1-based, across the full (unfiltered) list.
  string stock_code = 2;
  string company_name = 3;
  string industry = 4;
  string status = 5;             // "triggered" | "setup" | "unknown" | "watch".
  double score = 6;              // 0-100, orders rows within a status.
  repeated RuleResult rules = 7;

  // Headline numbers for the table.
  double close = 8;              // Meaningful only when has_close.
  string as_of = 9;              // YYYY-MM-DD of the last price.
  double pct_off_52w_high = 10;
  double volume_ratio_50d = 11;
  double base_depth_pct = 12;
  int32 base_length_days = 13;
  double pivot = 14;             // The base high: the breakout and invalidation level.
  double revenue_yoy_pct = 15;
  bool has_revenue_yoy = 16;
  double eps_yoy_pct = 17;
  bool has_eps_yoy = 18;
  double rs_3m_pct = 19;         // Meaningful only when has_rs_3m_pct.
  double short_pct = 20;         // Meaningful only when has_short_pct.
  double market_cap = 21;        // Meaningful only when has_market_cap.
  string logo_url = 22;

  // Presence flags for the headline numbers above. proto3 doubles cannot tell
  // 0 from missing, and "0 means unknown" is the screener defect this feature
  // must not repeat: reading short_pct 0 as "no short interest" is wrong for a
  // stock we simply have no ASIC row for.

  // True when rs_3m_pct is set (enough stock and XJO history for the 3m window).
  bool has_rs_3m_pct = 23;
  // True when short_pct is set (the stock has a reported ASIC short position).
  bool has_short_pct = 24;
  // True when market_cap is set.
  bool has_market_cap = 25;
  // True when close is set (the stock has a valid last price).
  bool has_close = 26;

  // Reported fundamentals behind the growth cells, with their basis and
  // provenance, plus headline ratios. Absent when the stock has no
  // fundamentals row at all.
  PickFundamentals fundamentals = 27;

  // Signal evidence (display-only in this release where noted).
  double days_to_cover = 28;              // Meaningful only when has_days_to_cover.
  bool has_days_to_cover = 29;
  double rs_6m_pct = 30;                  // Meaningful only when has_rs_6m_pct.
  bool has_rs_6m_pct = 31;
  double rs_6m_percentile = 32;           // Rank of rs_6m_pct across the evaluated universe on the quartile's own scale, 0-100 (75 or more is the top quartile).
  bool has_rs_6m_percentile = 33;
  double dollar_volume_20d = 34;          // Average daily turnover over 20 sessions, A$. Meaningful only when has_dollar_volume_20d.
  bool has_dollar_volume_20d = 35;
  string breakout_date = 36;              // YYYY-MM-DD of the breakout session; empty when there was none.
  string short_report_date = 37;          // YYYY-MM-DD of the ASIC report the short figure came from; empty when there is no short figure.
  string short_available_date = 38;       // YYYY-MM-DD the report became public; empty with no report, or a report dated before 2026.
  string short_status = 39;               // "reported" when the stock has a short figure; empty otherwise.
  // Meaningful only when has_pct_off_52w_high. pct_off_52w_high is 0 at the high,
  // so a stock with no 52-week high yet must not read as "at the high".
  bool has_pct_off_52w_high = 40;
  string ca_suspect_date = 41;            // Corporate-action suspect date; empty until the basis check ships.
}

// Fundamentals for one pick. Every ratio is computed within one reporting
// currency from one flow period and an aligned balance sheet; has_* is false
// when an input is missing or the ratio is not meaningful for the company.
message PickFundamentals {
  string revenue_basis_period_type = 1;  // "annual" | "half" | "ttm"; empty when no revenue growth.
  string revenue_period_end = 2;         // YYYY-MM-DD, end of the latest period in the revenue pair.
  string eps_basis_period_type = 3;      // "annual" | "half" | "ttm"; empty when no EPS growth.
  string eps_period_end = 4;             // YYYY-MM-DD, end of the latest period in the EPS pair.
  string currency = 5;                   // Reporting currency (ISO 4217).
  string fetched_at = 6;                 // RFC 3339, newest fetch of the inputs.
  string revenue_basis_source = 7;       // "vendor" | "filing" (a company filing, extracted); empty when unknown.
  string eps_basis_source = 8;           // "vendor" | "filing"; empty when unknown.
  double net_margin_pct = 9;
  bool has_net_margin_pct = 10;
  double roe_pct = 11;
  bool has_roe_pct = 12;
  double fcf_margin_pct = 13;
  bool has_fcf_margin_pct = 14;
  double net_debt_to_ebitda = 15;        // Net debt excluding leases over EBITDA (normalized when published).
  bool has_net_debt_to_ebitda = 16;
  double pe_ratio = 17;                  // Latest close over 12-month EPS; AUD reporters only.
  bool has_pe_ratio = 18;
  bool is_financial = 19;                // Bank, insurer or other financial: some ratios are not meaningful.
  bool net_income_positive = 20;         // Latest annual net income above zero.
  repeated string not_meaningful = 21;   // Ratio names withheld because is_financial.
}

// Request for GetStrategyPicks.
message GetStrategyPicksRequest {
  string strategy_id = 1;   // Required, e.g. "zanger-breakout".
  // Default 20, max 100. Under the public depth limit every HTTP caller, API
  // tokens included, gets at most that many rows of the default ranking; a
  // larger limit is clamped to it. GetViewerStrategyPicks is not clamped.
  int32 limit = 2;
  // Rows to skip. Under the public depth limit an offset other than 0 is
  // refused with PermissionDenied (the X-Entitlement-Detail names
  // full_signal_list and GetViewerStrategyPicks); use GetViewerStrategyPicks
  // for the rows beyond the public depth.
  int32 offset = 3;
  string status = 4;        // Optional filter: "triggered" | "setup" | "unknown" | "watch".
  // Optional ordering: "score" (default), "revenue_yoy", "eps_yoy", "roe",
  // "net_margin", "fcf_margin", "pe" (ascending) or "market_cap". Unknown values
  // sort last; growth above +500% or below -95% sorts after every measured value.
  // rank keeps the strategy's own ranking whatever the order.
  string sort_by = 5;
  bool require_fundamentals = 6;   // Only stocks with a fundamentals row.
}

// Response for GetStrategyPicks.
message GetStrategyPicksResponse {
  Strategy strategy = 1;
  MarketRegime regime = 2;
  repeated StrategyPick picks = 3;
  int32 total_count = 4;                   // Picks matching the status filter, before paging.
  int32 universe_count = 5;                // Stocks evaluated.
  int32 fundamentals_coverage_count = 6;   // Evaluated stocks with growth data.
  string as_of = 7;                        // YYYY-MM-DD of the latest price in the universe.
  int32 fundamentals_rows_count = 8;       // Evaluated stocks with any reported fundamentals row.
  // Counts of every pick by status, over the whole ranked list before the
  // status filter, the fundamentals filter and paging.
  StatusCounts status_counts = 9;
  StrategyVersionRef version = 10;        // The live rules version that produced these picks.
  string session_date = 11;               // YYYY-MM-DD of the session the picks are as at.
  string short_report_date = 12;          // Newest ASIC report date behind the short figures; empty when none.
  string short_available_date = 13;       // When that report became public; empty for a report dated before 2026.
  bool stale = 14;                        // True when the index has closed a session the prices have not reached (the data is delayed).
  double rs_quantile_threshold = 16;      // The session's top-quartile cut-off of rs_6m_pct (rs_leader reads it).
  bool has_rs_quantile_threshold = 17;
  string universe_label = 18;             // The universe the picks were drawn from, as the strategy names it.
  // Whose depth this answer is. A clamp is not an error: clamped is true when
  // more rows exist than this access receives.
  ViewerDepth viewer = 15;
}

// The depth the caller's access receives on a picks list.
message ViewerDepth {
  string access = 1;           // "anonymous" | "free" | "premium".
  bool clamped = 2;            // More rows exist than this access returns.
  string required_access = 3;  // The access that lifts the clamp ("free").
  int32 limit = 4;             // Rows this access may receive; 0 means unlimited.
}

// The version of a strategy's rules that produced a set of picks.
message StrategyVersionRef {
  string strategy_id = 1;
  string label = 2;          // "v0", "v1", "custom".
  string rules_hash = 3;     // 64 hex characters; UIs show the first 8.
  string engine_version = 4;
  string feature_set = 5;    // "fs1".
  string status = 6;         // "draft" | "live" | "superseded" | "retired".
  string live_from = 7;      // YYYY-MM-DD; empty before the first live session.
  string kind = 8;           // "canonical" | "variant".
  string variant_id = 9;
}

// Counts of ranked picks by status.
message StatusCounts {
  int32 triggered = 1;
  int32 setup = 2;
  int32 watch = 3;
  int32 unknown = 4;
}

// Request for GetStockStrategyFit.
message GetStockStrategyFitRequest {
  string stock_code = 1;   // ASX code, e.g. "BHP".
}

// One strategy's reading of one stock.
message StrategyFit {
  string strategy_id = 1;
  string strategy_name = 2;
  string status = 3;        // "triggered" | "setup" | "unknown" | "watch" | "none" (not a candidate).
  double score = 4;         // 0-100; 0 when status is "none".
  int32 rank = 5;           // 1-based rank among the strategy's picks; 0 when status is "none".
  int32 total_count = 6;    // Picks the strategy has in total.
  repeated RuleResult rules = 7;
  string version_hash = 8;  // rules_hash of the live version this reading was evaluated under.
}

// The price features the evaluator read for one stock (mv_price_features),
// so a chart can draw the levels the rules tested. Every nullable number
// travels with a has_ flag; read the value only when its flag is true.
message PriceFeatures {
  string as_of = 1;                      // YYYY-MM-DD of the last close.
  double close = 2;
  double sma50 = 3;                      bool has_sma50 = 4;
  double sma150 = 5;                     bool has_sma150 = 6;
  double sma200 = 7;                     bool has_sma200 = 8;
  double sma200_prior_month = 9;         bool has_sma200_prior_month = 10;
  double high52w = 11;                   bool has_high52w = 12;
  double low52w = 13;                    bool has_low52w = 14;
  // The pivot: the breakout and invalidation level.
  double base_high = 15;                 bool has_base_high = 16;
  double base_low = 17;                  bool has_base_low = 18;
  double base_depth_pct = 19;            bool has_base_depth_pct = 20;
  int32 base_length_days = 21;           bool has_base_length_days = 22;
  bool breakout_recent = 23;
  string breakout_date = 24;             // YYYY-MM-DD; empty when there was no breakout.
  double rs3m_pct = 25;                  bool has_rs3m_pct = 26;
  double rs6m_pct = 27;                  bool has_rs6m_pct = 28;
  double volume_ratio50d = 29;           bool has_volume_ratio50d = 30;
  int32 sessions_available = 31;
}

// Response for GetStockStrategyFit.
message GetStockStrategyFitResponse {
  string stock_code = 1;
  string as_of = 2;                 // YYYY-MM-DD of the latest price in the universe.
  MarketRegime regime = 3;
  repeated StrategyFit fits = 4;    // One per strategy; empty when the stock is outside the universe.
  bool in_universe = 5;
  PriceFeatures price_features = 6;  // Set only when in_universe is true.
  string session_date = 7;                 // YYYY-MM-DD of the session the readings are as at.
  string short_report_date = 8;            // Newest ASIC report date behind the short figures; empty when none.
  string short_available_date = 9;         // When that report became public; empty for a report dated before 2026.
  bool stale = 10;                         // True when the index has closed a session the prices have not reached (the data is delayed).
  bool eligible = 11;                      // False when the stock cannot be read against the strategies at all.
  string ineligible_reason = 12;           // Why not eligible, e.g. "short_history" (fewer than 60 sessions in the last 400 days); empty when eligible.
}

// Request for ListStrategies.
message ListStrategiesRequest {}

// Response for ListStrategies.
message ListStrategiesResponse {
  repeated Strategy strategies = 1;
  MarketRegime regime = 2;   // Verdict is strategy-neutral here; GetStrategyPicks phrases it per strategy.
}

// Request for GetStrategyVersion.
message GetStrategyVersionRequest {
  string strategy_id = 1;    // Required, e.g. "zanger-breakout".
  string version_hash = 2;   // rules_hash of a published version; empty for the live version.
}

// Response for GetStrategyVersion.
message GetStrategyVersionResponse {
  StrategyVersionDetail version = 1;
}

// Request for ListStrategyVersions.
message ListStrategyVersionsRequest {
  string strategy_id = 1;    // Empty for every strategy's versions.
}

// Response for ListStrategyVersions.
message ListStrategyVersionsResponse {
  repeated StrategyVersionDetail versions = 1;
}

// One published version of a strategy's rules, as the changelog states it.
// Recipe and recipe_hash (4 and 5) arrive with the recipe schema.
message StrategyVersionDetail {
  StrategyVersionRef version = 1;
  repeated RuleParam params = 2;    // Every numeric parameter of every rule, in rule order.
  repeated string policies = 3;     // Universe and data policy, one rendered sentence each.
  repeated string changes = 6;      // What this version changed from the one before it.
  repeated string known_issues = 7; // What this version gets wrong, worded as defects.
  string superseded_on = 8;         // YYYY-MM-DD the next version went live; empty while live.
  string retired_on = 9;            // YYYY-MM-DD the version was retired; empty while it is still evaluated.
  string canonical_json = 10;       // The hashed spec in canonical form, for audit.
}

// One numeric parameter of one rule in a version.
message RuleParam {
  string rule_id = 1;
  string name = 2;     // The parameter's key, e.g. "min_pct".
  double value = 3;
}

// ==================== Saved Strategy Messages ====================

// Request for SaveStrategy.
message SaveStrategyRequest {
  string strategy_ref = 1;   // A canonical strategy id, or "variant:<id>" for a variant the caller owns.
}

// Response for SaveStrategy.
message SaveStrategyResponse {
  SavedStrategy saved = 1;   // The entry as ListSavedStrategies lists it.
}

// Request for UnsaveStrategy.
message UnsaveStrategyRequest {
  string strategy_ref = 1;   // The reference SaveStrategy was given.
}

// Response for UnsaveStrategy.
message UnsaveStrategyResponse {}

// Request for ListSavedStrategies.
message ListSavedStrategiesRequest {}

// Response for ListSavedStrategies.
message ListSavedStrategiesResponse {
  repeated SavedStrategy strategies = 1;   // Most recent save first.
  int32 limit = 2;                         // The most strategies one caller may save.
}

// One strategy the signed-in caller saved.
message SavedStrategy {
  string strategy_ref = 1;          // A canonical strategy id, or "variant:<id>".
  string strategy_id = 2;           // The canonical id; empty for a variant.
  string name = 3;                  // The strategy's name; empty when it is not in the registry.
  string saved_at = 4;              // RFC 3339 time of the first save.
  StatusCounts status_counts = 5;   // Today's counts; absent for a variant or when they cannot be read.
  StrategyVersionRef version = 6;   // The live rules version the counts were evaluated under; absent for a variant or when unknown.
  string session_date = 7;          // The session the counts are as at (YYYY-MM-DD); empty when the counts are absent.
}

// Request for GetStrategyDataStatus.
message GetStrategyDataStatusRequest {}

// Response for GetStrategyDataStatus. Dates are YYYY-MM-DD; times are RFC 3339 UTC.
message GetStrategyDataStatusResponse {
  string latest_session = 1;                   // The newest index session the price data reaches; "" when unknown.
  string prices_completed_at = 2;              // When the newest completed price sweep finished; "" when none.
  string snapshot_as_of = 3;                   // The newest completed daily snapshot session; "" when none is completed. The picks read it once the source is the snapshot; until then they read the views.
  string snapshot_completed_at = 4;            // When that session's last phase completed.
  repeated AsicReportStatus asic_reports = 5;  // The newest ASIC short-position reports, newest first (at most 10).
  string next_update_utc = 6;                  // The next scheduled refresh of the picks.
  int32 priced_codes = 7;                      // Codes the snapshot session priced.
}

// One ASIC short-position report as the source dates show it.
message AsicReportStatus {
  string report_date = 1;          // The report's as-at date.
  string available_date = 2;       // When the report became public (T+ the publication lag).
  string first_ingested_at = 3;    // When we first saw the report; "" when not recorded.
  int32 rows = 4;                  // Codes of the report that are loaded.
  bool complete = 5;               // Every code the report carries is loaded.
}

// Request for ListStrategySignalEvents.
message ListStrategySignalEventsRequest {
  string strategy_id = 1;    // Required: a canonical strategy id.
  string version_hash = 2;   // Empty for the live version; else a live or superseded canonical rules hash.
  string stock_code = 3;     // Optional: one stock's events only.
  string since = 4;          // Optional YYYY-MM-DD, inclusive.
  string page_token = 5;     // The next_page_token of the previous page.
  int32 page_size = 6;       // 1 to 200; 0 is the default of 50.
}

// Response for ListStrategySignalEvents.
message ListStrategySignalEventsResponse {
  repeated StrategySignalEvent events = 1;  // Newest first.
  string next_page_token = 2;               // Empty on the last page.
  StrategyVersionRef version = 3;           // The rules version the events belong to.
}

// One status change of one stock under one canonical rules version.
message StrategySignalEvent {
  string stock_code = 1;
  string company_name = 2;
  string session_date = 3;          // The session the status changed on (YYYY-MM-DD).
  string prev_session_date = 4;     // The session it changed from; "" when none.
  string from_status = 5;           // triggered, setup, unknown, watch or none.
  string to_status = 6;             // triggered, setup, unknown, watch or none.
  double score = 7;
  double close = 8;
  double pivot = 9;
  bool has_pivot = 10;
  repeated RuleResult rules = 11;   // The rule results recorded that session (values and proximities as stored).
  string rules_hash = 12;
}

// ==================== Backtest Messages ====================

// Request for ListStrategyEvidence. It takes no arguments.
message ListStrategyEvidenceRequest {}

// Response for ListStrategyEvidence. Dates are YYYY-MM-DD.
message ListStrategyEvidenceResponse {
  repeated StrategyEvidence strategies = 1;   // Every strategy, in registry order.
  string window_start = 2;                    // The canonical windows open here: 2019-05-01, the first full month of XJT.
  string prices_through = 3;                  // The newest price session the published runs read; "" when none is published.
  string benchmark_name = 4;                  // The benchmark every run is measured against.
  repeated string footnotes = 5;              // The copy every evidence surface prints beside the figures.
}

// One strategy's backtest evidence on the live version.
message StrategyEvidence {
  string strategy_id = 1;
  StrategyVersionRef version = 2;        // The live canonical version; absent when none is registered.
  string state = 3;                      // published | approximate | run_required | running | not_computable.
  string computable_from = 4;            // not_computable: the first month-end the universe is computable; "" when none.
  string fiscal_label = 5;               // not_computable: the measured label, e.g. FY2024; "" when none.
  repeated WindowMetrics windows = 6;    // The chained windows, in window order.
  repeated AnnualReturn annual = 7;      // The annual table of the since-May-2019 chain.
  repeated SeriesPoint mini_curve = 8;   // Month ends of the since-May-2019 chain, at most 96 points.
  StatusCounts today = 9;                // Today's counts for the live version; absent when they cannot be read.
  PaperTrackSummary paper = 10;          // The recorded paper track since live_from.
  string survivorship = 11;              // The survivorship statement, with the measurement caveat where one applies.
  int64 run_id = 12;                     // The published run the figures come from; 0 when none.
  string latest_screen = 13;             // The session the today counts are as at (YYYY-MM-DD); "" when none.
  string state_reason = 14;              // Why the state is what it is, in words the explorer can print.
  string running_since = 15;             // running: when the request started, RFC 3339.
  double computable_share_pct = 16;      // not_computable: the measured universe share, when measured.
  bool has_computable_share = 17;
}

// Request for GetBacktestRun.
message GetBacktestRunRequest {
  string strategy_id = 1;    // Required: a canonical strategy id.
  int64 run_id = 2;          // 0: the published run of the live version. Otherwise a canonical run of this strategy.
  string resolution = 3;     // "weekly" (default) or "daily". Daily is served for windows of 500 sessions or fewer.
  string window = 4;         // since_2019_05 (default) | since_2023 | trailing_12m | live. live needs a paper track.
}

// Response for GetBacktestRun.
message GetBacktestRunResponse {
  BacktestRun run = 1;
}

// One canonical backtest run as the API serves it.
message BacktestRun {
  string state = 1;                              // published | approximate | run_required | running | not_computable.
  string state_reason = 2;                       // Why the state is what it is, in words.
  string computable_from = 3;                    // not_computable: "" when the 50% threshold was never met.
  string fiscal_label = 4;                       // not_computable: the measured label; "" when none.
  BacktestRunIdentity identity = 5;              // Absent for run_required, running and not_computable.
  repeated WindowMetrics windows = 6;            // Chained windows (5.8).
  repeated AnnualReturn annual = 7;              // Annual table of the since-May-2019 chain.
  repeated MonthlyReturn monthly = 8;            // Monthly table of the since-May-2019 chain.
  repeated SeriesPoint series = 9;               // The served window's points: daily or weekly, at most 500.
  repeated CoverageYear coverage = 10;           // Both coverage measures, by year.
  repeated CoverageMonth coverage_monthly = 11;  // Both coverage measures, by month.
  Survivorship survivorship = 12;
  repeated Sensitivity sensitivity = 13;         // The five sensitivity runs of the canonical run.
  RecipeLines recipe = 14;                       // The recipe prose, preface first.
  TradeSummary trade_summary = 15;               // Closed trades that exited before live_from (in-sample).
  StrategyVersionRef live_version = 16;          // The live canonical version now.
  bool rules_match_live = 17;                    // The run's rules and recipe are the live ones.
  bool engine_matches_live = 18;                 // The run's engine is the running engine.
  string replay_agreement = 19;                  // "Replay agrees: 14 of 15 trades", or why it is not comparable.
  string input_change_note = 20;                 // The diff note against the previous run; "" when none.
  repeated string disclosures = 21;              // Printed beside the figures.
  repeated string data_notes = 22;               // Data-quality notes of the run, as prose.
  string strategy_id = 23;
  string running_since = 24;                     // running: when the request started, RFC 3339.
  string series_resolution = 25;                 // "daily" or "weekly": what the series carries.
  double computable_share_pct = 26;              // not_computable: the measured universe share, when measured.
  bool has_computable_share = 27;
  DataQuality data_quality = 28;                 // The run's data-quality counts, as fields.
  string window_id = 29;                         // The window the series and window tables are served for.
  string fundamentals_label = 30;                // The fundamentals policy, in words the surfaces print.
}

// A run's data-quality counts (5.11). Every count the run stores is served here, so no reader has to
// parse the prose.
message DataQuality {
  int32 delisting_exits = 1;
  int32 corporate_action_exits = 2;
  int32 ca_suspects = 3;                  // Corporate-action suspects: ASIC share steps with an unconfirmed price.
  int32 fallback_close = 4;               // Held bars that fell back to a close price.
  int32 price_return_trades = 5;          // Trades holding a bar on price return (4.8).
  int32 capacity_capped = 6;
  int32 stale_mark_trades = 7;
  int32 delayed_exits = 8;
  map<string, int32> cancelled_entries = 9;   // Entries cancelled, by reason.
  int32 dividends_credited = 10;          // Ex-dates credited in cash.
  string consolidation_note = 11;         // The 5.11 note on pre-re-sync consolidations.
}

// A run's fingerprint, provenance and recipe identity.
message BacktestRunIdentity {
  int64 run_id = 1;
  string run_key = 2;
  string kind = 3;                    // "publish" for every run the API serves.
  StrategyVersionRef version = 4;
  string recipe_id = 5;
  string recipe_hash = 6;
  string engine_version = 7;
  string window_start = 8;
  string window_end = 9;
  string returns = 10;                // "total".
  string benchmark = 11;              // "XJT".
  string fundamentals = 12;           // "strict" or "approx_period_end_plus_2m".
  string prices_through = 13;
  string asic_report_through = 14;
  string in_sample_until = 15;        // live_from minus one day.
  string finished_at = 16;
  string input_hash = 17;
  string output_hash = 18;
  string build_revision = 19;
  string risk_free = 20;              // The risk-free rate the Sharpe ratio uses, or "none".
  string reference_name = 21;         // The recipe's reference universe, named.
  string run_date = 22;               // The day the run finished, Sydney time (YYYY-MM-DD).
}

// One window's metrics on the chained curve.
message WindowMetrics {
  string window = 1;               // since_2019_05 | since_2023 | trailing_12m | live.
  string from = 2;                 // YYYY-MM-DD, the window's first session.
  string to = 3;                   // YYYY-MM-DD, the window's last session.
  double total_return_pct = 4;
  double cagr_pct = 5;
  bool has_cagr = 6;               // False below 365 calendar days; the return is then not annualised.
  double benchmark_cagr_pct = 7;
  bool has_benchmark = 8;
  double reference_cagr_pct = 9;
  bool has_reference = 10;
  double max_drawdown_pct = 11;    // Negative; zero when the curve never falls.
  double sharpe = 12;
  double sharpe_se = 13;           // Lo (2002) standard error of the annual Sharpe ratio.
  bool has_sharpe = 14;            // False below 126 daily returns: "n/m".
  int32 closed_trades = 15;        // Trades whose exit executed inside the window.
  double win_rate_pct = 16;
  bool has_win_rate = 17;
  double exposure_pct = 18;
  bool recorded_tail = 19;         // The window ends in the paper track, recorded after live_from.
  string label = 20;               // The window's name, e.g. "Since May 2019".
  string note = 21;                // "in-sample to 2026-11-23, recorded after", or "paper track only, recorded".
  bool not_annualised = 22;
  int32 sessions = 23;
  int32 calendar_days = 24;
  double volatility_pct = 25;      // Annualised daily volatility.
  bool has_volatility = 26;
  bool has_total_return = 27;
  string peak_date = 28;           // The session of the window's deepest peak; "" when the curve never falls.
  string trough_date = 29;         // The session of the deepest fall.
  string recovery_date = 30;       // The first session back at the peak; "not recovered" when it has not; "" when none.
  double benchmark_total_return_pct = 31;   // XJT over the window: shown for every window, annualised or not.
  bool has_benchmark_total_return = 32;
  double reference_total_return_pct = 33;
  bool has_reference_total_return = 34;
}

// One period of the annual table: the strategy, XJT and the same-data reference.
message AnnualReturn {
  int32 year = 1;
  string state = 2;                // complete | partial | to_date (the current year, measured to date).
  double strategy_pct = 3;
  double benchmark_pct = 4;
  double reference_pct = 5;
  string months = 6;               // "May-Dec" for a partial first year, "YTD" for the current; "" for a whole year.
  double coverage_pct = 7;         // Coverage under coverage_measure.
  bool coverage_measurable = 8;
  bool approximate = 9;            // An approximate run's year. Nothing sets it in this release.
  bool has_benchmark = 10;
  bool has_reference = 11;
  string coverage_measure = 12;    // qualifying_5pct_short | all_reported | not_measurable: the measure the coverage uses.
}

// One month of the monthly table.
message MonthlyReturn {
  int32 year = 1;
  int32 month = 2;
  string state = 3;                // complete | partial | to_date.
  double strategy_pct = 4;
  double benchmark_pct = 5;
  double reference_pct = 6;
  bool has_benchmark = 7;
  bool has_reference = 8;
  string label = 9;                // "from 1 May" for the first month, "MTD" for the current one; "" otherwise.
}

// Coverage by year. The qualifying measure (name-days of at least 5% short) and the all-reported measure
// (every ordinary name in the report) are both served; each figure names its measure.
message CoverageYear {
  int32 year = 1;
  bool measurable = 2;                    // The qualifying measure has name-days in the year.
  int64 qualifying_name_days = 3;
  int64 priced_name_days = 4;
  double coverage_pct = 5;                // Qualifying coverage: priced over qualifying name-days.
  double all_reported_pct = 6;            // All-reported coverage.
  int32 delisting_exits = 7;              // Delisting exits of trades that exited in the year.
  int32 ca_exits = 8;                     // Corporate-action exits of trades that exited in the year.
  bool all_reported_measurable = 11;
  int64 all_reported_name_days = 12;
  int64 all_reported_priced_name_days = 13;
  // 9 and 10 (flat-bar cancellations, dividend-step suspects) are not stored per year; they are run totals
  // in DataQuality and are not repeated here.
}

// Coverage by month under both measures. Counts are not served: the percentages are.
message CoverageMonth {
  string month = 1;                // YYYY-MM.
  double coverage_pct = 2;         // Qualifying coverage.
  bool measurable = 3;
  double all_reported_pct = 4;
  bool all_reported_measurable = 5;
}

// Survivorship block. Measurement is one of 8.2's values: measured | partial | not_measurable.
message Survivorship {
  string measurement = 1;
  string direction = 2;            // flatters.
  string statement = 3;            // The copy the run prints.
  string caveat = 4;               // The extra line some recipes print; "" otherwise.
}

// One sensitivity run next to the canonical run.
message Sensitivity {
  string id = 1;                   // costs_x2 | asic_lag_plus_2 | delisting_zero | entry_plus_1 | flat_mockup_costs.
  string label = 2;
  double cagr_pct = 3;
  bool has_cagr = 4;
  double excess_vs_benchmark_pct = 5;
  double max_drawdown_pct = 6;
  bool fragile = 7;                // A sign flip of the excess CAGR; fragile_chip names it.
  bool applies = 8;                // False when the recipe does not take the change; reason says why.
  string reason = 9;
  bool has_excess = 10;
  string fragile_chip = 11;        // "Fragile to costs", "Fragile to publication timing", "Fragile to entry timing"; "" otherwise.
}

// One point of a series. Equity is in A$ on the chained curve, rounded to whole dollars. Benchmark and
// reference are index levels, never zero, so zero reads as not measured (the reference is not recorded
// after the freeze, and runs published before the reference fix carry none).
message SeriesPoint {
  string date = 1;
  double equity = 2;
  double benchmark = 3;
  double reference = 4;
  double drawdown_pct = 5;         // Negative or zero, two decimals.
  double exposure_pct = 6;
  bool recorded = 7;               // A paper-track session, recorded after live_from.
}

// The recipe's prose, one field per line, in print order: preface, entry, exits, then the rest.
message RecipeLines {
  string recipe_id = 1;
  string entry = 2;
  repeated string exits = 3;
  string sizing = 4;
  string brokerage = 5;
  string spread = 6;
  string capacity = 7;
  string dividends = 8;
  string asic_data = 9;
  string delisting = 10;
  string capital = 11;
  string cash = 12;
  string preface = 13;             // "Execution recipe chosen by Shorted to test the screen; the author's own entries and exits differ."
}

// The closed-trade statistics of a run, over the trades that exited before live_from (in-sample).
message TradeSummary {
  int32 closed = 1;
  int32 open_at_end = 2;
  double win_rate_pct = 3;
  double avg_hold_sessions = 4;
  double avg_win_pct = 5;
  double avg_loss_pct = 6;
  double best_pct = 7;
  double worst_pct = 8;
  map<string, int32> exits_by_reason = 9;
  bool has_win_rate = 10;
  bool has_avg_hold = 11;
  bool has_avg_win = 12;
  bool has_avg_loss = 13;
  bool has_best = 14;
  bool has_worst = 15;
}

// A trade of a canonical run. Return columns are percentages.
message BacktestTrade {
  int32 seq = 1;
  string stock_code = 2;
  string company_name = 3;
  string signal_date = 4;
  string entry_date = 5;
  double entry_price = 6;
  double captured_pivot = 7;
  bool has_captured_pivot = 8;
  double entry_score = 9;          // One decimal.
  string exit_date = 10;
  double exit_price = 11;
  string exit_reason = 12;
  int32 sessions_held = 13;
  double gross_return_pct = 14;
  double net_return_pct = 15;
  repeated string flags = 16;
  bool open = 17;
  string exit_signal_date = 18;
}

// The recorded paper track since live_from, with its honesty flags.
message PaperTrackSummary {
  string since = 1;                // live_from, YYYY-MM-DD; "" before the first live session.
  int32 sessions = 2;
  int32 closed_trades = 3;
  int32 open_positions = 4;
  double return_pct = 5;
  bool has_return = 6;
  bool too_short = 7;              // Under 63 sessions or 10 closed trades.
}

// Request for ListBacktestTrades.
message ListBacktestTradesRequest {
  int64 run_id = 1;                // Required: a canonical run.
  string page_token = 2;           // The next_page_token of the previous page.
  int32 page_size = 3;             // 1 to 200; 0 is the default of 50.
  string stock_code = 4;           // Optional: one stock's trades.
  string exit_reason = 5;          // Optional: one exit reason.
}

// Response for ListBacktestTrades.
message ListBacktestTradesResponse {
  repeated BacktestTrade trades = 1;   // In trade order.
  string next_page_token = 2;          // Empty on the last page.
  int32 total = 3;                     // Trades matching the filters, over every page.
}

// Request for CompareStrategies.
message CompareStrategiesRequest {
  repeated string refs = 1;        // Two or three canonical strategy ids. "variant:<id>" is refused.
}

// Response for CompareStrategies.
message CompareStrategiesResponse {
  string window_id = 1;            // "common": the sessions every compared curve covers.
  string window_from = 2;
  string window_to = 3;
  repeated CompareEntry entries = 4;
  repeated StrategyCorrelation correlations = 5;
  repeated RuleDiff rule_diffs = 6;   // The recipe lines that differ between each pair of compared strategies.
}

// One compared strategy.
message CompareEntry {
  string strategy_ref = 1;
  string strategy_id = 2;
  string name = 3;
  string state = 4;                // published, or the state the strategy is in.
  StrategyVersionRef version = 5;
  WindowMetrics window = 6;        // Absent when the strategy has no curve.
  repeated SeriesPoint series = 7; // Weekly over the common window, rebased to 100,000.
  string state_reason = 8;
}

// The correlation of two compared strategies' daily returns over the common window.
message StrategyCorrelation {
  string a = 1;
  string b = 2;
  double correlation = 3;
  bool has_correlation = 4;        // False when the overlap is too short or one curve is flat.
  int32 days = 5;                  // Daily returns in the overlap.
}

// One recipe line that differs between two compared strategies.
message RuleDiff {
  string a = 1;                    // The first strategy id.
  string b = 2;                    // The second strategy id.
  string field = 3;                // The recipe line, e.g. "entry", "exits", "sizing".
  string a_value = 4;
  string b_value = 5;
}
