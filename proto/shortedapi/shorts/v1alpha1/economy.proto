syntax = "proto3";

package shorts.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/shorts/v1alpha1;shortsv1alpha1";

import "google/protobuf/timestamp.proto";
import "options/v1/options.proto";

service EconomyService {
  // List economic series catalog entries (Australian economy snapshot layer).
  rpc ListEconomicSeries (ListEconomicSeriesRequest) returns (ListEconomicSeriesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Fetch observations for up to 50 series by series_key.
  rpc GetEconomicSeries (GetEconomicSeriesRequest) returns (GetEconomicSeriesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // List ASX-listed companies with operations-weighted exposure to a state.
  rpc ListStateCompanies (ListStateCompaniesRequest) returns (ListStateCompaniesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Exposure-weighted market cap and short interest aggregates by state.
  rpc GetStateCompanyAggregates (GetStateCompanyAggregatesRequest) returns (GetStateCompanyAggregatesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

// ── Economy (Australian economy snapshot) ────────────────────────────────────

message EconomicSeriesInfo {
  string series_key = 1;    // 'topic.metric[.product].region[.adjustment]'
  string topic = 2;         // 'petroleum' | 'trade' | 'gdp' | 'labour' | 'cpi' | 'rates'
  string metric = 3;
  string product = 4;       // '' when not applicable
  string region_type = 5;   // 'national' | 'state' | 'refinery' | 'industry'
  string region_code = 6;   // 'aus' | 'nsw' | ...
  string region_name = 7;
  string unit = 8;          // 'aud' | 'percent' | 'index' | 'megalitres' | ...
  string frequency = 9;     // 'monthly' | 'quarterly' | 'annual'
  string adjustment = 10;   // 'original' | 'seasadj' | 'trend'
  string source_key = 11;
  string source_licence = 12;
  google.protobuf.Timestamp latest_period = 13;
}

message ListEconomicSeriesRequest {
  string topic = 1;        // optional filters; empty = all
  string metric = 2;
  string region_type = 3;
  string region_code = 4;
  string product = 5;
  int32 limit = 6;         // default 200, max 500
}

message ListEconomicSeriesResponse {
  repeated EconomicSeriesInfo series = 1;
}

message EconomicObservation {
  google.protobuf.Timestamp period = 1;
  double value = 2;
}

message EconomicSeriesData {
  EconomicSeriesInfo info = 1;
  repeated EconomicObservation observations = 2; // capped at 600, oldest first
}

message GetEconomicSeriesRequest {
  repeated string series_keys = 1;            // max 50
  google.protobuf.Timestamp start_period = 2; // optional
}

message GetEconomicSeriesResponse {
  repeated EconomicSeriesData series = 1;
}

// ── Company state exposure (operations-weighted geographic footprint) ───────

message ListStateCompaniesRequest {
  string state = 1; // nsw|vic|qld|sa|wa|tas|nt|act (lowercase)
  int32 limit = 2;  // default 10, max 50
}

message StateCompany {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  double weight = 4;         // 0-1 share of operations attributed to this state
  string basis = 5;          // short human-readable basis, e.g. "Pilbara iron ore operations"
  double market_cap = 6;
  double short_percent = 7;  // 0 when no current short data
  string logo_url = 8;
  string source = 9;         // 'llm' | 'hq_fallback'
}

message ListStateCompaniesResponse {
  repeated StateCompany companies = 1;
}

message GetStateCompanyAggregatesRequest {}

message StateCompanyAggregate {
  string state = 1;
  int32 company_count = 2;                        // weight >= 0.2, excludes region=international
  double exposure_weighted_market_cap = 3;
  double exposure_weighted_short_percent = 4;      // sum(w*mc*short)/sum(w*mc) over non-null-short rows
}

message GetStateCompanyAggregatesResponse {
  repeated StateCompanyAggregate aggregates = 1;
}
