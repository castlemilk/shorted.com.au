syntax = "proto3";

package shorts.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/shorts/v1alpha1;shortsv1alpha1";

import "options/v1/options.proto";

// OwnershipService: who holds ASX stocks.
//
// Three public sources, never blended into one number:
//   - ASX substantial holding notices (Corporations Act s671B, Forms 603/604/605):
//     every holder of 5% or more, whatever it is: super funds, index managers,
//     hedge funds, banks lending stock to short sellers, companies, families.
//     A figure is the notice's own voting power, as at the notice.
//   - Index fund holdings files (iShares, Vanguard, SPDR, Betashares), daily or
//     monthly: shares held by the fund.
//   - Super fund portfolio holdings disclosures, semi-annual: one investment
//     option's holdings (the default or balanced option), never the whole fund.
//
// Every nullable number travels with a has_* flag: a missing figure is absent,
// never zero. An institution's kind is its dominant business, decided once in
// a curated registry; a holder not in it is "corporate" when its name is a
// listed company's, else "unclassified".
service OwnershipService {
  // The map and the aggregated view: institutions by kind, the most crowded
  // registers, stocks crowded both long and short, the latest notices, super
  // funds' consensus holdings and the stocks most owned by index funds.
  rpc GetOwnershipOverview (GetOwnershipOverviewRequest) returns (GetOwnershipOverviewResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Browse the institutions, by kind or name.
  rpc ListInstitutions (ListInstitutionsRequest) returns (ListInstitutionsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // One institution: its current substantial holdings, its notices, its funds
  // and what its holdings files hold.
  rpc GetInstitution (GetInstitutionRequest) returns (GetInstitutionResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Who holds one stock: its substantial holders, their notices, and the index
  // funds and super fund options that hold it.
  rpc GetStockOwnership (GetStockOwnershipRequest) returns (GetStockOwnershipResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // The substantial holding notices we could read, newest release first:
  // filtered by window, event, kind, stock or registry holder, paged by a
  // keyset cursor, with the window's activity on the first page for windows of
  // up to 90 days.
  rpc ListSubstantialNotices (ListSubstantialNoticesRequest) returns (ListSubstantialNoticesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Every stock with a current substantial holder, filtered and sorted for the
  // register explorer: what its notices disclose (each interest counted once,
  // not a share of the company), the investors, banks and index funds among its
  // holders, and its short interest.
  rpc ListStockRegisters (ListStockRegistersRequest) returns (ListStockRegistersResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // The desk's map: every stock with a current substantial holder, what its
  // notices disclose, and how that moved over a window.
  rpc GetOwnershipMap (GetOwnershipMapRequest) returns (GetOwnershipMapResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // The desk's flows: disclosed exposure by holder kind and industry, and the
  // net change in it over a window.
  rpc GetOwnershipFlows (GetOwnershipFlowsRequest) returns (GetOwnershipFlowsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // The desk's movement: each industry's notices by week, and the net change
  // in disclosed voting power that week.
  rpc GetOwnershipActivity (GetOwnershipActivityRequest) returns (GetOwnershipActivityResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // The index fund positions: the change in each stock's weight across the
  // tracked funds between two snapshot dates.
  rpc ListFundPositionChanges (ListFundPositionChangesRequest) returns (ListFundPositionChangesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // One stock's weight and value in each tracked fund, at every snapshot.
  rpc GetStockFundSeries (GetStockFundSeriesRequest) returns (GetStockFundSeriesResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Every tracked fund (index funds and super fund options) at its newest file,
  // with its sector weights and ten largest holdings.
  rpc ListFunds (ListFundsRequest) returns (ListFundsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // One fund's holdings at one file date: the file dates it has, each holding's
  // weight, units and value, and its share of the company's shares on issue.
  rpc GetFundPortfolio (GetFundPortfolioRequest) returns (GetFundPortfolioResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }

  // Two files of one fund compared holding by holding: the weight change in
  // percentage points, and the holdings new or dropped between them.
  rpc CompareFundSnapshots (CompareFundSnapshotsRequest) returns (CompareFundSnapshotsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

message OwnershipInstitution {
  string slug = 1;
  string name = 2;
  // super_fund, index_manager, hedge_fund, active_manager, bank_broker,
  // sovereign_public, insurer, private_equity, corporate, other.
  string kind = 3;
  string country = 4;
  string website = 5;
  string description = 6;
  // A super fund's total assets: the sum of the APRA-regulated funds it is
  // trustee of (APRA's annual fund-level statistics).
  double aum_aud = 7;
  bool has_aum = 8;
  string aum_as_at = 9;
  // Current substantial holdings and the notices behind them.
  int32 substantial_positions = 10;
  int32 notices = 11;
  string latest_notice_date = 12;
  // Products linked to it in the fund registers (ETFs, LICs, super funds),
  // with their combined size (FUM, market cap or total assets).
  int32 funds = 13;
  double funds_size_aud = 14;
  bool has_funds_size = 15;
}

// A holder's current substantial holding in one stock: its latest notice,
// when that notice leaves it substantial.
message SubstantialHolding {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  string holder_key = 4;
  string holder_name = 5;
  string institution_slug = 6;
  string kind = 7;
  // 603, 604 or nz: the form the holding was last stated on.
  string form = 8;
  double voting_power_pct = 9;
  double previous_pct = 10;
  bool has_previous = 11;
  int64 votes = 12;
  bool has_votes = 13;
  // The date the holding changed, as the notice states it ("" when it does
  // not), and the date ASX released the notice.
  string event_date = 14;
  string announced_on = 15;
  string announcement_url = 16;
}

// One notice as released.
message SubstantialNotice {
  string stock_code = 1;
  string company_name = 2;
  string holder_key = 3;
  string holder_name = 4;
  string institution_slug = 5;
  string kind = 6;
  string form = 7;
  double present_pct = 8;
  bool has_present = 9;
  double previous_pct = 10;
  bool has_previous = 11;
  bool ceased = 12;
  string event_date = 13;
  string announced_on = 14;
  string announcement_url = 15;
  // A notice's event, decided once from its form and figures, ceased first:
  // ceased (the ceased flag, or Form 605), became (603), increased or
  // decreased (604 with both figures and a difference), changed (604 with no
  // previous figure, no present figure, or an equal one), nz (an NZ
  // disclosure that is not a cessation).
  string event = 16;
}

// One stock in one fund's holdings file.
message FundHolding {
  string institution_slug = 1;
  string institution_name = 2;
  string kind = 3;
  string fund_name = 4;
  // An ETF's ASX code; "" for a super fund option.
  string fund_code = 5;
  // etf or super_phd.
  string source_kind = 6;
  string as_at = 7;
  string stock_code = 8;
  string company_name = 9;
  double units = 10;
  bool has_units = 11;
  double value_aud = 12;
  bool has_value = 13;
  // The stock's weight in the fund (or option), as the file states it.
  double weight_pct = 14;
  bool has_weight = 15;
  // Units over the shares on issue (ASIC's short position report).
  double pct_of_issued = 16;
  bool has_pct_of_issued = 17;
}

// A product in the fund registers.
message OwnershipFund {
  string fund_key = 1;
  string name = 2;
  // super_fund, etf or lic.
  string fund_type = 3;
  string asx_code = 4;
  string manager_name = 5;
  string category = 6;
  // FUM for an ETF, market cap for a LIC, total assets for a super fund.
  double size_aud = 7;
  bool has_size = 8;
  string as_at = 9;
}

message KindShare {
  string kind = 1;
  double pct = 2;
  int32 holders = 3;
}

message OwnershipKindSummary {
  string kind = 1;
  // Registry institutions of this kind.
  int32 institutions = 2;
  // Holders of this kind with a current substantial holding, the holdings,
  // and the distinct stocks they are in.
  int32 holders = 3;
  int32 positions = 4;
  int32 stocks = 5;
  double aum_aud = 6;
  bool has_aum = 7;
}

// A stock's register as the three sources show it.
message OwnershipStock {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  // Current substantial holders, and the sum of their voting power with each
  // interest counted once: a group and its member (MUFG and First Sentier)
  // count the larger figure, and two notices disclosing the same voting power
  // as at the same date count once. Other overlaps remain, so the sum is what
  // the notices disclose, not a share of the company.
  int32 holders = 4;
  double disclosed_pct = 5;
  repeated KindShare by_kind = 6;
  // ASIC's latest reported short position, as a percentage of shares on issue.
  double short_pct = 7;
  bool has_short_pct = 8;
  // Shares held by the index funds tracked, over shares on issue.
  double index_pct = 9;
  bool has_index_pct = 10;
  // Super fund options holding it, of those tracked, and their combined value.
  int32 super_options = 11;
  double super_value_aud = 12;
  bool has_super_value = 13;
  double market_cap = 14;
  bool has_market_cap = 15;
  // ASIC's report date behind short_pct; "" when there is none.
  string short_as_of = 16;
  // The oldest and newest file dates behind index_pct, and how many files
  // contributed; "" and 0 when there is no index figure.
  string index_as_at_from = 17;
  string index_as_at_to = 18;
  int32 index_files = 19;
  // The newest release date among the current holders' notices; "" when none.
  string latest_notice_date = 20;
}

// One holdings source's coverage.
message OwnershipSource {
  string source = 1;
  string description = 2;
  string as_at = 3;
  int32 records = 4;
  // Files (index funds) or options (super funds) the source holds. 0 for notices.
  int32 funds = 5;
  // The oldest file date behind the source; equals as_at when one file or
  // one date. "" for notices.
  string as_at_from = 6;
}

// Documents attempted and not parsed, by outcome. Six outcomes withhold a
// notice that was read or could not be read (no_text, no_voting_power,
// implausible, ambiguous_target, no_holder, inconsistent_votes); not_a_notice
// is a document that was never a substantial holding form and fetch_error a
// download that is retried. Neither is an unread notice.
message WithheldOutcome {
  string outcome = 1;
  int32 count = 2;
}

message GetOwnershipOverviewRequest {}

message GetOwnershipOverviewResponse {
  repeated OwnershipKindSummary kinds = 1;
  // Institutions with the most current substantial holdings.
  repeated OwnershipInstitution top_holders = 2;
  // Stocks where investors (super, index, active, hedge, sovereign, insurer)
  // disclose the most voting power; banks and brokers are not counted.
  repeated OwnershipStock crowded = 3;
  // Stocks where hedge funds and active managers hold substantial stakes and
  // short interest is high: crowded on both sides.
  repeated OwnershipStock crowded_both_ways = 4;
  // Stocks where banks and brokers hold substantial interests (mostly stock
  // lent to, or held as collateral from, short sellers) beside their short
  // interest.
  repeated OwnershipStock lending = 5;
  repeated SubstantialNotice recent = 6;
  // Stocks the tracked super fund options hold most of, by combined value.
  repeated OwnershipStock super_consensus = 7;
  // Stocks the tracked index funds own the largest share of.
  repeated OwnershipStock passive = 8;
  repeated OwnershipSource sources = 9;
  int32 notices_parsed = 10;
  int32 notices_withheld = 11;
  int32 super_funds = 12;
  double super_assets_aud = 13;
  int32 etfs = 14;
  double etf_fum_aud = 15;
  int32 lics = 16;
  double lic_market_cap_aud = 17;
  string as_of = 18;
  // Withheld documents by outcome; notices_withheld stays their total.
  repeated WithheldOutcome withheld_by_outcome = 19;
  // Every document attempted, parsed included: the base of notices_withheld.
  int32 documents_attempted = 20;
}

message ListInstitutionsRequest {
  // A kind to filter to; "" for all.
  string kind = 1;
  string query = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListInstitutionsResponse {
  repeated OwnershipInstitution institutions = 1;
  int32 total = 2;
}

message GetInstitutionRequest {
  string slug = 1;
}

message GetInstitutionResponse {
  OwnershipInstitution institution = 1;
  repeated SubstantialHolding positions = 2;
  repeated SubstantialNotice notices = 3;
  // The largest holdings, by value, of its latest holdings files.
  repeated FundHolding fund_holdings = 4;
  repeated OwnershipFund funds = 5;
  // Rows in its latest files; fund_holdings serves the largest 100.
  int32 fund_holdings_total = 6;
}

message GetStockOwnershipRequest {
  string stock_code = 1;
}

message GetStockOwnershipResponse {
  OwnershipStock summary = 1;
  repeated SubstantialHolding holders = 2;
  repeated SubstantialNotice history = 3;
  repeated FundHolding fund_holdings = 4;
  double shares_on_issue = 5;
  bool has_shares_on_issue = 6;
  // Parsed notices for the stock on record; history serves the newest 100.
  int32 history_total = 7;
  // Documents listed under this code whose outcome is one of the six
  // withholding outcomes. A document ASX lists under several codes is counted
  // under one of them, so the figure is "listed under", never beside a sum.
  int32 withheld_listed = 8;
  // The newest notice release date read anywhere.
  string as_of = 9;
}

message ListSubstantialNoticesRequest {
  // 7, 30, 90 or 365; 0 means every notice read (no date clause). Another
  // positive value rounds UP to the next served window, and one above 365 is
  // 0; the response echoes the window used. A negative value is invalid.
  int32 window_days = 1;
  // "" or one of became, increased, decreased, changed, ceased, nz.
  string event = 2;
  // "" or a holder kind: an institution kind, corporate or unclassified.
  string kind = 3;
  // "" or an ASX code (1 to 6 uppercase alphanumerics).
  string stock_code = 4;
  // "" or a registry slug: that holder's notices, as its institution page reads
  // them. Holders off the map cannot be filtered.
  string institution_slug = 5;
  // "" for the first page, else the previous page's next_cursor.
  string cursor = 6;
  // 0 means 50; above 100 is 100.
  int32 limit = 7;
  // Also compute the window's counts, weekly buckets and largest moves
  // (windows of at most 90 days; omitted above that, and with since or until). Only
  // the first page (cursor ""): a page after a cursor never carries it.
  bool include_activity = 8;
  // "" or an industry, matched exactly as the register's industries are. "" is
  // no filter, so the stocks with no industry on record cannot be filtered to.
  string industry = 9;
  // "" or YYYY-MM-DD: notices released on or after it, inclusive. Named dates
  // are the window: window_days is ignored when since or until is named, and the
  // response echoes 0. With no until the span runs to today; with no since it
  // starts 365 days before until. A span over 366 days is InvalidArgument, as is
  // an invalid date.
  string since = 10;
  // "" or YYYY-MM-DD: notices released on or before it, inclusive. Refused as
  // InvalidArgument when it is before since (see since for the span).
  string until = 11;
}

// One ISO week of notices, by event.
message NoticeWeek {
  // The Monday that starts the week, YYYY-MM-DD.
  string week_start = 1;
  int32 became = 2;
  int32 increased = 3;
  int32 decreased = 4;
  int32 changed = 5;
  int32 ceased = 6;
  int32 nz = 7;
}

// A window's notices by event, by week, and the largest moves.
message NoticeActivity {
  int32 became = 1;
  int32 increased = 2;
  int32 decreased = 3;
  int32 changed = 4;
  int32 ceased = 5;
  int32 nz = 6;
  // Every ISO week in the window, oldest first, empty weeks included.
  repeated NoticeWeek weeks = 7;
  // Form 604 notices with both figures, by the largest rise and fall in
  // percentage points; at most five each.
  repeated SubstantialNotice largest_rises = 8;
  repeated SubstantialNotice largest_falls = 9;
}

message ListSubstantialNoticesResponse {
  repeated SubstantialNotice notices = 1;
  // The cursor for the next page; "" on the last page.
  string next_cursor = 2;
  // Notices matching the filters in the window; the cursor does not narrow it.
  int32 total = 3;
  // The window used, echoed: 0 is every notice read (no date clause).
  int32 window_days = 4;
  string as_of = 5;
  // Only on a first page that set include_activity, for a window that allows it.
  NoticeActivity activity = 6;
}

message ListStockRegistersRequest {
  // disclosed (default), investors, banks, hedge_active, short, index,
  // super_value, super_options, interests, latest_notice, code. A stock
  // without the figure sorts last whatever the direction; ties are broken by
  // code.
  string sort = 1;
  bool ascending = 2;
  // "" or one of the response's industries, matched exactly after trim.
  string industry = 3;
  // A kind that must disclose 5% or more in the stock; "" for any.
  string kind = 4;
  // Interests counted once; 0 means 1.
  int32 min_interests = 5;
  // One of 0, 1, 3, 5, 10; another value snaps DOWN to the nearest served step.
  double min_short_pct = 6;
  // A code prefix or a name substring, at most 24 characters.
  string query = 7;
  // 0 means 50; above 100 is 100.
  int32 limit = 8;
  // 0 to 5000.
  int32 offset = 9;
}

// One industry among the register's stocks, for the filter.
message IndustryCount {
  string industry = 1;
  int32 stocks = 2;
}

message ListStockRegistersResponse {
  repeated OwnershipStock stocks = 1;
  // Stocks matching the filters.
  int32 total = 2;
  // Stocks with at least one current holder, before the filters.
  int32 universe = 3;
  // The distinct industries, sorted, for the filter.
  repeated IndustryCount industries = 4;
  string as_of = 5;
}

// The desk's map request. The dates are YYYY-MM-DD, inclusive. Empty means the
// default: the 91 days ending at the newest notice read. A span over 366 days
// is InvalidArgument.
message GetOwnershipMapRequest {
  string from = 1;
  string to = 2;
  // The index funds' window, when it is not the notice window: the snapshot
  // dates the fund figures compare, at most 366 days apart. Empty takes from and
  // to (the notice window), and one empty bound is filled as the desk fills it.
  string fund_from = 3;
  string fund_to = 4;
}

// One stock on the map. The figures are what the notices disclose, each
// interest counted once: not a share of the company.
message MapStock {
  string stock_code = 1;
  string company_name = 2;
  string industry = 3;
  double market_cap = 4;
  bool has_market_cap = 5;
  double disclosed_pct = 6;
  // The investor kinds' share of the disclosure (banks and brokers excluded).
  double institutional_pct = 7;
  double hedge_pct = 8;
  // Shares held by the index funds tracked, over shares on issue.
  double index_pct = 9;
  bool has_index_pct = 10;
  // ASIC's latest reported short position, over shares on issue.
  double short_pct = 11;
  bool has_short_pct = 12;
  // Net change in disclosed voting power across the notices released in the
  // window, in percentage points. A ceased notice counts its previous figure
  // as a fall. Unknown when no notice in the window states a figure.
  double flow_pp = 13;
  bool has_flow_pp = 14;
  // Notices released in the window.
  int32 notices = 15;
  // The index funds' holdings of the stock at the window's end, in AUD. Set
  // when a tracked index fund holds it at that file.
  double fund_value_aud = 16;
  bool has_fund_value = 17;
  // The change in shares the compared index funds hold, in AUD: each compared
  // fund's change valued at its own later file's price (its start file's price
  // when the position has left it), summed. A fund is compared when its file at
  // the window's start (or its first file inside the window) and a newer one at
  // the end are on record, and a fund is never new money by its first file. A
  // fund whose file states the stock with no units on either side of the window
  // (a value alone, or neither figure) is left out of this change and of its
  // start, so that row counts only in fund_value_aud. So is a fund whose later
  // file states shares with no value, which leaves it no price of its own. Each
  // fund is decided on its own row: no other fund's row changes it.
  double fund_flow_aud = 18;
  bool has_fund_flow = 19;
  // That change as a percentage of the same funds' starting shares, each valued at
  // the same price as its change. Set when those starting shares are positive.
  double fund_change_pct = 20;
  bool has_fund_change = 21;
}

message GetOwnershipMapResponse {
  string from = 1;
  string to = 2;
  repeated MapStock stocks = 3;
  string as_of = 4;
  // Index funds compared in the window: each with a file at its start (or
  // inside the window) and a newer file at the end. Zero when the window holds
  // one file per fund, in which case every fund change is unknown.
  int32 funds_compared = 5;
  // The as-at range of the start files the comparison reads.
  string start_files_from = 6;
  string start_files_to = 7;
  // The as-at range of the end files the comparison reads.
  string end_files_from = 8;
  string end_files_to = 9;
  // The index funds' window the fund figures compare, as served.
  string fund_from = 10;
  string fund_to = 11;
}

message GetOwnershipFlowsRequest {
  // The window of change, as GetOwnershipMapRequest. The positions are the
  // current holdings and do not depend on it.
  string from = 1;
  string to = 2;
}

// Disclosed exposure of one holder kind in one industry, estimated: the sum of
// each current interest's voting power over 100, times the stock's market cap.
// The sum covers only the interests whose stock has a positive market cap, and
// has_exposure is set when one does; the rest are not counted in it.
message FlowPosition {
  string kind = 1;
  string industry = 2;
  double exposure_aud = 3;
  bool has_exposure = 4;
  // Interests counted in the cell.
  int32 holdings = 5;
  // The cell's largest interest by voting power.
  string largest_code = 6;
  double largest_pct = 7;
  // The cell's largest holders by estimated exposure, at most ten, largest
  // first (unknown exposures last, then by holdings).
  repeated FlowHolder top_holders = 8;
}

// One holder in a position cell: an institution, or a holder with no institution
// page, which carries its holder key in slug.
message FlowHolder {
  string slug = 1;
  string name = 2;
  double exposure_aud = 3;
  bool has_exposure = 4;
  // The holder's interests counted in the cell.
  int32 holdings = 5;
  // Whether slug is an institution's slug. False means slug is the holder key
  // of a holder with no institution page.
  bool has_institution = 6;
}

// The window's change in disclosed exposure of one holder kind in one industry,
// split by direction. exposure_aud is a magnitude: the direction carries the
// sign, so a down row is a fall of that size. Like the positions, it sums only
// the notices whose stock has a positive market cap.
message FlowChange {
  string kind = 1;
  string industry = 2;
  // up or down.
  string direction = 3;
  double exposure_aud = 4;
  bool has_exposure = 5;
  int32 notices = 6;
}

message GetOwnershipFlowsResponse {
  string from = 1;
  string to = 2;
  repeated FlowPosition positions = 3;
  repeated FlowChange changes = 4;
  string as_of = 5;
}

message GetOwnershipActivityRequest {
  // 1 to 52 weeks; 0 means 52. Negative is InvalidArgument.
  int32 weeks = 1;
  // A holder kind (super_fund, index_manager, ...), or "" for every kind. A kind
  // outside the vocabulary is InvalidArgument.
  string kind = 2;
}

// One industry's notices in one ISO week, and the net change in disclosed
// voting power they state.
message IndustryWeek {
  string industry = 1;
  // The Monday that starts the week, YYYY-MM-DD.
  string week_start = 2;
  int32 became = 3;
  int32 increased = 4;
  int32 decreased = 5;
  int32 changed = 6;
  int32 ceased = 7;
  int32 nz = 8;
  double net_pp = 9;
  bool has_net_pp = 10;
}

message GetOwnershipActivityResponse {
  // The first and last Mondays of the weeks served, YYYY-MM-DD. The last week
  // is the newest notice's.
  string from_week = 1;
  string to_week = 2;
  // Every industry of the register, every week in the range, gap-filled with
  // zero counts: a week with no notice reads 0, and has_net_pp is false.
  repeated IndustryWeek rows = 3;
  string as_of = 4;
  // The window's largest moves the notices state (spec 14.10): at most ten notices
  // that state both their present and previous voting power and differ, ranked by
  // the size of the change, then the newer date, then the stock code. A notice that
  // does not state both figures (a cessation, a 605, or one with no previous figure)
  // is never ranked. Filtered by the request's kind, over the same weeks as rows.
  repeated LargestMove largest_moves = 5;
}

// One notice's stated change in disclosed voting power, in percentage points.
message LargestMove {
  string stock_code = 1;
  string company_name = 2;
  // The holder's institution name and slug when it has an institution page
  // (has_institution); otherwise its holder name, with the holder key in the slug.
  string holder_name = 3;
  string holder_slug = 4;
  bool has_institution = 5;
  // The voting power the notice states before and after the change.
  double previous_pct = 6;
  double present_pct = 7;
  // present_pct less previous_pct: a rise is positive, a fall negative.
  double change_pp = 8;
  // increased or decreased.
  string event = 9;
  // The date ASX released the notice, YYYY-MM-DD.
  string announced_on = 10;
  // The notice's PDF on ASX.
  string announcement_url = 11;
}

message ListFundPositionChangesRequest {
  // YYYY-MM-DD. Each side is the newest snapshot at or before it, per fund. Empty
  // means the two newest snapshot dates. The date range must not be inverted.
  string from = 1;
  string to = 2;
  // Per direction: up to this many of the largest rises and the largest falls,
  // and up to this many new and dropped stocks each. 0 means 10; above 50 is 50.
  int32 limit = 3;
}

// One stock's weight across the funds that hold it on both dates, the funds its
// delta sums: weight to less weight from is the delta. A new or dropped stock
// sums the funds on the one date it has and has no delta. A stock held on both
// dates only by different funds (one on each date) compares no fund with itself,
// so it is in no list.
message FundPositionChange {
  string stock_code = 1;
  string company_name = 2;
  double weight_from_pct = 3;
  bool has_weight_from = 4;
  double weight_to_pct = 5;
  bool has_weight_to = 6;
  double delta_pp = 7;
  bool has_delta = 8;
  double value_from_aud = 9;
  bool has_value_from = 10;
  double value_to_aud = 11;
  bool has_value_to = 12;
  // Funds holding it on either date.
  int32 funds = 13;
  // current, new or dropped.
  string state = 14;
}

message ListFundPositionChangesResponse {
  // Every distinct snapshot date across the tracked funds, oldest first.
  repeated string snapshot_dates = 1;
  // The dates used: the newest snapshot at or before each request date, and the
  // first snapshot for a from date before them all.
  string from = 2;
  string to = 3;
  // Rises (largest first), then falls (largest first), then new, then dropped.
  repeated FundPositionChange rows = 4;
}

message GetStockFundSeriesRequest {
  string stock_code = 1;
  // The index funds' window the per-fund comparison reads (spec 14.10), as
  // GetOwnershipMapRequest's fund window: YYYY-MM-DD, at most 366 days apart.
  // Empty takes the default window (the 91 days ending at the newest notice), and
  // one empty bound is filled as the desk fills it.
  string fund_from = 2;
  string fund_to = 3;
}

message FundPoint {
  string as_at = 1;
  double weight_pct = 2;
  bool has_weight = 3;
  double value_aud = 4;
  bool has_value = 5;
  // The fund's shares in the stock at this file.
  double units = 6;
  bool has_units = 7;
}

message FundSeries {
  string institution_slug = 1;
  string institution_name = 2;
  string fund_name = 3;
  // etf or super_phd.
  string source_kind = 4;
  // Oldest first, one a snapshot.
  repeated FundPoint points = 5;
  // The fund's ASX code (ticker) when its file names one; empty for a super option.
  string fund_code = 6;
  // The fund's key (spec 14.7): the registry key, or <institution_slug>/<fund_name>.
  string fund_key = 7;
  // The fund's own comparison of this stock over the request's fund window (spec
  // 14.10): the fund is compared with itself, its file at the window's start (or
  // its first file inside the window) against its newest file at the end, as the
  // map's index fund change reads it. Only index funds (etf) are compared. A super
  // option, or a fund whose only file is its end file, has no comparison: its start
  // and change fields are unknown (has_ false), though its end figures are stated
  // whenever it has an end file. A stock absent from a file holds zero shares
  // there, so a stock that enters the fund inside the window is a change, not an
  // unknown.
  //
  // The start file and its shares of the stock.
  string start_date = 8;
  bool has_start_date = 9;
  double start_units = 10;
  bool has_start_units = 11;
  // The end file (the newest on or before the window's end) and its shares of the
  // stock. Known whenever the fund has an end file, even with no comparison.
  string end_date = 12;
  bool has_end_date = 13;
  double end_units = 14;
  bool has_end_units = 15;
  // End shares less start shares.
  double units_change = 16;
  bool has_units_change = 17;
  // That change valued at this fund's own later file's price for the stock (its
  // start file's when the stock has left the fund): the figure the map's
  // fund_flow_aud sums over the compared funds. Unknown when the shares are not
  // stated on both sides, or the fund's own rows give no price (a row that states
  // units without a value, or a value without units).
  double change_value_aud = 18;
  bool has_change_value_aud = 19;
}

message GetStockFundSeriesResponse {
  string stock_code = 1;
  repeated FundSeries funds = 2;
  // The fund window the per-fund comparisons read, as served.
  string fund_from = 3;
  string fund_to = 4;
}

message ListFundsRequest {}

// One sector's share of a fund's holdings. The industry is company-metadata's,
// with a placeholder industry read as "Other".
message FundSectorWeight {
  string industry = 1;
  double weight_pct = 2;
  bool has_weight_pct = 3;
}

// One of a fund's ten largest holdings, by weight.
message FundTopHolding {
  string code = 1;
  string name = 2;
  double weight_pct = 3;
  bool has_weight_pct = 4;
}

// A tracked fund at one file date.
message FundSummary {
  // The registry key (abn:<ABN> or asx:<CODE>) when the file has a registry row,
  // else "<institution_slug>/<fund_name>".
  string fund_key = 1;
  string ticker = 2;
  string name = 3;
  string institution_slug = 4;
  string institution_name = 5;
  // etf or super_phd.
  string source_kind = 6;
  // Vanguard's ETF files hold the pooled wholesale fund behind each ETF, not the
  // ETF alone.
  bool pooled = 7;
  // The file date the figures are read from, YYYY-MM-DD.
  string as_at = 8;
  string source_url = 9;
  // Equity holdings stored for the file: the lines matched to an ASX code, not
  // every line of the vendor's file.
  int32 holdings = 10;
  // The weights of the ten largest holdings, summed. Known only when every one
  // of them states a weight: a partial sum is withheld.
  double top10_pct = 11;
  bool has_top10_pct = 12;
  repeated FundSectorWeight sector_weights = 13;
  repeated FundTopHolding largest = 14;
  double aum_aud = 15;
  bool has_aum_aud = 16;
}

message ListFundsResponse {
  repeated FundSummary funds = 1;
}

message GetFundPortfolioRequest {
  // A fund_key from ListFunds, or "<institution_slug>/<fund_name>".
  string fund_key = 1;
  // YYYY-MM-DD. The newest file at or before it; empty is the newest file.
  string as_at = 2;
}

// One holding in one fund's file. The shares on issue are ASIC's, from the report
// named by shares_on_issue_as_at (not necessarily the file date); est_company_pct
// is units over those shares, in percent, only when both are known.
message FundPortfolioHolding {
  string code = 1;
  string name = 2;
  string industry = 3;
  double weight_pct = 4;
  bool has_weight_pct = 5;
  double units = 6;
  bool has_units = 7;
  double value_aud = 8;
  bool has_value_aud = 9;
  double shares_on_issue = 10;
  bool has_shares_on_issue = 11;
  double est_company_pct = 12;
  bool has_est_company_pct = 13;
  // The date of the ASIC report the shares on issue come from, YYYY-MM-DD: the
  // newest on or before the file date, and no older than 30 days before it.
  // "" when there is no shares figure.
  string shares_on_issue_as_at = 14;
}

message GetFundPortfolioResponse {
  string fund_key = 1;
  string ticker = 2;
  string name = 3;
  string institution_slug = 4;
  string institution_name = 5;
  string source_kind = 6;
  bool pooled = 7;
  // The file the holdings are read from.
  string as_at = 8;
  string source_url = 9;
  // Every file date this fund has, oldest first.
  repeated string snapshot_dates = 10;
  // Ordered by weight, largest first.
  repeated FundPortfolioHolding holdings = 11;
  // The equity holdings stored for the file (the lines matched to an ASX code).
  int32 holdings_total = 12;
  // The ten largest weights, summed; known only when every one of them states a
  // weight.
  double top10_pct = 13;
  bool has_top10_pct = 14;
  repeated FundSectorWeight sector_weights = 15;
}

message CompareFundSnapshotsRequest {
  string fund_key = 1;
  // YYYY-MM-DD. Each side is the fund's newest file at or before the date. An
  // empty to is the newest file; an empty from is the file before to. A from
  // after an explicit to is InvalidArgument. When both sides resolve to the same
  // file there is nothing to compare: the response names that file on both sides
  // and carries no rows.
  string from = 2;
  string to = 3;
}

// One holding across two files of one fund. continuing is held on both,
// new only on the later file, dropped only on the earlier one.
message FundSnapshotChange {
  string code = 1;
  string name = 2;
  string industry = 3;
  double weight_from_pct = 4;
  bool has_weight_from_pct = 5;
  double weight_to_pct = 6;
  bool has_weight_to_pct = 7;
  double delta_pp = 8;
  bool has_delta_pp = 9;
  double value_from_aud = 10;
  bool has_value_from_aud = 11;
  double value_to_aud = 12;
  bool has_value_to_aud = 13;
  string status = 14;
}

message CompareFundSnapshotsResponse {
  // The file dates used.
  string from = 1;
  string to = 2;
  string source_from = 3;
  string source_to = 4;
  // Continuing holdings by |delta| (largest first), then new, then dropped, each
  // by weight.
  repeated FundSnapshotChange rows = 5;
  repeated string snapshot_dates = 6;
}
