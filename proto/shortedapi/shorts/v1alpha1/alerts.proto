syntax = "proto3";

package shorts.v1alpha1;

option go_package = "github.com/castlemilk/shorted.com.au/services/gen/proto/go/shorts/v1alpha1;shortsv1alpha1";

import "google/protobuf/timestamp.proto";
import "options/v1/options.proto";

service AlertsService {
  // Create a premium short-interest alert monitor for the current user.
  rpc CreateAlertMonitor (CreateAlertMonitorRequest) returns (CreateAlertMonitorResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }

  // List short-interest alert monitors for the current user.
  rpc ListAlertMonitors (ListAlertMonitorsRequest) returns (ListAlertMonitorsResponse) {
    option (shortedapi.options.v1.visibility) = VISIBILITY_PRIVATE;
  }
}

// Alert monitor target type.
enum AlertMonitorScope {
  ALERT_MONITOR_SCOPE_UNSPECIFIED = 0;
  ALERT_MONITOR_SCOPE_INDUSTRY = 1;
  ALERT_MONITOR_SCOPE_STOCK = 2;
}

// Alert monitor trigger condition.
enum AlertMonitorCondition {
  ALERT_MONITOR_CONDITION_UNSPECIFIED = 0;
  ALERT_MONITOR_CONDITION_SHORT_INTEREST_ABOVE = 1;
  ALERT_MONITOR_CONDITION_SHORT_INTEREST_RISES = 2;
  ALERT_MONITOR_CONDITION_NEW_TOP_TEN_ENTRY = 3;
}

// Alert delivery cadence.
enum AlertMonitorCadence {
  ALERT_MONITOR_CADENCE_UNSPECIFIED = 0;
  ALERT_MONITOR_CADENCE_DAILY = 1;
  ALERT_MONITOR_CADENCE_WEEKLY = 2;
}

// Alert monitor lifecycle status.
enum AlertMonitorStatus {
  ALERT_MONITOR_STATUS_UNSPECIFIED = 0;
  ALERT_MONITOR_STATUS_ACTIVE = 1;
  ALERT_MONITOR_STATUS_PAUSED = 2;
}

// A saved short-interest monitor owned by the current user.
message AlertMonitor {
  string id = 1;
  AlertMonitorScope scope = 2;
  string target = 3;
  AlertMonitorCondition condition = 4;
  double threshold = 5;
  bool has_threshold = 6;
  AlertMonitorCadence cadence = 7;
  AlertMonitorStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Request for CreateAlertMonitor RPC. Uses auth context for ownership.
message CreateAlertMonitorRequest {
  AlertMonitorScope scope = 1;
  string target = 2;
  AlertMonitorCondition condition = 3;
  double threshold = 4;
  bool has_threshold = 5;
  AlertMonitorCadence cadence = 6;
}

// Response for CreateAlertMonitor RPC.
message CreateAlertMonitorResponse {
  AlertMonitor monitor = 1;
}

// Request for ListAlertMonitors RPC. Uses auth context for ownership.
message ListAlertMonitorsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

// Response for ListAlertMonitors RPC.
message ListAlertMonitorsResponse {
  repeated AlertMonitor monitors = 1;
  int32 total_count = 2;
}
