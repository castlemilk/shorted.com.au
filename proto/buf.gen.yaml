version: v1
managed:
  enabled: true
  # go_package_prefix:
  #   default: github.com/skunkworkq/bedrock/services/gen/proto/go
plugins:
  - plugin: buf.build/protocolbuffers/go
    opt: paths=source_relative
    out: ../services/gen/proto/go
  - plugin: buf.build/connectrpc/go:v1.15.0
    out: ../services/gen/proto/go
    opt:
      - paths=source_relative
  # protoc-gen-es v2: generates both message types AND service descriptors in _pb.ts
  - plugin: protoc-gen-es
    path: ../web/node_modules/.bin/protoc-gen-es
    out: ../web/src/gen
    opt:
      - target=ts
      - import_extension=none
  # protoc-gen-connect-query removed 2026-07: zero generated hooks were
  # imported anywhere in web/src (verified repo-wide) — dead output.
  # Java client SDK
  # PINNED. Unpinned, buf resolves the latest plugin and every regeneration
  # rewrites all ~750 committed Java files with a gencode version bump, burying
  # the actual proto change and silently raising the SDK's runtime floor. Bump
  # this deliberately, in its own commit.
  - plugin: buf.build/protocolbuffers/java:v35.1
    out: ../sdks/java/src/main/java
  # - plugin: buf.build/grpc/python:v1.59.1
  #   out: ../services/gen/proto/python
  # - plugin: buf.build/protocolbuffers/python
  #   out: ../services/gen/proto/python
  # skip generating grpc-gateway + go-grpc code gen as we can use connect-go
  # as a replacement for muxing gRPC + RESTFul calls
  # - plugin: buf.build/grpc/go:v1.3.0
  #   out: ../services/gen/proto/go
  #   opt:
  #     - paths=source_relative
  # - plugin: buf.build/grpc-ecosystem/gateway:v2.16.0
  #   out: ../services/gen/proto/go
  #   opt:
  #     - paths=source_relative
  #     - generate_unbound_methods=true